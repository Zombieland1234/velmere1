name: R10 Runtime Browser Smoke

on:
  push:
    branches:
      - r10-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r10-runtime-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install exact lockfile
        run: npm ci --ignore-scripts
      - name: Production build
        run: npm run build
      - name: Start production server and HTTP smoke
        run: |
          mkdir -p artifacts/r10/runtime-smoke
          npx next start -H 127.0.0.1 -p 3100 > artifacts/r10/runtime-smoke/NEXT_START.log 2>&1 &
          echo $! > /tmp/next.pid
          cleanup(){ kill "$(cat /tmp/next.pid)" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 60); do
            code="$(curl -sS -o /tmp/home.html -w '%{http_code}' http://127.0.0.1:3100/en || true)"
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then ok=1; break; fi
            sleep 1
          done
          cat artifacts/r10/runtime-smoke/NEXT_START.log
          if [ "$ok" != "1" ]; then echo "production_server_never_became_ready"; exit 1; fi
          for path in /en /en/audit; do
            code="$(curl -sS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:3100${path}" || true)"
            echo "${path} ${code}" | tee -a artifacts/r10/runtime-smoke/HTTP_STATUS.txt
            case "$code" in 200|307|308) ;; *) echo "unexpected_http_status:${path}:${code}"; exit 1;; esac
          done
          trap - EXIT
          cleanup
      - name: Install Chromium for local browser smoke
        run: npx playwright install --with-deps chromium
      - name: Browser smoke against production server
        run: |
          npx next start -H 127.0.0.1 -p 3100 >> artifacts/r10/runtime-smoke/NEXT_START.log 2>&1 &
          echo $! > /tmp/next.pid
          cleanup(){ kill "$(cat /tmp/next.pid)" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3100/en >/dev/null 2>&1 && break; sleep 1; done
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[];
          page.on('pageerror',(e)=>pageErrors.push(String(e?.message||e)));
          const results=[];
          for(const path of ['/en','/en/audit']){
            const response=await page.goto(`http://127.0.0.1:3100${path}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1200);
            const status=response?.status() ?? 0;
            const bodyVisible=await page.locator('body').isVisible();
            const title=await page.title();
            results.push({path,status,bodyVisible,title,url:page.url()});
            if(status>=500 || status===0 || !bodyVisible) throw new Error(`browser_smoke_failed:${path}:${status}:${bodyVisible}`);
          }
          await page.screenshot({path:'artifacts/r10/runtime-smoke/FINAL_PAGE.png',fullPage:true});
          await browser.close();
          const receipt={schemaVersion:'velmere.r10.runtime-browser-smoke.v1',sourceSha:process.env.GITHUB_SHA,evidenceClass:'CURRENT_GIT_PROVEN_LOCAL_CI',results,pageErrors,productionCredit:false,stagingCredit:false};
          fs.writeFileSync('artifacts/r10/runtime-smoke/RECEIPT.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(pageErrors.length) throw new Error('browser_page_errors:'+JSON.stringify(pageErrors));
          NODE
          trap - EXIT
          cleanup
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r10-runtime-browser-smoke-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/r10/runtime-smoke/**
