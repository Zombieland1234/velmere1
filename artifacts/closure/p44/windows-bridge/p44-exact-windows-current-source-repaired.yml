name: P44 Exact Windows Current Source Closure — Repaired Bridge

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  exact-windows-current-source:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: pwsh
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --tags --force
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          check-latest: false
      - shell: pwsh
        run: |
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Exact Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'Exact npm mismatch' }
      - name: Assemble exact valid compact identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            'p43-bridge/i8s.part-00','p43-bridge/i8s.part-01',
            'p43-bridge/i8b.part-00','p43-bridge/i8b.part-01','p43-bridge/i8b.part-02',
            'p43-bridge/i8b.part-03','p43-bridge/i8b.part-04','p43-bridge/i8b.part-05',
            'p43-bridge/i8b.part-06','p43-bridge/i8b.part-07','p43-bridge/i8b.part-08',
            'p43-bridge/i8b.part-09-real'
          )
          foreach ($part in $parts) { if (!(Test-Path $part)) { throw "Missing identity block: $part" } }
          $joined = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          [IO.File]::WriteAllText('p43-identity.bin.gz.b64',$joined,[Text.Encoding]::ASCII)
          $sha=(Get-FileHash p43-identity.bin.gz.b64 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '26f191e21dba2cfcd73e3ab00e6b4a8ec2fdd1066ec9aaf2eb4663c7f456b198') { throw "Compact identity SHA mismatch: $sha" }
          $gzip=[Convert]::FromBase64String($joined)
          [IO.File]::WriteAllBytes('p43-identity.bin.gz',$gzip)
          python -c "import gzip,pathlib; pathlib.Path('p43-identity.bin').write_bytes(gzip.decompress(pathlib.Path('p43-identity.bin.gz').read_bytes()))"
      - name: Reconstruct exact source from all refs
        shell: pwsh
        run: |
          python p43-bridge/measure-source-coverage-bin-fixed.py --repo . --identity-bin p43-identity.bin --output-dir p44-win-work --reconstruct
      - name: Run exact Windows semantic and dual-build closure
        shell: pwsh
        run: |
          python p43-bridge/run-exact-windows-current-source.py --coverage-receipt p44-win-work/P44_COMPACT_IDENTITY_LOCAL_RECONSTRUCTION_REPLAY.json --output-dir p44-win-result
