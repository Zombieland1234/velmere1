[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
cbor_metadata = true
auto_detect_solc = false

[fuzz]
runs = 512
max_test_rejects = 65536

[invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 1000
show_metrics = true
