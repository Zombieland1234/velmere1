name: P47 Native Windows P46 A79 Control Plane

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - 'p47-a79-control/**'
      - '.github/workflows/p47-native-windows-p46-a79-control-plane.yml'

concurrency:
  group: p47-native-windows-p46-a79-control-plane-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-windows-p46-a79-control-plane:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout isolated P47 control-plane branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0 and locate CLI
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          $nodeVersion = (node --version).Trim()
          $npmVersion = (npm --version).Trim()
          if ($nodeVersion -ne 'v24.18.0') { throw "Exact Node mismatch: $nodeVersion" }
          if ($npmVersion -ne '11.16.0') { throw "Exact npm mismatch: $npmVersion" }
          $npmRoot = (npm root --global).Trim()
          $npmCli = (Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          if (-not (Test-Path -LiteralPath $npmCli -PathType Leaf)) { throw "npm CLI missing: $npmCli" }
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Node: $nodeVersion"
          Write-Host "npm: $npmVersion"
          Write-Host "npm CLI: $npmCli"

      - name: Reconstruct and verify exact P46 A79 projection bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p47-out | Out-Null
          python p47-a79-control/reconstruct-p47-a79-control.py `
            --parts-dir p47-a79-control `
            --output-root p47-work `
            --receipt p47-out/P47_A79_CONTROL_PLANE_TRANSPORT_RECEIPT.json `
            --npm-cli '${{ steps.toolchain.outputs.npm_cli }}'
          if ($LASTEXITCODE -ne 0) { throw "Projection reconstruction failed: $LASTEXITCODE" }

      - name: Execute exact P46 A79 control-plane controls on native Windows
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.toolchain.outputs.npm_cli }}
        run: |
          $ErrorActionPreference = 'Stop'
          node p47-work/p47/run-p47-native-windows-a79-control-plane.mjs p47-work p47-out
          if ($LASTEXITCODE -ne 0) { throw "Native Windows A79 control-plane campaign failed: $LASTEXITCODE" }

      - name: Upload P47 native Windows receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p47-native-windows-p46-a79-control-plane
          path: |
            p47-out
            p47-work/p47/P47_A79_CONTROL_PLANE_MANIFEST.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
