name: Temporary Full Current Velmere Source Export

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/_temporary-full-current-velmere-export.yml'

permissions:
  contents: read

jobs:
  export-full-current-source:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      TARGET_SHA: '82b424f39c575e55b825040d74260137b04bfa03'

    steps:
      - name: Checkout exact requested Velmere source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '82b424f39c575e55b825040d74260137b04bfa03'
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and build full tracked archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SHA) { throw "target_sha_mismatch:$actual" }

          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $files = @(git ls-files)
          if ($files.Count -lt 1) { throw 'tracked_file_list_empty' }

          $forbiddenTracked = @($files | Where-Object {
            $_ -match '(^|/)node_modules/' -or
            $_ -match '(^|/)\.next/' -or
            $_ -match '(^|/)\.git/' -or
            $_ -match '(^|/)\.env$' -or
            $_ -match '(^|/)\.env\.(local|development|production|test)(\.local)?$'
          })
          if ($forbiddenTracked.Count -gt 0) {
            throw ('forbidden_tracked_runtime_or_secret_paths:' + ($forbiddenTracked -join ','))
          }

          $manifestPath = 'VELMERE_FULL_CURRENT_TRACKED_FILES.txt'
          ($files -join "`n") + "`n" | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM

          $archive = 'VELMERE_FULL_CURRENT_SOURCE_2026-08-28.zip'
          git archive --format=zip --output=$archive $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'git_archive_failed' }

          $archiveItem = Get-Item -LiteralPath $archive
          $archiveSha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestSha = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()

          $receipt = [ordered]@{
            schemaVersion = 'velmere.full-current-tracked-source-export.v1'
            status = 'PASS_FULL_CURRENT_TRACKED_SOURCE_EXPORT_READY'
            repository = 'Zombieland1234/velmere1'
            branchAtRequest = 'velmere-r7-successor-delta-20260825'
            targetCommitSha = $env:TARGET_SHA
            targetTreeSha = $tree
            trackedFileCount = $files.Count
            archiveFileName = $archive
            archiveByteLength = $archiveItem.Length
            archiveSha256 = $archiveSha
            trackedManifestSha256 = $manifestSha
            exclusions = @('.git metadata','untracked files','node_modules','.next','local .env/secret files')
            truthBoundary = 'This ZIP is the complete Git-tracked repository tree for the exact requested Velmere commit. It includes all tracked source, configs, workflows, scripts, receipts and repository assets at that commit. It does not include Git metadata, dependency installs, generated build caches, untracked local files, credentials or local environment secrets.'
          }
          $receipt | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath 'VELMERE_FULL_CURRENT_SOURCE_RECEIPT.json' -Encoding utf8NoBOM
          $receipt | ConvertTo-Json -Depth 8

      - name: Upload full current Velmere source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VELMERE_FULL_CURRENT_SOURCE_2026-08-28_82b424f39c575e55b825040d74260137b04bfa03
          path: |
            VELMERE_FULL_CURRENT_SOURCE_2026-08-28.zip
            VELMERE_FULL_CURRENT_SOURCE_RECEIPT.json
            VELMERE_FULL_CURRENT_TRACKED_FILES.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
