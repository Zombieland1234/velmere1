name: R7 Audit Basic Exact Compiler Output AST

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-compiler-output-ast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-solc-standard-json:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Install exact solc-js 0.8.12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r7-ast-work artifacts/r7/audit-basic/compiler-ast
          cd r7-ast-work
          npm init -y >/dev/null
          npm install --audit=false --fund=false solc@0.8.12
          node -e "const s=require('solc'); console.log(s.version()); if(!s.version().startsWith('0.8.12+commit.f00d7308')) process.exit(2)" | tee ../artifacts/r7/audit-basic/compiler-ast/SOLC_VERSION.txt

      - name: Compile exact Sourcify source to Standard JSON AST/IR output
        shell: bash
        run: |
          set -euo pipefail
          cat > r7-ast-work/compile.mjs <<'NODE'
          import { createRequire } from 'node:module';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const require=createRequire(import.meta.url); const solc=require('solc');
          const sha=(v)=>createHash('sha256').update(v).digest('hex');
          const address='0xca11bde05977b3631167028862be2a173976ca11';
          const sourceSha='3f05fc95b3bfd3d41e96fa281e00a71302e35b8fff59f81f399a419cdb9f577e';
          const s=await fetch(`https://sourcify.dev/server/v2/contract/56/${address}?fields=all`,{headers:{accept:'application/json','user-agent':'velmere-r7-compiler-ast'},signal:AbortSignal.timeout(25000)});
          if(!s.ok) throw new Error(`sourcify_fetch_failed:${s.status}`); const c=await s.json(); if(c.match!=='exact_match') throw new Error('sourcify_not_exact_match');
          const rows=Object.entries(c.sources??{}).filter(([p,v])=>/Multicall3\.sol$/i.test(p)&&v&&typeof v==='object'&&typeof v.content==='string'); if(rows.length!==1) throw new Error(`source_denominator:${rows.length}`);
          const [sourcePath,record]=rows[0]; const source=record.content; if(sha(Buffer.from(source,'utf8'))!==sourceSha) throw new Error('source_sha_mismatch');
          const settings=c.compilation?.compilerSettings??{};
          const input={language:'Solidity',sources:{[sourcePath]:{content:source}},settings:{...settings,outputSelection:{'*':{'':['ast'],'*':['abi','storageLayout','ir','irOptimized','evm.bytecode.object','evm.deployedBytecode.object','evm.methodIdentifiers']}}}};
          const raw=solc.compile(JSON.stringify(input)); let output; try{output=JSON.parse(raw);}catch{throw new Error('solc_output_not_json');}
          const errors=(output.errors??[]).filter((r)=>r.severity==='error'); if(errors.length) throw new Error(`solc_compile_errors:${errors.map(r=>r.formattedMessage??r.message).join('\n').slice(0,3000)}`);
          if(!output.sources?.[sourcePath]?.ast?.nodeType) throw new Error('compiler_ast_missing');
          const runtime=String(output.contracts?.[sourcePath]?.Multicall3?.evm?.deployedBytecode?.object??''); if(!/^[0-9a-fA-F]{200,}$/.test(runtime)) throw new Error('compiled_runtime_missing');
          fs.writeFileSync('../artifacts/r7/audit-basic/compiler-ast/COMPILER_OUTPUT.json',JSON.stringify(output));
          fs.writeFileSync('../artifacts/r7/audit-basic/compiler-ast/SOURCE.json',JSON.stringify({path:sourcePath,content:source},null,2)+'\n');
          fs.writeFileSync('../artifacts/r7/audit-basic/compiler-ast/COMPILER_INPUT.json',JSON.stringify(input));
          const receipt={schemaVersion:'velmere.r7.audit-basic-compiler-output-transport.v1',status:'PASS_EXACT_SOLC_0_8_12_STANDARD_JSON_OUTPUT',compilerVersion:solc.version(),sourcePath,exactDeployedSourceSha256:sourceSha,sourceByteLength:Buffer.byteLength(source),compilerInputSha256:sha(Buffer.from(JSON.stringify(input))),compilerOutputSha256:sha(Buffer.from(raw)),astNodeType:output.sources[sourcePath].ast.nodeType,warningCount:(output.errors??[]).filter(r=>r.severity==='warning').length,compiledRuntimeSha256:sha(Buffer.from(runtime,'hex')),compiledRuntimeByteLength:runtime.length/2,optimizerEnabled:settings.optimizer?.enabled??null,optimizerRuns:settings.optimizer?.runs??null,evmVersion:settings.evmVersion??null,viaIR:settings.viaIR??null,customerFinalCredit:false,truthBoundary:'Pinned solc-js 0.8.12 Standard JSON output is bound to exact Sourcify-deployed source bytes. Velmere compiler-AST evidence self-digest and rule interpretation are produced separately by the exact current Velmere analyzer.'};
          fs.writeFileSync('../artifacts/r7/audit-basic/compiler-ast/R7_AUDIT_BASIC_COMPILER_OUTPUT_RECEIPT.json',JSON.stringify(receipt,null,2)+'\n'); console.log(JSON.stringify(receipt,null,2));
          NODE
          cd r7-ast-work
          node compile.mjs

      - name: Upload exact compiler output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-compiler-output-ast-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/r7/audit-basic/compiler-ast/R7_AUDIT_BASIC_COMPILER_OUTPUT_RECEIPT.json
            artifacts/r7/audit-basic/compiler-ast/COMPILER_OUTPUT.json
            artifacts/r7/audit-basic/compiler-ast/COMPILER_INPUT.json
            artifacts/r7/audit-basic/compiler-ast/SOURCE.json
            artifacts/r7/audit-basic/compiler-ast/SOLC_VERSION.txt
          if-no-files-found: error
          retention-days: 30
