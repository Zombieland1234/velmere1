name: R13F UI1 exact Node 24 runtime
on:
  push:
    branches: ["r13f-ui1/dependency-bundle-20260916"]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Verify and package runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee NODE_VERSION.txt
          npm --version | tee NPM_VERSION.txt
          test "$(node --version)" = "v24.18.0"
          root="$(dirname "$(dirname "$(command -v node)")")"
          tar --zstd -cf R13F_UI1_NODE24_RUNTIME.tar.zst -C "$root" .
          sha256sum R13F_UI1_NODE24_RUNTIME.tar.zst > R13F_UI1_NODE24_RUNTIME.tar.zst.sha256
          du -h R13F_UI1_NODE24_RUNTIME.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r13f-ui1-node24-runtime
          path: |
            R13F_UI1_NODE24_RUNTIME.tar.zst
            R13F_UI1_NODE24_RUNTIME.tar.zst.sha256
            NODE_VERSION.txt
            NPM_VERSION.txt
          retention-days: 7
          compression-level: 0
