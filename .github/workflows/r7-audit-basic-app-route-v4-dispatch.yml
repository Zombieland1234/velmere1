name: R7 Audit Basic App Route V4 Dispatch

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-app-route-v4-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-current-head:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch app-route exact-current-source workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(printf '{"ref":"%s"}' "$REF_NAME")
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/workflows/r7-audit-basic-app-route-current-source-e2e.yml/dispatches" \
            -d "$body")
          if [ "$code" != "204" ]; then
            cat response.txt
            exit 1
          fi
          echo "app-route V4 dispatched for $REF_NAME"