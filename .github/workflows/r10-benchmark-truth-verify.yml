name: R10 Local Benchmark Truth Verify

on:
  push:
    branches:
      - r10-benchmark-truth
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r10-benchmark-truth-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install lockfile
        run: npm ci --ignore-scripts
      - name: Apply guarded truth patch
        run: node scripts/r10/patch-local-benchmark-truth.mjs
      - name: Run security regression
        run: npm run security:regression
      - name: Run local benchmark after wording patch
        run: npm run security:benchmark
      - name: Assert benchmark source has no blind/certification overclaim
        run: |
          ! grep -E -i 'BLIND_HOLDOUT|zero[- ]leakage|unseen generalization|ANTI-OVERFITTING CERTIFICATION|held blind|prove generalizeable' scripts/qa/benchmark-security-engine-v2.ts
          grep -q 'LOCAL_HOLDOUT' scripts/qa/benchmark-security-engine-v2.ts
          grep -q 'Truth boundary' scripts/qa/benchmark-security-engine-v2.ts
      - name: Commit verified benchmark wording only
        run: |
          if git diff --quiet -- scripts/qa/benchmark-security-engine-v2.ts; then
            echo "No benchmark diff to commit"
            exit 0
          fi
          git config user.name "velmere-r10-benchmark-truth"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qa/benchmark-security-engine-v2.ts
          git commit -m "fix(r10): classify security benchmark as local-only [benchmark-truth]"
          git push origin HEAD:r10-benchmark-truth
      - name: Upload benchmark truth receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r10-benchmark-truth-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/r10/R10_LOCAL_BENCHMARK_TRUTH_PATCH.json
