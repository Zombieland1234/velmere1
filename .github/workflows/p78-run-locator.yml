name: P78 Diagnostic Run Locator

on:
  push:
    branches:
      - velmere-p78-real-dao-ground-truth-20260818

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  publish-main-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish exact P78 diagnostic run URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows/p78-dao-ground-truth-diagnostic.yml/runs?head_sha=${HEAD_SHA}&per_page=10"
          target=""
          run_api=""
          for i in $(seq 1 60); do
            body="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            target="$(printf '%s' "$body" | python -c 'import json,sys; r=json.load(sys.stdin).get("workflow_runs",[]); print(r[0]["html_url"] if r else "")')"
            run_api="$(printf '%s' "$body" | python -c 'import json,sys; r=json.load(sys.stdin).get("workflow_runs",[]); print(r[0]["url"] if r else "")')"
            [ -n "$target" ] && [ -n "$run_api" ] && break
            sleep 2
          done
          [ -n "$target" ] || { echo 'P78 diagnostic run not found'; exit 1; }
          post_status(){
            state="$1"; desc="$2"
            payload="$(STATE="$state" DESC="$desc" TARGET="$target" python -c 'import json,os; print(json.dumps({"state":os.environ["STATE"],"target_url":os.environ["TARGET"],"description":os.environ["DESC"][:140],"context":"velmere/P78-diagnostic"}))')"
            curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' -d "$payload" "https://api.github.com/repos/${REPO}/statuses/${HEAD_SHA}" >/dev/null
          }
          post_status pending 'P78 DAO diagnostic running'
          for i in $(seq 1 180); do
            run="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$run_api")"
            status="$(printf '%s' "$run" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            conclusion="$(printf '%s' "$run" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then post_status success 'P78 DAO diagnostic PASS'; else post_status failure "P78 diagnostic $conclusion"; fi
              exit 0
            fi
            sleep 5
          done
          post_status failure 'P78 diagnostic locator timeout'
          exit 1
