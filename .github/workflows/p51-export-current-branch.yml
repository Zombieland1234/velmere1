name: P51 Export Current Branch Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - '.github/workflows/p51-export-current-branch.yml'

permissions:
  contents: read

jobs:
  export-current-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Capture snapshot identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p51-export
          git rev-parse HEAD > p51-export/COMMIT.txt
          git ls-files -z | sort -z | xargs -0 sha256sum > p51-export/TRACKED_FILES_SHA256.txt
          git ls-files -z | tar --null -T - --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner -cJf p51-export/current-branch-tracked.tar.xz
          sha256sum p51-export/current-branch-tracked.tar.xz > p51-export/current-branch-tracked.tar.xz.sha256

      - name: Upload exact branch snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p51-current-branch-tracked-snapshot
          path: p51-export
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
