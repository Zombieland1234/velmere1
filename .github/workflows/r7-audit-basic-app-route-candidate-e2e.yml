name: R7 Audit Basic App Route Candidate E2E

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-app-route-candidate-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r7-audit-basic-app-route-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-basic-app-route-candidate:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      R7_RISK_FULL_SOURCE_AGGREGATE_SHA256: '50d59f5f028ef73b279fa3930889fcbf2ab5bc5e36ab4e8cec97be5ed49be67e'
      R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256: 'f83f28de6add73eee70d9086f2705241243661d64b5c9fd579b17b359050a221'
      R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256: 'b947314bb696fb8f9153c34d46ba825c5897e9f8cc8cf911a5f31113aa5fc01f'
      R7_RISK_BUNDLE_SHA256: '8e3c66471d534310e1142c3671d43bb556e35b6901c847c9596eea14e8815967'
      R7_PACKAGE_JSON_SHA256: '384932e8183ff4ced7850556ee21bb7b71f9a86add02112a4e434bc09f457a61'
      R7_PACKAGE_LOCK_SHA256: '5924aa0d679ebd78bcd6da01815fdd4b6ff503db45b17697c00168c06af7de61'
      EXACT_DEPLOYED_SOURCE_SHA256: '3f05fc95b3bfd3d41e96fa281e00a71302e35b8fff59f81f399a419cdb9f577e'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
      NEXT_PUBLIC_SUPABASE_URL: 'https://yljjyowcvjgjcamffnvd.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_RTqLeQRrAJl6seP0ShSJlA_hyNo4Yz2'
      VELMERE_AUDIT_CUSTOMER_BRIDGE_URL: 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-audit-basic-customer-bridge'
      AUDIT_OIDC_AUDIENCE: 'velmere-r7-audit-basic-app-candidate'
    steps:
      - name: Checkout exact control surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct exact current source before candidate patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoProfile -File 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1' -Mode Prepare
          if ($LASTEXITCODE -ne 0) { throw "exact_current_source_prepare_failed:$LASTEXITCODE" }
          Push-Location 'r7-work'
          try {
            node scripts/runtime-config/verify-runtime-env-contract.mjs --output ../R7_AUDIT_APP_ROUTE_CANDIDATE_ENV_CONTRACT.json
            if ($LASTEXITCODE -ne 0) { throw "exact_current_source_env_contract_failed:$LASTEXITCODE" }
            $EnvReceipt = Get-Content '../R7_AUDIT_APP_ROUTE_CANDIDATE_ENV_CONTRACT.json' -Raw | ConvertFrom-Json
            if ($EnvReceipt.status -ne 'PASS' -or @($EnvReceipt.missingRuntimeKeys).Count -ne 0) { throw 'exact_current_source_env_contract_not_pass' }
            $EnvExample = Get-Content 'ENV_PRODUCTION_READY.example' -Raw
            foreach ($Required in @('VELMERE_ACCOUNT_ARTIFACT_WRITE_BRIDGE_URL','VELMERE_BROWSER_SERVER_CAPABILITY')) {
              if ($EnvExample -notmatch "(?m)^$Required=") { throw "exact_current_source_documentation_missing:$Required" }
            }
          } finally {
            Pop-Location
          }

      - name: Apply Audit Basic app-route candidate and compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'r7-work'
          try {
            node ../diagnostic-current/patch-audit-basic-zero-vercel-app-route-candidate.mjs | Tee-Object -FilePath ../R7_AUDIT_APP_ROUTE_CANDIDATE_PATCH.json
            if ($LASTEXITCODE -ne 0) { throw 'candidate_patch_failed' }
            npm run typecheck
            if ($LASTEXITCODE -ne 0) { throw 'candidate_typecheck_failed' }
            npx eslint lib/security/audit-basic-customer-bridge-client.ts app/api/audit/basic/case/route.ts app/api/audit/basic/report/route.ts app/api/audit/basic/report/restore/route.ts --max-warnings=0
            if ($LASTEXITCODE -ne 0) { throw 'candidate_targeted_eslint_failed' }
            npm run build:webpack
            if ($LASTEXITCODE -ne 0) { throw 'candidate_webpack_failed' }
          } finally {
            Pop-Location
          }

      - name: Execute real Next Audit customer-route lifecycle candidate E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Canonical lifecycle candidate implementation intentionally retained from the exact current harness.
          & pwsh -NoProfile -File 'diagnostic-current/run-audit-basic-app-route-candidate-e2e.ps1'
          if ($LASTEXITCODE -ne 0) { throw "audit_basic_app_route_e2e_failed:$LASTEXITCODE" }

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-app-route-candidate-${{ github.run_id }}
          path: |
            R7_AUDIT_APP_ROUTE_CANDIDATE_ENV_CONTRACT.json
            R7_AUDIT_APP_ROUTE_CANDIDATE_PATCH.json
            r7-work/artifacts/r7/audit-basic/**
          if-no-files-found: warn
          retention-days: 30

# 2026-08-30 multi-closure retrigger: run Audit Basic technical candidate on the current canonical source.
