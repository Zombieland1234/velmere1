name: R7 Audit Basic App Route Candidate E2E

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-app-route-candidate-e2e.yml'
      - 'diagnostic-current/patch-audit-basic-zero-vercel-app-route-candidate.mjs'
      - 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r7-audit-basic-app-route-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-basic-app-route-candidate:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - name: Checkout exact control surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct exact current source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoProfile -File 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1' -Mode Prepare
          if($LASTEXITCODE -ne 0){throw "exact_current_source_prepare_failed:$LASTEXITCODE"}

      - name: Apply bounded Audit Basic customer-route candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location 'r7-work'
          try {
            & node ../diagnostic-current/patch-audit-basic-zero-vercel-app-route-candidate.mjs | Tee-Object -FilePath ../R7_AUDIT_APP_ROUTE_CANDIDATE_PATCH.json
            if($LASTEXITCODE -ne 0){throw 'candidate_patch_failed'}
          } finally { Pop-Location }

      - name: Typecheck and lint candidate surface
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location 'r7-work'
          try {
            npm run typecheck
            if($LASTEXITCODE -ne 0){throw 'candidate_typecheck_failed'}
            npx eslint lib/security/audit-basic-customer-bridge-client.ts app/api/audit/basic/case/route.ts app/api/audit/basic/report/route.ts app/api/audit/basic/report/restore/route.ts --max-warnings=0
            if($LASTEXITCODE -ne 0){throw 'candidate_targeted_eslint_failed'}
          } finally { Pop-Location }

      - name: Production webpack candidate compile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location 'r7-work'
          try {
            npm run build:webpack
            if($LASTEXITCODE -ne 0){throw 'candidate_webpack_failed'}
          } finally { Pop-Location }

      - name: Upload technical candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-technical-candidate-${{ github.sha }}-${{ github.run_id }}
          path: |
            R7_AUDIT_APP_ROUTE_CANDIDATE_PATCH.json
            r7-work/R7_EXECUTION_SLICE_MANIFEST.json
            r7-work/R7_EXECUTION_SLICE_MANIFEST.tsv
          if-no-files-found: warn
          retention-days: 30

# Technical candidate only. This workflow never grants Customer FINAL, Paid Value, rights, or human-proof credit.
