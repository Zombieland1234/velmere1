    steps:
      - name: Checkout exact control surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct promoted source and prove exact base before candidate patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $Receipt=Get-Content 'r7-runner-v3/R7_WINDOWS_RUNNER_V3_RECEIPT.json' -Raw|ConvertFrom-Json
          if((Get-FileHash 'r7-runner-v3/R7_WINDOWS_RUNNER_V3_RECEIPT.json' -Algorithm SHA256).Hash.ToLowerInvariant()-ne$env:R7_RUNNER_RECEIPT_SHA256){throw'runner_receipt_sha'}
          $Parts=@(Get-ChildItem 'r7-runner-v3/runner-gzip-b64' -File|Sort-Object Name);if($Parts.Count-ne[int]$env:R7_RUNNER_CHUNK_COUNT){throw'runner_chunk_count'}
          $E=[System.Collections.Generic.List[string]]::new();foreach($Row in @($Receipt.gzip.chunks)){$P='r7-runner-v3/runner-gzip-b64/'+[string]$Row.name;if((Get-FileHash $P -Algorithm SHA256).Hash.ToLowerInvariant()-ne[string]$Row.sha256){throw'runner_chunk_sha'};$E.Add([IO.File]::ReadAllText($P,[Text.Encoding]::ASCII))}
          $Encoded=[string]::Concat($E);$Gz=Join-Path $env:RUNNER_TEMP 'r7-v3.ps1.gz';[IO.File]::WriteAllBytes($Gz,[Convert]::FromBase64String($Encoded));if((Get-FileHash $Gz -Algorithm SHA256).Hash.ToLowerInvariant()-ne$env:R7_RUNNER_GZIP_SHA256){throw'runner_gzip_sha'}
          $Ps=Join-Path $env:RUNNER_TEMP 'r7-v3.ps1';$I=[IO.File]::OpenRead($Gz);$Z=[IO.Compression.GzipStream]::new($I,[IO.Compression.CompressionMode]::Decompress);$O=[IO.File]::Create($Ps);try{$Z.CopyTo($O)}finally{$O.Dispose();$Z.Dispose();$I.Dispose()};if((Get-FileHash $Ps -Algorithm SHA256).Hash.ToLowerInvariant()-ne$env:R7_RUNNER_SHA256){throw'runner_source_sha'}
          & pwsh -NoProfile -File $Ps
          if($LASTEXITCODE-ne0){throw'exact_promoted_base_failed'}

      - name: Apply Audit Basic app-route candidate and compile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location r7-work
          try {
            node ../diagnostic-current/patch-audit-basic-zero-vercel-app-route-candidate.mjs | Tee-Object -FilePath ../R7_AUDIT_APP_ROUTE_CANDIDATE_PATCH.json
            if($LASTEXITCODE-ne0){throw'candidate_patch_failed'}
            npm run typecheck
            if($LASTEXITCODE-ne0){throw'candidate_typecheck_failed'}
            npx eslint lib/security/audit-basic-customer-bridge-client.ts app/api/audit/basic/case/route.ts app/api/audit/basic/report/route.ts app/api/audit/basic/report/restore/route.ts --max-warnings=0
            if($LASTEXITCODE-ne0){throw'candidate_targeted_eslint_failed'}
            npm run build:webpack
            if($LASTEXITCODE-ne0){throw'candidate_webpack_failed'}
          } finally { Pop-Location }

      - name: Execute real Next Audit customer-route lifecycle candidate E2E
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function ShaBytes([byte[]]$B){return([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData($B))).Replace('-','').ToLowerInvariant()};function ShaText([string]$T){return ShaBytes([Text.Encoding]::UTF8.GetBytes($T))};function PJ([string]$U,[hashtable]$H,[object]$B){$J=$B|ConvertTo-Json -Depth 30 -Compress;$R=Invoke-WebRequest -Uri $U -Method Post -Headers $H -ContentType 'application/json' -Body $J -SkipHttpErrorCheck -TimeoutSec 30;$P=$null;try{$P=$R.Content|ConvertFrom-Json -Depth 40}catch{};return [pscustomobject]@{Status=[int]$R.StatusCode;Body=$P;Raw=[string]$R.Content}}
          $Sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'};$TR=Invoke-RestMethod -Uri($env:ACTIONS_ID_TOKEN_REQUEST_URL+$Sep+'audience='+[Uri]::EscapeDataString($env:AUDIT_OIDC_AUDIENCE))-Headers@{Authorization='Bearer '+$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN}-TimeoutSec 20;$Oidc=[string]$TR.value;$OU=$env:NEXT_PUBLIC_SUPABASE_URL+'/functions/v1/r7-audit-basic-app-candidate-oidc';$OH=@{Authorization='Bearer '+$Oidc;Accept='application/json'}
          $P=PJ $OU $OH @{action='provision'};if($P.Status-ne200-or$P.Body.ok-ne$true){throw('provision_failed:'+($P.Raw.Substring(0,[Math]::Min(400,$P.Raw.Length))))};$A=$P.Body.a;$B=$P.Body.b;$env:VELMERE_AUDIT_SERVER_CAPABILITY=[string]$P.Body.auditServerCapability
          $StdOut=Join-Path $env:RUNNER_TEMP 'audit-app-next.stdout.log';$StdErr=Join-Path $env:RUNNER_TEMP 'audit-app-next.stderr.log';$Next=Start-Process -FilePath 'node' -ArgumentList @('node_modules/next/dist/bin/next','dev','--hostname','localhost','--port','3112') -WorkingDirectory (Join-Path $PWD 'r7-work') -PassThru -RedirectStandardOutput $StdOut -RedirectStandardError $StdErr
          try {
            $Ready=$false;for($i=0;$i-lt60;$i++){Start-Sleep -Seconds 2;try{$Q=Invoke-WebRequest -Uri 'http://localhost:3112/' -Method Get -SkipHttpErrorCheck -TimeoutSec 5;if([int]$Q.StatusCode-ge200){$Ready=$true;break}}catch{}};if(-not$Ready){throw'next_dev_not_ready'}
            $Local='http://localhost:3112';$AH=@{Authorization='Bearer '+[string]$A.accessToken;Accept='application/json'};$BH=@{Authorization='Bearer '+[string]$B.accessToken;Accept='application/json'};$DirectAH=@{Authorization='Bearer '+[string]$A.accessToken;'x-velmere-audit-server-capability'=$env:VELMERE_AUDIT_SERVER_CAPABILITY;Accept='application/json'};$Case='ABA-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT;$Req='audit-app-request-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT;$Target='0x6666666666666666666666666666666666666666';$TH='sha256:'+(ShaText('velmere-audit-contract-target-v1:56:'+$Target.ToLowerInvariant()))
            $CI=@{caseId='audit-app-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT;caseRef=$Case;requestId=$Req;targetKind='contract';targetPrivate=$Target.ToLowerInvariant();targetHash=$TH;targetChainId='56';targetChainName='BSC';displayLabel='Audit Basic app-route candidate';tier='basic';locale='en';status='queued_basic_prescreen';accountId=[string]$A.accountId;accountEmail=$null;entitlementRequired=$false;entitlementVerified=$false;analysisStarted=$false;intakeReceipt=@{schemaVersion='audit-app-candidate-v1';customerFinalCredit=$false};sourceCandidatesProtected=@{auditUrl=$null;docsUrl=$null;githubUrl=$null;website=$null}}
            $C=PJ($Local+'/api/audit/basic/case')$AH $CI;if($C.Status-ne200-or$C.Body.ok-ne$true){throw('local_case_create_failed:'+($C.Raw.Substring(0,[Math]::Min(500,$C.Raw.Length))))};$BG=Invoke-WebRequest -Uri($Local+'/api/audit/basic/case?caseRef='+[Uri]::EscapeDataString($Case))-Headers$BH -SkipHttpErrorCheck -TimeoutSec20;if([int]$BG.StatusCode-ne404){throw'local_cross_account_case_not_denied'}
            $Claim=PJ $OU $OH @{action='claim';caseRef=$Case};if($Claim.Status-ne200-or$Claim.Body.claim.ok-ne$true){throw'claim_failed'};$At=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ');$Pdf=[Text.Encoding]::UTF8.GetBytes('%PDF-1.4'+"`n"+('D'*1800)+"`n%%EOF`n");$PD='sha256:'+(ShaBytes $Pdf);$AHsh=ShaText('velmere-account-binding-v1:'+[string]$A.accountId);$RID='audit-app-report-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT;$RV='sha256:'+(ShaText('rv:'+$Case));$SD='sha256:'+(ShaText('snap:'+$Case));$SR='sha256:'+(ShaText('src:'+$Case));$Snap=@{requestId=$Req;tier='basic';digest=$SD;sourceReceiptRoot=$SR;generatedAt=$At;renderContract=@{id='pass4808-deterministic-latin-extended-pagination-v1';pdfDigest=$PD;pdfByteLength=$Pdf.Length};auditExecutionRelease=@{expectedTier='basic';caseRef=$Case;decision='ALLOW_COMPLETE';completionAllowed=$true;persistAllowed=$true;packetDigest='sha256:'+(ShaText('packet:'+$Case));currentDeploymentReceiptDigest='sha256:'+(ShaText('deploy:'+$Case));matchedInputDigest='sha256:'+(ShaText('input:'+$Case));releaseBindingDigest='sha256:'+(ShaText('release:'+$Case))};customerEligibility=@{commercialUseReady=$true}};$Mat=@('velmere.audit-basic-exact-immutable-pdf-artifact.v1',$RID,$Case,$Req,$AHsh,$TH,$RV,$SD,$SR,$PD,[string]$Pdf.Length,'pass4808-deterministic-latin-extended-pagination-v1',$At)-join"`n";$RD='sha256:'+(ShaText $Mat);$Payload=@{caseRef=$Case;workerPrincipal=[string]$Claim.Body.workerPrincipal;leaseToken=[string]$Claim.Body.leaseToken;reasonCode='worker_result';reportId=$RID;requestId=$Req;accountIdHash=$AHsh;targetHash=$TH;reportVersionHash=$RV;snapshotDigest=$SD;sourceReceiptRoot=$SR;pdfDigest=$PD;pdfByteLength=$Pdf.Length;renderContractId='pass4808-deterministic-latin-extended-pagination-v1';recordDigest=$RD;pdfBase64=[Convert]::ToBase64String($Pdf);snapshotJson=$Snap;createdAt=$At};$Done=PJ $env:VELMERE_AUDIT_CUSTOMER_BRIDGE_URL $DirectAH @{schemaVersion='velmere.r7.audit-basic-customer-bridge-request.v1';action='complete_pdf';caseRef=$Case;payload=$Payload};if($Done.Status-ne200-or$Done.Body.data.ok-ne$true){throw('direct_completion_failed:'+($Done.Raw.Substring(0,[Math]::Min(500,$Done.Raw.Length))))}
            $F=Join-Path $env:RUNNER_TEMP 'audit-app.pdf';$RA=Invoke-WebRequest -Uri($Local+'/api/audit/basic/report?caseRef='+[Uri]::EscapeDataString($Case))-Headers$AH -OutFile $F -PassThru -SkipHttpErrorCheck -TimeoutSec30;if([int]$RA.StatusCode-ne200){throw'local_owner_pdf_failed'};$Obs=[IO.File]::ReadAllBytes($F);if((ShaBytes $Obs)-ne$PD.Substring(7)-or$Obs.Length-ne$Pdf.Length){throw'local_owner_pdf_identity'};$RB=Invoke-WebRequest -Uri($Local+'/api/audit/basic/report?caseRef='+[Uri]::EscapeDataString($Case))-Headers$BH -SkipHttpErrorCheck -TimeoutSec20;if([int]$RB.StatusCode-ne404){throw'local_cross_account_pdf_not_denied'}
            $Del=Invoke-WebRequest -Uri($Local+'/api/audit/basic/report?caseRef='+[Uri]::EscapeDataString($Case))-Headers$AH -Method Delete -SkipHttpErrorCheck -TimeoutSec30;$DJ=$Del.Content|ConvertFrom-Json;if([int]$Del.StatusCode-ne200-or$DJ.ok-ne$true){throw'local_backup_erase_failed'};$After=Invoke-WebRequest -Uri($Local+'/api/audit/basic/report?caseRef='+[Uri]::EscapeDataString($Case))-Headers$AH -SkipHttpErrorCheck -TimeoutSec20;if([int]$After.StatusCode-ne404){throw'local_owner_pdf_visible_after_erase'};$Restore=PJ($Local+'/api/audit/basic/report/restore?caseRef='+[Uri]::EscapeDataString($Case))$AH @{backupId=[string]$DJ.backupId};if($Restore.Status-ne200-or$Restore.Body.ok-ne$true){throw'local_restore_failed'}
            $F2=Join-Path $env:RUNNER_TEMP 'audit-app-restored.pdf';$RA2=Invoke-WebRequest -Uri($Local+'/api/audit/basic/report?caseRef='+[Uri]::EscapeDataString($Case))-Headers$AH -OutFile $F2 -PassThru -SkipHttpErrorCheck -TimeoutSec30;$Obs2=[IO.File]::ReadAllBytes($F2);if([int]$RA2.StatusCode-ne200-or(ShaBytes $Obs2)-ne$PD.Substring(7)-or$Obs2.Length-ne$Pdf.Length){throw'local_restored_pdf_identity'};$RB2=Invoke-WebRequest -Uri($Local+'/api/audit/basic/report?caseRef='+[Uri]::EscapeDataString($Case))-Headers$BH -SkipHttpErrorCheck -TimeoutSec20;if([int]$RB2.StatusCode-ne404){throw'local_post_restore_cross_account_not_denied'}
            $Receipt=[ordered]@{schemaVersion='velmere.r7.audit-basic-app-route-candidate-e2e.v1';status='PASS_CANDIDATE';exactPromotedBaseBeforePatch=$true;candidateOnly=$true;customerFinalCredit=$false;typecheck='PASS';targetedEslint='PASS';webpack='PASS';localCaseCreate='PASS';crossAccountCase='PASS_DENIED';localPdf='PASS_BYTE_IDENTICAL';crossAccountPdf='PASS_DENIED';backupErase='PASS';postEraseOwner='PASS_404';restore='PASS';postRestorePdf='PASS_BYTE_IDENTICAL';postRestoreCrossAccount='PASS_DENIED';serviceRoleInApplication=$false;pdfDigest=$PD;pdfByteLength=$Pdf.Length;recordDigest=$RD};$Receipt|ConvertTo-Json -Depth 20|Set-Content 'R7_AUDIT_BASIC_APP_ROUTE_CANDIDATE_E2E.json' -Encoding utf8;Write-Host($Receipt|ConvertTo-Json -Depth 20)
          } finally { if($Next-and-not$Next.HasExited){Stop-Process -Id $Next.Id -Force -ErrorAction SilentlyContinue};$Cleanup=PJ $OU $OH @{action='cleanup';userIds=@([string]$A.userId,[string]$B.userId)} }

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-app-route-candidate-${{ github.sha }}-${{ github.run_id }}
          path: |
            R7_AUDIT_APP_ROUTE_CANDIDATE_PATCH.json
            R7_AUDIT_BASIC_APP_ROUTE_CANDIDATE_E2E.json
            r7-work/artifacts/r7/windows
            r7-work/artifacts/r7/current-execution
          if-no-files-found: warn
          retention-days: 14
