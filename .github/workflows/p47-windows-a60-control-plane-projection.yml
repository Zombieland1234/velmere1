name: P47 exact Windows A60/A79 control-plane projection

on:
  push:
    branches:
      - velmere-p47-windows-a60-control-plane-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-windows-a60-control-plane-projection:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout isolated P47 projection branch
        uses: actions/checkout@v4

      - name: Verify and extract deterministic exact-source projection
        shell: pwsh
        run: |
          $archive = 'p47-bootstrap/p47-projection.tar.gz'
          $expected = '510a25a809a80e88a6c3143a5b380d96f6403484e3958749db857f0ba66292d6'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Projection archive missing' }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Projection archive SHA mismatch: $actual" }
          tar.exe -xzf $archive
          if ($LASTEXITCODE -ne 0) { throw "Projection extraction failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'p47-projection/p47-projection-manifest.json' -PathType Leaf)) { throw 'Projection manifest missing after extraction' }

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0 and locate CLI
        id: toolchain
        shell: pwsh
        run: |
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Exact Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'Exact npm mismatch' }
          $npmRoot = (npm root --global).Trim()
          $npmCli = Join-Path $npmRoot 'npm/bin/npm-cli.js'
          if (-not (Test-Path -LiteralPath $npmCli -PathType Leaf)) { throw "npm CLI missing: $npmCli" }
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Execute exact P46 A60/A79 Windows control-plane projection
        shell: pwsh
        working-directory: p47-projection
        env:
          P47_NPM_CLI_PATH: ${{ steps.toolchain.outputs.npm_cli }}
        run: |
          node scripts/p47-exact-windows-a60-control-plane-projection.mjs

      - name: Upload P47 exact Windows receipt
        uses: actions/upload-artifact@v4
        with:
          name: p47-exact-windows-a60-control-plane-projection
          path: p47-projection/p47-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
