name: R10 Release Lint Autofix

on:
  push:
    branches:
      - r10-lint-remediation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r10-lint-autofix-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout lint branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install lockfile
        run: npm ci --ignore-scripts
      - name: Apply ESLint-owned safe fixes only
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { ESLint } = require('eslint');
          const fs = require('node:fs');
          (async () => {
            const patterns = ['app/**','components/**','lib/**','config/**','types/**','i18n.ts','navigation.ts','proxy.ts','routing.ts','next.config.mjs'];
            const out = execFileSync('git', ['ls-files','-z',...patterns]);
            const files = out.toString('utf8').split('\0').filter(Boolean).filter((f) => !f.startsWith('components/backup/legacy/'));
            const eslint = new ESLint({ fix: true });
            let results = await eslint.lintFiles(files);
            await ESLint.outputFixes(results);
            results = await new ESLint({ fix: false }).lintFiles(files);
            const formatter = await new ESLint().loadFormatter('json');
            fs.mkdirSync('artifacts/r10/lint-autofix', { recursive: true });
            fs.writeFileSync('artifacts/r10/lint-autofix/AFTER_ESLINT_AUTOFIX.json', formatter.format(results));
            const summary = results.reduce((a,r)=>{a.files++;a.errors+=r.errorCount||0;a.warnings+=r.warningCount||0;return a},{files:0,errors:0,warnings:0});
            fs.writeFileSync('artifacts/r10/lint-autofix/SUMMARY.json', JSON.stringify(summary,null,2)+'\n');
            console.log(JSON.stringify(summary,null,2));
          })().catch((e)=>{console.error(e);process.exit(1)});
          NODE
      - name: Capture and validate changed paths
        run: |
          mkdir -p artifacts/r10/lint-autofix
          git diff --name-only > artifacts/r10/lint-autofix/CHANGED_PATHS.txt
          git diff --stat > artifacts/r10/lint-autofix/DIFF_STAT.txt
          cat artifacts/r10/lint-autofix/DIFF_STAT.txt
          node - <<'NODE'
          const fs=require('fs');
          const changed=fs.readFileSync('artifacts/r10/lint-autofix/CHANGED_PATHS.txt','utf8').trim().split(/\r?\n/).filter(Boolean);
          const allowed=(p)=>/^(app|components|lib|config|types)\//.test(p)||['i18n.ts','navigation.ts','proxy.ts','routing.ts','next.config.mjs'].includes(p);
          const bad=changed.filter((p)=>!allowed(p));
          if(bad.length) throw new Error(`lint_autofix_write_scope_violation:${bad.join(',')}`);
          console.log(JSON.stringify({changed},null,2));
          NODE
      - name: Commit ESLint-owned fixes if any
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "No ESLint-owned source fixes"
            exit 0
          fi
          git config user.name "velmere-r10-lint-autofix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$changed" | while IFS= read -r path; do [ -n "$path" ] && git add -- "$path"; done
          git diff --cached --name-only
          git commit -m "fix(r10): apply eslint-owned release source autofixes [lint]"
          git push origin HEAD:r10-lint-remediation
      - name: Direct TypeScript after autofix
        run: npm run typecheck:direct
      - name: Security regression after autofix
        run: npm run security:regression
      - name: Upload lint autofix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r10-lint-autofix-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/r10/lint-autofix/**
