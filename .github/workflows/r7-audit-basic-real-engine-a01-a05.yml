      R7_PAYLOAD_BYTE_LENGTH: '63055146'
      R7_TARGET_BUNDLE_SHA256: '25cea52822d17bc3ee2d8f20b97abd789368c6da3696081609dea18ebbac6bab'
      R7_EXECUTION_SLICE_AGGREGATE_SHA256: 'cf97c3fec69622b9e6c002832c901083239cf22d42be509e336f11fe439a01b6'
      R7_EXECUTION_SLICE_MANIFEST_SHA256: 'e80977b39c688f1702bdb0476ab37972a0fecfe50efcdf24301f56b0ebec1149'
      R7_FULL_SOURCE_AGGREGATE_SHA256: '27b823f68853513d4844383af4316f709e0e980e13de5c58373a59433f47f7db'
      R7_FULL_SOURCE_MANIFEST_SHA256: 'd0e47f41ec7f451d5dc808660c84f614fa71e3a8961840f647b21b9fe45e0c5c'
      R7_PACKAGE_JSON_SHA256: '384932e8183ff4ced7850556ee21bb7b71f9a86add02112a4e434bc09f457a61'
      R7_PACKAGE_LOCK_SHA256: '5924aa0d679ebd78bcd6da01815fdd4b6ff503db45b17697c00168c06af7de61'
      R7_PDF_FONT_PATH: 'r7-runtime/external-assets/manrope-pdf-latin-plus-ext.ttf'
      R7_PDF_FONT_BYTE_LENGTH: '46464'
      R7_PDF_FONT_SHA256: 'a07eea516ecb22957f162d68a559462c9af0534487669969d500f8e92aece0fa'
      R7_PDF_FONT_GIT_BLOB_SHA1: '716393b0614fdceaf6f5578694479466ed495b14'
      R7_PDF_FONT_LICENSE_PATH: 'r7-runtime/external-assets/OFL-Manrope.txt'
      R7_PDF_FONT_LICENSE_BYTE_LENGTH: '4384'
      R7_PDF_FONT_LICENSE_SHA256: 'e01b637272e0cbdfb240184dd98ea5cc671556d9894dae2668d92ab2c906787c'
      R7_PDF_FONT_LICENSE_GIT_BLOB_SHA1: '472064afc4b8dec9079fab03b8ffafb617a1b2d8'
      R7_RUNNER_RECEIPT_SHA256: 'da67ac58dd88ac1c4291cab450776bfcf102763ae12add5fbfb51a3bb17d1c34'
      R7_RUNNER_SHA256: 'c612d1fa5f976decf758224de9485ec1f487f3de6e14b5685a6742a7dcbf3ec2'
      R7_RUNNER_BYTE_LENGTH: '40693'
      R7_RUNNER_GZIP_SHA256: 'a2fa6f9a8c64ea59c1010a16c38969ce70dec65bcf08672ec6678bd4c75b9912'
      R7_RUNNER_GZIP_BYTE_LENGTH: '9295'
      R7_RUNNER_GZIP_BASE64_BYTE_LENGTH: '12396'
      R7_RUNNER_CHUNK_COUNT: '3'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
      GIT_CEILING_DIRECTORIES: ${{ github.workspace }}
      VELMERE_PDF_FONT_PATH: ${{ github.workspace }}\r7-runtime\external-assets\manrope-pdf-latin-plus-ext.ttf

    steps:
      - name: Checkout exact controls and adjudication packet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct exact V4 source and repeat full Windows authority runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ReceiptPath = 'r7-runner-v4/R7_WINDOWS_RUNNER_V4_RECEIPT.json'
          if ((Get-FileHash -LiteralPath $ReceiptPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:R7_RUNNER_RECEIPT_SHA256) { throw 'runner_receipt_sha_mismatch' }
          $Receipt = Get-Content -LiteralPath $ReceiptPath -Raw | ConvertFrom-Json
          if ($Receipt.schemaVersion -ne 'velmere.r7.windows-runner-base64-transport.v3' -or $Receipt.status -ne 'PASS_DETERMINISTIC_RUNNER_BUILT') { throw 'runner_receipt_identity_mismatch' }
          if ([int]$Receipt.source.byteLength -ne [int]$env:R7_RUNNER_BYTE_LENGTH -or [string]$Receipt.source.sha256 -ne $env:R7_RUNNER_SHA256) { throw 'runner_source_receipt_mismatch' }
          if ([int]$Receipt.gzip.byteLength -ne [int]$env:R7_RUNNER_GZIP_BYTE_LENGTH -or [string]$Receipt.gzip.sha256 -ne $env:R7_RUNNER_GZIP_SHA256 -or [int]$Receipt.gzip.base64ByteLength -ne [int]$env:R7_RUNNER_GZIP_BASE64_BYTE_LENGTH -or [int]$Receipt.gzip.chunkCount -ne [int]$env:R7_RUNNER_CHUNK_COUNT) { throw 'runner_gzip_receipt_mismatch' }
          $Observed = @(Get-ChildItem -LiteralPath 'r7-runner-v4/runner-gzip-b64' -File | Sort-Object Name)
          $ExpectedNames = @($Receipt.gzip.chunks | ForEach-Object { [string]$_.name }) | Sort-Object
          $ObservedNames = @($Observed | ForEach-Object { $_.Name }) | Sort-Object
          if ($Observed.Count -ne [int]$env:R7_RUNNER_CHUNK_COUNT -or ($ExpectedNames -join "`n") -ne ($ObservedNames -join "`n")) { throw 'runner_chunk_path_set_mismatch' }
          $EncodedParts = [System.Collections.Generic.List[string]]::new()
          foreach ($Row in @($Receipt.gzip.chunks)) {
            $P = 'r7-runner-v4/runner-gzip-b64/' + [string]$Row.name
            if ((Get-Item -LiteralPath $P).Length -ne [int64]$Row.byteLength) { throw "runner_chunk_bytes_mismatch:$P" }
            if ((Get-FileHash -LiteralPath $P -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$Row.sha256) { throw "runner_chunk_sha_mismatch:$P" }
            $EncodedParts.Add([IO.File]::ReadAllText($P, [Text.Encoding]::ASCII))
          }
          $Encoded = [string]::Concat($EncodedParts)
          if ([Text.Encoding]::ASCII.GetByteCount($Encoded) -ne [int]$env:R7_RUNNER_GZIP_BASE64_BYTE_LENGTH) { throw 'runner_base64_length_mismatch' }
          New-Item -ItemType Directory -Force -Path 'r7-runner-work' | Out-Null
          $Gz='r7-runner-work/run-r7-successor-v4-windows.ps1.gz'
          [IO.File]::WriteAllBytes($Gz,[Convert]::FromBase64String($Encoded))
          if ((Get-Item $Gz).Length -ne [int]$env:R7_RUNNER_GZIP_BYTE_LENGTH -or (Get-FileHash $Gz -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:R7_RUNNER_GZIP_SHA256) { throw 'runner_gzip_identity_mismatch' }
          $Ps='r7-runner-work/run-r7-successor-v4-windows.ps1'
          $I=[IO.File]::OpenRead($Gz);$Z=[IO.Compression.GzipStream]::new($I,[IO.Compression.CompressionMode]::Decompress);$O=[IO.File]::Create($Ps)
          try{$Z.CopyTo($O)}finally{$O.Dispose();$Z.Dispose();$I.Dispose()}
          if ((Get-Item $Ps).Length -ne [int]$env:R7_RUNNER_BYTE_LENGTH -or (Get-FileHash $Ps -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:R7_RUNNER_SHA256) { throw 'runner_source_identity_mismatch' }
          & pwsh -NoProfile -File $Ps
          if ($LASTEXITCODE -ne 0) { throw "exact_v4_runner_failed:$LASTEXITCODE" }

      - name: Install exact legacy compiler in isolated analysis workspace
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'r7-audit-engine-deps' | Out-Null
          Push-Location 'r7-audit-engine-deps'
          try {
            npm init -y | Out-Null
            npm install --audit=false --fund=false solc@0.8.12
            if ($LASTEXITCODE -ne 0) { throw 'solc_0_8_12_install_failed' }
            $Version = node -e "const s=require('solc'); process.stdout.write(s.version())"
            if (-not $Version.StartsWith('0.8.12+commit.f00d7308')) { throw "solc_version_mismatch:$Version" }
          } finally { Pop-Location }

      - name: Execute real A01-A05 with verified compiler AST on exact V4 product engine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url);
          const solc=require(`${process.cwd()}/r7-audit-engine-deps/node_modules/solc`);
          const { analyzeSolidityCompilerOutputAst, verifySolidityCompilerAstEvidence } = await import(`${process.cwd()}/r7-work/lib/security/solidity-compiler-ast-runtime.mjs`);
          const { executePass35AuditA01A05 } = await import(`${process.cwd()}/r7-work/lib/security/audit-a01-a05-engine.ts`);
          const sha=(value)=>createHash('sha256').update(value).digest('hex');
          const sourceSha='3f05fc95b3bfd3d41e96fa281e00a71302e35b8fff59f81f399a419cdb9f577e';
          const runtimeSha='2756d7c52baee85cacb504f6ee1df7aad6809ac8d94a4a111d76991f90d36d6e';
          const address='0xca11bde05977b3631167028862be2a173976ca11';
          const sr=await fetch(`https://sourcify.dev/server/v2/contract/56/${address}?fields=all`,{headers:{accept:'application/json','user-agent':'velmere-r7-real-engine'},signal:AbortSignal.timeout(25000)});
          if(!sr.ok) throw new Error(`sourcify_fetch_failed:${sr.status}`);
          const raw=await sr.text(); const sc=JSON.parse(raw); if(sc.match!=='exact_match') throw new Error('sourcify_not_exact_match');
          const rows=Object.entries(sc.sources??{}).filter(([p,v])=>/Multicall3\.sol$/i.test(p)&&v&&typeof v==='object'&&typeof v.content==='string');
          if(rows.length!==1) throw new Error(`source_denominator:${rows.length}`);
          const [sourcePath,record]=rows[0]; const source=record.content;
          if(sha(Buffer.from(source,'utf8'))!==sourceSha) throw new Error('exact_deployed_source_sha_mismatch');
          const settings=sc.compilation?.compilerSettings??{};
          const input={language:'Solidity',sources:{[sourcePath]:{content:source}},settings:{...settings,outputSelection:{'*':{'':['ast'],'*':['abi','storageLayout','ir','irOptimized','evm.bytecode.object','evm.deployedBytecode.object','evm.methodIdentifiers']}}}};
          const compilerRaw=solc.compile(JSON.stringify(input)); const compilerOutput=JSON.parse(compilerRaw);
          const errors=(compilerOutput.errors??[]).filter((r)=>r.severity==='error'); if(errors.length) throw new Error(errors.map(r=>r.formattedMessage??r.message).join('\n'));
          const sourceFiles=[{path:sourcePath,content:source}];
          const astEvidence=analyzeSolidityCompilerOutputAst({sourceFiles,compilerVersion:'0.8.12+commit.f00d7308',expectedCompilerVersionPrefix:'0.8.12+commit.f00d7308',compilerOutput});
          const astVerification=verifySolidityCompilerAstEvidence(astEvidence,{sourceFiles,expectedCompilerVersionPrefix:'0.8.12+commit.f00d7308'});
          if(astVerification.ok!==true) throw new Error(`compiler_ast_evidence_verification_failed:${JSON.stringify(astVerification)}`);
          const onchain=String(sc.runtimeBytecode?.onchainBytecode??'').toLowerCase(); const recompiled=String(sc.runtimeBytecode?.recompiledBytecode??'').toLowerCase();
          if(!/^0x[0-9a-f]{200,}$/.test(onchain)||!/^0x[0-9a-f]{200,}$/.test(recompiled)) throw new Error('runtime_bytecode_missing');
          const liveRes=await fetch('https://bsc-dataseed.binance.org/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_getCode',params:[address,'latest']}),signal:AbortSignal.timeout(20000)});
          if(!liveRes.ok) throw new Error(`bsc_rpc_failed:${liveRes.status}`); const live=String((await liveRes.json()).result??'').toLowerCase(); if(live!==onchain) throw new Error('live_runtime_not_sourcify_onchain');
          if(sha(Buffer.from(live.slice(2),'hex'))!==runtimeSha) throw new Error('runtime_sha_mismatch');
          const observedAt=new Date().toISOString();
          const auditInput={schemaVersion:'velmere.pass35.audit-a01-a05-input.v1',inputClass:'CUSTOMER_SUPPLIED_VERIFIED',caseRef:'AUD-REAL-MULTICALL3-56',observedAt,chainId:'56',chainName:'BSC',contractAddress:address,projectName:'Multicall3',sourceFiles,abi:sc.abi,sourceProvenance:{provider:'Sourcify API v2',sourceReference:`https://sourcify.dev/server/v2/contract/56/${address}?fields=all`,verifiedSource:true,observedAt,responseSha256:`sha256:${sha(Buffer.from(raw,'utf8'))}`},compiler:{family:'solc',version:'0.8.12+commit.f00d7308',optimizerEnabled:settings.optimizer?.enabled??null,optimizerRuns:settings.optimizer?.runs??null,evmVersion:settings.evmVersion??null,viaIR:settings.viaIR??null,settings},compiledRuntimeBytecode:recompiled,deployedRuntimeBytecode:live,compilerAstEvidence:astEvidence,compilerDeploymentBinding:null,compilerProxyBinding:null};
          const report=executePass35AuditA01A05(auditInput);
          const adjudication=JSON.parse(fs.readFileSync('r7-evidence/R7_AUDIT_BASIC_MULTICALL3_ADJUDICATION_PACKET.json','utf8'));
          if(adjudication.reviewState?.twoIndependentExternalFamiliesExecuted!==true||adjudication.reviewState?.qualifiedHumanArchitectureReview!==false) throw new Error('adjudication_packet_boundary_invalid');
          const envelope={schemaVersion:'velmere.r7.audit-basic-real-engine-exact-v4.v1',status:'PASS_REAL_ENGINE_EXECUTED_ON_EXACT_V4_SOURCE',velmereSource:{fullSourceAggregateSha256:process.env.R7_FULL_SOURCE_AGGREGATE_SHA256,executionSliceAggregateSha256:process.env.R7_EXECUTION_SLICE_AGGREGATE_SHA256,executionSliceManifestSha256:process.env.R7_EXECUTION_SLICE_MANIFEST_SHA256,executionBundleSha256:process.env.R7_TARGET_BUNDLE_SHA256},target:{chainId:'56',address,exactDeployedSourceSha256:sourceSha,runtimeSha256:runtimeSha,sourcifyMatch:sc.match},compilerAst:{verification:astVerification,selfDigestSha256:astEvidence.selfDigestSha256,findings:astEvidence.findings.length},twoIndependentExternalFamiliesAvailable:true,humanReviewStillRequired:true,customerFinalCredit:false,report,adjudicationPacketPath:'r7-evidence/R7_AUDIT_BASIC_MULTICALL3_ADJUDICATION_PACKET.json',truthBoundary:'The exact current Velmere A01-A05 engine executed on exact V4 product source and exact deployed Multicall3 evidence with verified compiler AST. Human architecture/business-logic review and higher-order final adjudication remain separate and are not impersonated by this workflow.'};
          fs.mkdirSync('artifacts/r7/audit-basic/real-engine',{recursive:true});
          fs.writeFileSync('artifacts/r7/audit-basic/real-engine/R7_AUDIT_BASIC_REAL_ENGINE_A01_A05_EXACT_V4.json',JSON.stringify(envelope,null,2)+'\n');
          console.log(JSON.stringify({status:envelope.status,velmereSource:envelope.velmereSource,target:envelope.target,compilerAst:envelope.compilerAst,controls:report.controls,bytecodeComparison:report.bytecodeComparison,staticFamilies:report.staticFamilies,summary:report.summary,reportSha256:report.reportSha256,humanReviewStillRequired:true},null,2));
          '@ | node --experimental-strip-types
          if ($LASTEXITCODE -ne 0) { throw "real_engine_execution_failed:$LASTEXITCODE" }

      - name: Upload real-engine exact V4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-real-engine-a01-a05-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/r7/audit-basic/real-engine/R7_AUDIT_BASIC_REAL_ENGINE_A01_A05_EXACT_V4.json
            r7-work/artifacts/r7/windows/R7_WINDOWS_TEST_REPEATABILITY_RECEIPT.json
            r7-work/R7_EXECUTION_SLICE_MANIFEST.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
