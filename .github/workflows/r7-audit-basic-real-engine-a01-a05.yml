name: R7 Audit Basic Real Engine A01 A05 Exact Windows

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-real-engine-a01-a05.yml'
      - 'r7-evidence/R7_AUDIT_BASIC_MULTICALL3_ADJUDICATION_PACKET.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-audit-basic-real-engine-a01-a05-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-engine-on-exact-v4:
    runs-on: windows-2025
