      R7_PROMOTED_EXECUTION_SLICE_MANIFEST_SHA256: 'cd07a81aa556ddb128c6d84e45b3ec752b8bbe0222e96abbf5816504c9bdcfd9'
      R7_PROMOTED_FULL_SOURCE_AGGREGATE_SHA256: 'd3a95fb9f8b218e751d9a2d3b75bd2d36a766cff6497207a35156ff46318e1c0'
      R7_PROMOTED_FULL_SOURCE_MANIFEST_SHA256: 'b76d26819db32d5cd7eb17258d3c9c1bf4d6b1345c9df985b20e074786f7fd5f'
      R7_ENVFIX_RECEIPT_SHA256: '4e17fcd6ef23d8bd04fb4c8eab6789bd769e5152f0dea6bb39191482ae9384a0'
      R7_ENVFIX_PATCH_SHA256: '620278df64fffa8f83600ab3998b0deb1dff6ea93e0ea65fc1b6fd6d7e155aac'
      R7_ENVFIX_PATCH_BYTE_LENGTH: '10080'
      R7_ENVFIX_GZIP_SHA256: '18d6957f2233574ea342bb1bfcc7f008c2d6ee27aa28e2f2455870d8dc4d023a'
      R7_ENVFIX_GZIP_BYTE_LENGTH: '2912'
      R7_ENVFIX_BASE64_BYTE_LENGTH: '3884'
      R7_ENVFIX_CHUNK_COUNT: '1'
      R7_ENVFIX_SECRET_SCAN_RECEIPT_SHA256: '43369b3ffcdd85694364bc44b771a51601a325bae901eacaec94ff58090824e5'
