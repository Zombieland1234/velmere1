name: R7 Shield Map Customer Graph E2E

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-shield-map-customer-e2e.yml'
      - 'r7-shield-map/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r7-shield-map-customer-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shield-map-customer-e2e:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout exact Shield Map controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Execute hosted PL EN DE customer graph contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-JsonPost([string]$Uri,[hashtable]$Headers,[object]$Body) {
            $Json = $Body | ConvertTo-Json -Depth 60 -Compress
            $Response = Invoke-WebRequest -Uri $Uri -Method Post -Headers $Headers -ContentType 'application/json' -Body $Json -SkipHttpErrorCheck -TimeoutSec 30
            $Parsed = $null
            try { $Parsed = $Response.Content | ConvertFrom-Json -Depth 100 } catch { }
            return [pscustomobject]@{ Status=[int]$Response.StatusCode; Body=$Parsed; Raw=[string]$Response.Content }
          }
          function Assert([bool]$Condition,[string]$Message) { if (-not $Condition) { throw $Message } }
          function Get-Oidc([string]$Audience) {
            if (-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) { throw 'shield_map_oidc_environment_missing' }
            $Separator = if ($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')) { '&' } else { '?' }
            $Response = Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL+$Separator+'audience='+[Uri]::EscapeDataString($Audience)) -Headers @{ Authorization='Bearer '+$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN } -Method Get -TimeoutSec 20
            $Token = [string]$Response.value
            if (-not $Token) { throw 'shield_map_oidc_token_missing' }
            Write-Host "::add-mask::$Token"
            return $Token
          }

          $HelperUrl = 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-shield-map-e2e-oidc'
          $BridgeUrl = 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-shield-map-public-bridge'

          $WrongOidc = Get-Oidc 'velmere-r7-shield-map-wrong-audience'
          $WrongAudience = Invoke-JsonPost $HelperUrl @{ Authorization='Bearer '+$WrongOidc; Accept='application/json' } @{ action='capability' }
          Assert ($WrongAudience.Status -eq 401) "shield_map_wrong_audience_not_denied_$($WrongAudience.Status)"

          $Oidc = Get-Oidc 'velmere-r7-shield-map-e2e'
          $CapabilityResponse = Invoke-JsonPost $HelperUrl @{ Authorization='Bearer '+$Oidc; Accept='application/json' } @{ action='capability' }
          Assert ($CapabilityResponse.Status -eq 200 -and $CapabilityResponse.Body.ok -eq $true) ('shield_map_capability_failed:'+($CapabilityResponse.Raw.Substring(0,[Math]::Min(500,$CapabilityResponse.Raw.Length))))
          Assert ($CapabilityResponse.Body.runId -eq $env:GITHUB_RUN_ID -and $CapabilityResponse.Body.headSha -eq $env:GITHUB_SHA) 'shield_map_capability_run_binding_invalid'
          $Capability = [string]$CapabilityResponse.Body.shieldMapServerCapability
          Assert ($Capability.Length -ge 48 -and $Capability.Length -le 256) 'shield_map_capability_contract_invalid'
          Write-Host "::add-mask::$Capability"

          $Headers = @{ 'x-velmere-shield-map-server-capability'=$Capability; Accept='application/json' }
          $ExpectedTitles = @{
            pl = 'Shield Map — mapa dowodów'
            en = 'Shield Map — evidence map'
            de = 'Shield Map — Evidenzkarte'
          }
          $ExpectedNextLabels = @{
            pl = 'Następny krok'
            en = 'Next step'
            de = 'Nächster Schritt'
          }
          $Localized = [ordered]@{}
          foreach ($Locale in @('pl','en','de')) {
            $Result = Invoke-JsonPost $BridgeUrl $Headers @{ schemaVersion='velmere.r7.shield-map-request.v1'; assetId='multicall3-bsc'; locale=$Locale }
            Assert ($Result.Status -eq 200 -and $Result.Body.ok -eq $true) "shield_map_${Locale}_status_$($Result.Status):$($Result.Raw)"
            Assert ($Result.Body.schemaVersion -eq 'velmere.r7.shield-map-customer-graph.v1') "shield_map_${Locale}_schema_invalid"
            Assert ($Result.Body.productSlug -eq 'shield-map') "shield_map_${Locale}_slug_invalid"
            Assert ($Result.Body.productContract -eq 'EVIDENCE_LINEAGE_GAPS_NEXT_ACTION_NOT_CURRENT_POSTURE_TILE') "shield_map_${Locale}_contract_invalid"
            Assert ($Result.Body.customerVisible -eq $true -and $Result.Body.locale -eq $Locale) "shield_map_${Locale}_customer_visibility_invalid"
            Assert ($Result.Body.title -eq $ExpectedTitles[$Locale]) "shield_map_${Locale}_title_invalid"
            Assert ($Result.Body.asset.assetId -eq 'multicall3-bsc') "shield_map_${Locale}_asset_invalid"
            Assert ($Result.Body.asset.canonicalAssetId -eq 'eip155:56:0xca11bde05977b3631167028862be2a173976ca11') "shield_map_${Locale}_canonical_identity_invalid"
            Assert ($Result.Body.asset.symbol -eq 'MC3' -and $Result.Body.asset.identityClass -eq 'CHAIN_CONTRACT') "shield_map_${Locale}_identity_contract_invalid"
            Assert (@($Result.Body.cards).Count -eq 6) "shield_map_${Locale}_card_denominator_invalid"
            Assert (@($Result.Body.graph.nodes).Count -eq 6 -and @($Result.Body.graph.edges).Count -eq 5) "shield_map_${Locale}_graph_denominator_invalid"
            Assert (@($Result.Body.graph.nodes | Where-Object { $_.id -eq 'next' -and $_.label -eq $ExpectedNextLabels[$Locale] }).Count -eq 1) "shield_map_${Locale}_next_action_missing"
            Assert ([int]$Result.Body.structuredPayload.historyCount -ge 2) "shield_map_${Locale}_history_incomplete"
            Assert ([int]$Result.Body.structuredPayload.comparabilitySegments -ge 2) "shield_map_${Locale}_segments_incomplete"
            $EventDigests = @($Result.Body.structuredPayload.eventDigests)
            Assert ($EventDigests -contains 'sha256:fd4a3a3b66f5a030e951cc0c592a847197260418282b3f71b4fdacdc9b8aa861') "shield_map_${Locale}_first_event_missing"
            Assert ($EventDigests -contains 'sha256:0aa92b05d736f5a3691be2420b77a0da7ff800d27707cb6f976d4626deb4f65e') "shield_map_${Locale}_latest_event_missing"
            foreach ($Digest in @($Result.Body.structuredPayload.evidenceDigests)) {
              Assert ([string]$Digest -match '^sha256:[a-f0-9]{64}$') "shield_map_${Locale}_evidence_digest_invalid"
            }
            $Current = $Result.Body.structuredPayload.currentEvent
            Assert ([int]$Current.score -eq 36 -and $Current.level -eq 'medium') "shield_map_${Locale}_current_posture_invalid"
            Assert ([double]$Current.confidence -eq 0.34 -and [int]$Current.signalCount -eq 2) "shield_map_${Locale}_confidence_invalid"
            try {
              $ObservedAt = [DateTimeOffset]$Result.Body.currentness.observedAt
              $SourceAsOf = [DateTimeOffset]$Result.Body.currentness.sourceAsOf
            } catch {
              throw "shield_map_${Locale}_timestamp_parse_invalid"
            }
            $Now = [DateTimeOffset]::UtcNow
            Assert ($ObservedAt -le $Now.AddMinutes(5) -and $SourceAsOf -le $Now.AddMinutes(5)) "shield_map_${Locale}_future_timestamp_invalid"
            Assert ($ObservedAt -ge $Now.AddDays(-7) -and $SourceAsOf -ge $Now.AddDays(-7)) "shield_map_${Locale}_stale_timestamp_invalid"
            Assert ($Result.Body.currentness.state -eq 'CURRENT' -and [int]$Result.Body.currentness.maxAgeSeconds -eq 604800) "shield_map_${Locale}_currentness_contract_invalid"
            Assert ($Result.Body.rights.sourceClass -eq 'VELMERE_GENERATED_PUBLIC_EVIDENCE_FROM_DIRECT_CHAIN_BOUND_SOURCE') "shield_map_${Locale}_rights_source_invalid"
            Assert ($Result.Body.rights.externalProviderDisplayRightsRequired -eq $false -and [int]$Result.Body.rights.providerNetworkCalls -eq 0) "shield_map_${Locale}_provider_boundary_invalid"
            Assert ($Result.Body.rights.rawProviderPayloadReturned -eq $false) "shield_map_${Locale}_raw_provider_payload_leak"
            Assert ($Result.Body.serviceRoleReturned -eq $false -and $Result.Body.rawCapabilityReturned -eq $false) "shield_map_${Locale}_secret_boundary_invalid"
            Assert ($Result.Body.paidValueCredit -eq $false) "shield_map_${Locale}_paid_overclaim"
            Assert ([string]$Result.Body.uncertaintyDisclosure -and [string]$Result.Body.uncertaintyDisclosure -notmatch '(?i)probability\s*[:=]\s*\d') "shield_map_${Locale}_uncertainty_invalid"
            $Serialized = $Result.Body | ConvertTo-Json -Depth 100 -Compress
            foreach ($Forbidden in @('SUPABASE_SERVICE_ROLE_KEY','x-velmere-shield-map-server-capability',$Capability)) {
              Assert (-not $Serialized.Contains($Forbidden)) "shield_map_${Locale}_private_value_leak"
            }
            $Localized[$Locale] = [ordered]@{
              title = [string]$Result.Body.title
              currentEventDigest = [string]$Current.eventDigest
              currentEvidenceDigest = [string]$Current.evidenceDigest
              observedAt = $ObservedAt.ToUniversalTime().ToString('o',[Globalization.CultureInfo]::InvariantCulture)
              sourceAsOf = $SourceAsOf.ToUniversalTime().ToString('o',[Globalization.CultureInfo]::InvariantCulture)
              cards = @($Result.Body.cards).Count
              nodes = @($Result.Body.graph.nodes).Count
              edges = @($Result.Body.graph.edges).Count
            }
          }

          $Invalid = Invoke-JsonPost $BridgeUrl @{ 'x-velmere-shield-map-server-capability'=('x' * 64); Accept='application/json' } @{ schemaVersion='velmere.r7.shield-map-request.v1'; assetId='multicall3-bsc'; locale='en' }
          Assert ($Invalid.Status -eq 403) "shield_map_invalid_capability_not_denied_$($Invalid.Status)"
          $Missing = Invoke-JsonPost $BridgeUrl $Headers @{ schemaVersion='velmere.r7.shield-map-request.v1'; assetId='unknown-shield-map'; locale='en' }
          Assert ($Missing.Status -eq 404) "shield_map_missing_asset_not_fail_closed_$($Missing.Status)"
          $BadLocale = Invoke-JsonPost $BridgeUrl $Headers @{ schemaVersion='velmere.r7.shield-map-request.v1'; assetId='multicall3-bsc'; locale='fr' }
          Assert ($BadLocale.Status -eq 400) "shield_map_bad_locale_not_rejected_$($BadLocale.Status)"
          $UnknownField = Invoke-JsonPost $BridgeUrl $Headers @{ schemaVersion='velmere.r7.shield-map-request.v1'; assetId='multicall3-bsc'; locale='en'; unexpected='blocked' }
          Assert ($UnknownField.Status -eq 400) "shield_map_unknown_field_not_rejected_$($UnknownField.Status)"
          $Oversized = Invoke-JsonPost $BridgeUrl $Headers @{ schemaVersion='velmere.r7.shield-map-request.v1'; assetId='multicall3-bsc'; locale='en'; padding=('z' * 5000) }
          Assert ($Oversized.Status -eq 413) "shield_map_oversized_body_not_rejected_$($Oversized.Status)"
          $GetResponse = Invoke-WebRequest -Uri $BridgeUrl -Method Get -SkipHttpErrorCheck -TimeoutSec 20
          Assert ([int]$GetResponse.StatusCode -eq 405) "shield_map_get_not_rejected_$([int]$GetResponse.StatusCode)"

          New-Item -ItemType Directory -Force -Path 'artifacts/r7/shield-map' | Out-Null
          $Receipt = [ordered]@{
            schemaVersion = 'velmere.r7.shield-map-customer-graph-e2e.v1'
            status = 'PASS_SHIELD_MAP_CUSTOMER_GRAPH_E2E'
            github = @{ runId=$env:GITHUB_RUN_ID; runAttempt=[int]$env:GITHUB_RUN_ATTEMPT; headSha=$env:GITHUB_SHA }
            product = @{
              productOrdinal = 16
              productSlug = 'shield-map'
              canonicalAssetId = 'eip155:56:0xca11bde05977b3631167028862be2a173976ca11'
              contract = 'EVIDENCE_LINEAGE_GAPS_NEXT_ACTION_NOT_CURRENT_POSTURE_TILE'
              locales = @('pl','en','de')
              localized = $Localized
              cardDenominator = 6
              graphNodeDenominator = 6
              graphEdgeDenominator = 5
              historyEvents = 2
              provenance = $true
              currentness = $true
              accessibilityStructure = $true
              customerVisibleStructuredPayload = $true
              distinctFromShieldBasic = $true
              distinctFromRiskIndicator = $true
            }
            rights = @{
              sourceClass = 'VELMERE_GENERATED_PUBLIC_EVIDENCE_FROM_DIRECT_CHAIN_BOUND_SOURCE'
              externalProviderDisplayRightsRequired = $false
              providerNetworkCalls = 0
              rawProviderPayloadReturned = $false
            }
            negatives = @{
              wrongOidcAudienceDenied = $true
              invalidCapabilityDenied = $true
              missingAssetFailClosed = $true
              unsupportedLocaleRejected = $true
              unknownFieldRejected = $true
              oversizedBodyRejected = $true
              wrongMethodRejected = $true
            }
            privacy = @{ serviceRoleInApplication=$false; rawCapabilityReturned=$false; rawProviderPayloadReturned=$false }
            customerFinalCredit = $false
            paidValueCredit = $false
            truthBoundary = 'Hosted Shield Map customer graph passed in PL, EN and DE against current customer-publishable Velmere evidence. The workflow cannot grant FINAL; the guarded finalizer separately binds the GitHub run, successful E2E job, immutable artifact, source files, live source authority, and physical ledger re-read.'
          }
          $Receipt | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath 'artifacts/r7/shield-map/R7_SHIELD_MAP_CUSTOMER_GRAPH_E2E.json' -Encoding utf8
          Write-Host ($Receipt | ConvertTo-Json -Depth 100)

      - name: Upload Shield Map customer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-shield-map-customer-e2e-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/r7/shield-map/R7_SHIELD_MAP_CUSTOMER_GRAPH_E2E.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  finalize-shield-map:
    needs: shield-map-customer-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guarded append-only Shield Map finalization and re-read
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) separator='&';; esac
          oidc="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=velmere-r7-shield-map-finalizer" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$oidc"
          response=''
          for attempt in $(seq 1 15); do
            response="$(curl --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $oidc" \
              -H 'Content-Type: application/json' \
              -d '{"action":"finalize"}' \
              'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-shield-map-finalizer-oidc')"
            if python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") is True else 1)' <<<"$response"; then
              break
            fi
            sleep 2
          done
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RESPONSE'])
          if data.get('ok') is not True:
              raise SystemExit(f"shield map finalization failed: {data}")
          result = data.get('result') or {}
          reread = data.get('reRead') or {}
          if result.get('productSlug') != 'shield-map' or result.get('finalStatus') != 'FINAL':
              raise SystemExit(f"shield map finalization contract invalid: {data}")
          if reread.get('product_slug') != 'shield-map' or reread.get('final_status') != 'FINAL':
              raise SystemExit(f"shield map ledger re-read invalid: {data}")
          print(json.dumps({
              'schemaVersion': 'velmere.r7.shield-map-finalization-receipt.v1',
              'status': 'FINAL',
              'customerFinalCount': result.get('customerFinalCount'),
              'reRead': reread,
              'serviceRoleReturned': False,
          }, indent=2))
          PY
