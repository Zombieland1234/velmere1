name: R7 Browser Pro PR Candidate Trigger

on:
  push:
    branches:
      - r7-browser-pro-final-trigger-20260829
    paths:
      - '.github/workflows/r7-browser-pro-pr-trigger.yml'
      - 'r7-browser-pro-harness/**'
      - 'r7-risk-v5/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  VELMERE_BROWSER_PRO_TRIGGER_REVISION: 'v5-direct-v3-branch-bound-oidc'

jobs:
  browser-pro-pr-candidate:
    if: ${{ github.repository == 'Zombieland1234/velmere1' && startsWith(github.ref_name, 'r7-browser-pro-final-trigger-') }}
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false
      - name: Prepare exact base
        shell: pwsh
        run: ./r7-risk-v5/run-r7-risk-v5-exact-windows-execution-slice-fixed.ps1 -Mode Prepare
      - name: Apply Browser Pro patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'r7-work/artifacts/r7/browser-pro' | Out-Null
          & node 'r7-browser-pro-harness/patch-browser-pro-entitlement-bridge-candidate-v2.mjs' 'r7-work'
          if($LASTEXITCODE -ne 0){throw "browser_pro_patch_failed:$LASTEXITCODE"}
      - name: Run Browser Pro canonical candidate E2E directly
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $SourcePath = './r7-browser-pro-harness/run-r7-browser-pro-entitlement-candidate-e2e-v3.ps1'
          $RuntimePath = Join-Path $env:RUNNER_TEMP 'run-r7-browser-pro-entitlement-candidate-e2e-v5-runtime.ps1'
          $Text = Get-Content -LiteralPath $SourcePath -Raw
          $Pairs = @(
            @{Old='https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-browser-pro-e2e-oidc';New='https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-browser-pro-e2e-final-oidc-v2';Label='helper'},
            @{Old="`$Audience = 'velmere-r7-browser-pro-e2e'";New="`$Audience = 'velmere-r7-browser-pro-e2e-final'";Label='audience'}
          )
          foreach($Pair in $Pairs){
            $Count=([regex]::Matches($Text,[regex]::Escape([string]$Pair.Old))).Count
            if($Count -ne 1){throw "browser_pro_v5_anchor_mismatch:$($Pair.Label):$Count"}
            $Text=$Text.Replace([string]$Pair.Old,[string]$Pair.New)
          }
          [IO.File]::WriteAllText($RuntimePath,$Text,[Text.UTF8Encoding]::new($false))
          & pwsh -NoProfile -File $RuntimePath
          if($LASTEXITCODE -ne 0){throw "browser_pro_v5_direct_v3_failed:$LASTEXITCODE"}
      - name: Record Browser Pro append-only candidate evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $Work = Join-Path (Get-Location).Path 'r7-work'
          $E2ePath = Join-Path $Work 'artifacts/r7/browser-pro/R7_BROWSER_PRO_ENTITLEMENT_CANDIDATE_E2E.json'
          $PatchPath = Join-Path $Work 'artifacts/r7/browser-pro/R7_BROWSER_PRO_ENTITLEMENT_PATCH_RECEIPT.json'
          if(-not(Test-Path -LiteralPath $E2ePath -PathType Leaf)){throw 'browser_pro_v5_e2e_receipt_missing'}
          if(-not(Test-Path -LiteralPath $PatchPath -PathType Leaf)){throw 'browser_pro_v5_patch_receipt_missing'}
          $Audience='velmere-r7-browser-pro-e2e-final'
          $Sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $TokenUri=$env:ACTIONS_ID_TOKEN_REQUEST_URL+$Sep+'audience='+[Uri]::EscapeDataString($Audience)
          $Oidc=[string](Invoke-RestMethod -Method Get -Uri $TokenUri -Headers @{Authorization='Bearer '+$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN} -TimeoutSec 20).value
          if($Oidc.Split('.').Count -ne 3){throw 'browser_pro_v5_record_oidc_missing'}
          Write-Host "::add-mask::$Oidc"
          $E2e=Get-Content -LiteralPath $E2ePath -Raw|ConvertFrom-Json -Depth 40
          $Patch=Get-Content -LiteralPath $PatchPath -Raw|ConvertFrom-Json -Depth 40
          $Body=@{action='record';e2eReceipt=$E2e;patchReceipt=$Patch}|ConvertTo-Json -Depth 50 -Compress
          $Resp=Invoke-WebRequest -Method Post -Uri 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-browser-pro-e2e-final-oidc-v2' -Headers @{Authorization='Bearer '+$Oidc;Accept='application/json'} -ContentType 'application/json' -Body $Body -SkipHttpErrorCheck -TimeoutSec 45
          if([int]$Resp.StatusCode -ne 200){throw "browser_pro_v5_record_http_$([int]$Resp.StatusCode)"}
          $Recorded=$Resp.Content|ConvertFrom-Json -Depth 30
          if($Recorded.ok -ne $true -or $Recorded.recorded -ne $true){throw 'browser_pro_v5_record_contract_failed'}
          $Recorded|ConvertTo-Json -Depth 20|Set-Content -LiteralPath (Join-Path $Work 'artifacts/r7/browser-pro/R7_BROWSER_PRO_CANDIDATE_EVIDENCE_RECORD.json') -Encoding utf8
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-browser-pro-pr-candidate-${{ github.run_id }}
          path: r7-work/artifacts/r7/browser-pro
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true