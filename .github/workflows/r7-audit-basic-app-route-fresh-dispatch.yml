name: R7 Audit Basic Fresh Closure Dispatch

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-app-route-fresh-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-current-head:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch app-route and Aderyn workflows on current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(printf '{"ref":"%s"}' "$REF_NAME")
          for workflow in \
            r7-audit-basic-app-route-current-source-e2e.yml \
            r7-audit-basic-aderyn-external.yml
          do
            code=$(curl -sS -o "response-${workflow}.txt" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/actions/workflows/$workflow/dispatches" \
              -d "$body")
            if [ "$code" != "204" ]; then
              cat "response-${workflow}.txt"
              exit 1
            fi
            echo "fresh $workflow dispatched for $REF_NAME"
          done