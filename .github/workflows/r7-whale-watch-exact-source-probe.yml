name: R7 Whale Watch Exact Current Source Probe

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-whale-watch-exact-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-whale-watch-exact-source-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  whale-watch-source-probe:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      R7_RISK_FULL_SOURCE_AGGREGATE_SHA256: '50d59f5f028ef73b279fa3930889fcbf2ab5bc5e36ab4e8cec97be5ed49be67e'
      R7_RISK_FULL_SOURCE_MANIFEST_SHA256: 'af63491cf2922c6391d25fcf25a7d8efb6e76d128f4f9ca1dcf07b36471b0a2f'
      R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256: 'f83f28de6add73eee70d9086f2705241243661d64b5c9fd579b17b359050a221'
      R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256: 'b947314bb696fb8f9153c34d46ba825c5897e9f8cc8cf911a5f31113aa5fc01f'
      R7_RISK_BUNDLE_SHA256: '8e3c66471d534310e1142c3671d43bb556e35b6901c847c9596eea14e8815967'
      R7_PACKAGE_JSON_SHA256: '384932e8183ff4ced7850556ee21bb7b71f9a86add02112a4e434bc09f457a61'
      R7_PACKAGE_LOCK_SHA256: '5924aa0d679ebd78bcd6da01815fdd4b6ff503db45b17697c00168c06af7de61'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'

    steps:
      - name: Checkout exact control surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct exact current source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1' -Mode Prepare
          if ($LASTEXITCODE -ne 0) { throw "exact_current_source_prepare_failed:$LASTEXITCODE" }

      - name: Discover Whale Watch routes contracts and tests from exact source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const root='r7-work';
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const manifestPath=path.join(root,'CURRENT_CANDIDATE_CONTENT_MANIFEST.tsv');
          const manifestBytes=fs.readFileSync(manifestPath);
          if(sha(manifestBytes)!==process.env.R7_RISK_FULL_SOURCE_MANIFEST_SHA256) throw new Error('whale_probe_full_source_manifest_sha_mismatch');
          const lines=manifestBytes.toString('utf8').trimEnd().split(/\r?\n/);
          if(lines.shift()!=='path\tbytes\tsha256') throw new Error('whale_probe_manifest_header_invalid');
          const rows=lines.map(line=>{const [p,b,s]=line.split('\t');return{path:p,bytes:Number(b),sha256:s};});

          const primary=[
            ['whale',/\bwhale(?:s)?\b/i],
            ['whale-watch',/whale[-_\s]?watch/i],
            ['large-transfer',/large[-_\s]?transfer/i],
            ['large-movement',/large[-_\s]?(?:movement|transaction|tx)/i],
            ['wallet-flow',/wallet[-_\s]?flow/i],
            ['transfer-watch',/transfer[-_\s]?(?:watch|monitor|alert)/i],
            ['onchain-flow',/on[-_\s]?chain[-_\s]?(?:flow|movement)/i],
          ];
          const support=[
            ['finality',/\bfinality\b/i],['reorg',/\breorg(?:anization)?\b/i],['decimals',/\bdecimals\b/i],
            ['bridge',/\bbridge(?:d|s)?\b/i],['labels',/\blabel(?:s|ing|led)?\b/i],['wallet',/\bwallet\b/i],
            ['transfer',/\btransfer(?:s|red|ring)?\b/i],['transaction',/\btransaction(?:s)?\b/i]
          ];
          const textExt=new Set(['.ts','.tsx','.mts','.mjs','.js','.json','.md','.txt','.yaml','.yml']);
          const matches=[];
          for(const row of rows){
            const p=row.path;
            const pathSignals=primary.filter(([,rx])=>rx.test(p)).map(([n])=>n);
            let contentSignals=[],supportSignals=[];
            const ext=path.extname(p).toLowerCase();
            if(textExt.has(ext)&&row.bytes>0&&row.bytes<=1500000){
              const abs=path.join(root,p);
              if(fs.existsSync(abs)){
                const bytes=fs.readFileSync(abs);
                if(bytes.length!==row.bytes||sha(bytes)!==row.sha256) throw new Error(`whale_probe_file_identity:${p}`);
                const text=bytes.toString('utf8');
                contentSignals=primary.filter(([,rx])=>rx.test(text)).map(([n])=>n);
                if(pathSignals.length||contentSignals.length) supportSignals=support.filter(([,rx])=>rx.test(text)).map(([n])=>n);
              }
            }
            if(pathSignals.length||contentSignals.length){
              const lower=p.toLowerCase();
              const category=lower.includes('/app/api/')||lower.endsWith('/route.ts')?'route':lower.includes('test')||lower.includes('/scripts/')?'test-or-script':lower.includes('/lib/')?'library':'other';
              matches.push({path:p,category,bytes:row.bytes,sha256:row.sha256,pathSignals,contentSignals,supportSignals});
            }
          }
          matches.sort((a,b)=>{
            const score=x=>x.pathSignals.length*100+x.contentSignals.length*10+x.supportSignals.length;
            return score(b)-score(a)||a.path.localeCompare(b.path);
          });
          const receipt={
            schemaVersion:'velmere.r7.whale-watch-exact-source-probe.v1',
            status:matches.length?'PASS_WHALE_WATCH_SOURCE_SURFACES_DISCOVERED':'PASS_NO_NAMED_WHALE_SURFACE_DISCOVERED',
            github:{runId:process.env.GITHUB_RUN_ID,headSha:process.env.GITHUB_SHA,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT)},
            exactCurrentSource:{fullSourceAggregateSha256:process.env.R7_RISK_FULL_SOURCE_AGGREGATE_SHA256,fullSourceManifestSha256:process.env.R7_RISK_FULL_SOURCE_MANIFEST_SHA256,executionSliceAggregateSha256:process.env.R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256},
            sourceFileCount:rows.length,
            matchCount:matches.length,
            matches:matches.slice(0,100),
            customerFinalCredit:false,
            paidValueCredit:false,
            truthBoundary:'Discovery-only probe over exact current source. Matching names and code do not establish customer FINAL, provider rights, live-data truth, or correctness; those require bounded execution and guarded final adjudication.'
          };
          fs.writeFileSync('R7_WHALE_WATCH_EXACT_SOURCE_PROBE.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw "whale_watch_source_probe_failed:$LASTEXITCODE" }

      - name: Upload Whale Watch source discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-whale-watch-exact-source-probe-${{ github.sha }}-${{ github.run_id }}
          path: R7_WHALE_WATCH_EXACT_SOURCE_PROBE.json
          if-no-files-found: error
          retention-days: 30
