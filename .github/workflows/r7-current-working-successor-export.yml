name: R7 Velmere Current Working Successor Export

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-current-working-successor-export.yml'
      - 'diagnostic-current/patch-whale-watch-conflicting-label-downgrade-v1.mjs'
      - 'diagnostic-current/r7-whale-watch-label-identity-negatives.mts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-current-working-successor-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-working-successor:
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      R7_RISK_FULL_SOURCE_AGGREGATE_SHA256: '50d59f5f028ef73b279fa3930889fcbf2ab5bc5e36ab4e8cec97be5ed49be67e'
      R7_RISK_FULL_SOURCE_MANIFEST_SHA256: 'af63491cf2922c6391d25fcf25a7d8efb6e76d128f4f9ca1dcf07b36471b0a2f'
      R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256: 'f83f28de6add73eee70d9086f2705241243661d64b5c9fd579b17b359050a221'
      R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256: 'b947314bb696fb8f9153c34d46ba825c5897e9f8cc8cf911a5f31113aa5fc01f'
      R7_RISK_BUNDLE_SHA256: '8e3c66471d534310e1142c3671d43bb556e35b6901c847c9596eea14e8815967'
      R7_PACKAGE_JSON_SHA256: '384932e8183ff4ced7850556ee21bb7b71f9a86add02112a4e434bc09f457a61'
      R7_PACKAGE_LOCK_SHA256: '5924aa0d679ebd78bcd6da01815fdd4b6ff503db45b17697c00168c06af7de61'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'

    steps:
      - name: Checkout current closure controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct exact current source and clean export base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1' -Mode Prepare
          if ($LASTEXITCODE -ne 0) { throw "exact_current_source_prepare_failed:$LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'r7-risk-v5-clean-source' -PathType Container)) { throw 'clean_source_copy_missing' }

      - name: Apply validated Audit V5 and Whale Watch successor candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location r7-work
          try {
            node ../diagnostic-current/patch-audit-basic-zero-vercel-app-route-candidate.mjs | Tee-Object -FilePath ../R7_WORKING_SUCCESSOR_AUDIT_PATCH.json
            if ($LASTEXITCODE -ne 0) { throw 'working_successor_audit_patch_failed' }
            node ../diagnostic-current/patch-whale-watch-public-route-v1.mjs | Tee-Object -FilePath ../R7_WORKING_SUCCESSOR_WHALE_ROUTE_PATCH.json
            if ($LASTEXITCODE -ne 0) { throw 'working_successor_whale_route_patch_failed' }
            node ../diagnostic-current/patch-whale-watch-conflicting-label-downgrade-v1.mjs | Tee-Object -FilePath ../R7_WORKING_SUCCESSOR_WHALE_CONFLICT_PATCH.json
            if ($LASTEXITCODE -ne 0) { throw 'working_successor_whale_conflict_patch_failed' }

            npx tsc -p scripts/current-execution/tsconfig-whale-watch-canonical-event-identity.json --noEmit
            if ($LASTEXITCODE -ne 0) { throw 'working_successor_whale_typecheck_failed' }
            node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/current-execution/test-whale-watch-canonical-event-identity.mts | Tee-Object -FilePath ../R7_WORKING_SUCCESSOR_WHALE_CANONICAL.log
            if ($LASTEXITCODE -ne 0) { throw 'working_successor_whale_canonical_failed' }

            Pop-Location
            node --import ./r7-work/scripts/pass11/register-offline-ts-loader.mjs diagnostic-current/r7-whale-watch-label-identity-negatives.mts | Tee-Object -FilePath R7_WORKING_SUCCESSOR_WHALE_LABEL_NEGATIVES.log
            if ($LASTEXITCODE -ne 0) { throw 'working_successor_whale_label_negatives_failed' }
            if (-not (Test-Path -LiteralPath 'R7_WHALE_WATCH_LABEL_IDENTITY_NEGATIVES.json' -PathType Leaf)) { throw 'working_successor_whale_label_negative_receipt_missing' }
            Push-Location r7-work

            npm run typecheck
            if ($LASTEXITCODE -ne 0) { throw 'working_successor_typecheck_failed' }
            npx eslint lib/security/audit-basic-customer-bridge-client.ts app/api/audit/basic/case/route.ts app/api/audit/basic/report/route.ts app/api/audit/basic/report/restore/route.ts app/api/whale-watch/route.ts lib/market-integrity/whale-watch-engine.ts --max-warnings=0
            if ($LASTEXITCODE -ne 0) { throw 'working_successor_eslint_failed' }
            npm run build:webpack
            if ($LASTEXITCODE -ne 0) { throw 'working_successor_webpack_failed' }
          } finally {
            if ((Get-Location).Path -like '*r7-work') { Pop-Location }
          }

      - name: Materialize validated candidate files into clean successor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'lib/security/audit-basic-customer-bridge-client.ts',
            'app/api/audit/basic/case/route.ts',
            'app/api/audit/basic/report/route.ts',
            'app/api/audit/basic/report/restore/route.ts',
            'app/api/whale-watch/route.ts',
            'lib/market-integrity/whale-watch-engine.ts'
          )
          foreach ($relative in $paths) {
            $source = Join-Path 'r7-work' $relative
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "candidate_file_missing:$relative" }
            $dest = Join-Path 'r7-risk-v5-clean-source' $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest) | Out-Null
            Copy-Item -LiteralPath $source -Destination $dest -Force
          }
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root='r7-risk-v5-clean-source';
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const changed=[
            'lib/security/audit-basic-customer-bridge-client.ts',
            'app/api/audit/basic/case/route.ts',
            'app/api/audit/basic/report/route.ts',
            'app/api/audit/basic/report/restore/route.ts',
            'app/api/whale-watch/route.ts',
            'lib/market-integrity/whale-watch-engine.ts',
          ].map(p=>{const b=fs.readFileSync(path.join(root,p));return{path:p,bytes:b.length,sha256:sha(b)};});
          const whaleEngine=changed.find(x=>x.path==='lib/market-integrity/whale-watch-engine.ts');
          const receipt={
            schemaVersion:'velmere.r7.current-working-successor-candidate.v2',
            status:'PASS_VALIDATED_WORKING_SUCCESSOR_CANDIDATE',
            github:{runId:process.env.GITHUB_RUN_ID,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),controlHeadSha:process.env.GITHUB_SHA},
            baseAuthority:{fullSourceAggregateSha256:process.env.R7_RISK_FULL_SOURCE_AGGREGATE_SHA256,fullSourceManifestSha256:process.env.R7_RISK_FULL_SOURCE_MANIFEST_SHA256,executionSliceAggregateSha256:process.env.R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256,executionSliceManifestSha256:process.env.R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256,executionBundleSha256:process.env.R7_RISK_BUNDLE_SHA256},
            validatedCandidateChanges:changed,
            whaleWatch:{
              engineBaseSha256:'dbaa32feb1134c6eb4c2fa7e6bd8e71d187f2366af1c5e2cba459ed4af672a99',
              enginePatchedSha256:whaleEngine.sha256,
              behavior:'CONFLICTING_VERIFIED_LABEL_ARTIFACTS_DOWNGRADE_HOLDER_TO_UNCLASSIFIED',
              historicalFailRunId:'33123865212',
              supersedingConflictFixRunId:'33124300674',
              publicRouteRunId:'33123256667',
              realBscFinalityV4RunId:'33123623285',
              deployedStagingRouteRunId:'33123982191',
              integratedCanonicalRegression:'PASS',
              integratedSignedLabelIdentityNegatives:'PASS'
            },
            validation:{typecheck:'PASS',targetedEslint:'PASS',webpack:'PASS',auditV5CustomerLifecycleSourceRunId:'33122699919',auditV5CustomerLifecycleResult:'PASS',whalePublicRouteResult:'PASS',whaleConflictDowngradeResult:'PASS'},
            operationalComponents:{auditCustomerBridge:'r7-audit-basic-customer-bridge@v4',auditOwnerOidc:'r7-audit-basic-app-candidate-oidc@v4'},
            customerFinalCountAtConstruction:4,
            paidValueFinalCountAtConstruction:0,
            authoritySnapshot:false,
            workingSuccessorCandidate:true,
            customerFinalCredit:false,
            paidValueCredit:false,
            truthBoundary:'This ZIP is the latest validated working-successor candidate layered onto the exact current Risk-v5 clean execution source. Six materialized candidate files include the Whale Watch conflicting-label fail-closed engine fix. Integrated Whale canonical-event and signed-label identity-negative regressions, full TypeScript, targeted ESLint and webpack must pass before export. It is not a new source-authority snapshot and does not increase Customer FINAL or Paid Value FINAL by itself.'
          };
          fs.writeFileSync(path.join(root,'VELMERE_WORKING_SUCCESSOR_RECEIPT.json'),JSON.stringify(receipt,null,2)+'\n');
          fs.writeFileSync('R7_VELMERE_WORKING_SUCCESSOR_RECEIPT.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          '@ | node --input-type=module

      - name: Upload latest validated Velmere working successor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VELMERE_WORKING_SUCCESSOR_CANDIDATE_2026-08-28_${{ github.sha }}
          path: |
            r7-risk-v5-clean-source/**
            R7_VELMERE_WORKING_SUCCESSOR_RECEIPT.json
            R7_WORKING_SUCCESSOR_AUDIT_PATCH.json
            R7_WORKING_SUCCESSOR_WHALE_ROUTE_PATCH.json
            R7_WORKING_SUCCESSOR_WHALE_CONFLICT_PATCH.json
            R7_WORKING_SUCCESSOR_WHALE_CANONICAL.log
            R7_WORKING_SUCCESSOR_WHALE_LABEL_NEGATIVES.log
            R7_WHALE_WATCH_LABEL_IDENTITY_NEGATIVES.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
