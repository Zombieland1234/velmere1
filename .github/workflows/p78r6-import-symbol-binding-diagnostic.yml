name: P78R6 OpenZeppelin Import Symbol Binding Diagnostic

on:
  push:
    branches:
      - velmere-p78r6-import-symbol-binding-20260818
    paths:
      - 'p78-runtime/test-p78r6-import-alias-fp.mts'
      - '.github/workflows/p78r6-import-symbol-binding-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Expand support and reconstruct exact P78R5
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,zipfile
          parts=sorted(Path('p75-runtime').glob('bundle.part*'))
          raw=base64.b64decode(''.join(p.read_text(encoding='ascii').strip() for p in parts),validate=True)
          assert len(parts)==7 and hashlib.sha256(raw).hexdigest()=='467026e4c5751d42c6fb06fb4425d640f911a3990fc3f05fd2de99c03e68ffad'
          z=Path('p75-runtime/p75-ci-bundle.zip');z.write_bytes(raw)
          with zipfile.ZipFile(z) as a:a.extractall('p75-runtime')
          PY
          python3 p77-runtime/reconstruct-p77-support.py --parts-dir p77-runtime --output-dir p77-runtime
          mkdir -p p78r6-out
          git config core.autocrlf false
          git config core.eol lf
          python3 p73-runtime/reconstruct-p73r7-exact.py --work-root p75-work --out-root p78r6-out >/dev/null
          python3 p75-runtime/apply-p75-advanced-automation-runtime.py --source-root p75-work/source --parent-manifest p75-work/P73R7_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P75_BUILD_PROJECTION_MANIFEST.json --receipt p78r6-out/P75.json >/dev/null
          python3 p76r2-runtime/reconstruct-p76-base-apply.py --parts-dir p76-runtime --output p76-runtime/apply-p76-advanced-release-automation.py >/dev/null
          python3 p76-runtime/apply-p76-advanced-release-automation.py --source-root p75-work/source --parent-manifest p75-work/P75_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P76_BUILD_PROJECTION_MANIFEST.json --receipt p78r6-out/P76.json >/dev/null
          python3 p76r2-runtime/apply-p76r2-typescript-repair.py --source-root p75-work/source --parent-manifest p75-work/P76_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P76R2_BUILD_PROJECTION_MANIFEST.json --receipt p78r6-out/P76R2.json >/dev/null
          python3 p77-runtime/apply-p77-deterministic-final-delivery.py --source-root p75-work/source --parent-manifest p75-work/P76R2_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P77_BUILD_PROJECTION_MANIFEST.json --receipt p78r6-out/P77.json >/dev/null
          python3 p78-runtime/apply-p78r1-audit-authority-customer-path.py --source-root p75-work/source --parent-manifest p75-work/P77_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P78R1_BUILD_PROJECTION_MANIFEST.json --receipt p78r6-out/P78R1.json >/dev/null
          python3 p78-runtime/apply-p78r2-verified-static-evidence-handoff.py --source-root p75-work/source --parent-manifest p75-work/P78R1_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P78R2_BUILD_PROJECTION_MANIFEST.json --receipt p78r6-out/P78R2.json >/dev/null
          python3 p78-runtime/apply-p78r3-erc2771-multicall-detector.py --source-root p75-work/source --parent-manifest p75-work/P78R2_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P78R3_BUILD_PROJECTION_MANIFEST.json --receipt p78r6-out/P78R3.json >/dev/null
          python3 p78-runtime/apply-p78r4-contract-correlation.py --source-root p75-work/source --parent-manifest p75-work/P78R3_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P78R4_BUILD_PROJECTION_MANIFEST.json --receipt p78r6-out/P78R4.json >/dev/null
          python3 p78-runtime/apply-p78r5-context-authenticity.py --source-root p75-work/source --parent-manifest p75-work/P78R4_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P78R5_BUILD_PROJECTION_MANIFEST.json --receipt p78r6-out/P78R5.json >/dev/null
          python3 - <<'PY'
          import json
          p=json.load(open('p75-work/P78R5_BUILD_PROJECTION_MANIFEST.json'))['projection']
          expected=(1602,21069277,'214c0ad793a36a61c5290baeb104d2e671387df5c07e42862143861aa13ef66f','530e81064adafe6b8c2f3a7d31f485c85b0e5f7977c371369b721e88a8558cfe')
          got=(p['fileCount'],p['payloadBytes'],p['pathSetSha256'],p['sourceContentAggregateSha256'])
          if got!=expected: raise SystemExit(f'P78R5 identity mismatch:{got}:{expected}')
          print('PASS exact P78R5',got)
          PY

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Install exact dependency closure
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          cd p75-work/source
          npm ci --ignore-scripts --include=dev --audit=false --fund=false >/dev/null

      - name: Execute alias-decoy hard negative against exact P78R5 detector
        env:
          P78R6_RESULT_DIR: ${{ github.workspace }}/p78r6-out
        run: |
          set -euo pipefail
          cd p75-work/source
          node ./node_modules/tsx/dist/cli.mjs ../../p78-runtime/test-p78r6-import-alias-fp.mts

      - name: Publish diagnostic receipt
        run: |
          set -euo pipefail
          mkdir -p p78r6-results
          cp p78r6-out/P78R6_IMPORT_SYMBOL_BINDING_DIAGNOSTIC.json p78r6-results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- p78r6-results
          git commit -m 'P78R6 publish import symbol binding diagnostic'
          git push origin HEAD:velmere-p78r6-import-symbol-binding-20260818
