name: R7 Browser Advanced Entitlement Candidate E2E

on:
  push:
    branches:
      - r7-browser-advanced-final-trigger-20260830
    paths:
      - '.github/workflows/r7-browser-advanced-entitlement-candidate-e2e.yml'
      - 'r7-browser-advanced-harness/**'
      - 'r7-browser-pro-harness/patch-browser-pro-entitlement-bridge-candidate-v2.mjs'
      - 'r7-risk-v5/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r7-browser-advanced-entitlement-candidate-e2e-functional-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-advanced-candidate-e2e:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
      VELMERE_BROWSER_ADVANCED_CANDIDATE: 'true'
    steps:
      - name: Checkout exact Browser Advanced candidate controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Prepare exact hash-bound Risk/Browser base
        shell: pwsh
        run: ./r7-risk-v5/run-r7-risk-v5-exact-windows.ps1 -Mode Prepare

      - name: Apply shared Browser Pro entitlement candidate patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'r7-work/artifacts/r7/browser-advanced' | Out-Null
          & node 'r7-browser-pro-harness/patch-browser-pro-entitlement-bridge-candidate-v2.mjs' 'r7-work' | Tee-Object -FilePath 'r7-work/artifacts/r7/browser-advanced/R7_BROWSER_ADVANCED_SHARED_ENTITLEMENT_PATCH_RECEIPT.json'
          if ($LASTEXITCODE -ne 0) { throw "browser_advanced_shared_candidate_patch_failed:$LASTEXITCODE" }

      - name: Apply Browser Advanced hosted-only entitlement candidate patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & node 'r7-browser-advanced-harness/patch-browser-advanced-entitlement-candidate-v1.mjs' 'r7-work' | Tee-Object -FilePath 'r7-work/artifacts/r7/browser-advanced/R7_BROWSER_ADVANCED_ENTITLEMENT_PATCH_RECEIPT.json'
          if ($LASTEXITCODE -ne 0) { throw "browser_advanced_candidate_patch_failed:$LASTEXITCODE" }

      - name: Validate changed Browser Advanced surface before E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'r7-work'
          try {
            node scripts/pass13/run-partitioned-typescript.mjs --worker 5 2>&1 | Tee-Object -FilePath 'artifacts/r7/browser-advanced/R7_BROWSER_ADVANCED_TS_PARTITION_06.log'
            if ($LASTEXITCODE -ne 0) { throw "browser_advanced_changed_partition_typecheck_failed:$LASTEXITCODE" }
            & node 'node_modules/eslint/bin/eslint.js' 'lib/commerce/vlm-advanced-only-access-policy.ts' 'lib/server/lazy-route-modules/security--audit-watch--pro-pdf--token.ts' 2>&1 | Tee-Object -FilePath 'artifacts/r7/browser-advanced/R7_BROWSER_ADVANCED_PATCH_ESLINT.log'
            if ($LASTEXITCODE -ne 0) { throw "browser_advanced_patch_lint_failed:$LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Execute Browser Advanced matched-input candidate E2E
        shell: pwsh
        run: ./r7-browser-advanced-harness/run-r7-browser-advanced-candidate-e2e.ps1

      - name: Prove production webpack after hosted E2E
        if: ${{ success() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'r7-work'
          try {
            npm run build:webpack 2>&1 | Tee-Object -FilePath 'artifacts/r7/browser-advanced/R7_BROWSER_ADVANCED_WEBPACK.log'
            if ($LASTEXITCODE -ne 0) { throw "browser_advanced_webpack_failed:$LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Upload Browser Advanced candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-browser-advanced-entitlement-candidate-${{ github.sha }}-${{ github.run_id }}
          path: |
            r7-work/artifacts/r7/browser-advanced
            r7-work/artifacts/r7/windows
            r7-work/artifacts/r7/current-execution
            r7-work/R7_EXECUTION_SLICE_MANIFEST.json
            r7-work/R7_EXECUTION_SLICE_MANIFEST.tsv
            r7-work/R7_NPM_CI.log
            r7-risk-v5/R7_RISK_V5_PATCH_RECEIPT.json
            r7-risk-runner-work/R7_RISK_V5_EFFECTIVE_WINDOWS_RUNNER_RECEIPT.json
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 14