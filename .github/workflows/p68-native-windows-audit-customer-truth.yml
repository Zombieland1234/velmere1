name: P68 Native Windows Audit Customer Artifact Truth

on:
  push:
    branches:
      - velmere-p68-audit-customer-artifact-truth-20260816
  workflow_dispatch:

concurrency:
  group: p68-native-windows-audit-customer-truth-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p68-native-windows-current-source:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout P68 control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        id: npmcli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }
          $npmRoot=(npm root --global).Trim()
          $npmCli=(Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node --version
          npm --version
          python --version

      - name: Reconstruct P46 and apply P66 then P68 exact source deltas
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config core.autocrlf false
          git config core.eol lf
          New-Item -ItemType Directory -Force p68-out | Out-Null
          python p49-build-projection/reconstruct-p49-direct-projection.py `
            --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json `
            --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f `
            --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json `
            --runner p49-build-projection/run-p47-product-windows-projection.mjs `
            --parts-root p49-build-projection/parts `
            --work-root p68-work `
            --output-root p68-out
          if ($LASTEXITCODE -ne 0) { throw "P46 reconstruction failed: $LASTEXITCODE" }
          python p66-runtime/apply-p66-audit-pdf-delta.py --source-root p68-work/source --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --output-manifest p68-work/P66_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p68-out/P66_STAGE1.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 1 failed: $LASTEXITCODE" }
          python p66-runtime/finalize-p66-shield-pro-row-id.py --source-root p68-work/source --manifest p68-work/P66_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p68-out/P66_STAGE2.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 2 failed: $LASTEXITCODE" }
          python p66-runtime/fix-p66-topology-ts-const.py --source-root p68-work/source --manifest p68-work/P66_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p68-out/P66_STAGE3.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 3 failed: $LASTEXITCODE" }
          python p68-runtime/apply-p68-audit-customer-truth.py --source-root p68-work/source --manifest p68-work/P66_BUILD_PROJECTION_MANIFEST.json --output-manifest p68-work/P68_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p68-out/P68_SOURCE_PATCH.log
          if ($LASTEXITCODE -ne 0) { throw "P68 source patch failed: $LASTEXITCODE" }
          $m=Get-Content p68-work/P68_BUILD_PROJECTION_MANIFEST.json -Raw | ConvertFrom-Json
          if ($m.projection.fileCount -ne 1597 -or $m.projection.payloadBytes -ne 20958924 -or $m.projection.pathSetSha256 -ne 'b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73' -or $m.projection.sourceContentAggregateSha256 -ne 'd4bddcf0df467142e022e59a0840c37695076be65acd6f29e5339e21a87c574c') { throw 'P68 manifest identity mismatch' }
          $expected=@{
            'lib/security/audit-report-assembler.ts'='f3b95f8d43d94ee6087b30a12814cbe78b6ed61bfe3dc186323fbc18af167438';
            'lib/security/audit-report-customer-projection.ts'='35825487b6b5bbd90d3a1eeeb1a27a9c131d60fe5a8385509431e4a88c954b50';
            'lib/security/audit-account-customer-snapshot.ts'='3929e379b41a81c9fc38c68a517d861745a0220dc308069733e96d074a68f456';
            'lib/server/security-route-modules/audit-report-assembler.ts'='a2b3d3e9036a06de4213e309d49cea515e21aacc983280c2979ebaf341d07c1e'
          }
          foreach($rel in $expected.Keys){ $actual=(Get-FileHash -LiteralPath (Join-Path 'p68-work/source' $rel) -Algorithm SHA256).Hash.ToLowerInvariant(); if($actual -ne $expected[$rel]){throw "P68 source hash mismatch: $rel $actual"} }
          Copy-Item p68-work/P68_BUILD_PROJECTION_MANIFEST.json p68-out/

      - name: Verify corrected product topology remains exact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location p68-work/source
          try {
            node --experimental-strip-types -e "import('./lib/product/vlm-canonical-product-topology.ts').then(m=>{const r=m.VLM_CANONICAL_CUSTOMER_PRODUCTS,f=m.VLM_CANONICAL_PRODUCT_FAMILIES,p=m.VLM_INTERNAL_EXECUTION_PROFILES,t=m.VLM_CONTEXT_TRANSITIONS;const fake=r.filter(x=>['angel','whale-watch','market-impact','shield-map','risk-indicator'].includes(x.family)&&x.tier!==null);if(r.length!==20||f.length!==10||p.length!==20||t.length!==10||fake.length||f.some(x=>x.family==='pdf')||m.VLM_V16_TOPOLOGY_DENOMINATORS.legacy33ProductCompletionDenominatorRetired!==true)process.exit(2);console.log(JSON.stringify({status:'PASS_P68_TOPOLOGY_RETENTION',rows:20,families:10,profiles:20,transitions:10,fakeStandaloneTiers:0,pdfFamily:false}))}).catch(e=>{console.error(e);process.exit(1)})"
            if ($LASTEXITCODE -ne 0) { throw "P68 topology verifier failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Exact Windows dependency semantic lint and dual build
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.npmcli.outputs.npm_cli }}
        run: |
          $ErrorActionPreference='Stop'
          python p60-runtime/build-p60-reconciled-runner.py --input p49-build-projection/run-p47-product-windows-projection.mjs --output p68-work/run-p68-reconciled-windows-projection.mjs --receipt p68-out/P68_BASE_RECONCILED_RUNNER.json
          if ($LASTEXITCODE -ne 0) { throw 'base runner generation failed' }
          python p66-runtime/patch-p66-reconciled-runner.py --runner p68-work/run-p68-reconciled-windows-projection.mjs --receipt p68-out/P68_P66_NEXT_ENV_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 runner adaptation failed' }
          python p68-runtime/patch-p68-reconciled-runner.py --runner p68-work/run-p68-reconciled-windows-projection.mjs --receipt p68-out/P68_CURRENT_NEXT_ENV_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P68 runner adaptation failed' }
          node --check p68-work/run-p68-reconciled-windows-projection.mjs
          if ($LASTEXITCODE -ne 0) { throw 'P68 runner parse failed' }
          node p68-work/run-p68-reconciled-windows-projection.mjs --source-root p68-work/source --manifest p68-work/P68_BUILD_PROJECTION_MANIFEST.json --output-dir p68-out
          if ($LASTEXITCODE -ne 0) { throw "P68 exact Windows engineering failed: $LASTEXITCODE" }

      - name: Execute P68 Audit customer artifact truth fixture
        shell: pwsh
        env:
          P68_RESULT_DIR: ${{ github.workspace }}\p68-out
        run: |
          $ErrorActionPreference='Stop'
          Push-Location p68-work/source
          try {
            node --import ./scripts/pass11/register-offline-ts-loader.mjs ../../p68-runtime/test-p68-audit-customer-truth.mjs
            if ($LASTEXITCODE -ne 0) { throw "P68 Audit artifact fixture failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Capture P68 workflow boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p68-out | Out-Null
          $r=[ordered]@{
            schemaVersion='velmere.p68.github-workflow-boundary.v1';runId='${{ github.run_id }}';runAttempt='${{ github.run_attempt }}';sha='${{ github.sha }}';ref='${{ github.ref }}';runnerOs='${{ runner.os }}';runnerArch='${{ runner.arch }}';imageOs=$env:ImageOS;node=(node --version 2>$null);npm=(npm --version 2>$null);
            changedBuildRelevantFiles=4;projectionFileCount=1597;projectionPayloadBytes=20958924;projectionPathSetSha256='b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73';projectionAggregateSha256='d4bddcf0df467142e022e59a0840c37695076be65acd6f29e5339e21a87c574c';generatedNextEnvProjectionPayloadBytes=20958909;generatedNextEnvProjectionAggregateSha256='80849d7b41f3e902ed1f1ae033a8b08e83e9ea57f48fa1974465d8ce727d4434';
            productFamilies=10;customerFacingRows=20;currentExecutionProfiles=20;paidValueTransitions=10;rightsPassed=0;rightsDenominator=199;customerFinalOutputs=0;auditFinalCustomerPdfs=0;saleEligibleRows=0;live=$false;worldClassProven=$false;
            truthBoundary='Exact Windows engineering and synthetic Audit customer artifact truth/PDF parity only. No real customer, provider-rights, paid-value, sale, LIVE or WORLD_CLASS promotion.'
          }
          $r | ConvertTo-Json -Depth 8 | Set-Content p68-out/P68_GITHUB_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload P68 native Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p68-native-windows-audit-customer-truth
          path: p68-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
