name: P74 L1 Output Anchor Discovery
on:
  push:
    branches: [velmere-p73-audit-ancient8-ground-truth-20260817]
    paths:
      - 'p74-runtime/diagnose-p74-l1-output-anchor.mjs'
      - '.github/workflows/p74-l1-output-anchor-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24.18.0, check-latest: false}
      - name: Discover L1 oracle and L2 proof material
        shell: pwsh
        env:
          P74_RESULT_DIR: ${{ github.workspace }}\p74-l1-anchor-out
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force p74-l1-anchor-out | Out-Null
          node p74-runtime/diagnose-p74-l1-output-anchor.mjs | Tee-Object p74-l1-anchor-out\P74_L1_ANCHOR.log
          if($LASTEXITCODE-ne0){throw 'P74 L1 anchor discovery execution failed'}
      - name: Strict zero-credit boundary
        if: always()
        shell: pwsh
        run: |
          $s='NOT_EXECUTED';if(Test-Path 'p74-l1-anchor-out/P74_L1_OUTPUT_ANCHOR_DISCOVERY.json'){$s='DISCOVERY_PASS_NO_PRODUCT_CREDIT'}elseif(Test-Path 'p74-l1-anchor-out/P74_L1_OUTPUT_ANCHOR_FAILURE.json'){$x=Get-Content 'p74-l1-anchor-out/P74_L1_OUTPUT_ANCHOR_FAILURE.json' -Raw|ConvertFrom-Json;$s=$x.status}
          [ordered]@{schemaVersion='velmere.p74.l1-anchor-discovery-boundary.v1';runId='${{ github.run_id }}';sha='${{ github.sha }}';discoveryStatus=$s;parentP73R7Aggregate='b25efb6aeb017989e96ed1c4bc1fee02a4f181fc5103e9396091d23333a7c92b';productBytesChanged=$false;currentRuntimeBytecodeCredit=0;vulnerabilityGroundTruthCredit=0;customerFinal='0/20';auditFinalPdf='0/3';rights='2/203';paidValue='0/10';sale='0/20';live=$false;worldClassProven=$false;truthBoundary='Discovery only. L1 oracle agreement and L2 proof material grant zero credit until OP output root is independently recomputed, account proof/codeHash binding is verified, product source is integrated, and exact Windows engineering plus live integration pass.'}|ConvertTo-Json|Set-Content p74-l1-anchor-out/P74_L1_ANCHOR_BOUNDARY.json -Encoding utf8
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p74-l1-output-anchor-discovery
          path: p74-l1-anchor-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
