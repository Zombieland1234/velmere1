name: R7 Velmere Current Exact Source Export

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-current-exact-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-velmere-current-exact-source-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-current-exact-source:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      R7_RISK_FULL_SOURCE_AGGREGATE_SHA256: '50d59f5f028ef73b279fa3930889fcbf2ab5bc5e36ab4e8cec97be5ed49be67e'
      R7_RISK_FULL_SOURCE_MANIFEST_SHA256: 'af63491cf2922c6391d25fcf25a7d8efb6e76d128f4f9ca1dcf07b36471b0a2f'
      R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256: 'f83f28de6add73eee70d9086f2705241243661d64b5c9fd579b17b359050a221'
      R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256: 'b947314bb696fb8f9153c34d46ba825c5897e9f8cc8cf911a5f31113aa5fc01f'
      R7_RISK_BUNDLE_SHA256: '8e3c66471d534310e1142c3671d43bb556e35b6901c847c9596eea14e8815967'
      R7_PACKAGE_JSON_SHA256: '384932e8183ff4ced7850556ee21bb7b71f9a86add02112a4e434bc09f457a61'
      R7_PACKAGE_LOCK_SHA256: '5924aa0d679ebd78bcd6da01815fdd4b6ff503db45b17697c00168c06af7de61'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'

    steps:
      - name: Checkout exact control surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct exact current source and clean copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1' -Mode Prepare
          if ($LASTEXITCODE -ne 0) { throw "exact_current_source_prepare_failed:$LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'r7-risk-v5-clean-source' -PathType Container)) { throw 'clean_source_copy_missing' }

      - name: Verify exact Risk v5 execution-source export
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root='r7-risk-v5-clean-source';
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          const manifestPath=path.join(root,'R7_EXECUTION_SLICE_MANIFEST.json');
          const manifestBytes=fs.readFileSync(manifestPath);
          if(digest(manifestBytes)!==process.env.R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256) throw new Error('export_execution_manifest_sha_mismatch');
          const manifest=JSON.parse(manifestBytes.toString('utf8'));
          if(manifest.fileCount!==3506||manifest.testDenominator!==52||manifest.aggregateIdentitySha256!==process.env.R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256) throw new Error('export_execution_manifest_identity_invalid');
          if(manifest.fullSource?.aggregateIdentitySha256!==process.env.R7_RISK_FULL_SOURCE_AGGREGATE_SHA256||manifest.fullSource?.manifestWithHeaderSha256!==process.env.R7_RISK_FULL_SOURCE_MANIFEST_SHA256) throw new Error('export_full_source_authority_binding_invalid');
          let body='',payloadBytes=0;
          for(const row of manifest.files){
            const abs=path.join(root,row.path);
            if(!fs.existsSync(abs)) throw new Error(`export_execution_file_missing:${row.path}`);
            const bytes=fs.readFileSync(abs);
            if(bytes.length!==row.byteLength||digest(bytes)!==row.sha256) throw new Error(`export_execution_file_identity:${row.path}`);
            body+=`${row.sha256}\t${row.byteLength}\t${row.path}\n`;
            payloadBytes+=bytes.length;
          }
          if(digest(Buffer.from(body))!==process.env.R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256) throw new Error('export_execution_aggregate_mismatch');
          if(!fs.readFileSync(path.join(root,'R7_EXECUTION_SLICE_MANIFEST.tsv')).equals(Buffer.from(body))) throw new Error('export_execution_manifest_tsv_mismatch');
          for(const p of manifest.archiveAdditionalPaths??[]){if(!fs.existsSync(path.join(root,p))) throw new Error(`export_archive_additional_missing:${p}`);}
          const forbidden=[];
          for(const p of ['node_modules','.next','.env','.env.local','.git','r7-runtime/external-assets']) if(fs.existsSync(path.join(root,p))) forbidden.push(p);
          if(forbidden.length) throw new Error(`export_forbidden_runtime_paths:${forbidden.join(',')}`);
          const receipt={
            schemaVersion:'velmere.r7.current-exact-execution-source-export.v2',
            status:'PASS_EXACT_CURRENT_EXECUTION_SOURCE_EXPORT_READY',
            github:{runId:process.env.GITHUB_RUN_ID,headSha:process.env.GITHUB_SHA,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT)},
            exactSource:{
              fullSourceAuthorityAggregateSha256:process.env.R7_RISK_FULL_SOURCE_AGGREGATE_SHA256,
              fullSourceAuthorityManifestSha256:process.env.R7_RISK_FULL_SOURCE_MANIFEST_SHA256,
              executionSliceAggregateSha256:process.env.R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256,
              executionSliceManifestSha256:process.env.R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256,
              executionBundleSha256:process.env.R7_RISK_BUNDLE_SHA256
            },
            executionSourceFileCount:manifest.fileCount,
            executionSourcePayloadByteLength:payloadBytes,
            testDenominator:manifest.testDenominator,
            archiveAdditionalPaths:manifest.archiveAdditionalPaths??[],
            excludedRuntimePaths:['node_modules','.next','.env','.env.local','.git','r7-runtime/external-assets'],
            customerFinalCredit:false,
            paidValueCredit:false,
            truthBoundary:'This ZIP contains the exact current Risk-v5 execution source slice used for the 52-case Windows authority, plus manifest-declared archive support paths. The separate 9958-entry full package manifest remains an authority binding and is not misrepresented as 9958 physically exported files. Runtime dependencies, generated build output, external licensed runtime assets, credentials and local environment files are excluded.'
          };
          fs.writeFileSync('R7_VELMERE_CURRENT_EXACT_SOURCE_EXPORT_RECEIPT.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw "exact_execution_source_export_verification_failed:$LASTEXITCODE" }

      - name: Upload exact current Velmere execution source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VELMERE_CURRENT_EXACT_EXECUTION_SOURCE_2026-08-28_${{ github.sha }}
          path: |
            r7-risk-v5-clean-source/**
            R7_VELMERE_CURRENT_EXACT_SOURCE_EXPORT_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
