name: P66 Native Windows Owner Topology Audit PDF Projection

on:
  push:
    branches:
      - velmere-p66-audit-pdf-full-windows-20260816
  workflow_dispatch:

concurrency:
  group: p66-native-windows-owner-topology-audit-pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p66-native-windows-current-source:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout byte-safe projection branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0 and npm 11.16.0
        id: toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin npm and resolve CLI
        id: npmcli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }
          $npmRoot=(npm root --global).Trim()
          $npmCli=(Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node --version
          npm --version
          python --version

      - name: Reconstruct exact P46 projection and apply P66 delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config core.autocrlf false
          git config core.eol lf
          New-Item -ItemType Directory -Force p66-out | Out-Null
          python p49-build-projection/reconstruct-p49-direct-projection.py `
            --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json `
            --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f `
            --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json `
            --runner p49-build-projection/run-p47-product-windows-projection.mjs `
            --parts-root p49-build-projection/parts `
            --work-root p66-work `
            --output-root p66-out
          if ($LASTEXITCODE -ne 0) { throw "P46 reconstruction failed: $LASTEXITCODE" }
          python p66-runtime/apply-p66-audit-pdf-delta.py `
            --source-root p66-work/source `
            --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json `
            --output-manifest p66-work/P66_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p66-out/P66_PATCH_AND_MANIFEST.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 1 failed: $LASTEXITCODE" }
          python p66-runtime/finalize-p66-shield-pro-row-id.py `
            --source-root p66-work/source `
            --manifest p66-work/P66_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p66-out/P66_FINALIZE_TOPOLOGY.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 2 failed: $LASTEXITCODE" }
          python p66-runtime/fix-p66-topology-ts-const.py `
            --source-root p66-work/source `
            --manifest p66-work/P66_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p66-out/P66_TOPOLOGY_TS_FIX.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 3 failed: $LASTEXITCODE" }
          $expected=@{
            'lib/security/pro-audit-pdf/render-pro-audit-pdf.ts'='9e1f16f519dd5166fdacdb070dea6aa39dd6d7f7688e7aee065f069e18311530';
            'lib/product/vlm-canonical-product-topology.ts'='fc5214b3b9bfb65614e4eb5f47d291ffc773cfadaf65133afc1495cbb18db220';
            'lib/commerce/vlm-current-sku-truth.ts'='01a0d155513372145e7000959a81e14218d514930fafe63f7a226d59f47432ee'
          }
          foreach ($rel in $expected.Keys) {
            $actual=(Get-FileHash -LiteralPath (Join-Path 'p66-work/source' $rel) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$rel]) { throw "P66 source identity mismatch: $rel $actual" }
          }
          Copy-Item p66-work/P66_BUILD_PROJECTION_MANIFEST.json p66-out/

      - name: Verify owner topology runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location p66-work/source
          try {
            node --experimental-strip-types -e "import('./lib/product/vlm-canonical-product-topology.ts').then(m=>{const r=m.VLM_CANONICAL_CUSTOMER_PRODUCTS,f=m.VLM_CANONICAL_PRODUCT_FAMILIES,p=m.VLM_INTERNAL_EXECUTION_PROFILES,t=m.VLM_CONTEXT_TRANSITIONS;const fake=r.filter(x=>['angel','whale-watch','market-impact','shield-map','risk-indicator'].includes(x.family)&&x.tier!==null);const sp=r.find(x=>x.family==='shield'&&x.tier==='pro');if(r.length!==20||f.length!==10||p.length!==20||t.length!==10||fake.length||f.some(x=>x.family==='pdf')||sp?.productId!=='shield-pro'||m.VLM_V16_TOPOLOGY_DENOMINATORS.pdfSeparateProductFamily!==false||m.VLM_V16_TOPOLOGY_DENOMINATORS.legacy33ProductCompletionDenominatorRetired!==true)process.exit(2);console.log(JSON.stringify({status:'PASS_P66_OWNER_TOPOLOGY_RUNTIME',rows:20,families:10,profiles:20,transitions:10,fakeStandaloneTiers:0,pdfFamily:false,shieldProRowId:sp.productId,legacy33Retired:true}))}).catch(e=>{console.error(e);process.exit(1)})"
            if ($LASTEXITCODE -ne 0) { throw "Topology runtime failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Generate reconciled runner and execute exact Windows campaign
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.npmcli.outputs.npm_cli }}
        run: |
          $ErrorActionPreference='Stop'
          python p60-runtime/build-p60-reconciled-runner.py `
            --input p49-build-projection/run-p47-product-windows-projection.mjs `
            --output p66-work/run-p66-reconciled-windows-projection.mjs `
            --receipt p66-out/P66_RECONCILED_RUNNER_BUILD_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { throw "Runner generation failed: $LASTEXITCODE" }
          $runnerSha=(Get-FileHash -LiteralPath p66-work/run-p66-reconciled-windows-projection.mjs -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($runnerSha -ne '805d80391fd2b4def259e896e1aadcd3b4bbe130c6374a5bc28a00f760abb6d2') { throw "Runner SHA mismatch: $runnerSha" }
          node p66-work/run-p66-reconciled-windows-projection.mjs `
            --source-root p66-work/source `
            --manifest p66-work/P66_BUILD_PROJECTION_MANIFEST.json `
            --output-dir p66-out
          if ($LASTEXITCODE -ne 0) { throw "Native Windows campaign failed: $LASTEXITCODE" }

      - name: Typecheck current nonprojected evidence matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='p66-work/source/lib/commerce/vlm-current-evidence-availability-matrix.ts'
          if (Test-Path -LiteralPath $path) { throw 'Nonprojected matrix unexpectedly projected' }
          python p66-runtime/write-p66-nonprojected.py --root p66-work/source
          $actual=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '5e74d4eb203819c2f9e9b5f697a09c4d31c61bf77b0dcba01d351ae891b0b736') { throw 'Nonprojected matrix hash mismatch' }
          Push-Location p66-work/source
          try {
            node node_modules/typescript/bin/tsc --noEmit --pretty false
            if ($LASTEXITCODE -ne 0) { throw "Full semantic typecheck with current matrix failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          Remove-Item -LiteralPath $path -Force

      - name: Capture P66 workflow boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p66-out | Out-Null
          $r=[ordered]@{
            schemaVersion='velmere.p66.github-workflow-boundary.v4';runId='${{ github.run_id }}';runAttempt='${{ github.run_attempt }}';sha='${{ github.sha }}';ref='${{ github.ref }}';runnerOs='${{ runner.os }}';runnerArch='${{ runner.arch }}';imageOs=$env:ImageOS;node=(node --version 2>$null);npm=(npm --version 2>$null);
            changedBuildRelevantFiles=3;auditPdfSourceSha256='9e1f16f519dd5166fdacdb070dea6aa39dd6d7f7688e7aee065f069e18311530';canonicalTopologySourceSha256='fc5214b3b9bfb65614e4eb5f47d291ffc773cfadaf65133afc1495cbb18db220';currentSkuTruthSourceSha256='01a0d155513372145e7000959a81e14218d514930fafe63f7a226d59f47432ee';nonprojectedEvidenceMatrixSha256='5e74d4eb203819c2f9e9b5f697a09c4d31c61bf77b0dcba01d351ae891b0b736';
            projectionFileCount=1597;projectionPayloadBytes=20956802;projectionPathSetSha256='b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73';projectionAggregateSha256='0778ac3f6ae71785495b8e6bbb228b30d8e3bb10ba73eb9de7d3da7f08a19cd3';
            productFamilies=10;customerFacingRows=20;tieredFamilies=5;tieredRows=15;standaloneRows=5;currentExecutionProfiles=20;paidValueTransitions=10;legacy33ProductCompletionDenominatorRetired=$true;pdfSeparateProductFamily=$false;customerFinalOutputCredit=0;saleEligibleRows=0;live=$false;
            truthBoundary='Exact Windows engineering proof for owner-corrected build-relevant source plus semantic validation of the current nonprojected evidence matrix. Audit PDF fixture/QA remains internal only. No final customer, rights, paid-value, sale, LIVE or WORLD_CLASS promotion.'
          }
          $r | ConvertTo-Json -Depth 8 | Set-Content p66-out/P66_GITHUB_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload P66 native Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p66-native-windows-owner-topology-audit-pdf
          path: p66-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
