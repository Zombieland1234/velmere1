name: P61G8 Browser Three SKU Object-URL Proof

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - '.github/workflows/p61g8-browser-only-object-url-proof.yml'

concurrency:
  group: p61g8-browser-only-object-url-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-basic-pro-advanced:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize exact control bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config core.autocrlf false
          git config core.eol lf
          git checkout --force HEAD -- p49-build-projection
          $paths = @(
            'p61-browser/run-p61-browser-sku-executions.mjs',
            'p61-browser/P61_VISIBLE_LOCATOR_FIX.patch',
            'p61-browser/P61_HTTPS_CANONICAL_ORIGIN_FIX.patch',
            'p61-browser/P61_TRUSTED_CLIENT_QA_FIX.patch',
            'p61-browser/P61G_OFFICIAL_MANROPE_RENDERER_ONLY.patch',
            'p61-browser/P61G_OFFICIAL_MANROPE_RENDERER_ONLY_ACQUISITION.json',
            'p61-browser/P61G_BROWSER_RECEIPT_SOURCE_BINDING.patch',
            'p61-browser/acquire-p61g-official-runtime-font.py',
            'p61-browser/run-p61-https-proxy.mjs',
            'p61-browser/apply-browser-object-url-proof.py'
          )
          python -c "import pathlib,subprocess; paths=$($paths | ConvertTo-Json -Compress); [(pathlib.Path(p).parent.mkdir(parents=True, exist_ok=True), pathlib.Path(p).write_bytes(subprocess.check_output(['git','show',f'HEAD:{p}']))) for p in paths]"
          if ($LASTEXITCODE -ne 0) { throw "Exact control materialization failed: ${LASTEXITCODE}" }
          New-Item -ItemType Directory -Force p61g8-out | Out-Null

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw "Node version mismatch" }
          if ((npm --version).Trim() -ne '11.16.0') { throw "npm version mismatch" }
          node --version
          npm --version

      - name: Reconstruct exact projection and install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python p49-build-projection/reconstruct-p49-direct-projection.py `
            --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json `
            --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f `
            --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json `
            --runner p49-build-projection/run-p47-product-windows-projection.mjs `
            --parts-root p49-build-projection/parts `
            --work-root p49-work `
            --output-root p61g8-out/reconstruction
          if ($LASTEXITCODE -ne 0) { throw "Projection reconstruction failed: ${LASTEXITCODE}" }
          Push-Location p49-work/source
          try {
            npm ci --ignore-scripts --audit=false --fund=false
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed: ${LASTEXITCODE}" }
          } finally { Pop-Location }

      - name: Apply exact P61G renderer transition and production build
        shell: pwsh
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          git apply --check --whitespace=nowarn --directory=p49-work/source p61-browser/P61G_OFFICIAL_MANROPE_RENDERER_ONLY.patch
          if ($LASTEXITCODE -ne 0) { throw "P61G renderer patch check failed: ${LASTEXITCODE}" }
          git apply --whitespace=nowarn --directory=p49-work/source p61-browser/P61G_OFFICIAL_MANROPE_RENDERER_ONLY.patch
          if ($LASTEXITCODE -ne 0) { throw "P61G renderer patch apply failed: ${LASTEXITCODE}" }
          $renderer = 'p49-work/source/lib/search/lens-pdf-renderer.ts'
          $sha = (Get-FileHash -LiteralPath $renderer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '18142581dc6f858df800c684c90bb6c444683758664f45f5eb7b87932f0bd647') { throw "P61G renderer SHA mismatch: $sha" }
          Push-Location p49-work/source
          try {
            node node_modules/next/dist/bin/next build --webpack
            if ($LASTEXITCODE -ne 0) { throw "P61G8 production build failed: ${LASTEXITCODE}" }
          } finally { Pop-Location }

      - name: Prepare Browser QA harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($patch in @('p61-browser/P61_VISIBLE_LOCATOR_FIX.patch', 'p61-browser/P61_HTTPS_CANONICAL_ORIGIN_FIX.patch')) {
            git apply --check --whitespace=nowarn $patch
            if ($LASTEXITCODE -ne 0) { throw "Harness patch check failed for ${patch}: ${LASTEXITCODE}" }
            git apply --whitespace=nowarn $patch
            if ($LASTEXITCODE -ne 0) { throw "Harness patch apply failed for ${patch}: ${LASTEXITCODE}" }
          }
          git apply --check --whitespace=nowarn p61-browser/P61G_BROWSER_RECEIPT_SOURCE_BINDING.patch
          if ($LASTEXITCODE -ne 0) { throw "P61G Browser binding patch check failed: ${LASTEXITCODE}" }
          git apply --whitespace=nowarn p61-browser/P61G_BROWSER_RECEIPT_SOURCE_BINDING.patch
          if ($LASTEXITCODE -ne 0) { throw "P61G Browser binding patch apply failed: ${LASTEXITCODE}" }
          git apply --check --whitespace=nowarn p61-browser/P61_TRUSTED_CLIENT_QA_FIX.patch
          if ($LASTEXITCODE -ne 0) { throw "Proxy patch check failed: ${LASTEXITCODE}" }
          git apply --whitespace=nowarn p61-browser/P61_TRUSTED_CLIENT_QA_FIX.patch
          if ($LASTEXITCODE -ne 0) { throw "Proxy patch apply failed: ${LASTEXITCODE}" }
          python p61-browser/apply-browser-object-url-proof.py `
            --harness p61-browser/run-p61-browser-sku-executions.mjs `
            --receipt p61g8-out/P61G8_OBJECT_URL_PROOF_REPAIR.json
          if ($LASTEXITCODE -ne 0) { throw "P61G8 object URL proof repair failed: ${LASTEXITCODE}" }
          node --check p61-browser/run-p61-browser-sku-executions.mjs
          if ($LASTEXITCODE -ne 0) { throw "Browser harness parse check failed: ${LASTEXITCODE}" }
          node --check p61-browser/run-p61-https-proxy.mjs
          if ($LASTEXITCODE -ne 0) { throw "HTTPS proxy parse check failed: ${LASTEXITCODE}" }

      - name: Acquire exact official runtime font outside artifact root
        id: runtime_font
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'velmere-p61g8-runtime-font'
          New-Item -ItemType Directory -Force $runtimeRoot | Out-Null
          $fontPath = Join-Path $runtimeRoot 'Manrope-ExtraLight.ttf'
          New-Item -ItemType Directory -Force p61g8-out/runtime | Out-Null
          python p61-browser/acquire-p61g-official-runtime-font.py `
            --font-output $fontPath `
            --receipt-output p61g8-out/runtime/P61G8_RUNTIME_FONT_ACQUISITION_RECEIPT.json `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw "Official runtime font acquisition failed: ${LASTEXITCODE}" }
          "font_path=$fontPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Locate installed Chromium browser
        id: browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\Program Files\Google\Chrome\Application\chrome.exe',
            'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe',
            'C:\Program Files\Microsoft\Edge\Application\msedge.exe',
            'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          )
          $browser = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $browser) { throw 'No installed Chrome/Edge executable found' }
          "path=$browser" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$((Get-FileHash -LiteralPath $browser -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Execute Browser Basic Pro Advanced over HTTPS QA boundary
        shell: pwsh
        env:
          NODE_ENV: development
          NEXT_TELEMETRY_DISABLED: '1'
          VELMERE_CANONICAL_ORIGIN: 'https://localhost:3443'
          NEXT_PUBLIC_SITE_URL: 'https://localhost:3443'
          VELMERE_TRUSTED_PROXY_PROFILE: 'vercel'
          VERCEL: '1'
          VERCEL_ENV: 'preview'
          P61_BASE_URL: 'https://localhost:3443'
          P61_OUTPUT_ROOT: 'p61g8-out/browser'
          P61_NODE_MODULES_ROOT: 'p49-work/source/node_modules'
          P61_BROWSER_EXECUTABLE_PATH: ${{ steps.browser.outputs.path }}
          VELMERE_PDF_FONT_PATH: ${{ steps.runtime_font.outputs.font_path }}
          P61_PROXY_LISTEN_HOST: '127.0.0.1'
          P61_PROXY_LISTEN_PORT: '3443'
          P61_PROXY_PUBLIC_HOST: 'localhost:3443'
          P61_PROXY_UPSTREAM_HOST: '127.0.0.1'
          P61_PROXY_UPSTREAM_PORT: '3110'
          P61_PROXY_PFX_PASSPHRASE: 'p61g8-runtime-only-pfx-2026'
          VELMERE_LENS_SOURCE_TOKEN_SECRET_CURRENT: 'p61-source-token-fixture-secret-2026-08-15-0123456789abcdef'
          VELMERE_LENS_SOURCE_TOKEN_KEY_ID: 'p61g8-browser-current-execution'
          VELMERE_LENS_RENDER_TOKEN_SECRET_CURRENT: 'p61-render-token-fixture-secret-2026-08-15-fedcba9876543210'
          VELMERE_LENS_RENDER_TOKEN_KEY_ID: 'p61g8-browser-render-execution'
          NEXTAUTH_SECRET: 'p61-nextauth-fixture-secret-2026-08-15-0123456789abcdef'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p61g8-out/server | Out-Null
          $serverDir = (Resolve-Path -LiteralPath p61g8-out/server).Path
          $sourceRoot = (Resolve-Path -LiteralPath p49-work/source).Path
          $nextCli = (Resolve-Path -LiteralPath (Join-Path $sourceRoot 'node_modules/next/dist/bin/next')).Path
          $nextOut = Join-Path $serverDir 'next.stdout.log'; $nextErr = Join-Path $serverDir 'next.stderr.log'
          $proxyOut = Join-Path $serverDir 'proxy.stdout.log'; $proxyErr = Join-Path $serverDir 'proxy.stderr.log'
          $pfx = Join-Path $serverDir 'runtime.pfx'
          $secure = ConvertTo-SecureString $env:P61_PROXY_PFX_PASSPHRASE -AsPlainText -Force
          $cert = New-SelfSignedCertificate -DnsName 'localhost' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(1)
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          $env:P61_PROXY_PFX_PATH = $pfx
          $next = Start-Process -FilePath (Get-Command node).Source -ArgumentList @($nextCli,'start','-H','127.0.0.1','-p','3110') -WorkingDirectory $sourceRoot -RedirectStandardOutput $nextOut -RedirectStandardError $nextErr -PassThru
          $proxy = $null
          try {
            $ready = $false
            for ($i=0; $i -lt 120; $i++) {
              if ($next.HasExited) { throw "Next server exited: $($next.ExitCode)" }
              try { $r=Invoke-WebRequest -Uri 'http://127.0.0.1:3110/en/search' -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ready=$true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Next server readiness timeout' }
            $proxy = Start-Process -FilePath (Get-Command node).Source -ArgumentList @('p61-browser/run-p61-https-proxy.mjs') -WorkingDirectory (Resolve-Path '.').Path -RedirectStandardOutput $proxyOut -RedirectStandardError $proxyErr -PassThru
            $proxyReady = $false
            for ($i=0; $i -lt 60; $i++) {
              if ($proxy.HasExited) { throw "HTTPS proxy exited: $($proxy.ExitCode)" }
              try { $r=Invoke-WebRequest -Uri 'https://localhost:3443/en/search' -SkipCertificateCheck -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $proxyReady=$true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $proxyReady) { throw 'HTTPS proxy readiness timeout' }
            node p61-browser/run-p61-browser-sku-executions.mjs
            if ($LASTEXITCODE -ne 0) { throw "Browser campaign failed: ${LASTEXITCODE}" }
          } finally {
            if ($proxy) { Stop-Process -Id $proxy.Id -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $next.Id -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Enforce font non-retention and upload evidence
        if: always()
        shell: pwsh
        env:
          RUNTIME_FONT_PATH: ${{ steps.runtime_font.outputs.font_path }}
        run: |
          if ($env:RUNTIME_FONT_PATH) { Remove-Item -LiteralPath $env:RUNTIME_FONT_PATH -Force -ErrorAction SilentlyContinue }
          $leaks = Get-ChildItem -LiteralPath p61g8-out -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -match '^\.(ttf|otf|woff|woff2|eot|pfx)$' }
          if ($leaks) { throw "Runtime binary leaked into evidence: $($leaks.FullName -join ', ')" }
          $boundary = [ordered]@{
            schemaVersion='velmere.p61g8.browser-three-sku-object-url-proof-boundary.v1'; runId='${{ github.run_id }}'; sha='${{ github.sha }}';
            rendererSha256='18142581dc6f858df800c684c90bb6c444683758664f45f5eb7b87932f0bd647'; officialFontSha256='67d5c238a5058f56a361c7fea054cf3be26d602bd03b418a09bff73a25a17250';
            evidenceClass='FIXTURE_INTERNAL_ONLY'; pdfIndependentReplay='0/1'; saleEligible='0/3';
            truthBoundary='Browser-only current execution. Object URL wiring and originating PDF response are proven; exact independent PDF byte replay remains P62. No live/provider/customer/sale/GO/LIVE/WORLD_CLASS credit.'
          }
          $boundary | ConvertTo-Json -Depth 5 | Set-Content p61g8-out/P61G8_GITHUB_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload P61G8 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p61g8-browser-three-sku-object-url-proof
          path: p61g8-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
