name: R7 Angel Deterministic Closure Candidate E2E

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-angel-customer-e2e.yml'
      - 'r7-angel-harness/verify-r7-angel-exact-source-identity.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-angel-deterministic-closure-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  angel-deterministic-closure-candidate:
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
      R7_EXPECTED_FULL_SOURCE_AGGREGATE_SHA256: '50d59f5f028ef73b279fa3930889fcbf2ab5bc5e36ab4e8cec97be5ed49be67e'
      R7_EXPECTED_EXECUTION_SLICE_AGGREGATE_SHA256: 'f83f28de6add73eee70d9086f2705241243661d64b5c9fd579b17b359050a221'
      R7_EXPECTED_EXECUTION_SLICE_MANIFEST_SHA256: 'b947314bb696fb8f9153c34d46ba825c5897e9f8cc8cf911a5f31113aa5fc01f'
      R7_EXPECTED_EXECUTION_BUNDLE_SHA256: '8e3c66471d534310e1142c3671d43bb556e35b6901c847c9596eea14e8815967'

    steps:
      - name: Checkout exact Angel controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct and execute exact current Windows source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1' -Mode Full
          if ($LASTEXITCODE -ne 0) { throw "angel_exact_windows_source_failed:$LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'r7-work' -PathType Container)) { throw 'angel_r7_work_missing' }

      - name: Verify exact source identity before Angel execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & node 'r7-angel-harness/verify-r7-angel-exact-source-identity.mjs' 'r7-work' 'R7_ANGEL_EXACT_SOURCE_IDENTITY.json'
          if ($LASTEXITCODE -ne 0) { throw "angel_exact_source_identity_failed:$LASTEXITCODE" }

      - name: Execute Angel customer truth, safety, grounding and memory suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'artifacts/r7/angel' | Out-Null
          Push-Location r7-work
          try {
            $Loader = './scripts/pass11/register-offline-ts-loader.mjs'
            $Cases = @(
              @{ Name='standalone-output-truth'; Path='tests/security/a102-angel-standalone-output-truth.test.ts' },
              @{ Name='ai-disclosure-public-topology'; Path='tests/security/a102-angel-ai-disclosure-and-public-topology.test.ts' },
              @{ Name='grounding-before-provider'; Path='tests/security/v4-angel-grounding-before-provider-boundary.test.ts' },
              @{ Name='primary-route-safety'; Path='tests/security/a102-angel-primary-route-safety-boundary.test.ts' },
              @{ Name='durable-memory-delete-fail-closed'; Path='scripts/current-execution/test-angel-durable-memory-delete-fail-closed.mts' }
            )
            foreach ($Case in $Cases) {
              Write-Host "Running Angel case $($Case.Name)"
              & node --import $Loader $Case.Path 2>&1 | Tee-Object -FilePath "../artifacts/r7/angel/$($Case.Name).log"
              if ($LASTEXITCODE -ne 0) { throw "angel_case_failed:$($Case.Name):$LASTEXITCODE" }
            }
            & node --no-warnings --import $Loader 'tests/pass36/a102r44p11-angel-multicoin-safety.ts' | Tee-Object -FilePath '../artifacts/r7/angel/angel-adversarial.json'
            if ($LASTEXITCODE -ne 0) { throw "angel_adversarial_failed:$LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Validate Angel adversarial receipt and deterministic customer contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Raw = Get-Content -LiteralPath 'artifacts/r7/angel/angel-adversarial.json' -Raw
          $Boundary = $Raw | ConvertFrom-Json -Depth 100
          $Identity = Get-Content -LiteralPath 'R7_ANGEL_EXACT_SOURCE_IDENTITY.json' -Raw | ConvertFrom-Json -Depth 100
          if ($Identity.status -ne 'PASS_ANGEL_EXACT_CURRENT_SOURCE_IDENTITY' -or [int]$Identity.requiredSourceFiles -ne 11) { throw 'angel_source_identity_receipt_invalid' }
          if ($Boundary.schemaVersion -ne 'velmere.pass36.a102r44p11.angel-multicoin-safety.v1') { throw 'angel_adversarial_schema_invalid' }
          if ([int]$Boundary.assertions -lt 120 -or [int]$Boundary.failed -ne 0 -or [int]$Boundary.passed -ne [int]$Boundary.assertions) { throw 'angel_adversarial_denominator_invalid' }
          if ([int]$Boundary.rejectedProviderCallsAllowed -ne 0) { throw 'angel_rejected_case_reached_provider' }
          if ($Boundary.globalDecision -ne 'NO_GO' -or [bool]$Boundary.live -or [bool]$Boundary.saleEnabled) { throw 'angel_adversarial_truth_boundary_invalid' }
          foreach ($Locale in @('pl','en','de')) {
            $LocaleRows = @($Boundary.rows | Where-Object { $_.locale -eq $Locale })
            if ($LocaleRows.Count -lt 40 -or @($LocaleRows | Where-Object { -not $_.ok }).Count -ne 0) { throw "angel_adversarial_locale_failed:$Locale" }
          }

          $Receipt = [ordered]@{
            schemaVersion = 'velmere.r7.angel-deterministic-closure-candidate.v2'
            status = 'PASS_ANGEL_DETERMINISTIC_CLOSURE_CANDIDATE'
            github = @{ runId=$env:GITHUB_RUN_ID; runAttempt=[int]$env:GITHUB_RUN_ATTEMPT; headSha=$env:GITHUB_SHA }
            source = @{
              exactCurrentSourceBytesAtProductExecution = $true
              fullSourceAggregateSha256 = $env:R7_EXPECTED_FULL_SOURCE_AGGREGATE_SHA256
              executionSliceAggregateSha256 = $env:R7_EXPECTED_EXECUTION_SLICE_AGGREGATE_SHA256
              executionSliceManifestSha256 = $env:R7_EXPECTED_EXECUTION_SLICE_MANIFEST_SHA256
              executionBundleSha256 = $env:R7_EXPECTED_EXECUTION_BUNDLE_SHA256
              exactWindows52x2 = $true
              testDenominator = 52
              identityVerifierSha256 = [string]$Identity.identityVerifierSha256
              requiredSourceFilesHashVerified = [int]$Identity.requiredSourceFiles
            }
            product = @{
              productOrdinal = 19
              productSlug = 'angel'
              standaloneFreeBasicOnly = $true
              customerVisibleAiDisclosure = $true
              informationalDecisionSupportOnly = $true
              directChatPaymentRequired = $false
              paidDepthChangesTruth = $false
              locales = @('pl','en','de')
            }
            safety = @{
              adversarialCases = [int]$Boundary.assertions
              adversarialPassed = [int]$Boundary.passed
              adversarialFailed = [int]$Boundary.failed
              rejectedCasesThatReachedProvider = [int]$Boundary.rejectedProviderCallsAllowed
              promptInjectionRejected = $true
              personalizedInvestmentAdviceAbstained = $true
              personalizedLegalAdviceDisclosed = $true
              groundingBeforeProvider = $true
              unsignedEvidenceWithheld = $true
              oversizedContextRejected = $true
              providerOutputAdviceRewrittenSafely = $true
              durableMemoryDeleteFailClosed = $true
              rawIdentityDisclosure = $false
            }
            provider = @{
              externalProviderRuntimeExecuted = $false
              externalModelAnswerQualityVerified = $false
              deterministicBoundaryInjectionOnly = $true
              deterministicBoundaryInjectionGrantsProviderCredit = $false
              remainingGate = 'SEPARATE_AUTHORIZED_REAL_PROVIDER_RUN_REQUIRED'
            }
            paidValueCredit = $false
            customerFinalCredit = $false
            truthBoundary = 'This run executes the exact hash-bound current source on Windows Server 2025, then exercises the actual Angel POST route module and customer-facing product truth across PL/EN/DE plus the deterministic adversarial boundary corpus. Provider doubles are used only to inject controlled outputs into safety boundaries. It does not execute or claim an external provider, external-model answer quality, human evaluation, paid value, Customer FINAL, or ledger credit. A separate authorized real-provider run remains required.'
          }
          $Receipt | ConvertTo-Json -Depth 50 | Set-Content -LiteralPath 'artifacts/r7/angel/R7_ANGEL_DETERMINISTIC_CLOSURE_CANDIDATE.json' -Encoding utf8
          Write-Host ($Receipt | ConvertTo-Json -Depth 50)

      - name: Upload Angel deterministic closure candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-angel-deterministic-closure-candidate-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/r7/angel/**
            R7_ANGEL_EXACT_SOURCE_IDENTITY.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

