name: R7 Browser Pro Closure Launcher
on:
  push:
    branches:
      - r7-close-browser-pro-20260830
    paths:
      - '.github/workflows/r7-close-browser-pro-launch.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Browser Pro candidate E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run r7-browser-pro-entitlement-candidate-e2e-final.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "dispatched Browser Pro canonical candidate on $GITHUB_REF_NAME"
