name: P43 Exact Windows Current Source Closure

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p43-current-source-reconstruction-20260814
    paths:
      - 'p43-bridge/**'
      - '.github/workflows/p43-exact-windows-current-source.yml'

concurrency:
  group: p43-exact-windows-current-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  exact-windows-current-source:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout complete reconstruction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch, tag and pull-request ref
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --tags --force
          $pullRefs = @(git ls-remote origin 'refs/pull/*/head' 'refs/pull/*/merge')
          if ($pullRefs.Count -eq 0) { throw 'No pull-request refs discovered' }
          $fetched = 0
          foreach ($row in $pullRefs) {
            if ([string]::IsNullOrWhiteSpace($row)) { continue }
            $columns = $row -split "`t"
            if ($columns.Count -ne 2) { throw "Unexpected ls-remote row: $row" }
            $remoteRef = $columns[1]
            $localRef = $remoteRef -replace '^refs/pull/', 'refs/remotes/pull/'
            git fetch origin "+$remoteRef`:$localRef" --force
            if ($LASTEXITCODE -ne 0) { throw "Failed to fetch $remoteRef" }
            $fetched++
          }
          if ($fetched -lt 27) { throw "Expected at least 27 pull refs; fetched $fetched" }
          Write-Host "Fetched pull-request refs: $fetched"
          git for-each-ref --format='%(refname)' refs/remotes/pull

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Set up exact npm 11.16.0
        shell: pwsh
        run: |
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Exact Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'Exact npm mismatch' }

      - name: Download P42 tracked-source seed
        uses: actions/download-artifact@v4
        with:
          name: p42-branch-source-snapshot
          path: p43-artifact-seeds/p42
          github-token: ${{ github.token }}
          repository: Zombieland1234/velmere1
          run-id: 31791166532

      - name: Download P41 dependency-CAS seed
        uses: actions/download-artifact@v4
        with:
          name: p41-exact-windows-node24-dependency-closure
          path: p43-artifact-seeds/p41
          github-token: ${{ github.token }}
          repository: Zombieland1234/velmere1
          run-id: 31789641833

      - name: Make artifact seed bytes reachable to Git object scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p43-artifact-seeds/p42-source | Out-Null
          tar -xzf p43-artifact-seeds/p42/branch-source-tracked.tar.gz -C p43-artifact-seeds/p42-source
          git config core.autocrlf false
          git config core.safecrlf false
          git config user.name 'Velmere Closure Bot'
          git config user.email 'velmere-closure@users.noreply.github.com'
          $env:GIT_AUTHOR_NAME = 'Velmere Closure Bot'
          $env:GIT_AUTHOR_EMAIL = 'velmere-closure@users.noreply.github.com'
          $env:GIT_COMMITTER_NAME = 'Velmere Closure Bot'
          $env:GIT_COMMITTER_EMAIL = 'velmere-closure@users.noreply.github.com'
          $env:GIT_INDEX_FILE = (Join-Path $PWD '.git/p43-artifact-seed-index')
          if (Test-Path $env:GIT_INDEX_FILE) { Remove-Item $env:GIT_INDEX_FILE -Force }
          git --work-tree="$PWD/p43-artifact-seeds" add -f -A .
          $tree = (git write-tree).Trim()
          if ([string]::IsNullOrWhiteSpace($tree)) { throw 'Artifact seed tree was not created' }
          $commit = ("P43 local artifact seed pool`n" | git commit-tree $tree).Trim()
          if ([string]::IsNullOrWhiteSpace($commit)) { throw 'Artifact seed commit was not created' }
          git update-ref refs/heads/p43-local-artifact-seed $commit
          Remove-Item Env:GIT_INDEX_FILE
          Write-Host "Local artifact seed tree: $tree"
          Write-Host "Local artifact seed commit: $commit"
          git count-objects -vH

      - name: Assemble and verify compact P43 identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            'p43-bridge/i8s.part-00',
            'p43-bridge/i8s.part-01',
            'p43-bridge/i8b.part-00',
            'p43-bridge/i8b.part-01',
            'p43-bridge/i8b.part-02',
            'p43-bridge/i8b.part-03',
            'p43-bridge/i8b.part-04',
            'p43-bridge/i8b.part-05',
            'p43-bridge/i8b.part-06',
            'p43-bridge/i8b.part-07',
            'p43-bridge/i8b.part-08'
          )
          if (Test-Path 'p43-bridge/i8b.part-09-real') {
            $parts += 'p43-bridge/i8b.part-09-real'
          } elseif (Test-Path 'p43-bridge/i8b.part-09') {
            $parts += 'p43-bridge/i8b.part-09'
          } else {
            throw 'Final compact identity block is missing'
          }
          foreach ($part in $parts) {
            if (!(Test-Path $part)) { throw "Missing identity block: $part" }
          }
          $joined = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          [IO.File]::WriteAllText('p43-identity.bin.gz.b64', $joined, [Text.Encoding]::ASCII)
          $sha = (Get-FileHash p43-identity.bin.gz.b64 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '26f191e21dba2cfcd73e3ab00e6b4a8ec2fdd1066ec9aaf2eb4663c7f456b198') {
            throw "Compact identity SHA mismatch: $sha"
          }
          $gzip = [Convert]::FromBase64String($joined)
          [IO.File]::WriteAllBytes('p43-identity.bin.gz', $gzip)
          python -c "import gzip,pathlib; pathlib.Path('p43-identity.bin').write_bytes(gzip.decompress(pathlib.Path('p43-identity.bin.gz').read_bytes()))"
          $identitySha = (Get-FileHash p43-identity.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($identitySha -ne '588acada1e423fa2f52f608c7638bfd23d55229ad8a7078e440ae6198d79cbd0') {
            throw "Decoded identity SHA mismatch: $identitySha"
          }

      - name: Reconstruct exact current source from refs and retained artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p43-win-work | Out-Null
          python p43-bridge/measure-source-coverage-bin.py `
            --repo . `
            --identity-bin p43-identity.bin `
            --output-dir p43-win-work `
            --reconstruct

      - name: Run exact Windows semantic and dual-build closure
        id: exact
        shell: pwsh
        run: |
          python p43-bridge/run-exact-windows-current-source.py `
            --coverage-receipt p43-win-work/P43_GITHUB_ALL_REFS_SOURCE_RECONSTRUCTION_COVERAGE.json `
            --output-dir p43-win-result

      - name: Persist exact Windows receipt on branch
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p43-results | Out-Null
          $paths = @()
          if (Test-Path 'p43-win-result/P43_EXACT_WINDOWS_CURRENT_SOURCE_SEMANTIC_DUAL_BUILD_RECEIPT.json') {
            Copy-Item p43-win-result/P43_EXACT_WINDOWS_CURRENT_SOURCE_SEMANTIC_DUAL_BUILD_RECEIPT.json p43-results/P43_EXACT_WINDOWS_CURRENT_SOURCE_SEMANTIC_DUAL_BUILD_RECEIPT.json -Force
            $paths += 'p43-results/P43_EXACT_WINDOWS_CURRENT_SOURCE_SEMANTIC_DUAL_BUILD_RECEIPT.json'
          }
          if (Test-Path 'p43-win-work/P43_GITHUB_ALL_REFS_SOURCE_RECONSTRUCTION_COVERAGE.json') {
            Copy-Item p43-win-work/P43_GITHUB_ALL_REFS_SOURCE_RECONSTRUCTION_COVERAGE.json p43-results/P43_GITHUB_ALL_REFS_SOURCE_RECONSTRUCTION_COVERAGE.json -Force
            $paths += 'p43-results/P43_GITHUB_ALL_REFS_SOURCE_RECONSTRUCTION_COVERAGE.json'
          }
          if (Test-Path 'p43-win-work/P43_GITHUB_ALL_REFS_MISSING_SOURCE_ROWS.json') {
            Copy-Item p43-win-work/P43_GITHUB_ALL_REFS_MISSING_SOURCE_ROWS.json p43-results/P43_GITHUB_ALL_REFS_MISSING_SOURCE_ROWS.json -Force
            $paths += 'p43-results/P43_GITHUB_ALL_REFS_MISSING_SOURCE_ROWS.json'
          }
          if ($paths.Count -eq 0) {
            Write-Host 'No Windows receipt or reconstruction result was produced before failure.'
            exit 0
          }
          git config user.name 'Velmere Closure Bot'
          git config user.email 'velmere-closure@users.noreply.github.com'
          git add -- $paths
          if (git diff --cached --quiet) {
            Write-Host 'No receipt change to commit.'
          } else {
            git commit -m 'P43: persist exact Windows current-source closure evidence'
            git push origin HEAD:velmere-p43-current-source-reconstruction-20260814
          }

      - name: Upload exact Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p43-exact-windows-current-source-closure
          path: |
            p43-win-work/P43_GITHUB_ALL_REFS_SOURCE_RECONSTRUCTION_COVERAGE.json
            p43-win-work/P43_GITHUB_ALL_REFS_MISSING_SOURCE_ROWS.json
            p43-win-work/P43_GITHUB_ALL_REFS_COVERED_SOURCE_ROWS.json
            p43-win-result/P43_EXACT_WINDOWS_CURRENT_SOURCE_SEMANTIC_DUAL_BUILD_RECEIPT.json
            p43-win-result/logs
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
