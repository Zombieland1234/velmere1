name: P61C Browser Three SKU QA Rate-Limit Execution

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - 'p61-browser/P61_TRUSTED_CLIENT_QA_FIX.patch'
      - '.github/workflows/p61c-browser-three-sku-qa-rate-limit.yml'

concurrency:
  group: p61c-browser-three-sku-qa-rate-limit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-basic-pro-advanced-qa:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout isolated projection branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize, patch and verify exact P49/P60/P61 controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config core.autocrlf false
          git config core.eol lf
          git checkout --force HEAD -- p49-build-projection
          python -c "import pathlib,subprocess; paths=['p60-runtime/build-p60-reconciled-runner.py','p61-browser/run-p61-browser-sku-executions.mjs','p61-browser/P61_VISIBLE_LOCATOR_FIX.patch','p61-browser/P61_HTTPS_CANONICAL_ORIGIN_FIX.patch','p61-browser/run-p61-https-proxy.mjs','p61-browser/P61_TRUSTED_CLIENT_QA_FIX.patch']; [(pathlib.Path(p).parent.mkdir(parents=True, exist_ok=True), pathlib.Path(p).write_bytes(subprocess.check_output(['git','show',f'HEAD:{p}']))) for p in paths]"
          if ($LASTEXITCODE -ne 0) { throw "Exact Git blob materialization failed: ${LASTEXITCODE}" }
          $checks = @(
            @{ Path = 'p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json'; Sha256 = 'b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f' },
            @{ Path = 'p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json'; Sha256 = '2a8a45acf4ab96827f636386edd06b1800c696b937d75eb81434a280c0a26b3b' },
            @{ Path = 'p49-build-projection/reconstruct-p49-direct-projection.py'; Sha256 = '793e8610630d5efbfdb0d472d103338590ba34a17950a1700f0f41e97c08bef8' },
            @{ Path = 'p49-build-projection/run-p47-product-windows-projection.mjs'; Sha256 = '687b14858ec05972b97640e3943de1c779f3b7bcfbe819d9367ee9a9e2b3abe4' },
            @{ Path = 'p60-runtime/build-p60-reconciled-runner.py'; Sha256 = 'b1ebefec74d5c1d50895c01c9092d8e49fde46314eba1f3cdd41e4f570d9e433' },
            @{ Path = 'p61-browser/run-p61-browser-sku-executions.mjs'; Sha256 = '7a51aa87be9c2bc97d0f73a874c2dc1eb23ad54a375ccfbd3cfe4c3c4848c3f5' },
            @{ Path = 'p61-browser/P61_VISIBLE_LOCATOR_FIX.patch'; Sha256 = '5582e586e2c9deeecb9bae37e82113d4a14190b5d2894f1d05e11a0dbe2fb051' },
            @{ Path = 'p61-browser/P61_HTTPS_CANONICAL_ORIGIN_FIX.patch'; Sha256 = '6c871324a234db853e7ca534f30f093273617e2efa78cbaa6416e313ba139404' },
            @{ Path = 'p61-browser/run-p61-https-proxy.mjs'; Sha256 = 'eb93b33f07cf382154ee0a2239c10b82c70fe59dfba3a161d0427ecd56d03ee5' },
            @{ Path = 'p61-browser/P61_TRUSTED_CLIENT_QA_FIX.patch'; Sha256 = '7d32f58deef155418de17e43540f4aa40ed16e68de2399772ef51100483542ab' }
          )
          foreach ($check in $checks) {
            if (-not (Test-Path -LiteralPath $check.Path -PathType Leaf)) { throw "Required P61C file missing: $($check.Path)" }
            $actual = (Get-FileHash -LiteralPath $check.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $check.Sha256) { throw "P61C byte mismatch for $($check.Path): $actual != $($check.Sha256)" }
          }
          foreach ($patch in @('p61-browser/P61_VISIBLE_LOCATOR_FIX.patch', 'p61-browser/P61_HTTPS_CANONICAL_ORIGIN_FIX.patch')) {
            git apply --check --whitespace=nowarn $patch
            if ($LASTEXITCODE -ne 0) { throw "Harness patch check failed for ${patch}: ${LASTEXITCODE}" }
            git apply --whitespace=nowarn $patch
            if ($LASTEXITCODE -ne 0) { throw "Harness patch apply failed for ${patch}: ${LASTEXITCODE}" }
          }
          git apply --check --whitespace=nowarn p61-browser/P61_TRUSTED_CLIENT_QA_FIX.patch
          if ($LASTEXITCODE -ne 0) { throw "Proxy patch check failed: ${LASTEXITCODE}" }
          git apply --whitespace=nowarn p61-browser/P61_TRUSTED_CLIENT_QA_FIX.patch
          if ($LASTEXITCODE -ne 0) { throw "Proxy patch apply failed: ${LASTEXITCODE}" }
          $harnessSha = (Get-FileHash -LiteralPath p61-browser/run-p61-browser-sku-executions.mjs -Algorithm SHA256).Hash.ToLowerInvariant()
          $proxySha = (Get-FileHash -LiteralPath p61-browser/run-p61-https-proxy.mjs -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($harnessSha -ne 'd59126094e3c4aefbd88828be9b5e3d66176eec378b7274005af19f099df0291') { throw "P61C patched harness mismatch: $harnessSha" }
          if ($proxySha -ne '25da75d90eb9bc02a15051a716c06dd0d191461a435006f63b17e3f935eda49a') { throw "P61C patched proxy mismatch: $proxySha" }
          node --check p61-browser/run-p61-browser-sku-executions.mjs
          if ($LASTEXITCODE -ne 0) { throw "P61C harness parse check failed: ${LASTEXITCODE}" }
          node --check p61-browser/run-p61-https-proxy.mjs
          if ($LASTEXITCODE -ne 0) { throw "P61C proxy parse check failed: ${LASTEXITCODE}" }
          Write-Host 'P61C exact control and QA runtime preflight: PASS'

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0 and locate CLI
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          $nodeVersion = (node --version).Trim()
          $npmVersion = (npm --version).Trim()
          if ($nodeVersion -ne 'v24.18.0') { throw "Exact Node mismatch: $nodeVersion" }
          if ($npmVersion -ne '11.16.0') { throw "Exact npm mismatch: $npmVersion" }
          $npmRoot = (npm root --global).Trim()
          $npmCli = (Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          if (-not (Test-Path -LiteralPath $npmCli -PathType Leaf)) { throw "npm CLI missing: $npmCli" }
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node --version
          npm --version
          python --version

      - name: Reconstruct exact 1597-file P46 projection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p61c-out | Out-Null
          python p49-build-projection/reconstruct-p49-direct-projection.py `
            --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json `
            --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f `
            --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json `
            --runner p49-build-projection/run-p47-product-windows-projection.mjs `
            --parts-root p49-build-projection/parts `
            --work-root p49-work `
            --output-root p61c-out/reconstruction
          if ($LASTEXITCODE -ne 0) { throw "Projection reconstruction failed: ${LASTEXITCODE}" }

      - name: Generate exact P60 reconciled engineering runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python p60-runtime/build-p60-reconciled-runner.py `
            --input p49-build-projection/run-p47-product-windows-projection.mjs `
            --output p49-work/run-p60-reconciled-windows-projection.mjs `
            --receipt p61c-out/P60_RECONCILED_RUNNER_BUILD_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { throw "P60 runner generation failed: ${LASTEXITCODE}" }
          node --check p49-work/run-p60-reconciled-windows-projection.mjs
          if ($LASTEXITCODE -ne 0) { throw "P60 runner parse check failed: ${LASTEXITCODE}" }

      - name: Re-establish P60 exact Windows engineering and production build
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.toolchain.outputs.npm_cli }}
        run: |
          $ErrorActionPreference = 'Stop'
          node p49-work/run-p60-reconciled-windows-projection.mjs `
            --source-root p49-work/source `
            --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json `
            --output-dir p61c-out/p60-engineering
          if ($LASTEXITCODE -ne 0) { throw "P60 engineering prerequisite failed: ${LASTEXITCODE}" }

      - name: Locate installed Chromium browser
        id: browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\Program Files\Google\Chrome\Application\chrome.exe',
            'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe',
            'C:\Program Files\Microsoft\Edge\Application\msedge.exe',
            'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          )
          $browser = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $browser) { throw 'No installed Chrome/Edge executable found on windows-2025' }
          $sha = (Get-FileHash -LiteralPath $browser -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $browser).Length
          "path=$browser" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "bytes=$bytes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Browser: $browser"
          Write-Host "SHA-256: $sha"

      - name: Start exact built server in QA rate-limit mode and execute three Browser SKUs
        shell: pwsh
        env:
          NODE_ENV: development
          NEXT_TELEMETRY_DISABLED: '1'
          VELMERE_CANONICAL_ORIGIN: 'https://localhost:3443'
          NEXT_PUBLIC_SITE_URL: 'https://localhost:3443'
          VELMERE_TRUSTED_PROXY_PROFILE: 'vercel'
          VERCEL: '1'
          VERCEL_ENV: 'preview'
          P61_BASE_URL: 'https://localhost:3443'
          P61_OUTPUT_ROOT: 'p61c-out/browser'
          P61_NODE_MODULES_ROOT: 'p49-work/source/node_modules'
          P61_BROWSER_EXECUTABLE_PATH: ${{ steps.browser.outputs.path }}
          P61_PROXY_LISTEN_HOST: '127.0.0.1'
          P61_PROXY_LISTEN_PORT: '3443'
          P61_PROXY_PUBLIC_HOST: 'localhost:3443'
          P61_PROXY_UPSTREAM_HOST: '127.0.0.1'
          P61_PROXY_UPSTREAM_PORT: '3110'
          P61_PROXY_PFX_PASSPHRASE: 'p61-runtime-only-pfx-passphrase-2026'
          VELMERE_LENS_SOURCE_TOKEN_SECRET_CURRENT: 'p61-source-token-fixture-secret-2026-08-15-0123456789abcdef'
          VELMERE_LENS_SOURCE_TOKEN_KEY_ID: 'p61-browser-current-execution'
          VELMERE_LENS_RENDER_TOKEN_SECRET_CURRENT: 'p61-render-token-fixture-secret-2026-08-15-fedcba9876543210'
          VELMERE_LENS_RENDER_TOKEN_KEY_ID: 'p61-browser-render-execution'
          NEXTAUTH_SECRET: 'p61-nextauth-fixture-secret-2026-08-15-0123456789abcdef'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p61c-out/server | Out-Null
          $serverDir = (Resolve-Path -LiteralPath p61c-out/server).Path
          $sourceRoot = (Resolve-Path -LiteralPath p49-work/source).Path
          $nextCli = (Resolve-Path -LiteralPath (Join-Path $sourceRoot 'node_modules/next/dist/bin/next')).Path
          $nextStdout = Join-Path $serverDir 'next-start.stdout.log'
          $nextStderr = Join-Path $serverDir 'next-start.stderr.log'
          $proxyStdout = Join-Path $serverDir 'https-proxy.stdout.log'
          $proxyStderr = Join-Path $serverDir 'https-proxy.stderr.log'
          $pfxPath = Join-Path $serverDir 'p61-runtime-certificate.pfx'
          $securePassword = ConvertTo-SecureString $env:P61_PROXY_PFX_PASSPHRASE -AsPlainText -Force
          $cert = New-SelfSignedCertificate -DnsName 'localhost' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(1)
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path -LiteralPath $pfxPath -PathType Leaf)) { throw 'P61C runtime PFX export failed' }
          $env:P61_PROXY_PFX_PATH = $pfxPath

          $nextProcess = Start-Process -FilePath (Get-Command node).Source -ArgumentList @($nextCli, 'start', '-H', '127.0.0.1', '-p', '3110') -WorkingDirectory $sourceRoot -RedirectStandardOutput $nextStdout -RedirectStandardError $nextStderr -PassThru
          $proxyProcess = $null
          try {
            $nextReady = $false
            for ($i = 0; $i -lt 120; $i++) {
              if ($nextProcess.HasExited) { throw "Next server exited early with code $($nextProcess.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3110/en/search' -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $nextReady = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $nextReady) { throw 'Next server did not become ready within 120 seconds' }
            $proxyProcess = Start-Process -FilePath (Get-Command node).Source -ArgumentList @('p61-browser/run-p61-https-proxy.mjs') -WorkingDirectory (Resolve-Path -LiteralPath '.').Path -RedirectStandardOutput $proxyStdout -RedirectStandardError $proxyStderr -PassThru
            $proxyReady = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($proxyProcess.HasExited) { throw "HTTPS proxy exited early with code $($proxyProcess.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'https://localhost:3443/en/search' -SkipCertificateCheck -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $proxyReady = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $proxyReady) { throw 'P61C HTTPS proxy did not become ready within 60 seconds' }
            Write-Host "P61C exact built server and QA HTTPS proxy ready. NextPID=$($nextProcess.Id) ProxyPID=$($proxyProcess.Id)"
            node p61-browser/run-p61-browser-sku-executions.mjs
            if ($LASTEXITCODE -ne 0) { throw "P61C Browser campaign failed: ${LASTEXITCODE}" }
          } finally {
            if ($proxyProcess) { Stop-Process -Id $proxyProcess.Id -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $nextProcess.Id -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            Get-Content $nextStdout -ErrorAction SilentlyContinue
            Get-Content $nextStderr -ErrorAction SilentlyContinue
            Get-Content $proxyStdout -ErrorAction SilentlyContinue
            Get-Content $proxyStderr -ErrorAction SilentlyContinue
          }

      - name: Capture P61C workflow boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p61c-out | Out-Null
          $boundary = [ordered]@{
            schemaVersion = 'velmere.p61c.github-browser-three-sku-qa-boundary.v1'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            workflow = '${{ github.workflow }}'
            ref = '${{ github.ref }}'
            sha = '${{ github.sha }}'
            runnerOs = '${{ runner.os }}'
            runnerArch = '${{ runner.arch }}'
            imageOs = $env:ImageOS
            node = (node --version 2>$null)
            npm = (npm --version 2>$null)
            browserExecutablePath = '${{ steps.browser.outputs.path }}'
            browserExecutableSha256 = '${{ steps.browser.outputs.sha256 }}'
            canonicalOrigin = 'https://localhost:3443'
            rateLimitRuntime = 'QA nonproduction memory adapter; no production readiness credit'
            exactProjectionManifestSha256 = '2a8a45acf4ab96827f636386edd06b1800c696b937d75eb81434a280c0a26b3b'
            patchedHarnessSha256 = 'd59126094e3c4aefbd88828be9b5e3d66176eec378b7274005af19f099df0291'
            patchedProxySha256 = '25da75d90eb9bc02a15051a716c06dd0d191461a435006f63b17e3f935eda49a'
            fixtureEvidenceClass = 'FIXTURE_INTERNAL_ONLY'
            truthBoundary = 'Credit is limited to three physically distinct Browser paths on the exact P60-built source using the QA memory rate-limit adapter behind an HTTPS canonical-origin proxy. Production rate-limit readiness, live data, rights, customer value, independent PDF replay, sale, GO and WORLD_CLASS remain excluded.'
            timestampUtc = [DateTime]::UtcNow.ToString('o')
          }
          $boundary | ConvertTo-Json -Depth 8 | Set-Content p61c-out/P61C_GITHUB_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload P61C Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p61c-browser-three-sku-qa-rate-limit
          path: p61c-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
