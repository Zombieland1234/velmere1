name: R11B Asset Detail Truth Containment

on:
  push:
    branches:
      - r11b-runtime-asset-detail-truth-containment

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  asset-detail-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install exact lockfile
        run: npm ci --ignore-scripts
      - name: Build exact source
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify asset-detail fail-closed boundary
        shell: bash
        run: |
          mkdir -p artifacts/r11b/asset-detail-truth-containment
          npx next start -H 127.0.0.1 -p 3103 > artifacts/r11b/asset-detail-truth-containment/NEXT_START.log 2>&1 &
          echo $! > /tmp/asset-detail-truth-next.pid
          cleanup(){ kill "$(cat /tmp/asset-detail-truth-next.pid)" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 90); do
            code="$(curl -sS -o /tmp/asset-detail-truth.html -w '%{http_code}' http://127.0.0.1:3103/en/real-markets/assets/aapl || true)"
            case "$code" in 200|307|308) ready=1; break;; esac
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat artifacts/r11b/asset-detail-truth-containment/NEXT_START.log; exit 1; fi
          VELMERE_BASE_URL=http://127.0.0.1:3103 \
          VELMERE_EVIDENCE_DIR=artifacts/r11b/asset-detail-truth-containment \
          node scripts/r11/test-asset-detail-truth-containment.mjs
          trap - EXIT
          cleanup
      - name: Upload containment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r11b-asset-detail-truth-containment-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/r11b/asset-detail-truth-containment/**
