name: R10 Corpus Integrity Migration

on:
  push:
    branches:
      - r10-candidate-truth-build
    paths:
      - scripts/r10/migrate-legacy-report-integrity.mjs
      - .github/workflows/r10-corpus-integrity-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r10-corpus-integrity-migration-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  VELMERE_OFFLINE_TS_FORCE_BUILTIN: "1"

jobs:
  migrate:
    name: Replace legacy pseudo-TSA and provenance placeholders
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate for guarded corpus commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Verify exact bundled toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Run deterministic report-integrity migration
        run: node scripts/r10/migrate-legacy-report-integrity.mjs

      - name: Re-test local integrity implementation
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/r10/test-local-integrity-attestation.ts

      - name: Re-test release truth scanner rules
        run: node scripts/r10/test-release-truth-gate.mjs

      - name: Measure full candidate truth after migration
        shell: bash
        run: |
          set +e
          node scripts/r10/verify-release-truth.mjs --write --output artifacts/r10/R10_RELEASE_TRUTH_AFTER_INTEGRITY_MIGRATION.json
          scanner_exit=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('artifacts/r10/R10_RELEASE_TRUTH_AFTER_INTEGRITY_MIGRATION.json', 'utf8'));
          const targeted = new Set([
            'local_timestamp_not_external_tsa',
            'local_signer_not_trusted_root_ca',
            'provenance_placeholder',
          ]);
          const remaining = (receipt.findings ?? []).filter((finding) => targeted.has(finding.category));
          if (remaining.length) {
            console.error(`targeted R10 corpus findings remain: ${remaining.length}`);
            process.exit(1);
          }
          console.log(`Targeted integrity categories cleared. Remaining overall P0=${receipt.totalP0}; scannerExit=${process.env.SCANNER_EXIT ?? 'measured separately'}`);
          NODE
          echo "Full scanner exit was ${scanner_exit}; remaining non-targeted P0 are allowed in this migration job and remain release blockers."

      - name: Commit migrated corpus and receipts
        run: |
          git config user.name "velmere-r10-corpus-migrator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/smart_contract reports/shield reports/real_markets artifacts/r10/R10_CORPUS_INTEGRITY_MIGRATION_RECEIPT.json artifacts/r10/R10_RELEASE_TRUTH_AFTER_INTEGRITY_MIGRATION.json
          if git diff --cached --quiet; then
            echo "No corpus changes to commit."
            exit 0
          fi
          git commit -m "fix(r10): migrate legacy report integrity corpus [r10-corpus-migrate]"
          git push origin HEAD:r10-candidate-truth-build

      - name: Upload migration receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r10-corpus-integrity-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/r10/R10_CORPUS_INTEGRITY_MIGRATION_RECEIPT.json
            artifacts/r10/R10_RELEASE_TRUTH_AFTER_INTEGRITY_MIGRATION.json
