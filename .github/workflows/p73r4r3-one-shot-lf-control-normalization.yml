name: P73R4R3 One-Shot LF Control Normalization

on:
  push:
    branches:
      - velmere-p73-audit-ancient8-ground-truth-20260817

permissions:
  contents: write

concurrency:
  group: p73r4r3-one-shot-lf-control-normalization
  cancel-in-progress: false

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'P73R4R3 normalize authority template LF') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Canonicalize control plane to LF product bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json

          patcher=Path('p73-runtime/apply-p73r4-adjudicated-authority-engine.py')
          runner=Path('p73-runtime/patch-p73r4-reconciled-runner.py')
          workflow=Path('.github/workflows/p73r4-exact-windows-adjudicated-authority.yml')
          spec=Path('p73-runtime/p73r4-product-patch-spec.json')
          template=Path('p73-runtime/p73r4-new-audit-adjudicated-authority-evidence.ts')

          def sha(b): return hashlib.sha256(b).hexdigest()
          spec_before=spec.read_bytes(); template_raw=template.read_bytes()
          if sha(spec_before)!='9386413bfd3d1b733547393117ee799f50918572a4eceb4964d5416e1830389a':
              raise SystemExit(f'spec drift:{len(spec_before)}:{sha(spec_before)}')
          canonical_template=template_raw.decode('utf-8').replace('\r\n','\n').replace('\r','\n').encode('utf-8')
          if len(canonical_template)!=19749 or sha(canonical_template)!='0d9ad2b771ad4d19c61853ed5d5562f54c2549b07493690f28edc5383aff6521':
              raise SystemExit(f'canonical template mismatch:{len(canonical_template)}:{sha(canonical_template)}')

          p=patcher.read_text(encoding='utf-8')
          replacements=[
            ("FINAL_PAYLOAD=21015946","FINAL_PAYLOAD=21015520"),
            ("FINAL_AGG='1ac85bb49caade92cecae6ba2c7d8f76e782a9c86fd90509d99a762d25f44c4f'","FINAL_AGG='d0306b565af73939691a34554e4f7e57543f6d3b91d778a9c93ebf25f5ffd377'"),
            ("NEW_BYTES=20175","NEW_BYTES=19749"),
            ("NEW_SHA='30bbb4d9813bb0866234b02280e177d0939fcee9956578b04e636d068de1fb84'","NEW_SHA='0d9ad2b771ad4d19c61853ed5d5562f54c2549b07493690f28edc5383aff6521'"),
            ("new_source=(control/'p73r4-new-audit-adjudicated-authority-evidence.ts').read_bytes()","new_source=(control/'p73r4-new-audit-adjudicated-authority-evidence.ts').read_text(encoding='utf-8').replace('\\r\\n','\\n').replace('\\r','\\n').encode('utf-8')"),
          ]
          for old,new in replacements:
              if p.count(old)!=1: raise SystemExit(f'patcher anchor count:{old}:{p.count(old)}')
              p=p.replace(old,new,1)
          patcher.write_text(p,encoding='utf-8',newline='\n')

          r=runner.read_text(encoding='utf-8')
          for old,new in [
            ("NEW_GENERATED_PAYLOAD='21015931'","NEW_GENERATED_PAYLOAD='21015505'"),
            ("NEW_GENERATED_AGG='d6c2a3fccd6b8d8c0887d74b1badaf8c6d776ddff5559742d600d658b98a4fe5'","NEW_GENERATED_AGG='7040ed310df042104f9628d68a18f0afa7a4497b1aaab5ead0434b452a65a076'"),
            ("CURRENT_PAYLOAD=21015946","CURRENT_PAYLOAD=21015520"),
            ("CURRENT_AGG='1ac85bb49caade92cecae6ba2c7d8f76e782a9c86fd90509d99a762d25f44c4f'","CURRENT_AGG='d0306b565af73939691a34554e4f7e57543f6d3b91d778a9c93ebf25f5ffd377'"),
          ]:
              if r.count(old)!=1: raise SystemExit(f'runner anchor count:{old}:{r.count(old)}')
              r=r.replace(old,new,1)
          runner.write_text(r,encoding='utf-8',newline='\n')

          w=workflow.read_text(encoding='utf-8')
          observed={}
          for old,new in [
            ('P73R4R2','P73R4R3'),
            ('p73r4r2-','p73r4r3-'),
            ('21015946','21015520'),
            ('1ac85bb49caade92cecae6ba2c7d8f76e782a9c86fd90509d99a762d25f44c4f','d0306b565af73939691a34554e4f7e57543f6d3b91d778a9c93ebf25f5ffd377'),
            ('21015931','21015505'),
            ('d6c2a3fccd6b8d8c0887d74b1badaf8c6d776ddff5559742d600d658b98a4fe5','7040ed310df042104f9628d68a18f0afa7a4497b1aaab5ead0434b452a65a076'),
          ]:
              c=w.count(old); observed[old]=c
              if c<1: raise SystemExit(f'workflow anchor missing:{old}')
              w=w.replace(old,new)
          workflow.write_text(w,encoding='utf-8',newline='\n')

          receipt={
            'schemaVersion':'velmere.p73r4r3.lf-control-normalization.v1',
            'status':'PASS_CONTROL_PLANE_CROSS_PLATFORM_NORMALIZATION_NO_PRODUCT_CREDIT',
            'patchSpecSha256':sha(spec_before),
            'productOpsChanged':False,
            'templateRepositoryBytes':len(template_raw),'templateRepositorySha256':sha(template_raw),
            'canonicalLfTemplateBytes':len(canonical_template),'canonicalLfTemplateSha256':sha(canonical_template),
            'canonicalProjection':{'fileCount':1598,'payloadBytes':21015520,'pathSetSha256':'9cb47f15e73ec678e32fe214b8e2947a4bfbaa624d8fb5101650296700d3dd25','aggregateSha256':'d0306b565af73939691a34554e4f7e57543f6d3b91d778a9c93ebf25f5ffd377'},
            'generatedNextEnv':{'payloadBytes':21015505,'aggregateSha256':'7040ed310df042104f9628d68a18f0afa7a4497b1aaab5ead0434b452a65a076'},
            'workflowReplacementCounts':observed,
            'customerFinalOutputCredit':0,'auditFinalPdfCredit':0,'rightsCredit':0,'paidValueCredit':0,'saleCredit':0,'live':False,
            'truthBoundary':'Repairs a control-plane platform drift: the new P73 authority source template is normalized to LF before product projection hashing/writing. The six product patch operations are unchanged. Prior Windows-only CRLF P73R4R2 bytes receive no canonical promotion.'
          }
          Path('p73-runtime/P73R4R3_LF_CONTROL_NORMALIZATION_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8',newline='\n')
          print(json.dumps(receipt,indent=2))
          PY

      - name: Commit normalized control plane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Velmere Closure Bot'
          git config user.email 'velmere141@gmail.com'
          git add p73-runtime/apply-p73r4-adjudicated-authority-engine.py p73-runtime/patch-p73r4-reconciled-runner.py p73-runtime/P73R4R3_LF_CONTROL_NORMALIZATION_RECEIPT.json .github/workflows/p73r4-exact-windows-adjudicated-authority.yml
          git commit -m 'P73R4R3 normalize authority template LF'
          git push origin HEAD:velmere-p73-audit-ancient8-ground-truth-20260817
