name: R7 Exact Current Package Dependency Closure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r7-exact-current-package-dependency-closure.yml'
      - 'r7-transport/**'
      - 'scripts/verify-runtime-contract.mjs'
      - 'scripts/lib/velmere-runtime-contract.mjs'
  push:
    branches:
      - velmere-r7-exact-dependency-closure-20260823
    paths:
      - '.github/workflows/r7-exact-current-package-dependency-closure.yml'
      - 'r7-transport/**'
      - 'scripts/verify-runtime-contract.mjs'
      - 'scripts/lib/velmere-runtime-contract.mjs'

permissions:
  contents: read

jobs:
  exact-current-package-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout hash-bound dependency bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Set up exact npm 11.16.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Reconstruct exact lock and exact current R7 package manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r7-dependency-out/logs .r7-npm-cache
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const zlib = require('node:zlib');
          const sha = b => crypto.createHash('sha256').update(b).digest('hex');
          const base = path.resolve('p41-runtime');
          const repaired = ['payload.fix-02-0','payload.fix-02-1'].map(n => fs.readFileSync(path.join(base,n),'utf8').trim()).join('');
          if (sha(Buffer.from(repaired)) !== 'a0955da49c4e98bde742ddd4fcaa9a384edf3a29a93097d47267b799bfd63568') throw new Error('repair fragment mismatch');
          const parts = Array.from({length:7},(_,i)=>path.join(base,`payload.part-${String(i).padStart(2,'0')}`));
          const b64 = parts.map((p,i)=>i===2 ? repaired : fs.readFileSync(p,'utf8').trim()).join('');
          const compressed = Buffer.from(b64,'base64');
          if (sha(compressed) !== '5b1423b61d346fdbff9d92c0ce4f30be40357f8edb09f36bf77e44025acdb061') throw new Error('compressed payload mismatch');
          const payload = JSON.parse(zlib.brotliDecompressSync(compressed).toString('utf8'));
          const pkg = Buffer.from(payload.packageJson,'utf8');
          const lock = Buffer.from(payload.packageLock,'utf8');
          if (sha(pkg) !== '04aa4b393337fffa6e02ef54ad7668fe8136b038b0d924b208158a095b6f70a5') throw new Error('historical package mismatch');
          if (sha(lock) !== 'e228adec08801e454ef5559a20f302110b4896a307c364195716218a376c48bb') throw new Error('lock mismatch');
          fs.writeFileSync('package.json', pkg);
          fs.writeFileSync('package-lock.json', lock);
          const patch = fs.readFileSync('r7-transport/package-json-r7.patch');
          if (sha(patch) !== 'b5065feca85aa6b849082e882a2a92db24ebaa41dffce1c76146f41297773756') throw new Error('R7 package patch mismatch');
          NODE
          patch --batch package.json < r7-transport/package-json-r7.patch
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          if(sha('package.json')!=='de067fe9cd5611ebf9c719ca0be30e5b149d19b002268a0ce496acb10f871c1c') throw new Error('current R7 package.json mismatch');
          if(sha('package-lock.json')!=='e228adec08801e454ef5559a20f302110b4896a307c364195716218a376c48bb') throw new Error('current R7 package-lock mismatch');
          NODE

      - name: Full npm ci with lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --audit=false --fund=false --prefer-online --cache .r7-npm-cache --loglevel=notice > r7-dependency-out/logs/npm-ci-online.stdout.log 2> r7-dependency-out/logs/npm-ci-online.stderr.log
          npm ls --all --json > r7-dependency-out/logs/npm-ls-online.json

      - name: Prove exact React TypeScript and PGlite runtime
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { PGlite } from '@electric-sql/pglite';
          const read = p => JSON.parse(fs.readFileSync(p,'utf8'));
          const versions = {
            react: read('node_modules/react/package.json').version,
            reactDom: read('node_modules/react-dom/package.json').version,
            typescript: read('node_modules/typescript/package.json').version,
            pglite: read('node_modules/@electric-sql/pglite/package.json').version,
          };
          if (JSON.stringify(versions) !== JSON.stringify({react:'19.2.7',reactDom:'19.2.7',typescript:'5.9.3',pglite:'0.5.4'})) throw new Error(`version mismatch ${JSON.stringify(versions)}`);
          const lock = read('package-lock.json');
          const pglite = lock.packages['node_modules/@electric-sql/pglite'];
          if (pglite.integrity !== 'sha512-yYZUyyXrHU7tPlCjwZQJ6hIG9DscdCCn7Uk0mYKwC1FeHX286AbcmFveMiRBEak8e9iPupjsoVImN3yJZVed2g==') throw new Error('PGlite lock integrity mismatch');
          const db = new PGlite();
          try {
            const result = await db.query('select 1::int as value');
            if (result.rows?.[0]?.value !== 1) throw new Error('PGlite SELECT 1 failed');
          } finally {
            await db.close();
          }
          fs.writeFileSync('r7-dependency-out/exact-runtime-versions.json', JSON.stringify({versions,pgliteIntegrity:pglite.integrity,status:'PASS'},null,2)+'\n');
          NODE

      - name: Full offline npm ci replay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --offline --audit=false --fund=false --cache .r7-npm-cache --loglevel=notice > r7-dependency-out/logs/npm-ci-offline.stdout.log 2> r7-dependency-out/logs/npm-ci-offline.stderr.log
          npm ls --all --json > r7-dependency-out/logs/npm-ls-offline.json
          node --input-type=module <<'NODE'
          import { PGlite } from '@electric-sql/pglite';
          const db = new PGlite();
          try {
            const result = await db.query('select 2::int as value');
            if (result.rows?.[0]?.value !== 2) throw new Error('offline PGlite SELECT failed');
          } finally {
            await db.close();
          }
          NODE

      - name: Write exact dependency receipt
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const receipt={
            schemaVersion:'velmere.r7.exact-current-package-dependency-closure.v1',
            generatedAt:new Date().toISOString(),
            status:'PASS_EXACT_CURRENT_PACKAGE_DEPENDENCIES',
            github:{sha:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,workflowSha:sha('.github/workflows/r7-exact-current-package-dependency-closure.yml')},
            runtime:{node:process.version,npm:cp.execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),platform:process.platform,arch:process.arch},
            sourceBinding:{packageJsonSha256:sha('package.json'),packageLockSha256:sha('package-lock.json'),packagePatchSha256:sha('r7-transport/package-json-r7.patch')},
            npmCi:{onlineFullLifecycle:'PASS',offlineFullLifecycle:'PASS',ignoreScripts:false},
            exactPackages:{react:'19.2.7',reactDom:'19.2.7',typescript:'5.9.3',pglite:'0.5.4'},
            pgliteSequentialQueries:'PASS',
            currentR7FullSourceCredit:false,
            exactWindowsCredit:false,
            stagingCredit:false,
            customerFinalCredit:false,
            truthBoundary:'Exact current R7 package.json/package-lock dependency closure under Node 24.18.0/npm 11.16.0. This branch is dependency-only and does not by itself prove full R7 source execution, Windows, staging or Customer FINAL.'
          };
          fs.writeFileSync('r7-dependency-out/VELMERE_R7_EXACT_CURRENT_PACKAGE_DEPENDENCY_CLOSURE_RECEIPT.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          NODE

      - name: Upload exact dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velmere-r7-exact-current-package-dependency-closure
          path: r7-dependency-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
