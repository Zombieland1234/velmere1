name: Velmere R5 Exact Dependency Bridge Publish

on:
  push:
    branches:
      - velmere-r5-exact-dependency-bridge-20260823
    paths:
      - .github/workflows/velmere-r5-exact-dependency-bridge-push.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-verified-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Build exact verified bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          rm -rf r5-exact-dependency-bridge r5-exact-dependency-bridge.zip
          mkdir -p r5-exact-dependency-bridge/packages r5-exact-dependency-bridge/logs
          node --version > r5-exact-dependency-bridge/logs/node-version.txt
          npm --version > r5-exact-dependency-bridge/logs/npm-version.txt
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const https = require('node:https');
          const { execFileSync } = require('node:child_process');

          const out = path.resolve('r5-exact-dependency-bridge');
          const packagesDir = path.join(out, 'packages');
          const extractDir = path.join(out, '.extract');
          fs.mkdirSync(extractDir, { recursive: true });

          const specs = [
            ['react','19.2.7','react-19.2.7.tgz','https://registry.npmjs.org/react/-/react-19.2.7.tgz','HNe9WslTbXmFK8o8cmwgAeJFSBvt1bPdHCVKtaaV+WlAN36mpT4hcRpwbf3fY56ar2oIXzsBpOAiIRHAdY0OlQ=='],
            ['react-dom','19.2.7','react-dom-19.2.7.tgz','https://registry.npmjs.org/react-dom/-/react-dom-19.2.7.tgz','t0BRVXvbiE/o20Hfw669rLbMCDWtYZLvmJigy2f0MxsXF+71pxhR3xOkspmsO8h3ZlNzyibAmtCa3l4lYKk6gQ=='],
            ['scheduler','0.27.0','scheduler-0.27.0.tgz','https://registry.npmjs.org/scheduler/-/scheduler-0.27.0.tgz','eNv+WrVbKu1f3vbYJT/xtiF5syA5HPIMtf9IgY/nKg0sWqzAUEvqY/xm7OcZc/qafLx/iO9FgOmeSAp4v5ti/Q=='],
            ['typescript','5.9.3','typescript-5.9.3.tgz','https://registry.npmjs.org/typescript/-/typescript-5.9.3.tgz','jl1vZzPDinLr9eUt3J/t7V6FgNEw9QjvBPdysz9KfQDD41fQrC2Y4vKQdiaUpFT4bXlb1RHhLpp8wtm6M5TgSw=='],
            ['@electric-sql/pglite','0.5.4','electric-sql-pglite-0.5.4.tgz','https://registry.npmjs.org/@electric-sql/pglite/-/pglite-0.5.4.tgz','yYZUyyXrHU7tPlCjwZQJ6hIG9DscdCCn7Uk0mYKwC1FeHX286AbcmFveMiRBEak8e9iPupjsoVImN3yJZVed2g=='],
          ];

          function get(url, redirects = 0) {
            if (redirects > 8) return Promise.reject(new Error(`too_many_redirects:${url}`));
            return new Promise((resolve, reject) => {
              https.get(url, { headers: { 'User-Agent': 'Velmere-R5-Exact-Dependency-Bridge/1.0' } }, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  const next = new URL(res.headers.location, url).toString();
                  res.resume();
                  resolve(get(next, redirects + 1));
                  return;
                }
                if (res.statusCode !== 200) {
                  res.resume();
                  reject(new Error(`http_${res.statusCode}:${url}`));
                  return;
                }
                const chunks = [];
                res.on('data', chunk => chunks.push(chunk));
                res.on('end', () => resolve(Buffer.concat(chunks)));
                res.on('error', reject);
              }).on('error', reject);
            });
          }

          (async () => {
            const nodeUrl = 'https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz';
            const sumsUrl = 'https://nodejs.org/dist/v24.18.0/SHASUMS256.txt';
            const [nodeBytes, sumsBytes] = await Promise.all([get(nodeUrl), get(sumsUrl)]);
            const sums = sumsBytes.toString('utf8');
            const match = sums.match(/^([0-9a-f]{64})  node-v24\.18\.0-linux-x64\.tar\.xz$/mu);
            if (!match) throw new Error('node_checksum_line_missing');
            const nodeSha256 = crypto.createHash('sha256').update(nodeBytes).digest('hex');
            if (nodeSha256 !== match[1]) throw new Error(`node_sha256_mismatch:${nodeSha256}`);
            fs.writeFileSync(path.join(out, 'node-v24.18.0-linux-x64.tar.xz'), nodeBytes);
            fs.writeFileSync(path.join(out, 'SHASUMS256.txt'), sumsBytes);

            const packages = [];
            for (const [name, version, file, url, integrity] of specs) {
              const bytes = await get(url);
              const sha512Base64 = crypto.createHash('sha512').update(bytes).digest('base64');
              if (sha512Base64 !== integrity) throw new Error(`integrity_mismatch:${name}@${version}`);
              const archive = path.join(packagesDir, file);
              fs.writeFileSync(archive, bytes);
              const target = path.join(extractDir, file.replace(/\.tgz$/u, ''));
              fs.mkdirSync(target, { recursive: true });
              execFileSync('tar', ['-xzf', archive, '-C', target]);
              const packageJson = JSON.parse(fs.readFileSync(path.join(target, 'package', 'package.json'), 'utf8'));
              if (packageJson.name !== name || packageJson.version !== version) throw new Error(`package_identity_mismatch:${name}@${version}`);
              packages.push({
                name,
                version,
                file: `packages/${file}`,
                sourceUrl: url,
                byteLength: bytes.length,
                sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
                sha512Base64,
                lockIntegrity: `sha512-${integrity}`,
                license: packageJson.license ?? null,
                packageIdentity: 'PASS',
              });
            }
            fs.rmSync(extractDir, { recursive: true, force: true });
            const receipt = {
              schemaVersion: 'velmere.r5.exact-dependency-bridge.v2',
              generatedAt: new Date().toISOString(),
              sourceCommit: process.env.GITHUB_SHA,
              sourceBranch: process.env.GITHUB_REF_NAME,
              runner: {
                os: process.env.RUNNER_OS,
                arch: process.arch,
                node: process.version,
                npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
              },
              nodeArchive: {
                version: '24.18.0',
                platform: 'linux-x64',
                sourceUrl: nodeUrl,
                file: 'node-v24.18.0-linux-x64.tar.xz',
                byteLength: nodeBytes.length,
                sha256: nodeSha256,
                checksumSource: sumsUrl,
                checksumVerification: 'PASS',
              },
              packages,
              status: 'PASS_EXACT_LOCK_INTEGRITY_AND_PACKAGE_IDENTITY',
              customerFinalCredit: false,
              exactWindowsCredit: false,
              truthBoundary: 'Exact official Linux Node archive and five exact npm tarballs required by bounded R5 tests. Not npm ci, not the full dependency tree, not Windows Server 2025 and not row-level Customer FINAL.',
            };
            fs.writeFileSync(path.join(out, 'VELMERE_R5_EXACT_DEPENDENCY_BRIDGE_RECEIPT.json'), `${JSON.stringify(receipt, null, 2)}\n`);
          })().catch(error => {
            console.error(error);
            process.exit(2);
          });
          NODE
          zip -0 -q -r r5-exact-dependency-bridge.zip r5-exact-dependency-bridge
          sha256sum r5-exact-dependency-bridge.zip > r5-exact-dependency-bridge.zip.sha256

      - name: Publish bundle to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'velmere-r5-bridge-bot'
          git config user.email 'velmere141@gmail.com'
          git add r5-exact-dependency-bridge.zip r5-exact-dependency-bridge.zip.sha256
          git commit -m 'R5: publish exact verified dependency bridge [skip ci]'
          git push origin HEAD:velmere-r5-exact-dependency-bridge-20260823
