name: P78R1 Audit Authority Customer Path Source Proof

on:
  push:
    branches:
      - velmere-p78-real-audit-customer-final-20260818
    paths:
      - 'p78-runtime/apply-p78r1-audit-authority-customer-path.py'
      - 'p78-runtime/test-p78r1-static.py'
      - 'p78-runtime/test-p78r1-runtime.mts'
      - '.github/workflows/p78r1-source-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p78r1-source-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout P78R1 control head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Expand pinned P75 support
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,zipfile
          parts=sorted(Path('p75-runtime').glob('bundle.part*'))
          if len(parts)!=7: raise SystemExit(f'P75 bundle part count mismatch:{len(parts)}')
          raw=base64.b64decode(''.join(p.read_text(encoding='ascii').strip() for p in parts),validate=True)
          sha=hashlib.sha256(raw).hexdigest(); expected='467026e4c5751d42c6fb06fb4425d640f911a3990fc3f05fd2de99c03e68ffad'
          if sha!=expected: raise SystemExit(f'P75 bundle SHA mismatch:{sha}')
          z=Path('p75-runtime/p75-ci-bundle.zip');z.write_bytes(raw)
          with zipfile.ZipFile(z) as a:a.extractall('p75-runtime')
          PY

      - name: Expand pinned P77 support
        run: |
          set -euo pipefail
          python3 p77-runtime/reconstruct-p77-support.py --parts-dir p77-runtime --output-dir p77-runtime

      - name: Reconstruct exact P77R3 source
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          mkdir -p p78r1-out
          python3 p73-runtime/reconstruct-p73r7-exact.py --work-root p75-work --out-root p78r1-out
          python3 p75-runtime/apply-p75-advanced-automation-runtime.py --source-root p75-work/source --parent-manifest p75-work/P73R7_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P75_BUILD_PROJECTION_MANIFEST.json --receipt p78r1-out/P75_PARENT_SOURCE_PATCH.json
          python3 p76r2-runtime/reconstruct-p76-base-apply.py --parts-dir p76-runtime --output p76-runtime/apply-p76-advanced-release-automation.py
          python3 p76-runtime/apply-p76-advanced-release-automation.py --source-root p75-work/source --parent-manifest p75-work/P75_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P76_BUILD_PROJECTION_MANIFEST.json --receipt p78r1-out/P76_SOURCE_PATCH.json
          python3 p76r2-runtime/apply-p76r2-typescript-repair.py --source-root p75-work/source --parent-manifest p75-work/P76_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P76R2_BUILD_PROJECTION_MANIFEST.json --receipt p78r1-out/P76R2_SOURCE_PATCH.json
          python3 p77-runtime/apply-p77-deterministic-final-delivery.py --source-root p75-work/source --parent-manifest p75-work/P76R2_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P77_BUILD_PROJECTION_MANIFEST.json --receipt p78r1-out/P77_SOURCE_PATCH.json
          python3 - <<'PY'
          import json
          p=json.load(open('p75-work/P77_BUILD_PROJECTION_MANIFEST.json',encoding='utf-8'))['projection']
          expected=(1601,21037233,'40b966b3bc2497a1d1d18b967ec867f182f76030af23d15329e42c6057268d59','354ec7229eb61dd55cccdae90c4a94576967f1c3beb9bad67909d847ccf1e032')
          got=(p['fileCount'],p['payloadBytes'],p['pathSetSha256'],p['sourceContentAggregateSha256'])
          if got!=expected: raise SystemExit(f'P77 identity mismatch:{got}')
          print('PASS P77 exact source parent',got)
          PY

      - name: Apply P78R1 product repair
        run: |
          set -euo pipefail
          python3 p78-runtime/apply-p78r1-audit-authority-customer-path.py \
            --source-root p75-work/source \
            --parent-manifest p75-work/P77_BUILD_PROJECTION_MANIFEST.json \
            --manifest p75-work/P78R1_BUILD_PROJECTION_MANIFEST.json \
            --receipt p78r1-out/P78R1_SOURCE_PATCH.json

      - name: Run P78R1 static controls
        run: |
          set -euo pipefail
          python3 p78-runtime/test-p78r1-static.py \
            --source-root p75-work/source \
            --manifest p75-work/P78R1_BUILD_PROJECTION_MANIFEST.json \
            --receipt p78r1-out/P78R1_STATIC_CONTROL.json

      - name: Publish P78R1 exact source candidate receipts
        run: |
          set -euo pipefail
          mkdir -p p78r1-results
          cp p75-work/P78R1_BUILD_PROJECTION_MANIFEST.json p78r1-results/
          cp p78r1-out/P78R1_SOURCE_PATCH.json p78r1-results/
          cp p78r1-out/P78R1_STATIC_CONTROL.json p78r1-results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- p78r1-results
          if ! git diff --cached --quiet; then
            git commit -m 'P78R1 publish exact source repair receipts'
            git push origin HEAD:velmere-p78-real-audit-customer-final-20260818
          fi

      - name: Upload P78R1 source proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p78r1-source-proof
          path: p78r1-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
