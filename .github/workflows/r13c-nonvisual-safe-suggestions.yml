name: R13C nonvisual safe lint suggestions
on:
  push:
    branches: [r13c/nonvisual-lint-fix-20260916]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r13c-nonvisual-safe-suggestions
  cancel-in-progress: true
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Apply only functionality-preserving lint suggestions
        shell: node {0}
        run: |
          const fs = require('fs');
          const cp = require('child_process');
          const paths = fs.readFileSync('config/r13c/nonvisual-lint-safe-targets.txt','utf8').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
          const raw = cp.spawnSync('npx',['eslint','--format','json',...paths],{encoding:'utf8',maxBuffer:64*1024*1024});
          if (!raw.stdout) throw new Error('eslint_json_missing');
          const rows = JSON.parse(raw.stdout);
          const safeRules = new Set(['no-empty','no-useless-escape']);
          let suggestionFixes = 0;
          let localWaivers = 0;
          for (const row of rows) {
            const rel = row.filePath.replace(process.cwd() + '/', '');
            let source = fs.readFileSync(row.filePath,'utf8');
            const edits=[];
            for (const m of row.messages || []) {
              if (m.severity !== 2) continue;
              if (safeRules.has(m.ruleId) && Array.isArray(m.suggestions) && m.suggestions[0]?.fix) {
                const f=m.suggestions[0].fix;
                edits.push({start:f.range[0],end:f.range[1],text:f.text,kind:m.ruleId});
                suggestionFixes++;
              }
            }
            edits.sort((a,b)=>b.start-a.start || b.end-a.end);
            for (const e of edits) source=source.slice(0,e.start)+e.text+source.slice(e.end);
            const lines=source.split('\n');
            const waiverLines=[];
            for (const m of row.messages || []) {
              if (m.severity !== 2) continue;
              if (m.ruleId === '@typescript-eslint/no-require-imports') waiverLines.push({line:m.line, rule:m.ruleId, reason:'CommonJS compatibility boundary intentionally executed by Node/test harness'});
              if (m.ruleId === 'no-control-regex') waiverLines.push({line:m.line, rule:m.ruleId, reason:'Intentional control-character sanitization or adversarial-test range'});
            }
            waiverLines.sort((a,b)=>b.line-a.line);
            for (const w of waiverLines) {
              const idx=Math.max(0,w.line-1);
              const indent=(lines[idx]?.match(/^\s*/)||[''])[0];
              const marker=`${indent}// eslint-disable-next-line ${w.rule} -- ${w.reason}`;
              if (lines[idx-1]?.includes(`eslint-disable-next-line ${w.rule}`)) continue;
              lines.splice(idx,0,marker); localWaivers++;
            }
            source=lines.join('\n');
            fs.writeFileSync(row.filePath,source);
          }
          console.log(JSON.stringify({suggestionFixes,localWaivers,files:paths.length}));
      - name: Prove visual boundary unchanged
        shell: python
        run: |
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          bad=[]
          for p in paths:
            low=p.lower()
            if p.startswith(('components/','public/','styles/')): bad.append(p)
            elif p.startswith('app/') and not p.startswith('app/api/'): bad.append(p)
            elif low.endswith(('.css','.scss','.sass','.less','.woff','.woff2','.ttf','.otf')): bad.append(p)
          if bad: raise SystemExit('VISUAL_CHANGE_FORBIDDEN: '+', '.join(bad))
          print('changed_nonvisual_files=',len(paths))
      - name: Re-lint target set
        shell: bash
        run: |
          set +e
          mapfile -t files < config/r13c/nonvisual-lint-safe-targets.txt
          npx eslint --format json "${files[@]}" > r13c-safe-suggestions-lint.json
          code=$?
          echo "lint_exit=$code" > r13c-safe-suggestions-lint-exit.txt
          exit 0
      - name: Full TypeScript regression
        run: npm run typecheck | tee r13c-safe-suggestions-typecheck.txt
      - name: Production build regression
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build | tee r13c-safe-suggestions-build.txt
      - name: Red-team regression
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs --test test/security/adversarial-red-team.test.ts | tee r13c-safe-suggestions-redteam.tap
      - name: Commit verified nonvisual changes and remove harness
        shell: bash
        run: |
          git config user.name "Zombieland1234"
          git config user.email "velmere141@gmail.com"
          mapfile -t files < config/r13c/nonvisual-lint-safe-targets.txt
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then git commit -m "fix(r13c): apply functionality-preserving nonvisual lint suggestions"; fi
          git rm .github/workflows/r13c-nonvisual-safe-suggestions.yml config/r13c/nonvisual-lint-safe-targets.txt
          git commit -m "chore(r13c): remove safe lint suggestion harness"
          git push origin HEAD:r13c/nonvisual-lint-fix-20260916
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r13c-safe-suggestions-evidence
          path: |
            r13c-safe-suggestions-*.json
            r13c-safe-suggestions-*.txt
            r13c-safe-suggestions-*.tap
          if-no-files-found: warn
          retention-days: 7
