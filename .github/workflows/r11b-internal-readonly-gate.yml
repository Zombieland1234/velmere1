name: R11B Internal Read-Only Gate

on:
  push:
    branches: [r11b-internal-hardening, r11b-audit-hardening-v6, r11b-integration-v8-clean]
  pull_request:
    branches: [r11b-internal-hardening]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  VELMERE_OFFLINE_TS_FORCE_BUILTIN: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Bind exact runtime
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          mkdir -p /tmp/r11b
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: PASS15 exact route AST registry candidate (read-only evidence)
        run: |
          node scripts/pass15/build-route-export-ast-registry.mjs --output /tmp/r11b/ROUTE_AST_REGISTRY_CANDIDATE.json
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const tracked = JSON.parse(fs.readFileSync('config/pass15/route-export-ast-registry.json', 'utf8'));
          const candidate = JSON.parse(fs.readFileSync('/tmp/r11b/ROUTE_AST_REGISTRY_CANDIDATE.json', 'utf8'));
          const trackedByPath = new Map((tracked.rows || []).map((row) => [row.path, row]));
          const candidateByPath = new Map((candidate.rows || []).map((row) => [row.path, row]));
          const allPaths = [...new Set([...trackedByPath.keys(), ...candidateByPath.keys()])].sort();
          const changed = [];
          const added = [];
          const removed = [];
          for (const p of allPaths) {
            const oldRow = trackedByPath.get(p);
            const newRow = candidateByPath.get(p);
            if (!oldRow) { added.push(p); continue; }
            if (!newRow) { removed.push(p); continue; }
            const relevant = (row) => JSON.stringify({
              byteLength: row.byteLength,
              sha256: row.sha256,
              mode: row.mode,
              methods: row.methods,
              exportKinds: row.exportKinds,
              duplicateMethods: row.duplicateMethods,
              routeConfig: row.routeConfig,
              parseDiagnostics: row.parseDiagnostics,
              namedReExportCount: row.namedReExportCount,
              exportStarCount: row.exportStarCount,
              astEligible: row.astEligible,
            });
            if (relevant(oldRow) !== relevant(newRow)) {
              changed.push({
                path: p,
                oldSha256: oldRow.sha256,
                newSha256: newRow.sha256,
                oldByteLength: oldRow.byteLength,
                newByteLength: newRow.byteLength,
                oldMethods: oldRow.methods,
                newMethods: newRow.methods,
                oldRouteConfig: oldRow.routeConfig,
                newRouteConfig: newRow.routeConfig,
              });
            }
          }
          const summary = {
            schemaVersion: 'velmere.r11b.route-ast-registry-diff.v1',
            sourceSha: process.env.GITHUB_SHA || null,
            trackedFileCount: tracked.fileCount,
            candidateFileCount: candidate.fileCount,
            denominatorConserved: candidate.fileCount === (candidate.rows || []).length,
            trackedRegistryDigestSha256: tracked.registryDigestSha256 || null,
            candidateRegistryDigestSha256: candidate.registryDigestSha256 || null,
            pathSetChanged: tracked.pathSetSha256 !== candidate.pathSetSha256,
            aggregateChanged: tracked.aggregateSha256 !== candidate.aggregateSha256,
            added,
            removed,
            changed,
            changedCount: changed.length,
            addedCount: added.length,
            removedCount: removed.length,
            candidateFileSha256: crypto.createHash('sha256').update(fs.readFileSync('/tmp/r11b/ROUTE_AST_REGISTRY_CANDIDATE.json')).digest('hex'),
          };
          fs.writeFileSync('/tmp/r11b/ROUTE_AST_REGISTRY_DIFF.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          if (!summary.denominatorConserved) process.exit(1);
          NODE
      - name: PASS15 route dispatch candidate (read-only evidence)
        run: |
          node scripts/pass15/rebaseline-route-dispatch-manifest.mjs \
            --candidate-output /tmp/r11b/ROUTE_DISPATCH_MANIFEST_CANDIDATE.json \
            > /tmp/r11b/ROUTE_DISPATCH_REBASELINE.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/r11b/ROUTE_DISPATCH_REBASELINE.json','utf8'));
          if (r.routeDenominator !== 160) process.exit(1);
          if (r.exactAstCreditEligible !== true) process.exit(1);
          if (!fs.existsSync('/tmp/r11b/ROUTE_DISPATCH_MANIFEST_CANDIDATE.json')) process.exit(1);
          console.log(JSON.stringify({routeDenominator:r.routeDenominator,changedRoutes:r.changedRoutes,changedFields:r.changedFields,beforeSha256:r.beforeSha256,afterSha256:r.afterSha256,parser:r.parser},null,2));
          NODE
      - name: F10 supply-chain adversarial tests
        run: node scripts/pass4992/test-supply-chain-release.mjs
      - name: F10 exact secret fixture and env boundary
        run: node scripts/r11/verify-secret-fixture-boundary.mjs --output /tmp/r11b/SECRET_FIXTURE_BOUNDARY.json
      - name: F10 targeted secret/redaction tests
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs --test tests/unit/ai-vlm-security.test.ts tests/unit/security-api-error-envelope.test.ts
      - name: F09 workflow semantic adversarial tests
        run: node scripts/r11/test-workflow-semantic-policy.mjs
      - name: F09 active workflow semantic policy
        run: node scripts/r11/verify-workflow-semantic-policy.mjs --output /tmp/r11b/WORKFLOW_SEMANTIC_POLICY.json
      - name: F11 release lint denominator
        run: |
          node scripts/r10/run-release-source-lint.mjs --output /tmp/r11b/RELEASE_LINT.json --summary /tmp/r11b/RELEASE_LINT_SUMMARY.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/r11b/RELEASE_LINT_SUMMARY.json','utf8'));
          if (!r.denominatorConserved || !r.checkedCandidateCountMatched) process.exit(1);
          if (r.eligibleFileCount !== r.checkedFileCount + r.ignoredFileCount) process.exit(1);
          if (r.errors !== 0 || r.fatalErrors !== 0) process.exit(1);
          console.log(JSON.stringify({tracked:r.trackedScopeFileCount,excluded:r.explicitlyExcludedFileCount,eligible:r.eligibleFileCount,checked:r.checkedFileCount,ignored:r.ignoredFileCount,failed:r.failedFileCount,warnings:r.warnings},null,2));
          NODE
      - name: F14 finding-level local benchmark semantics
        run: ./node_modules/.bin/tsx scripts/r11/run-finding-level-local-benchmark.ts --output /tmp/r11b/FINDING_LEVEL_LOCAL_BENCHMARK.json
      - name: F15 local instrument identity denominator (supporting evidence)
        run: ./node_modules/.bin/tsx scripts/r11/verify-real-market-master.ts --output /tmp/r11b/REAL_MARKET_IDENTITY.json
      - name: F17 static payment/browser authority boundary (supporting evidence only)
        run: node scripts/r11/verify-paid-browser-authority.mjs --output /tmp/r11b/PAID_BROWSER_AUTHORITY.json
      - name: Direct TypeScript
        run: npm run typecheck:direct
      - name: Production build
        run: npm run build
      - name: Security regression
        run: npm run security:regression
      - name: Source truth scan
        run: node scripts/r11/verify-truth-scope-v2.mjs --output /tmp/r11b/R11_TRUTH_SCOPE.json
      - name: F21 exact-subject evidence ledger
        run: node scripts/r11/build-evidence-ledger.mjs --evidence-dir /tmp/r11b --output /tmp/r11b/EVIDENCE_LEDGER.json --workflow .github/workflows/r11b-internal-readonly-gate.yml
      - name: F22 evidence ledger independent recomputation
        run: node scripts/r11/verify-evidence-ledger.mjs --evidence-dir /tmp/r11b --ledger /tmp/r11b/EVIDENCE_LEDGER.json --output /tmp/r11b/EVIDENCE_LEDGER_VERIFICATION.json --workflow .github/workflows/r11b-internal-readonly-gate.yml
      - name: No write-capable R11B workers remain
        run: |
          if grep -R -n -E 'contents:[[:space:]]*write' .github/workflows/r11b-*.yml; then
            echo 'write-capable R11B workflow remains active' >&2
            exit 1
          fi
      - name: Dirty source gate
        run: |
          # Reset only known generated files. Any other source mutation remains blocking.
          git checkout -- artifacts/pass4992/PASS4992_SUPPLY_CHAIN_ADVERSARIAL_TEST.json || true
          git checkout -- next-env.d.ts || true
          git diff --exit-code
      - name: Upload R11B internal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r11b-internal-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: /tmp/r11b
