name: P73R5R2 Diagnostic Pinned Authority

on:
  push:
    branches:
      - velmere-p73-audit-ancient8-ground-truth-20260817
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p73r5r2-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout exact control head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }

      - name: Reconstruct exact P73R5 product bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';git config core.autocrlf false;git config core.eol lf;New-Item -ItemType Directory -Force p73r5r2-out|Out-Null
          function Run([string]$cmd){Invoke-Expression $cmd;if($LASTEXITCODE-ne 0){throw "failed: $cmd"}}
          Run "python p49-build-projection/reconstruct-p49-direct-projection.py --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --runner p49-build-projection/run-p47-product-windows-projection.mjs --parts-root p49-build-projection/parts --work-root p73r5r2-work --output-root p73r5r2-out"
          Run "python p66-runtime/apply-p66-audit-pdf-delta.py --source-root p73r5r2-work/source --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --output-manifest p73r5r2-work/P66.json"
          Run "python p66-runtime/finalize-p66-shield-pro-row-id.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P66.json"
          Run "python p66-runtime/fix-p66-topology-ts-const.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P66.json"
          Run "python p68-runtime/apply-p68-audit-customer-truth.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P66.json --output-manifest p73r5r2-work/P68.json"
          Run "python p69-runtime/apply-p69-ecb-reference-fx.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P68.json --output-manifest p73r5r2-work/P69.json"
          Run "python p69-runtime/fix-p69r2-node24-pinned-egress.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P69.json --output-manifest p73r5r2-work/P69R2.json --receipt p73r5r2-out/P69R2.json"
          Run "python p71-runtime/apply-p71-owner-truth-advanced-automation.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P69R2.json --output-manifest p73r5r2-work/P71.json --receipt p73r5r2-out/P71.json"
          Run "python p71-runtime/apply-p71r1-expanded-advanced-automation.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P71.json --output-manifest p73r5r2-work/P71R1.json --receipt p73r5r2-out/P71R1.json"
          Run "python p71-runtime/apply-p71r2-optional-qa-status.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P71R1.json --output-manifest p73r5r2-work/P71R2.json --receipt p73r5r2-out/P71R2.json"
          Run "python p71-runtime/apply-p71r3-remove-stale-disclosure.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P71R2.json --output-manifest p73r5r2-work/P71R5.json --receipt p73r5r2-out/P71R3.json"
          Run "python p72-runtime/apply-p72-commercial-topology-measurement.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P71R5.json --output-manifest p73r5r2-work/P72.json --receipt p73r5r2-out/P72_SOURCE_PATCH.json"
          Run "python p72-runtime/apply-p72r3-typescript-contract-repair.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P72.json --output-manifest p73r5r2-work/P72R3.json --receipt p73r5r2-out/P72R3_SOURCE_PATCH.json"
          Run "python p73-runtime/apply-p73r4-adjudicated-authority-engine.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P72R3.json --output-manifest p73r5r2-work/P73R4.json --receipt p73r5r2-out/P73R4_SOURCE_PATCH.json"
          Run "python p73-runtime/apply-p73r5-pinned-maintainer-authority.py --source-root p73r5r2-work/source --manifest p73r5r2-work/P73R4.json --output-manifest p73r5r2-work/P73R5.json --receipt p73r5r2-out/P73R5_SOURCE_PATCH.json"
          $m=Get-Content p73r5r2-work/P73R5.json -Raw|ConvertFrom-Json
          if($m.projection.fileCount-ne1598-or$m.projection.payloadBytes-ne21014969-or$m.projection.pathSetSha256-ne'9cb47f15e73ec678e32fe214b8e2947a4bfbaa624d8fb5101650296700d3dd25'-or$m.projection.sourceContentAggregateSha256-ne'1c0f505f6d580ef49cc3b6fdb1e52518b341e4da96a3f2729b5b7d05cd9a4401'){throw 'P73R5 exact aggregate mismatch'}
          Copy-Item p73r5r2-work/P73R5.json p73r5r2-out/P73R5_BUILD_PROJECTION_MANIFEST.json

      - name: Install dependency closure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Push-Location p73r5r2-work/source
          try { npm ci --ignore-scripts --include=dev --audit=false --fund=false;if($LASTEXITCODE-ne0){throw 'npm ci failed'} } finally { Pop-Location }

      - name: Build diagnostic harness with no product changes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import { buildAuditAdjudicatedAuthorityEvidence, verifyAuditAdjudicatedAuthorityEvidence } from '../p73r5r2-work/source/lib/security/audit-adjudicated-authority-evidence';
          async function main(){
            const out=process.env.P73_RESULT_DIR || path.resolve('p73r5r2-out');
            fs.mkdirSync(out,{recursive:true});
            let evidence:any=null; let thrown:any=null;
            try {
              evidence=await buildAuditAdjudicatedAuthorityEvidence({chain:'ancient8',contractAddress:'0xca11bde05977b3631167028862be2a173976ca11'});
            } catch(error:any) {
              thrown={name:String(error?.name??'Error'),message:String(error?.message??error),stack:String(error?.stack??'').split('\n').slice(0,8)};
            }
            const diagnostic={schemaVersion:'velmere.p73r5r2.authority-diagnostic.v1',status:'DIAGNOSTIC_ONLY_ZERO_CREDIT',productAggregateSha256:'1c0f505f6d580ef49cc3b6fdb1e52518b341e4da96a3f2729b5b7d05cd9a4401',evidence,verify:evidence?verifyAuditAdjudicatedAuthorityEvidence(evidence):false,thrown,customerFinalOutputCredit:0,auditFinalPdfCredit:0,rightsCredit:0,paidValueCredit:0,saleCredit:0,live:false};
            fs.writeFileSync(path.join(out,'P73R5R2_AUTHORITY_DIAGNOSTIC.json'),JSON.stringify(diagnostic,null,2)+'\n');
            console.log(JSON.stringify(diagnostic,null,2));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content -LiteralPath p73-runtime/p73r5r2-authority-diagnostic.generated.ts -Encoding utf8 -NoNewline

      - name: Execute diagnostic authority acquisition
        shell: pwsh
        env:
          P73_RESULT_DIR: ${{ github.workspace }}\p73r5r2-out
          TSX_TSCONFIG_PATH: ${{ github.workspace }}\p73r5r2-work\source\tsconfig.json
        run: |
          $ErrorActionPreference='Stop';Push-Location p73r5r2-work/source
          try { node ./node_modules/tsx/dist/cli.mjs ../../p73-runtime/p73r5r2-authority-diagnostic.generated.ts | Tee-Object ../..\p73r5r2-out\P73R5R2_DIAGNOSTIC.log;if($LASTEXITCODE-ne0){throw 'diagnostic execution failed'} } finally { Pop-Location }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p73r5r2-authority-diagnostic
          path: p73r5r2-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
