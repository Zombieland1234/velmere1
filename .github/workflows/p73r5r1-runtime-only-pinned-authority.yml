name: P73R6 Exact Windows Row-Bound Authority Parser

on:
  push:
    branches:
      - velmere-p73-audit-ancient8-ground-truth-20260817
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p73r6-exact-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p73r6-current-product:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout exact P73R6 control head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        id: npmcli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }
          $npmRoot=(npm root --global).Trim();$npmCli=(Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Reconstruct exact P72R3 then apply P73R4 P73R5 P73R6
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';git config core.autocrlf false;git config core.eol lf;New-Item -ItemType Directory -Force p73r6-out|Out-Null
          function Run([string]$cmd){Invoke-Expression $cmd;if($LASTEXITCODE-ne 0){throw "failed: $cmd"}}
          Run "python p49-build-projection/reconstruct-p49-direct-projection.py --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --runner p49-build-projection/run-p47-product-windows-projection.mjs --parts-root p49-build-projection/parts --work-root p73r6-work --output-root p73r6-out"
          Run "python p66-runtime/apply-p66-audit-pdf-delta.py --source-root p73r6-work/source --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --output-manifest p73r6-work/P66.json"
          Run "python p66-runtime/finalize-p66-shield-pro-row-id.py --source-root p73r6-work/source --manifest p73r6-work/P66.json"
          Run "python p66-runtime/fix-p66-topology-ts-const.py --source-root p73r6-work/source --manifest p73r6-work/P66.json"
          Run "python p68-runtime/apply-p68-audit-customer-truth.py --source-root p73r6-work/source --manifest p73r6-work/P66.json --output-manifest p73r6-work/P68.json"
          Run "python p69-runtime/apply-p69-ecb-reference-fx.py --source-root p73r6-work/source --manifest p73r6-work/P68.json --output-manifest p73r6-work/P69.json"
          Run "python p69-runtime/fix-p69r2-node24-pinned-egress.py --source-root p73r6-work/source --manifest p73r6-work/P69.json --output-manifest p73r6-work/P69R2.json --receipt p73r6-out/P69R2.json"
          Run "python p71-runtime/apply-p71-owner-truth-advanced-automation.py --source-root p73r6-work/source --manifest p73r6-work/P69R2.json --output-manifest p73r6-work/P71.json --receipt p73r6-out/P71.json"
          Run "python p71-runtime/apply-p71r1-expanded-advanced-automation.py --source-root p73r6-work/source --manifest p73r6-work/P71.json --output-manifest p73r6-work/P71R1.json --receipt p73r6-out/P71R1.json"
          Run "python p71-runtime/apply-p71r2-optional-qa-status.py --source-root p73r6-work/source --manifest p73r6-work/P71R1.json --output-manifest p73r6-work/P71R2.json --receipt p73r6-out/P71R2.json"
          Run "python p71-runtime/apply-p71r3-remove-stale-disclosure.py --source-root p73r6-work/source --manifest p73r6-work/P71R2.json --output-manifest p73r6-work/P71R5.json --receipt p73r6-out/P71R3.json"
          Run "python p72-runtime/apply-p72-commercial-topology-measurement.py --source-root p73r6-work/source --manifest p73r6-work/P71R5.json --output-manifest p73r6-work/P72.json --receipt p73r6-out/P72_SOURCE_PATCH.json"
          Run "python p72-runtime/apply-p72r3-typescript-contract-repair.py --source-root p73r6-work/source --manifest p73r6-work/P72.json --output-manifest p73r6-work/P72R3.json --receipt p73r6-out/P72R3_SOURCE_PATCH.json"
          $p=Get-Content p73r6-work/P72R3.json -Raw|ConvertFrom-Json
          if($p.projection.fileCount-ne1597-or$p.projection.payloadBytes-ne20988569-or$p.projection.sourceContentAggregateSha256-ne'4db46e951d3f7f2cc04f61418279b9347bc21b4300b7152aa3e2c77395216252'){throw 'P72R3 parent mismatch'}
          Run "python p73-runtime/apply-p73r4-adjudicated-authority-engine.py --source-root p73r6-work/source --manifest p73r6-work/P72R3.json --output-manifest p73r6-work/P73R4.json --receipt p73r6-out/P73R4_SOURCE_PATCH.json"
          Run "python p73-runtime/apply-p73r5-pinned-maintainer-authority.py --source-root p73r6-work/source --manifest p73r6-work/P73R4.json --output-manifest p73r6-work/P73R5.json --receipt p73r6-out/P73R5_SOURCE_PATCH.json"
          $r5=Get-Content p73r6-work/P73R5.json -Raw|ConvertFrom-Json
          if($r5.projection.fileCount-ne1598-or$r5.projection.payloadBytes-ne21014969-or$r5.projection.pathSetSha256-ne'9cb47f15e73ec678e32fe214b8e2947a4bfbaa624d8fb5101650296700d3dd25'-or$r5.projection.sourceContentAggregateSha256-ne'1c0f505f6d580ef49cc3b6fdb1e52518b341e4da96a3f2729b5b7d05cd9a4401'){throw 'P73R5 parent mismatch'}
          Run "python p73-runtime/apply-p73r6-row-bound-chain-docs-parser.py --source-root p73r6-work/source --manifest p73r6-work/P73R5.json --output-manifest p73r6-work/P73R6_BUILD_PROJECTION_MANIFEST.json --receipt p73r6-out/P73R6_SOURCE_PATCH.json"
          Copy-Item p73r6-work/P73R6_BUILD_PROJECTION_MANIFEST.json p73r6-out/

      - name: Static row-bound and fail-closed invariants
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$a=Get-Content 'p73r6-work/source/lib/security/audit-adjudicated-authority-evidence.ts' -Raw
          if($a-match'addressesNearProject'){throw 'stale proximity parser remains'}
          if($a-notmatch'addressesBoundToProjectLabel'){throw 'row-bound parser missing'}
          if($a-notmatch'projectBoundAddresses'){throw 'row-bound call missing'}
          if($a-notmatch'raw\.githubusercontent\.com'){throw 'pinned maintainer host missing'}
          if($a-notmatch'b667d67ecfa5361a81e8f110234ce242613b0012'){throw 'pinned maintainer commit missing'}
          if($a-notmatch'current_runtime_bytecode_quorum_unavailable'){throw 'runtime-bytecode blocker missing'}
          if($a-notmatch'new Set\(value\.receipts\.map\(\(item\) => item\.upstreamRoot\)\)\.size < 2'){throw 'independent authority root quorum missing'}

      - name: Exact Windows TypeScript ESLint Webpack Turbopack
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.npmcli.outputs.npm_cli }}
        run: |
          $ErrorActionPreference='Stop';function Run([string]$cmd){Invoke-Expression $cmd;if($LASTEXITCODE-ne0){throw "failed: $cmd"}}
          Run "python p60-runtime/build-p60-reconciled-runner.py --input p49-build-projection/run-p47-product-windows-projection.mjs --output p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P60.json"
          Run "python p66-runtime/patch-p66-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P66.json"
          Run "python p68-runtime/patch-p68-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P68.json"
          Run "python p69-runtime/patch-p69-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P69.json"
          Run "python p69-runtime/patch-p69r2-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P69R2.json"
          Run "python p71-runtime/patch-p71-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P71.json"
          Run "python p71-runtime/patch-p71r1-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P71R1.json"
          Run "python p71-runtime/patch-p71r3-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P71R3.json"
          Run "python p72-runtime/patch-p72-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P72.json"
          Run "python p72-runtime/patch-p72r3-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P72R3.json"
          Run "python p73-runtime/patch-p73r4-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --receipt p73r6-out/RUNNER_P73R4.json"
          Run "python p73-runtime/patch-p73r6-reconciled-runner.py --runner p73r6-work/run-p73r6.mjs --manifest p73r6-work/P73R6_BUILD_PROJECTION_MANIFEST.json --receipt p73r6-out/RUNNER_P73R6.json"
          Run "node --check p73r6-work/run-p73r6.mjs"
          Run "node p73r6-work/run-p73r6.mjs --source-root p73r6-work/source --manifest p73r6-work/P73R6_BUILD_PROJECTION_MANIFEST.json --output-dir p73r6-out"

      - name: Build control-only full integration harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { buildAuditAdjudicatedAuthorityEvidence, verifyAuditAdjudicatedAuthorityEvidence } from '../p73r6-work/source/lib/security/audit-adjudicated-authority-evidence';
          import { buildPass2574AuditClaimLedgerReport } from '../p73r6-work/source/lib/security/audit-claim-ledger';
          import { buildPass2578AuditReportAssemblerReport } from '../p73r6-work/source/lib/security/audit-report-assembler';
          import { evaluateAuditPaidEvidenceReadiness } from '../p73r6-work/source/lib/security/audit-paid-evidence-readiness';
          import { getAuditTierContract } from '../p73r6-work/source/lib/security/audit-tier-contract';
          const OUT=process.env.P73_RESULT_DIR || path.resolve('p73r6-out'); const ROOT=process.env.P73_SOURCE_ROOT || path.resolve('p73r6-work/source'); fs.mkdirSync(OUT,{recursive:true});
          const checks:any[]=[];function check(id:string,v:any,d?:any){assert.ok(v,id);checks.push({id,passed:true,...(d===undefined?{}:{detail:d})});}
          async function main(){
            const canonical='0xca11bde05977b3631167028862be2a173976ca11'; const expectedOfficial='0xb76d6e8c82d06fd262ef3799db73d5a724108d4e';
            const evidence=await buildAuditAdjudicatedAuthorityEvidence({chain:'ancient8',contractAddress:canonical});
            check('authority:confirmed',evidence.state==='confirmed',evidence);
            check('authority:self-verifies',verifyAuditAdjudicatedAuthorityEvidence(evidence));
            check('authority:chain-id',evidence.target.chainId==='888888888',evidence.target);
            check('authority:official-multicall3-row-bound',evidence.documentedAlternateAddress===expectedOfficial,evidence.documentedAlternateAddress);
            check('authority:not-neighbor-contract',evidence.documentedAlternateAddress!=='0x4200000000000000000000000000000000000007');
            check('authority:two-independent-roots',evidence.receipts.length===2 && new Set(evidence.receipts.map(x=>x.upstreamRoot)).size===2,evidence.receipts);
            const docs=evidence.receipts.find(x=>x.authorityClass==='chain_official_docs'); const maint=evidence.receipts.find(x=>x.authorityClass==='project_maintainer');
            check('authority:docs-address-assertion',docs?.assertions.includes(`documented_address:${expectedOfficial}`),docs);
            check('authority:pinned-maintainer-commit',maint?.assertions.includes('source_commit:b667d67ecfa5361a81e8f110234ce242613b0012'),maint);
            check('authority:risk-floor-90',evidence.riskFloor===90 && evidence.severity==='critical',evidence);
            check('authority:runtime-explicitly-unverified',evidence.blockers.includes('current_runtime_bytecode_quorum_unavailable'),evidence.blockers);
            check('authority:tamper-fails',verifyAuditAdjudicatedAuthorityEvidence({...evidence,riskFloor:10})===false);
            const nonApplicable=await buildAuditAdjudicatedAuthorityEvidence({chain:'ethereum',contractAddress:canonical});check('authority:unsupported-chain-fails-closed',nonApplicable.state==='not_applicable'&&nonApplicable.riskFloor===null,nonApplicable);
            const claimLedger=buildPass2574AuditClaimLedgerReport({locale:'en',chain:'ancient8',contractAddress:canonical,reviewLevel:'basic_review',authorityEvidence:evidence});
            const adverse=claimLedger.claims.filter(x=>x.adverseKind==='deployment_identity');check('claim:one-confirmed-adverse',adverse.length===1&&adverse[0]?.grade==='confirmed'&&adverse[0]?.canShowAsFact===true,adverse);check('claim:risk-floor-bound',adverse[0]?.adverseRiskFloor===90,adverse[0]);check('claim:evidence-refs-two',adverse[0]?.evidenceRefs?.length===2,adverse[0]);
            const report=buildPass2578AuditReportAssemblerReport({locale:'en',chain:'ancient8',contractAddress:canonical,reviewLevel:'basic_review',claimLedger});
            check('report:risk-score-90',report.finalVerdict.riskScore===90,report.finalVerdict);check('report:critical-deployment-finding',report.topFindings[0]?.severity==='critical'&&report.topFindings[0]?.title.includes('Deployment identity mismatch'),report.topFindings[0]);check('report:no-exploitability-overclaim',!JSON.stringify(report).toLowerCase().includes('exploitable vulnerability'));
            const basic=evaluateAuditPaidEvidenceReadiness({lanes:[],tier:'basic',tierContract:getAuditTierContract('basic'),evidenceRows:Math.max(2,report.summary.totalEvidence),authorityEvidence:evidence});
            const pro=evaluateAuditPaidEvidenceReadiness({lanes:[],tier:'pro',tierContract:getAuditTierContract('pro'),evidenceRows:Math.max(6,report.summary.totalEvidence),authorityEvidence:evidence});
            const advanced=evaluateAuditPaidEvidenceReadiness({lanes:[],tier:'advanced',tierContract:getAuditTierContract('advanced'),evidenceRows:Math.max(10,report.summary.totalEvidence),authorityEvidence:evidence});
            check('readiness:basic-authority-supplement',basic.met===true&&basic.verifiedAuthorityReceipts===2,basic);check('readiness:pro-still-blocked',pro.met===false&&pro.verifiedAuthorityReceipts===0,pro);check('readiness:advanced-still-blocked',advanced.met===false&&advanced.verifiedAuthorityReceipts===0,advanced);
            const provider=fs.readFileSync(path.join(ROOT,'lib/security/audit-provider-runtime-client.ts'),'utf8');check('chain-map:ancient8',provider.includes('ancient8: "888888888"'));
            const route=fs.readFileSync(path.join(ROOT,'lib/server/security-route-modules/audit-report-assembler.ts'),'utf8');check('route:source-url-binding',route.includes('searchParams.get("docsUrl")')&&route.includes('searchParams.get("githubUrl")'));check('route:authority-builder',route.includes('buildAuditAdjudicatedAuthorityEvidence'));
            const result={schemaVersion:'velmere.p73r6.full-authority-integration.v1',status:'PASS',checkCount:checks.length,checks,evidenceDigest:evidence.evidenceDigest,documentedAlternateAddress:evidence.documentedAlternateAddress,reportRiskScore:report.finalVerdict.riskScore,basicReadiness:basic,proReadiness:pro,advancedReadiness:advanced};fs.writeFileSync(path.join(OUT,'P73R6_FULL_AUTHORITY_INTEGRATION_TEST.json'),JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result,null,2));
          } main().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content p73-runtime/test-p73r6-full-authority.generated.ts -Encoding utf8 -NoNewline

      - name: Execute live full authority integration
        shell: pwsh
        env:
          P73_RESULT_DIR: ${{ github.workspace }}\p73r6-out
          P73_SOURCE_ROOT: ${{ github.workspace }}\p73r6-work\source
          TSX_TSCONFIG_PATH: ${{ github.workspace }}\p73r6-work\source\tsconfig.json
        run: |
          $ErrorActionPreference='Stop';Push-Location p73r6-work/source
          try { node ./node_modules/tsx/dist/cli.mjs ../../p73-runtime/test-p73r6-full-authority.generated.ts | Tee-Object ../..\p73r6-out\P73R6_INTEGRATION.log;if($LASTEXITCODE-ne0){throw 'P73R6 integration failed'} } finally { Pop-Location }

      - name: Capture zero-fake-credit boundary
        if: always()
        shell: pwsh
        run: |
          $eng='NOT_EXECUTED_OR_FAILED';$runtime='NOT_EXECUTED_OR_FAILED';$ground=0;$m=$null
          if(Test-Path 'p73r6-out/P47_EXACT_WINDOWS_BUILD_RELEVANT_PROJECTION_RECEIPT.json'){$x=Get-Content 'p73r6-out/P47_EXACT_WINDOWS_BUILD_RELEVANT_PROJECTION_RECEIPT.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$eng='PASS'}}
          if(Test-Path 'p73r6-out/P73R6_FULL_AUTHORITY_INTEGRATION_TEST.json'){$x=Get-Content 'p73r6-out/P73R6_FULL_AUTHORITY_INTEGRATION_TEST.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$runtime='PASS';$ground=1}}
          if(Test-Path 'p73r6-work/P73R6_BUILD_PROJECTION_MANIFEST.json'){$m=Get-Content 'p73r6-work/P73R6_BUILD_PROJECTION_MANIFEST.json' -Raw|ConvertFrom-Json}
          [ordered]@{schemaVersion='velmere.p73r6.github-boundary.v1';runId='${{ github.run_id }}';sha='${{ github.sha }}';projectionFileCount=if($m){$m.projection.fileCount}else{0};projectionPayloadBytes=if($m){$m.projection.payloadBytes}else{0};projectionPathSetSha256=if($m){$m.projection.pathSetSha256}else{$null};projectionAggregateSha256=if($m){$m.projection.sourceContentAggregateSha256}else{$null};engineering=$eng;authorityIntegration=$runtime;deploymentGroundTruthCases=$ground;currentRuntimeBytecodeCases=0;vulnerabilityGroundTruthCases=0;customerFinal='0/20';auditFinalPdf='0/3';rights='2/203';paidValue='0/10';sale='0/20';live=$false;worldClassProven=$false;truthBoundary='One deployment-identity authority case is credited only if both exact engineering and the live full integration receipt pass. Current runtime bytecode remains unverified, vulnerability/exploitability ground truth remains zero, and no customer FINAL/PDF/rights/value/sale/LIVE numerator is promoted.'}|ConvertTo-Json -Depth 8|Set-Content p73r6-out/P73R6_GITHUB_BOUNDARY.json -Encoding utf8

      - name: Upload P73R6 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p73r6-row-bound-authority-exact-windows
          path: p73r6-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
