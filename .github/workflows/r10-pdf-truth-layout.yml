name: R10 PDF Truth Layout

on:
  push:
    branches:
      - r10-candidate-truth-build
    paths:
      - scripts/r10/patch-pdf-truth-layout.mjs
      - scripts/r10/test-pdf-truth-layout.ts
      - .github/workflows/r10-pdf-truth-layout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r10-pdf-truth-layout-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  VELMERE_OFFLINE_TS_FORCE_BUILTIN: "1"

jobs:
  patch-and-test:
    name: Patch PDF safe area and integrity semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Verify exact bundled toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Apply exact PDF source patch
        run: node scripts/r10/patch-pdf-truth-layout.mjs --write

      - name: Run PDF geometry and truth regression
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/r10/test-pdf-truth-layout.ts

      - name: Re-test local integrity and candidate truth
        run: |
          node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/r10/test-local-integrity-attestation.ts
          node scripts/r10/test-release-truth-gate.mjs
          node scripts/r10/verify-release-truth.mjs --write --output artifacts/r10/R10_RELEASE_TRUTH_AFTER_PDF_PATCH.json

      - name: Require zero scanner P0 after PDF patch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('artifacts/r10/R10_RELEASE_TRUTH_AFTER_PDF_PATCH.json', 'utf8'));
          const p0 = receipt.counts?.p0 ?? 999;
          if (p0 !== 0 || !String(receipt.status ?? '').startsWith('PASS')) process.exit(1);
          console.log(`R10 PDF patch preserves truth gate: ${receipt.status}`);
          NODE

      - name: Commit PDF source patch and receipts with ephemeral auth
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "velmere-r10-pdf-truth"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/security/pro-audit-pdf/customer-safe-renderer.ts lib/security/pdf-institutional-seal.ts artifacts/r10/R10_PDF_TRUTH_LAYOUT_PATCH.json artifacts/r10/R10_RELEASE_TRUTH_AFTER_PDF_PATCH.json
          if git diff --cached --quiet; then
            echo "No PDF source changes to commit."
            exit 0
          fi
          git commit -m "fix(r10): enforce PDF safe area and integrity-only semantics [r10-pdf]"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:r10-candidate-truth-build

      - name: Upload PDF truth receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r10-pdf-truth-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/r10/R10_PDF_TRUTH_LAYOUT_PATCH.json
            artifacts/r10/R10_RELEASE_TRUTH_AFTER_PDF_PATCH.json
