name: P77 Exact Windows Deterministic Final Delivery

on:
  push:
    branches:
      - velmere-p77-deterministic-final-delivery-20260818
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p77-deterministic-final-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p77-current-product:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout exact P77 control head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Expand pinned P75 parent bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'p75-runtime/bundle.part*' | Sort-Object Name
          if($parts.Count-ne7){throw "P75 bundle part count mismatch: $($parts.Count)"}
          $b64=''; foreach($part in $parts){$b64 += (Get-Content $part.FullName -Raw).Trim()}
          [IO.File]::WriteAllBytes('p75-runtime/p75-ci-bundle.zip',[Convert]::FromBase64String($b64))
          $sha=(Get-FileHash 'p75-runtime/p75-ci-bundle.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha-ne'467026e4c5751d42c6fb06fb4425d640f911a3990fc3f05fd2de99c03e68ffad'){throw "P75 CI bundle SHA mismatch: $sha"}
          Expand-Archive -LiteralPath 'p75-runtime/p75-ci-bundle.zip' -DestinationPath 'p75-runtime' -Force

      - name: Expand pinned P77 support bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python p77-runtime/reconstruct-p77-support.py --parts-dir p77-runtime --output-dir p77-runtime

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        id: npmcli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }
          $npmRoot=(npm root --global).Trim(); $npmCli=(Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Exact P77 source engineering and regressions
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.npmcli.outputs.npm_cli }}
        run: |
          $ErrorActionPreference='Stop'
          ./p77-runtime/run-p77-exact-windows.ps1

      - name: Capture P77 Windows boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path p77-out | Out-Null
          $eng='FAIL';$patch='FAIL';$static='FAIL';$runtime='FAIL';$p73='FAIL';$p75='FAIL';$p76='FAIL';$p76r2='FAIL';$m=$null
          if(Test-Path 'p77-out/P47_EXACT_WINDOWS_BUILD_RELEVANT_PROJECTION_RECEIPT.json'){$x=Get-Content 'p77-out/P47_EXACT_WINDOWS_BUILD_RELEVANT_PROJECTION_RECEIPT.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$eng='PASS'}}
          if(Test-Path 'p77-out/P77_SOURCE_PATCH.json'){$x=Get-Content 'p77-out/P77_SOURCE_PATCH.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$patch='PASS'}}
          if(Test-Path 'p77-out/P77_STATIC_CONTROL.json'){$x=Get-Content 'p77-out/P77_STATIC_CONTROL.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$static='PASS'}}
          if(Test-Path 'p77-out/P77_DETERMINISTIC_DELIVERY_RUNTIME.json'){$x=Get-Content 'p77-out/P77_DETERMINISTIC_DELIVERY_RUNTIME.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$runtime='PASS'}}
          if(Test-Path 'p77-out/P73R7_FULL_AUTHORITY_INTEGRATION_TEST.json'){$x=Get-Content 'p77-out/P73R7_FULL_AUTHORITY_INTEGRATION_TEST.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$p73='PASS'}}
          if(Test-Path 'p77-out/P75_ADVANCED_MEMORY_RUNTIME.json'){$x=Get-Content 'p77-out/P75_ADVANCED_MEMORY_RUNTIME.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$p75='PASS'}}
          if(Test-Path 'p77-out/P76_RELEASE_ENVELOPE_RUNTIME.json'){$x=Get-Content 'p77-out/P76_RELEASE_ENVELOPE_RUNTIME.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$p76='PASS'}}
          if(Test-Path 'p77-out/P76R2_RELEASE_ENVELOPE_RUNTIME.json'){$x=Get-Content 'p77-out/P76R2_RELEASE_ENVELOPE_RUNTIME.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$p76r2='PASS'}}
          if(Test-Path 'p75-work/P77_BUILD_PROJECTION_MANIFEST.json'){$m=Get-Content 'p75-work/P77_BUILD_PROJECTION_MANIFEST.json' -Raw|ConvertFrom-Json}
          [ordered]@{schemaVersion='velmere.p77.windows-boundary.v1';runId='${{ github.run_id }}';sha='${{ github.sha }}';projection=if($m){$m.projection}else{$null};sourcePatch=$patch;engineering=$eng;staticControl=$static;deterministicDeliveryRuntime=$runtime;p73AuthorityRegression=$p73;p75AutomationRegression=$p75;p76ReleaseRegression=$p76;p76r2HumanGateRegression=$p76r2;customerFinal='0/20';auditFinalPdf='0/3';rights='2/203';paidValue='0/10';sale='0/20';live=$false;truthBoundary='P77 credits only deterministic delivery-authority repair plus exact engineering and regressions. No customer FINAL/PDF/rights/value/sale/LIVE promotion.'}|ConvertTo-Json -Depth 12|Set-Content p77-out/P77_WINDOWS_BOUNDARY.json -Encoding utf8

      - name: Upload P77 Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p77-deterministic-final-delivery-exact-windows
          path: p77-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
