name: R7 Risk Indicator Customer Tile E2E v2

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-risk-indicator-customer-e2e-v2.yml'
      - '.github/workflows/r7-risk-v5-manifest-probe.yml'
      - 'r7-risk-v5/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r7-risk-indicator-customer-e2e-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bind-risk-source-authority:
    name: bind-risk-source-authority
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Bind exact Risk v5 source authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Audience = 'velmere-r7-risk-v5-source-authority'
          $Separator = if ($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')) { '&' } else { '?' }
          $TokenResponse = Invoke-RestMethod -Method Get -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL + $Separator + 'audience=' + [Uri]::EscapeDataString($Audience)) -Headers @{ Authorization = 'Bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN } -TimeoutSec 20
          $Oidc = [string]$TokenResponse.value
          if ($Oidc.Split('.').Count -ne 3) { throw 'risk_source_authority_oidc_missing' }
          Write-Host "::add-mask::$Oidc"
          $Response = Invoke-WebRequest -Method Post -Uri 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-risk-v5-source-authority-binder' -Headers @{ Authorization = 'Bearer ' + $Oidc; Accept = 'application/json' } -ContentType 'application/json' -Body '{"action":"bind"}' -SkipHttpErrorCheck -TimeoutSec 40
          if ([int]$Response.StatusCode -ne 200) { throw "risk_source_authority_http_$([int]$Response.StatusCode):$($Response.Content)" }
          $Body = $Response.Content | ConvertFrom-Json -Depth 20
          if ($Body.ok -ne $true -or $Body.sourceIdentityBound -ne $true -or $Body.githubRunVerifiedSuccess -ne $true) { throw 'risk_source_authority_contract_failed' }
          Write-Host 'Risk v5 exact source authority bound.'
  risk-indicator-customer-e2e:
    name: risk-indicator-customer-e2e
    needs: bind-risk-source-authority
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout exact Risk v5 controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false
      - name: Execute exact-source Risk customer tile E2E
        shell: pwsh
        run: ./r7-risk-v5/run-r7-risk-v5-e2e-final.ps1
      - name: Upload exact Risk customer E2E evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-risk-indicator-customer-e2e-${{ github.sha }}-${{ github.run_id }}
          path: |
            r7-work/artifacts/r7/risk-indicator/R7_RISK_INDICATOR_EXACT_SOURCE_E2E.json
            r7-work/R7_RISK_INDICATOR_NEXT_STDOUT.log
            r7-work/R7_RISK_INDICATOR_NEXT_STDERR.log
            r7-work/R7_EXECUTION_SLICE_MANIFEST.json
            r7-work/R7_EXECUTION_SLICE_MANIFEST.tsv
            r7-work/R7_NPM_CI.log
            r7-risk-v5/R7_RISK_V5_PATCH_RECEIPT.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
  finalize-risk-indicator:
    name: finalize-risk-indicator
    needs: risk-indicator-customer-e2e
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Insert guarded Risk Indicator FINAL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Audience = 'velmere-r7-risk-indicator-finalizer'
          $Separator = if ($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')) { '&' } else { '?' }
          $TokenResponse = Invoke-RestMethod -Method Get -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL + $Separator + 'audience=' + [Uri]::EscapeDataString($Audience)) -Headers @{ Authorization = 'Bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN } -TimeoutSec 20
          $Oidc = [string]$TokenResponse.value
          if ($Oidc.Split('.').Count -ne 3) { throw 'risk_finalizer_oidc_missing' }
          Write-Host "::add-mask::$Oidc"
          $Response = Invoke-WebRequest -Method Post -Uri 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-risk-indicator-finalizer-oidc' -Headers @{ Authorization = 'Bearer ' + $Oidc; Accept = 'application/json' } -ContentType 'application/json' -Body '{"action":"finalize"}' -SkipHttpErrorCheck -TimeoutSec 60
          if ([int]$Response.StatusCode -ne 200) { throw "risk_finalizer_http_$([int]$Response.StatusCode):$($Response.Content)" }
          $Body = $Response.Content | ConvertFrom-Json -Depth 30
          if ($Body.ok -ne $true -or $Body.result.finalStatus -ne 'FINAL') { throw 'risk_finalizer_contract_failed' }
          Write-Host ($Body | ConvertTo-Json -Depth 30)

# 2026-08-29 canonical retrigger: force a fresh source-authority bind and guarded customer finalization.
