name: R10 Exact Runtime Contract Remediation

on:
  push:
    branches:
      - r10-runtime-contract
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r10-runtime-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Apply exact runtime metadata
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          npm pkg set engines.node=24.18.0
          npm pkg set engines.npm=11.16.0
          npm pkg set packageManager=npm@11.16.0
          npm install --package-lock-only --ignore-scripts
      - name: Clean exact-runtime install
        run: npm ci --ignore-scripts
      - name: Verify metadata and repository runtime policy
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.engines?.node!=='24.18.0') throw new Error('node_engine_not_exact');
          if(p.engines?.npm!=='11.16.0') throw new Error('npm_engine_not_exact');
          if(p.packageManager!=='npm@11.16.0') throw new Error('package_manager_not_exact');
          if(fs.readFileSync('.nvmrc','utf8').trim()!=='24.18.0') throw new Error('nvmrc_mismatch');
          if(fs.existsSync('.node-version') && fs.readFileSync('.node-version','utf8').trim()!=='24.18.0') throw new Error('node_version_mismatch');
          NODE
          node scripts/verify-runtime-contract.mjs
      - name: Dependency vulnerability gate
        run: |
          mkdir -p artifacts/r10/runtime-contract
          npm audit --json > artifacts/r10/runtime-contract/NPM_AUDIT.json || true
          node - <<'NODE'
          const a=require('./artifacts/r10/runtime-contract/NPM_AUDIT.json');
          const v=a.metadata?.vulnerabilities||{};
          if((v.high||0)>0 || (v.critical||0)>0) process.exit(1);
          console.log(JSON.stringify(v,null,2));
          NODE
      - name: Direct TypeScript compatibility
        run: npm run typecheck:direct
      - name: Security regression compatibility
        run: npm run security:regression
      - name: Production build compatibility
        run: npm run build
      - name: Commit exact runtime metadata only
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No runtime metadata diff"
            exit 0
          fi
          git config user.name "velmere-r10-runtime-contract"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(r10): pin exact Node and npm runtime contract [runtime]"
          git push origin HEAD:r10-runtime-contract
      - name: Upload runtime contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r10-runtime-contract-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/r10/runtime-contract/**
