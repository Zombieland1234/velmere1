name: R10 Truth Scanner Coverage

on:
  push:
    branches:
      - r10-truth-scanner-coverage
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r10-truth-scanner-coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout worker branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Apply guarded scanner coverage patch
        run: node scripts/r10/patch-truth-scanner-coverage.mjs
      - name: Scanner regression including customer components
        run: node scripts/r10/test-release-truth-gate.mjs
      - name: Scan patched branch
        continue-on-error: true
        run: node scripts/r10/verify-release-truth.mjs --write --output artifacts/r10/TRUTH_SCANNER_COVERAGE_RECEIPT.json
      - name: Assert new coverage catches an injected customer RFC3161 claim
        run: |
          cp components/market-integrity/AnalysisCardsSection.tsx /tmp/AnalysisCardsSection.tsx
          printf '\nexport const __r10TruthProbe = "Certyfikacja RFC 3161";\n' >> components/market-integrity/AnalysisCardsSection.tsx
          if node scripts/r10/verify-release-truth.mjs >/tmp/probe.log 2>&1; then
            echo "Scanner failed to block injected RFC3161 customer claim"
            cat /tmp/probe.log
            exit 1
          fi
          grep -q 'CLAIM_CUSTOMER_RFC3161_CERTIFICATION' /tmp/probe.log
          mv /tmp/AnalysisCardsSection.tsx components/market-integrity/AnalysisCardsSection.tsx
      - name: Commit verified scanner and regression only
        run: |
          git diff --name-only > /tmp/changed.txt
          allowed='^(scripts/r10/release-truth-lib\.mjs|scripts/r10/test-release-truth-gate\.mjs)$'
          bad="$(grep -Ev "$allowed" /tmp/changed.txt || true)"
          if [ -n "$bad" ]; then echo "Unexpected write scope:"; echo "$bad"; exit 1; fi
          git config user.name "velmere-r10-truth-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -d '\n' git add -- < /tmp/changed.txt
          git commit -m "fix(r10): scan customer components for unsupported RFC3161 claims [truth]"
          git push origin HEAD:r10-truth-scanner-coverage
      - name: Upload scanner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r10-truth-scanner-coverage-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/r10/TRUTH_SCANNER_COVERAGE_RECEIPT.json
