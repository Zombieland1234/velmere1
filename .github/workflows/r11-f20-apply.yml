name: R11 F20 Audit UI Remediation

on:
  push:
    branches:
      - r11-redteam-remediation
    paths:
      - scripts/r11/apply-f20-audit-ui-fix.mjs
      - scripts/r11/test-f20-audit-ui-contract.mjs
      - .github/workflows/r11-f20-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r11-f20-audit-ui-remediation
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Apply exact guarded patch
        run: node scripts/r11/apply-f20-audit-ui-fix.mjs
      - name: Contract regression
        run: node scripts/r11/test-f20-audit-ui-contract.mjs
      - name: Direct TypeScript
        run: npm run typecheck:direct
      - name: Write scope
        run: |
          git diff --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          grep -qx 'components/security/SecurityAuditsCleanPage.tsx' /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt | tr -d ' ')" = "1"
      - name: Commit verified source patch
        run: |
          git config user.name 'velmere-r11-remediation'
          git config user.email 'velmere-r11-remediation@users.noreply.github.com'
          git add components/security/SecurityAuditsCleanPage.tsx
          git commit -m 'fix(r11): bind audit intake redirect to server authorization'
          git push origin HEAD:r11-redteam-remediation
