name: Velmere R5 P81 Source Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/velmere-r5-p81-source-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact probe branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build exact checkout manifest and archive
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path('.').resolve()
          out = root / 'r5-source-probe'
          out.mkdir(exist_ok=True)
          excluded_roots = {'.git', 'r5-source-probe'}
          files = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              if rel.split('/', 1)[0] in excluded_roots:
                  continue
              data = path.read_bytes()
              files.append({
                  'path': rel,
                  'byteLength': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          aggregate = hashlib.sha256(''.join(f"{item['path']}\t{item['byteLength']}\t{item['sha256']}\n" for item in files).encode()).hexdigest()
          receipt = {
              'schemaVersion': 'velmere.r5.p81-source-probe.v1',
              'sourceCommit': os.environ.get('GITHUB_SHA'),
              'sourceBranch': os.environ.get('GITHUB_HEAD_REF') or os.environ.get('GITHUB_REF_NAME'),
              'fileCount': len(files),
              'payloadByteLength': sum(item['byteLength'] for item in files),
              'aggregateSha256': aggregate,
              'files': files,
              'customerFinalCredit': False,
              'exactWindowsCredit': False,
              'truthBoundary': 'Exact checkout bytes from the isolated P81-derived probe branch. This is a comparison input only, not current-source identity and not Customer FINAL.',
          }
          (out / 'VELMERE_R5_P81_SOURCE_PROBE_RECEIPT.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          zip_path = out / 'velmere-r5-p81-source-probe.zip'
          fixed = (1980, 1, 1, 0, 0, 0)
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as zf:
              for item in files:
                  data = (root / item['path']).read_bytes()
                  info = zipfile.ZipInfo(item['path'], date_time=fixed)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, data)
          zip_bytes = zip_path.read_bytes()
          (out / 'velmere-r5-p81-source-probe.zip.sha256').write_text(hashlib.sha256(zip_bytes).hexdigest() + '  velmere-r5-p81-source-probe.zip\n', encoding='utf-8')
          print(json.dumps({k: receipt[k] for k in ('fileCount','payloadByteLength','aggregateSha256')}, indent=2))
          PY

      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: velmere-r5-p81-source-probe
          path: r5-source-probe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
