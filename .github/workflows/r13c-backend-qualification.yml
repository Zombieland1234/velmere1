name: R13C backend qualification (UI immutable)
on:
  push:
    branches: [r13c/backend-hardening-20260916]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r13c-backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Normalize backend TypeScript relative imports
        shell: python
        run: |
          from pathlib import Path
          changed_files=[]
          changed_imports=0
          roots=[Path('lib/security'),Path('lib/worldclass')]
          for root in roots:
            for p in root.rglob('*.ts'):
              lines=p.read_text(encoding='utf-8').splitlines(keepends=True)
              out=[]
              changed=False
              for line in lines:
                  original=line
                  stripped=line.lstrip()
                  is_import=(' from "./' in line or ' from "../' in line or " from './" in line or " from '../" in line or stripped.startswith('import("./') or stripped.startswith('import("../') or stripped.startswith("import('./") or stripped.startswith("import('../"))
                  if is_import:
                      if '.ts"' in line:
                          line=line.replace('.ts"','"')
                      if ".ts'" in line:
                          line=line.replace(".ts'","'")
                  if line != original:
                      changed=True
                      changed_imports += 1
                  out.append(line)
              if changed:
                  p.write_text(''.join(out),encoding='utf-8')
                  changed_files.append(str(p))
          remaining=[]
          for root in roots:
            for p in root.rglob('*.ts'):
              for i,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  stripped=line.lstrip()
                  is_import=(' from "./' in line or ' from "../' in line or " from './" in line or " from '../" in line or stripped.startswith('import("./') or stripped.startswith('import("../') or stripped.startswith("import('./") or stripped.startswith("import('../"))
                  if is_import and ('.ts"' in line or ".ts'" in line):
                      remaining.append(f'{p}:{i}')
          if remaining:
              raise SystemExit(f'unresolved relative .ts imports remain: {remaining}')
          print(f'normalized_files={len(changed_files)} normalized_imports={changed_imports}')
      - name: Align security dependency versions to canonical R13 source
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['dependencies']['next']='16.3.5'
          d['devDependencies']['solc']='0.8.37'
          d['devDependencies']['postcss-selector-parser']='6.1.4'
          d.setdefault('overrides',{})['sharp']='0.35.4'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Refresh lockfile without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Persist backend-only R13C corrections
        shell: bash
        run: |
          if git diff --quiet -- lib/security lib/worldclass package.json package-lock.json; then
            echo "backend source and dependency contract already normalized"
          else
            git config user.name "Zombieland1234"
            git config user.email "velmere141@gmail.com"
            git add lib/security lib/worldclass package.json package-lock.json
            git commit -m "fix(r13c): normalize backend imports and security dependencies"
            git push origin HEAD:r13c/backend-hardening-20260916
          fi
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Preserve dependency audit evidence
        if: always()
        shell: bash
        run: |
          npm audit --json > r13c-npm-audit.json || true
          npm audit --omit=dev --json > r13c-npm-audit-production.json || true
      - name: Enforce zero production high or critical dependency advisories
        shell: python
        run: |
          import json
          d=json.load(open('r13c-npm-audit-production.json'))
          counts=d.get('metadata',{}).get('vulnerabilities',{})
          print(counts)
          if counts.get('critical',0) or counts.get('high',0):
              raise SystemExit('production dependency high/critical advisories remain')
      - name: Full TypeScript gate
        run: npm run typecheck
      - name: Full lint gate
        run: npm run lint
      - name: Production build gate
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: R13/R13B entitlement component regression
        run: node --experimental-vm-modules --experimental-strip-types --test scripts/r13/*.test.mjs scripts/r13b/*.test.mjs | tee r13c-entitlement.tap
      - name: R13C adversarial backend regression
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs --test test/security/adversarial-red-team.test.ts | tee r13c-redteam.tap
      - name: Database contract evidence
        run: npm run audit:database | tee r13c-database.txt
      - name: Provider rights evidence (expected fail-closed commercial state)
        run: npm run audit:provider-rights | tee r13c-provider-rights.txt
      - name: Merchant/legal evidence (expected fail-closed commercial state)
        run: npm run audit:merchant-legal | tee r13c-merchant-legal.txt
      - name: Current product readiness observation (NO_GO is preserved, not masked)
        if: always()
        shell: bash
        run: |
          set +e
          npm run audit:product-readiness > r13c-product-readiness.txt 2>&1
          code=$?
          echo "product_readiness_exit=$code" | tee r13c-product-readiness-exit.txt
          cat r13c-product-readiness.txt
          exit 0
      - name: Preserve exact qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r13c-backend-qualification-${{ github.sha }}
          path: |
            r13c-*.tap
            r13c-*.txt
            r13c-*.json
          if-no-files-found: warn
          retention-days: 14
