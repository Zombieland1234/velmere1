name: R13C backend qualification (UI immutable)
on:
  push:
    branches: [r13c/backend-hardening-20260916]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r13c-backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Normalize backend security TypeScript relative imports
        shell: python
        run: |
          from pathlib import Path
          import re
          pattern=re.compile(r'(?P<prefix>(?:from\\s+|import\\s*\\()\\s*["\\\'])(?P<path>\\.{1,2}/[^"\\\']+)\\.ts(?P<quote>["\\\'])')
          changed=[]
          for p in Path('lib/security').rglob('*.ts'):
              s=p.read_text(encoding='utf-8')
              ns,n=pattern.subn(lambda m: f"{m.group('prefix')}{m.group('path')}{m.group('quote')}",s)
              if n:
                  p.write_text(ns,encoding='utf-8')
                  changed.append((str(p),n))
          remaining=[]
          for p in Path('lib/security').rglob('*.ts'):
              s=p.read_text(encoding='utf-8')
              if pattern.search(s): remaining.append(str(p))
          if remaining:
              raise SystemExit(f'unresolved relative .ts imports remain: {remaining}')
          print(f'normalized_files={len(changed)} normalized_imports={sum(n for _,n in changed)}')
      - name: Persist backend-only TypeScript import normalization on R13C branch
        shell: bash
        run: |
          if git diff --quiet -- lib/security; then
            echo "backend security import contracts already normalized"
          else
            git config user.name "Zombieland1234"
            git config user.email "velmere141@gmail.com"
            git add lib/security
            git commit -m "fix(r13c): normalize security TypeScript import specifiers"
            git push origin HEAD:r13c/backend-hardening-20260916
          fi
      - name: Install lockfile dependencies
        run: npm ci
      - name: Preserve dependency audit evidence
        if: always()
        shell: bash
        run: |
          npm audit --json > r13c-npm-audit.json || true
          npm audit --omit=dev --json > r13c-npm-audit-production.json || true
      - name: Full TypeScript gate
        run: npm run typecheck
      - name: Full lint gate
        run: npm run lint
      - name: Production build gate
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: R13/R13B entitlement component regression
        run: node --experimental-vm-modules --experimental-strip-types --test scripts/r13/*.test.mjs scripts/r13b/*.test.mjs | tee r13c-entitlement.tap
      - name: R13C adversarial backend regression
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs --test test/security/adversarial-red-team.test.ts | tee r13c-redteam.tap
      - name: Database contract evidence
        run: npm run audit:database | tee r13c-database.txt
      - name: Provider rights evidence (expected fail-closed commercial state)
        run: npm run audit:provider-rights | tee r13c-provider-rights.txt
      - name: Merchant/legal evidence (expected fail-closed commercial state)
        run: npm run audit:merchant-legal | tee r13c-merchant-legal.txt
      - name: Current product readiness observation (NO_GO is preserved, not masked)
        if: always()
        shell: bash
        run: |
          set +e
          npm run audit:product-readiness > r13c-product-readiness.txt 2>&1
          code=$?
          echo "product_readiness_exit=$code" | tee r13c-product-readiness-exit.txt
          cat r13c-product-readiness.txt
          exit 0
      - name: Preserve exact qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r13c-backend-qualification-${{ github.sha }}
          path: |
            r13c-*.tap
            r13c-*.txt
            r13c-*.json
          if-no-files-found: warn
          retention-days: 14
