name: R13C backend qualification (UI immutable)
on:
  push:
    branches: [r13c/backend-hardening-20260916]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r13c-backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Verify immutable dependency contract
        shell: python
        run: |
          import json
          d=json.load(open('package.json'))
          expected={
            ('dependencies','next'):'16.3.5',
            ('devDependencies','solc'):'0.8.37',
            ('devDependencies','postcss-selector-parser'):'6.1.4',
            ('overrides','sharp'):'0.35.4',
            ('overrides','tmp'):'0.2.7',
          }
          for (section,key),want in expected.items():
            got=d.get(section,{}).get(key)
            if got != want:
              raise SystemExit(f'dependency contract mismatch: {section}.{key}={got!r}, expected {want!r}')
          print('dependency contract: PASS')
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Preserve dependency audit evidence
        if: always()
        shell: bash
        run: |
          npm audit --json > r13c-npm-audit.json || true
          npm audit --omit=dev --json > r13c-npm-audit-production.json || true
      - name: Enforce zero high or critical dependency advisories
        shell: python
        run: |
          import json
          for name in ['r13c-npm-audit.json','r13c-npm-audit-production.json']:
            d=json.load(open(name))
            counts=d.get('metadata',{}).get('vulnerabilities',{})
            print(name,counts)
            if counts.get('critical',0) or counts.get('high',0):
              raise SystemExit(f'high/critical dependency advisories remain in {name}')
      - name: Full source integrity gate
        run: npm run audit:source
      - name: Full TypeScript gate
        run: npm run typecheck
      - name: Full lint gate
        run: npm run lint
      - name: Production build gate
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: R13/R13B entitlement component regression
        run: node --experimental-vm-modules --experimental-strip-types --test scripts/r13/*.test.mjs scripts/r13b/*.test.mjs | tee r13c-entitlement.tap
      - name: R13C adversarial backend regression
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs --test test/security/adversarial-red-team.test.ts | tee r13c-redteam.tap
      - name: Database contract evidence
        if: always()
        shell: bash
        run: |
          set +e
          npm run audit:database > r13c-database.txt 2>&1
          code=$?
          echo "database_exit=$code" | tee r13c-database-exit.txt
          cat r13c-database.txt
          exit 0
      - name: Provider rights evidence (fail-closed commercial observation)
        if: always()
        shell: bash
        run: |
          set +e
          npm run audit:provider-rights > r13c-provider-rights.txt 2>&1
          code=$?
          echo "provider_rights_exit=$code" | tee r13c-provider-rights-exit.txt
          cat r13c-provider-rights.txt
          exit 0
      - name: Merchant/legal evidence (fail-closed commercial observation)
        if: always()
        shell: bash
        run: |
          set +e
          npm run audit:merchant-legal > r13c-merchant-legal.txt 2>&1
          code=$?
          echo "merchant_legal_exit=$code" | tee r13c-merchant-legal-exit.txt
          cat r13c-merchant-legal.txt
          exit 0
      - name: Current product readiness observation (NO_GO is preserved, not masked)
        if: always()
        shell: bash
        run: |
          set +e
          npm run audit:product-readiness > r13c-product-readiness.txt 2>&1
          code=$?
          echo "product_readiness_exit=$code" | tee r13c-product-readiness-exit.txt
          cat r13c-product-readiness.txt
          exit 0
      - name: Preserve exact qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r13c-backend-qualification-${{ github.sha }}
          path: |
            r13c-*.tap
            r13c-*.txt
            r13c-*.json
            artifacts/pass13/PASS13_CLEAN_SAFE_AUDIT.json
            artifacts/pass13/PASS13_CLEAN_SAFE_MANIFEST.json
          if-no-files-found: warn
          retention-days: 14
