name: P73 Ancient8 Multicall3 Ground Truth

on:
  push:
    branches:
      - velmere-p73-audit-ancient8-ground-truth-20260817
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p73-ancient8-multicall3-ground-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p73-ground-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout P73 control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Verify exact toolchain and execute current ground-truth probe
        shell: bash
        env:
          P73_RESULT_DIR: ${{ github.workspace }}/p73-out
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          mkdir -p p73-out
          node p73-runtime/probe-p73-ancient8-multicall3-ground-truth.mjs | tee p73-out/P73_GROUND_TRUTH.log

      - name: Bind P72R3 parent and P73 truth boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='p73-out/P73_GITHUB_BOUNDARY.json';
          fs.mkdirSync('p73-out',{recursive:true});
          fs.writeFileSync(p, JSON.stringify({
            schemaVersion:'velmere.p73.github-boundary.v1',
            runId:process.env.GITHUB_RUN_ID,
            sha:process.env.GITHUB_SHA,
            parent:{revision:'P72R3',headSha:'516bd5a051b143cae192833cb36ce4e573800928',projectionAggregateSha256:'4db46e951d3f7f2cc04f61418279b9347bc21b4300b7152aa3e2c77395216252'},
            target:{chain:'Ancient8 Mainnet',chainId:888888888,address:'0xca11bde05977b3631167028862be2a173976ca11'},
            officialRpc:'https://rpc.ancient8.gg',
            groundTruthAuthority:'mds1/multicall3 issue #336 owner comment 2495504312',
            customerFinal:'0/20',auditFinalPdf:'0/3',rights:'2/203',paidValue:'0/10',sale:'0/20',live:false,worldClassProven:false,
            truthBoundary:'P73 external proof may promote only a current deployment-identity ground-truth case if exact public evidence passes. It cannot promote vulnerability exploitability, customer FINAL output, rights, paid value, sale, LIVE or WORLD_CLASS.'
          },null,2)+'\n');
          NODE

      - name: Upload P73 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p73-ancient8-multicall3-ground-truth
          path: p73-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
