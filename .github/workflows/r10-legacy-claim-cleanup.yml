name: R10 Legacy Claim Cleanup

on:
  push:
    branches:
      - r10-candidate-truth-build
    paths:
      - scripts/r10/migrate-legacy-claim-wording.mjs
      - scripts/generate_180_dowody7.ts
      - scripts/generate_180_dowody8.ts
      - .github/workflows/r10-legacy-claim-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r10-legacy-claim-cleanup-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  VELMERE_OFFLINE_TS_FORCE_BUILTIN: "1"

jobs:
  cleanup:
    name: Neutralize unsupported legacy release claims
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate for guarded claim commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Verify exact bundled toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Dry-run exact scanner-driven claim migration
        run: node scripts/r10/migrate-legacy-claim-wording.mjs --output artifacts/r10/R10_LEGACY_CLAIM_WORDING_PREFLIGHT.json

      - name: Apply exact scanner-driven claim migration
        run: node scripts/r10/migrate-legacy-claim-wording.mjs --write --output artifacts/r10/R10_LEGACY_CLAIM_WORDING_MIGRATION.json

      - name: Syntax-check changed JavaScript modules
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const receipt = JSON.parse(fs.readFileSync('artifacts/r10/R10_LEGACY_CLAIM_WORDING_MIGRATION.json', 'utf8'));
          for (const item of receipt.files ?? []) {
            if (!item.path.endsWith('.mjs')) continue;
            const result = spawnSync(process.execPath, ['--check', item.path], { stdio: 'inherit' });
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          console.log('R10 changed .mjs syntax checks: PASS');
          NODE

      - name: Re-test truth scanner rules
        run: node scripts/r10/test-release-truth-gate.mjs

      - name: Require zero P0 in full candidate truth scan
        run: |
          node scripts/r10/verify-release-truth.mjs --write --output artifacts/r10/R10_RELEASE_TRUTH_AFTER_CLAIM_CLEANUP.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('artifacts/r10/R10_RELEASE_TRUTH_AFTER_CLAIM_CLEANUP.json', 'utf8'));
          const p0 = receipt.counts?.p0 ?? (receipt.findings ?? []).filter((finding) => finding.severity === 'P0').length;
          if (p0 !== 0 || receipt.status !== 'PASS') {
            console.error(JSON.stringify({ status: receipt.status, counts: receipt.counts, findings: (receipt.findings ?? []).slice(0, 20) }, null, 2));
            process.exit(1);
          }
          console.log('R10 full candidate truth scan P0=0: PASS');
          NODE

      - name: Commit claim cleanup and receipts
        run: |
          git config user.name "velmere-r10-claim-cleaner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit reports scripts artifacts/r10/R10_LEGACY_CLAIM_WORDING_PREFLIGHT.json artifacts/r10/R10_LEGACY_CLAIM_WORDING_MIGRATION.json artifacts/r10/R10_RELEASE_TRUTH_AFTER_CLAIM_CLEANUP.json
          if git diff --cached --quiet; then
            echo "No claim cleanup changes to commit."
            exit 0
          fi
          git commit -m "fix(r10): neutralize unsupported legacy release claims [r10-claims]"
          git push origin HEAD:r10-candidate-truth-build

      - name: Upload claim cleanup receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r10-claim-cleanup-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/r10/R10_LEGACY_CLAIM_WORDING_PREFLIGHT.json
            artifacts/r10/R10_LEGACY_CLAIM_WORDING_MIGRATION.json
            artifacts/r10/R10_RELEASE_TRUTH_AFTER_CLAIM_CLEANUP.json
