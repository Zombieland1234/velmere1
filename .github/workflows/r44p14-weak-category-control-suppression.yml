name: R44P14 Weak Category Recall and Control Suppression

on:
  pull_request:
    branches: [main]
    paths:
      - 'r44p14-evidence/**'
      - '.github/workflows/r44p14-weak-category-control-suppression.yml'

permissions:
  contents: read

jobs:
  external-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATASET_COMMIT: 230e649123477eff332742a59a1c7cc6dc286cab
      EXPECTED_ANALYZER_SHA256: fd678819f6e6265a801e7cc386d22bdf6e7361f3197cb6caf012fcf4acb1cf6e
      EXPECTED_RUNNER_SHA256: e577446aa97bf203c247f20226ecf407dea151025d95019bea3811d635ab88b5
      EXPECTED_PARENT_SHA256: 8111d3ce89e44954f8bbe37e06349a0f204976cdafd293db44972136e0f52eff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned external labeled corpus
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/smartbugs/smartbugs-curated.git r44p14-evidence/smartbugs-curated
          git -C r44p14-evidence/smartbugs-curated fetch --depth 1 origin "$DATASET_COMMIT"
          git -C r44p14-evidence/smartbugs-curated checkout --detach "$DATASET_COMMIT"
          test "$(git -C r44p14-evidence/smartbugs-curated rev-parse HEAD)" = "$DATASET_COMMIT"
          sha256sum \
            r44p14-evidence/smartbugs-curated/vulnerabilities.json \
            r44p14-evidence/smartbugs-curated/ICSE2020_curated_69.txt \
            > r44p14-evidence/DATASET_METADATA_SHA256.txt

      - name: Reconstruct and verify exact analyzer inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,pathlib
          root=pathlib.Path('r44p14-evidence')
          for encoded_name, output_name in [
              ('analyzer.mjs.gz.b64','analyzer.mjs'),
              ('run_r44p14_external.mjs.gz.b64','run_r44p14_external.mjs'),
              ('parent_predictions.json.gz.b64','parent_predictions.json'),
          ]:
              output=gzip.decompress(base64.b64decode((root/encoded_name).read_text().strip()))
              (root/output_name).write_bytes(output)
          PY
          test "$(sha256sum r44p14-evidence/analyzer.mjs | awk '{print $1}')" = "$EXPECTED_ANALYZER_SHA256"
          test "$(sha256sum r44p14-evidence/run_r44p14_external.mjs | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA256"
          test "$(sha256sum r44p14-evidence/parent_predictions.json | awk '{print $1}')" = "$EXPECTED_PARENT_SHA256"
          node --version | grep -F 'v24.18.0'
          node --check r44p14-evidence/analyzer.mjs
          node --check r44p14-evidence/run_r44p14_external.mjs
          sha256sum \
            r44p14-evidence/analyzer.mjs \
            r44p14-evidence/run_r44p14_external.mjs \
            r44p14-evidence/parent_predictions.json \
            > r44p14-evidence/INPUT_SHA256.txt

      - name: Execute 69-case remediation measurement
        working-directory: r44p14-evidence
        shell: bash
        run: |
          set -euo pipefail
          node run_r44p14_external.mjs | tee execution-summary.log

      - name: Independently verify denominator and truth boundary
        working-directory: r44p14-evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          evidence=root/'evidence'
          ledger_path=evidence/'R44P14_EXTERNAL_WEAK_CATEGORY_CONTROL_SUPPRESSION_LEDGER.json'
          summary_path=evidence/'R44P14_EXTERNAL_WEAK_CATEGORY_CONTROL_SUPPRESSION_SUMMARY.json'
          ledger=json.loads(ledger_path.read_text())
          summary=json.loads(summary_path.read_text())
          assert ledger['dataset']['commit']=='230e649123477eff332742a59a1c7cc6dc286cab'
          assert ledger['denominators']['cases']==69
          assert ledger['denominators']['controls']==12
          assert len(ledger['cases'])==69
          assert len({row['datasetPath'] for row in ledger['cases']})==69
          assert len(ledger['controls'])==12
          assert len(list((evidence/'receipts').glob('*.json')))==69
          assert ledger['analyzer']['class']=='STRUCTURED_TOKEN_CONTROL_FLOW_V2_NOT_COMPILER_AST'
          assert summary['parentRecall']==0.710145
          assert summary['parentFlaggedControls']==7
          assert summary['hybridReviewRecall']>=summary['parentRecall']
          assert summary['projectFlaggedControls']<=summary['parentFlaggedControls']
          for row in ledger['cases']:
              receipt=evidence/'receipts'/(row['datasetPath'].replace('/','_')+'.json')
              assert receipt.is_file(),receipt
              assert hashlib.sha256(receipt.read_bytes()).hexdigest()==row['receiptSha256']
          tb=ledger['truthBoundary']
          assert tb['projectAnalyzerFindingPromotionMeasuredSeparately'] is True
          assert tb['hybridReviewQueueIsNotCustomerFindingCredit'] is True
          assert tb['formalPrecision'] is False
          assert tb['severityCalibration'] is False
          assert tb['customerCredit'] is False
          assert tb['paidTierCredit'] is False
          assert tb['liveCredit'] is False
          assert tb['worldClassProven'] is False
          result={
            'schemaVersion':'velmere.pass36.a102r44p14.external-remediation-verification.v1',
            'status':'PASS',
            'checks':24,
            'passed':24,
            'failed':0,
            'cases':69,
            'controls':12,
            'projectRecall':summary['projectRecall'],
            'hybridReviewRecall':summary['hybridReviewRecall'],
            'projectControlFlagRate':summary['projectControlFlagRate'],
            'ledgerSha256':hashlib.sha256(ledger_path.read_bytes()).hexdigest(),
          }
          (root/'R44P14_INDEPENDENT_EVIDENCE_VERIFICATION.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Package redacted deterministic evidence
        if: always()
        working-directory: r44p14-evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > GITHUB_CHECKOUT_SHA.txt
          mkdir -p packaged-evidence
          if test -d evidence; then
            cp evidence/R44P14_EXTERNAL_WEAK_CATEGORY_CONTROL_SUPPRESSION_LEDGER.json packaged-evidence/ 2>/dev/null || true
            cp evidence/R44P14_EXTERNAL_WEAK_CATEGORY_CONTROL_SUPPRESSION_SUMMARY.json packaged-evidence/ 2>/dev/null || true
            cp -R evidence/receipts packaged-evidence/ 2>/dev/null || true
          fi
          cp -f execution-summary.log INPUT_SHA256.txt DATASET_METADATA_SHA256.txt GITHUB_CHECKOUT_SHA.txt R44P14_INDEPENDENT_EVIDENCE_VERIFICATION.json packaged-evidence/ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('packaged-evidence')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes(); rows.append({'path':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          Path('R44P14_EVIDENCE_FILE_MANIFEST.json').write_text(json.dumps({'fileCount':len(rows),'files':rows},indent=2,sort_keys=True)+'\n')
          PY
          cp R44P14_EVIDENCE_FILE_MANIFEST.json packaged-evidence/
          tar --sort=name --mtime='UTC 2026-08-04' --owner=0 --group=0 --numeric-owner \
            -czf r44p14-weak-category-control-suppression-evidence.tar.gz packaged-evidence
          sha256sum r44p14-weak-category-control-suppression-evidence.tar.gz > r44p14-weak-category-control-suppression-evidence.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44p14-weak-category-control-suppression-evidence
          path: |
            r44p14-evidence/packaged-evidence
            r44p14-evidence/R44P14_EVIDENCE_FILE_MANIFEST.json
            r44p14-evidence/r44p14-weak-category-control-suppression-evidence.tar.gz
            r44p14-evidence/r44p14-weak-category-control-suppression-evidence.sha256
          if-no-files-found: warn
          retention-days: 14
