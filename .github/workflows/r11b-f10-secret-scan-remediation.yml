name: R11B F10 Secret Scan Remediation

on:
  push:
    branches: [r11b-internal-hardening]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Apply guarded F10 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/pass4992/supply-chain-release.mjs'); s=p.read_text()
          old='''const SECRET_SCAN_EXACT_FIXTURES = new Set([\n  "scripts/security/scan-all-secrets.mjs:stripe-live-secret",\n  "tests/unit/ai-vlm-security.test.ts:stripe-live-secret",\n  "tests/unit/security-api-error-envelope.test.ts:stripe-live-secret",\n]);'''
          fp='71a68559119629d989386448adad9d5920e7e8e83fb7f55282d9ef9fcc7051cf'
          new=f'''const SECRET_SCAN_EXACT_FIXTURES = new Map([\n  ["scripts/security/scan-all-secrets.mjs:stripe-live-secret", new Set(["{fp}"])],\n  ["tests/unit/ai-vlm-security.test.ts:stripe-live-secret", new Set(["{fp}"])],\n  ["tests/unit/security-api-error-envelope.test.ts:stripe-live-secret", new Set(["{fp}"])],\n]);'''
          assert s.count(old)==1; s=s.replace(old,new)
          marker='''export async function scanSourceForHighPrecisionSecrets(root, sourceManifest) {\n  const findings = [];\n  const ignoredFixtureFindings = [];\n  let scannedFileCount = 0;'''
          replacement='''function isSecretScannablePath(filePath) {\n  const base = path.basename(filePath).toLowerCase();\n  return base === ".env" || base.startsWith(".env.") || SECRET_SCAN_EXTENSIONS.has(path.extname(filePath).toLowerCase());\n}\n\nexport async function scanSourceForHighPrecisionSecrets(root, sourceManifest) {\n  const findings = [];\n  const ignoredFixtureFindings = [];\n  const ignoredFixtureCounts = new Map();\n  let scannedFileCount = 0;'''
          assert s.count(marker)==1; s=s.replace(marker,replacement)
          oldcond='''if (entry.type !== "file" || !SECRET_SCAN_EXTENSIONS.has(path.extname(entry.path).toLowerCase())) continue;'''
          assert s.count(oldcond)==1; s=s.replace(oldcond,'''if (entry.type !== "file" || !isSecretScannablePath(entry.path)) continue;''')
          oldblock='''      const fixtureKey = `${finding.path}:${finding.ruleId}`;\n      if (SECRET_SCAN_EXACT_FIXTURES.has(fixtureKey)) {\n        ignoredFixtureFindings.push({ path: finding.path, line: finding.line, ruleId: finding.ruleId });\n      } else {\n        findings.push(finding);\n      }'''
          newblock='''      const fixtureKey = `${finding.path}:${finding.ruleId}`;\n      const allowedFingerprints = SECRET_SCAN_EXACT_FIXTURES.get(fixtureKey);\n      const occurrenceKey = `${fixtureKey}:${finding.fingerprint}`;\n      const priorIgnored = ignoredFixtureCounts.get(occurrenceKey) ?? 0;\n      if (allowedFingerprints?.has(finding.fingerprint) && priorIgnored === 0) {\n        ignoredFixtureCounts.set(occurrenceKey, 1);\n        ignoredFixtureFindings.push({ path: finding.path, line: finding.line, ruleId: finding.ruleId, fingerprint: finding.fingerprint });\n      } else {\n        findings.push(finding);\n      }'''
          assert s.count(oldblock)==1; s=s.replace(oldblock,newblock)
          assert s.count('fixturePolicy: "EXACT_PATH_PLUS_RULE_ID_ONLY"')==1
          s=s.replace('fixturePolicy: "EXACT_PATH_PLUS_RULE_ID_ONLY"','fixturePolicy: "EXACT_PATH_RULE_FINGERPRINT_SINGLE_OCCURRENCE"')
          p.write_text(s)

          p=Path('scripts/pass4992/test-supply-chain-release.mjs'); s=p.read_text()
          s=s.replace('import { mkdir, readFile, rename, writeFile } from "node:fs/promises";', 'import { mkdir, mkdtemp, readFile, rename, rm, writeFile } from "node:fs/promises";')
          s=s.replace('import path from "node:path";', 'import path from "node:path";\nimport os from "node:os";')
          assert s.count('assert.equal(scan.fixturePolicy, "EXACT_PATH_PLUS_RULE_ID_ONLY");')==1
          s=s.replace('assert.equal(scan.fixturePolicy, "EXACT_PATH_PLUS_RULE_ID_ONLY");','assert.equal(scan.fixturePolicy, "EXACT_PATH_RULE_FINGERPRINT_SINGLE_OCCURRENCE");')
          anchor='''  const adversarialOutsideFixture = scanTextForHighPrecisionSecrets(["sk", "_live_", "A1B2C3D4E5F6G7H8I9"].join(""), "app/adversarial-real-source.ts");\n  assert.equal(adversarialOutsideFixture.some((finding) => finding.ruleId === "stripe-live-secret"), true);\n});'''
          insert='''  const adversarialOutsideFixture = scanTextForHighPrecisionSecrets(["sk", "_live_", "A1B2C3D4E5F6G7H8I9"].join(""), "app/adversarial-real-source.ts");\n  assert.equal(adversarialOutsideFixture.some((finding) => finding.ruleId === "stripe-live-secret"), true);\n});\n\nawait check("fixture fingerprint is exact and env files are scanned", async () => {\n  const tmp = await mkdtemp(path.join(os.tmpdir(), "velmere-f10-"));\n  try {\n    const fixturePath = "tests/unit/ai-vlm-security.test.ts";\n    const envPath = ".env";\n    const envLocalPath = ".env.local";\n    await mkdir(path.join(tmp, "tests/unit"), { recursive: true });\n    const allowed = ["sk", "_live_", "51H2xK2eZvKYlo2CcF7xNgABC123"].join("");\n    const different = ["sk", "_live_", "ZZZZZZZZZZZZZZZZZZZZZZZZ"].join("");\n    await writeFile(path.join(tmp, fixturePath), `${allowed}\\n${different}\\n`);\n    await writeFile(path.join(tmp, envPath), `STRIPE_SECRET=${different}\\n`);\n    await writeFile(path.join(tmp, envLocalPath), `STRIPE_SECRET=${different}\\n`);\n    const syntheticManifest = { entries: [\n      { type: "file", path: fixturePath },\n      { type: "file", path: envPath },\n      { type: "file", path: envLocalPath },\n    ] };\n    const result = await scanSourceForHighPrecisionSecrets(tmp, syntheticManifest);\n    assert.equal(result.ignoredFixtureFindingCount, 1);\n    assert.equal(result.findingCount, 3);\n    assert.equal(result.findings.filter((f) => f.path === fixturePath).length, 1);\n    assert.equal(result.findings.some((f) => f.path === envPath), true);\n    assert.equal(result.findings.some((f) => f.path === envLocalPath), true);\n  } finally {\n    await rm(tmp, { recursive: true, force: true });\n  }\n});'''
          assert s.count(anchor)==1; s=s.replace(anchor,insert); p.write_text(s)
          PY
      - name: F10 targeted and full supply-chain tests without temporary worker
        run: |
          worker=.github/workflows/r11b-f10-secret-scan-remediation.yml
          mv "$worker" /tmp/r11b-f10-secret-scan-remediation.yml
          set +e
          node --input-type=module - <<'NODE'
          import { buildSourceManifest, scanSourceForHighPrecisionSecrets } from './scripts/pass4992/supply-chain-release.mjs';
          const manifest=await buildSourceManifest(process.cwd());
          const scan=await scanSourceForHighPrecisionSecrets(process.cwd(),manifest);
          console.log(JSON.stringify({status:scan.status,scannedFileCount:scan.scannedFileCount,findings:scan.findings,ignoredFixtureFindings:scan.ignoredFixtureFindings},null,2));
          NODE
          node --check scripts/pass4992/supply-chain-release.mjs
          node scripts/pass4992/test-supply-chain-release.mjs
          rc=$?
          mv /tmp/r11b-f10-secret-scan-remediation.yml "$worker"
          set -e
          test "$rc" -eq 0
          npm run typecheck:direct
      - name: Exact write scope
        run: |
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' scripts/pass4992/supply-chain-release.mjs scripts/pass4992/test-supply-chain-release.mjs | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Commit verified F10 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/pass4992/supply-chain-release.mjs scripts/pass4992/test-supply-chain-release.mjs
          git commit -m "fix(r11b): bind secret fixtures to exact fingerprints and scan env files"
          git push origin HEAD:r11b-internal-hardening
