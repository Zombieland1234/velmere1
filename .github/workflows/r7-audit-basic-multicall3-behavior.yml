name: R7 Audit Basic Multicall3 Behavioral Semantics

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-multicall3-behavior.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Install pinned local EVM test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r7-behavior-work
          cd r7-behavior-work
          npm init -y >/dev/null
          npm install --ignore-scripts=false --audit=false --fund=false solc@0.8.12 ethers@6.15.0 ganache@7.9.2

      - name: Execute exact-source behavioral tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r7/audit-basic/behavior
          cat > r7-behavior-work/run.mjs <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import ganache from 'ganache';
          import solc from 'solc';
          import { ContractFactory, Interface, JsonRpcProvider } from 'ethers';

          const sha=(v)=>createHash('sha256').update(v).digest('hex');
          const chainId='56';
          const deployedAddress='0xca11bde05977b3631167028862be2a173976ca11';
          const exactSourceSha='3f05fc95b3bfd3d41e96fa281e00a71302e35b8fff59f81f399a419cdb9f577e';
          const sourcifyUrl=`https://sourcify.dev/server/v2/contract/${chainId}/${deployedAddress}?fields=all`;
          const sRes=await fetch(sourcifyUrl,{headers:{accept:'application/json','user-agent':'velmere-r7-behavior'},signal:AbortSignal.timeout(25000)});
          if(!sRes.ok) throw new Error(`sourcify_fetch_failed:${sRes.status}`);
          const sourcify=await sRes.json(); if(sourcify.match!=='exact_match') throw new Error('sourcify_not_exact_match');
          const sources=Object.entries(sourcify.sources??{}).filter(([p,v])=>/Multicall3\.sol$/i.test(p)&&v&&typeof v==='object'&&typeof v.content==='string');
          if(sources.length!==1) throw new Error(`source_denominator:${sources.length}`);
          const source=sources[0][1].content;
          if(sha(Buffer.from(source,'utf8'))!==exactSourceSha) throw new Error('source_sha_mismatch');

          const probe=`// SPDX-License-Identifier: MIT\npragma solidity 0.8.12;\ncontract Probe { uint256 public last; function ok(uint256 v) external returns(uint256){last=v;return v+1;} function failCall() external pure { revert(\"probe fail\"); } function receiveValue() external payable returns(uint256){last=msg.value;return msg.value;} }`;
          const input={language:'Solidity',sources:{'Multicall3.sol':{content:source},'Probe.sol':{content:probe}},settings:{optimizer:{enabled:true,runs:10000000},evmVersion:'london',outputSelection:{'*':{'*':['abi','evm.bytecode.object','evm.deployedBytecode.object']}}}};
          const output=JSON.parse(solc.compile(JSON.stringify(input)));
          const errors=(output.errors??[]).filter((row)=>row.severity==='error');
          if(errors.length) throw new Error(`solc_compile_failed:${errors.map(e=>e.formattedMessage).join('\n').slice(0,2000)}`);
          const mc=output.contracts['Multicall3.sol'].Multicall3, pc=output.contracts['Probe.sol'].Probe;
          if(!mc?.evm?.bytecode?.object||!pc?.evm?.bytecode?.object) throw new Error('compiled_artifacts_missing');

          const server=ganache.server({logging:{quiet:true},wallet:{totalAccounts:3,defaultBalance:1000},chain:{hardfork:'london',chainId:1337}});
          await server.listen(8545);
          try{
            const provider=new JsonRpcProvider('http://127.0.0.1:8545');
            const signer=await provider.getSigner(0);
            const mcContract=await new ContractFactory(mc.abi,'0x'+mc.evm.bytecode.object,signer).deploy(); await mcContract.waitForDeployment();
            const probeContract=await new ContractFactory(pc.abi,'0x'+pc.evm.bytecode.object,signer).deploy(); await probeContract.waitForDeployment();
            const mcAddr=await mcContract.getAddress(), probeAddr=await probeContract.getAddress();
            const probeIface=new Interface(pc.abi);
            const okData=probeIface.encodeFunctionData('ok',[7n]);
            const failData=probeIface.encodeFunctionData('failCall',[]);
            const receiveValueData=probeIface.encodeFunctionData('receiveValue',[]);
            const tests=[];
            const push=(id,pass,details={})=>{tests.push({id,pass,...details}); if(!pass) throw new Error(`behavior_test_failed:${id}`);};

            const agg=await mcContract.aggregate.staticCall([{target:probeAddr,callData:okData}]);
            push('aggregate_success_returns',Array.isArray(agg[1])&&agg[1].length===1);
            let aggregateReverted=false; try{await mcContract.aggregate.staticCall([{target:probeAddr,callData:failData}]);}catch{aggregateReverted=true;}
            push('aggregate_failed_subcall_reverts',aggregateReverted);

            const tryFalse=await mcContract.tryAggregate.staticCall(false,[{target:probeAddr,callData:failData}]);
            push('tryAggregate_false_surfaces_failure',tryFalse.length===1&&tryFalse[0].success===false);
            let tryTrueReverted=false;try{await mcContract.tryAggregate.staticCall(true,[{target:probeAddr,callData:failData}]);}catch{tryTrueReverted=true;}
            push('tryAggregate_true_reverts_failure',tryTrueReverted);

            const a3Allowed=await mcContract.aggregate3.staticCall([{target:probeAddr,allowFailure:true,callData:failData}]);
            push('aggregate3_allowFailure_surfaces_failure',a3Allowed.length===1&&a3Allowed[0].success===false);
            let a3Denied=false;try{await mcContract.aggregate3.staticCall([{target:probeAddr,allowFailure:false,callData:failData}]);}catch{a3Denied=true;}
            push('aggregate3_disallowFailure_reverts',a3Denied);

            let mismatchReverted=false;try{await mcContract.aggregate3Value.staticCall([{target:probeAddr,allowFailure:false,value:123n,callData:receiveValueData}],{value:122n});}catch{mismatchReverted=true;}
            push('aggregate3Value_value_mismatch_reverts',mismatchReverted);
            const probeBefore=await provider.getBalance(probeAddr); const mcBefore=await provider.getBalance(mcAddr);
            const valueTx=await mcContract.aggregate3Value([{target:probeAddr,allowFailure:false,value:123n,callData:receiveValueData}],{value:123n}); await valueTx.wait();
            const probeAfter=await provider.getBalance(probeAddr); const mcAfter=await provider.getBalance(mcAddr);
            push('aggregate3Value_exact_value_forwarded',probeAfter-probeBefore===123n,{probeDeltaWei:String(probeAfter-probeBefore)});
            push('aggregate3Value_success_does_not_retain_value',mcAfter===mcBefore,{multicallBalanceBefore:String(mcBefore),multicallBalanceAfter:String(mcAfter)});

            const trappedBefore=await provider.getBalance(mcAddr); const probeFailBefore=await provider.getBalance(probeAddr);
            const failedAllowedTx=await mcContract.aggregate3Value([{target:probeAddr,allowFailure:true,value:77n,callData:failData}],{value:77n}); await failedAllowedTx.wait();
            const trappedAfter=await provider.getBalance(mcAddr); const probeFailAfter=await provider.getBalance(probeAddr);
            const retained=trappedAfter-trappedBefore;
            push('aggregate3Value_allowed_failed_call_retains_value',retained===77n&&probeFailAfter===probeFailBefore,{retainedWei:String(retained),probeDeltaWei:String(probeFailAfter-probeFailBefore)});
            const hasWithdrawal=mc.abi.some((row)=>row.type==='function'&&/(withdraw|sweep|recover|rescue)/i.test(String(row.name??'')));
            push('no_explicit_withdrawal_surface',hasWithdrawal===false,{hasWithdrawalSurface:hasWithdrawal});

            const liveBalRes=await fetch('https://bsc-dataseed.binance.org/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_getBalance',params:[deployedAddress,'latest']}),signal:AbortSignal.timeout(20000)});
            if(!liveBalRes.ok) throw new Error(`live_balance_rpc_failed:${liveBalRes.status}`); const liveBalanceHex=String((await liveBalRes.json()).result??''); const liveBalanceWei=BigInt(liveBalanceHex||'0x0');

            const receipt={schemaVersion:'velmere.r7.audit-basic-multicall3-behavior.v1',status:'PASS_EXACT_SOURCE_BEHAVIOR_EXECUTED',exactDeployedSourceSha256:exactSourceSha,compiler:'solc-js 0.8.12',optimizerRuns:10000000,evmVersion:'london',localEvm:'ganache 7.9.2',tests,passed:tests.filter(t=>t.pass).length,total:tests.length,
              adjudicationSignals:{aggregateChecksLowLevelSuccess:true,tryAggregateFailureSemanticsExplicit:true,aggregate3AllowFailureSemanticsExplicit:true,aggregate3ValueConservesCallerValueOnSuccess:true,aggregate3ValueAllowedFailureCanRetainFailedSubcallValue:true,noExplicitWithdrawalSurface:!hasWithdrawal,currentDeployedBalanceWei:String(liveBalanceWei)},
              customerRiskCandidate:{id:'MC3-VALUE-RETENTION-ON-ALLOWED-FAILED-CALL',state:'REVIEW_REQUIRED',severityCandidate:'medium',description:'When aggregate3Value is called with allowFailure=true and a value-bearing subcall fails, the failed value remains on Multicall3. The contract exposes no explicit withdrawal/sweep function. This is deterministic behavior and can cause caller funds to remain inaccessible unless another mechanism exists outside the audited source.',exploitability:'No attacker theft path established; primary risk is caller fund loss/misuse semantics.',requiresExternalCorrelation:true},
              paidProviderRequired:false,customerFinalCredit:false,truthBoundary:'Behavioral tests prove exact-source local semantics and fresh deployed balance observation. They do not by themselves prove exploitability, production transaction history, or customer impact frequency.'};
            fs.mkdirSync('../artifacts/r7/audit-basic/behavior',{recursive:true}); fs.writeFileSync('../artifacts/r7/audit-basic/behavior/R7_AUDIT_BASIC_MULTICALL3_BEHAVIOR.json',JSON.stringify(receipt,null,2)+'\n'); console.log(JSON.stringify(receipt,null,2));
          } finally { await server.close(); }
          NODE
          cd r7-behavior-work
          node run.mjs

      - name: Upload behavioral evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-multicall3-behavior-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/r7/audit-basic/behavior/R7_AUDIT_BASIC_MULTICALL3_BEHAVIOR.json
          if-no-files-found: error
          retention-days: 30
