name: P43 Exact Current Source Reconstruction

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p43-current-source-reconstruction-20260814
    paths:
      - 'p43-bridge/**'
      - '.github/workflows/p43-current-source-reconstruction-exact.yml'

permissions:
  contents: write
  actions: read

jobs:
  reconstruct-current-source:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout reconstruction branch with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch and tag
        shell: pwsh
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --tags --force
          git for-each-ref --format='%(refname)' refs/heads refs/remotes refs/tags | Sort-Object | Set-Content p43-all-refs.txt

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Set up exact npm 11.16.0
        shell: pwsh
        run: |
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Exact Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'Exact npm mismatch' }

      - name: Assemble and verify compact P43 identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            'p43-bridge/i8s.part-00',
            'p43-bridge/i8s.part-01',
            'p43-bridge/i8b.part-00',
            'p43-bridge/i8b.part-01',
            'p43-bridge/i8b.part-02',
            'p43-bridge/i8b.part-03',
            'p43-bridge/i8b.part-04',
            'p43-bridge/i8b.part-05',
            'p43-bridge/i8b.part-06',
            'p43-bridge/i8b.part-07',
            'p43-bridge/i8b.part-08'
          )
          if (Test-Path 'p43-bridge/i8b.part-09-real') {
            $parts += 'p43-bridge/i8b.part-09-real'
          } elseif (Test-Path 'p43-bridge/i8b.part-09') {
            $parts += 'p43-bridge/i8b.part-09'
          } else {
            throw 'Final compact identity block is missing'
          }
          foreach ($part in $parts) {
            if (!(Test-Path $part)) { throw "Missing identity block: $part" }
          }
          $joined = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          [IO.File]::WriteAllText('p43-identity.bin.gz.b64', $joined, [Text.Encoding]::ASCII)
          $sha = (Get-FileHash p43-identity.bin.gz.b64 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '26f1600434724aa9724064009ab3e1f6b10393e39f4c98a3133b9824735ecfd5') {
            throw "Compact identity SHA mismatch: $sha"
          }
          $gzip = [Convert]::FromBase64String($joined)
          [IO.File]::WriteAllBytes('p43-identity.bin.gz', $gzip)
          python -c "import gzip,pathlib; pathlib.Path('p43-identity.bin').write_bytes(gzip.decompress(pathlib.Path('p43-identity.bin.gz').read_bytes()))"

      - name: Measure all-ref coverage and reconstruct exact current source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p43-results | Out-Null
          python p43-bridge/measure-source-coverage-bin.py `
            --repo . `
            --identity-bin p43-identity.bin `
            --output-dir p43-results `
            --reconstruct

      - name: Enforce exact P43 source identity
        shell: pwsh
        run: |
          $receipt = Get-Content p43-results/P43_GITHUB_ALL_REFS_SOURCE_RECONSTRUCTION_COVERAGE.json -Raw | ConvertFrom-Json
          if (-not $receipt.coverage.complete) {
            throw "All-ref source reconstruction incomplete: $($receipt.coverage.missingFiles) missing, $($receipt.coverage.ambiguousFiles) ambiguous"
          }
          if (-not $receipt.reconstruction.exactIdentityPass) {
            throw "Reconstructed source does not match exact P43 path-set/source aggregate"
          }
          if ($receipt.reconstruction.fileCount -ne 6666) { throw 'Unexpected reconstructed file count' }
          if ($receipt.reconstruction.payloadBytes -ne 196479563) { throw 'Unexpected reconstructed payload bytes' }
          if ($receipt.reconstruction.pathSetSha256 -ne '38eba6c9b7f1761d531bed806cc783d28b540165f199bce385ba6d38842238fa') { throw 'Path-set mismatch' }
          if ($receipt.reconstruction.sourceAggregateSha256 -ne 'ae505b6f94813767752e344c76c249099fb3e30283b64a3647420eaafbbd8478') { throw 'Source aggregate mismatch' }

      - name: Create exact reconstructed source archive
        if: success()
        shell: pwsh
        run: |
          Compress-Archive -Path 'p43-results/reconstructed-current-source/*' -DestinationPath 'p43-results/P43_EXACT_CURRENT_SOURCE_RECONSTRUCTED.zip' -CompressionLevel Optimal
          Get-FileHash p43-results/P43_EXACT_CURRENT_SOURCE_RECONSTRUCTED.zip -Algorithm SHA256 | Format-List | Out-File p43-results/P43_EXACT_CURRENT_SOURCE_RECONSTRUCTED_SHA256.txt

      - name: Persist current reconstruction receipts on branch
        if: always()
        shell: pwsh
        run: |
          git config user.name 'Velmere Closure Bot'
          git config user.email 'velmere-closure@users.noreply.github.com'
          git add p43-results/P43_GITHUB_ALL_REFS_SOURCE_RECONSTRUCTION_COVERAGE.json p43-results/P43_GITHUB_ALL_REFS_MISSING_SOURCE_ROWS.json p43-results/P43_GITHUB_ALL_REFS_COVERED_SOURCE_ROWS.json
          if (git diff --cached --quiet) {
            Write-Host 'No receipt change to commit.'
          } else {
            git commit -m 'P43: persist exact current-source reconstruction receipt'
            git push origin HEAD:velmere-p43-current-source-reconstruction-20260814
          }

      - name: Upload reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p43-exact-current-source-reconstruction
          path: |
            p43-results/P43_GITHUB_ALL_REFS_SOURCE_RECONSTRUCTION_COVERAGE.json
            p43-results/P43_GITHUB_ALL_REFS_MISSING_SOURCE_ROWS.json
            p43-results/P43_GITHUB_ALL_REFS_COVERED_SOURCE_ROWS.json
            p43-results/P43_EXACT_CURRENT_SOURCE_RECONSTRUCTED.zip
            p43-results/P43_EXACT_CURRENT_SOURCE_RECONSTRUCTED_SHA256.txt
            p43-all-refs.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
