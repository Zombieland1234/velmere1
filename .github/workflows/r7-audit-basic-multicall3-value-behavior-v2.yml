name: R7 Audit Basic Multicall3 Value Behavior V2

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-multicall3-value-behavior-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-value-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Install pinned compiler and EVM dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r7-value-work
          cd r7-value-work
          npm init -y >/dev/null
          npm install --audit=false --fund=false solc@0.8.12 ethers@6.15.0 ganache@7.9.2

      - name: Execute value forwarding and failed-call retention tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r7/audit-basic/behavior
          cat > r7-value-work/run.mjs <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import ganache from 'ganache';
          import solc from 'solc';
          import { ContractFactory, Interface, JsonRpcProvider } from 'ethers';
          const sha=(v)=>createHash('sha256').update(v).digest('hex');
          const address='0xca11bde05977b3631167028862be2a173976ca11';
          const expectedSourceSha='3f05fc95b3bfd3d41e96fa281e00a71302e35b8fff59f81f399a419cdb9f577e';
          const s=await fetch(`https://sourcify.dev/server/v2/contract/56/${address}?fields=all`,{headers:{accept:'application/json','user-agent':'velmere-r7-value-behavior'},signal:AbortSignal.timeout(25000)});
          if(!s.ok)throw new Error(`sourcify_fetch_failed:${s.status}`);const c=await s.json();if(c.match!=='exact_match')throw new Error('sourcify_not_exact_match');
          const rows=Object.entries(c.sources??{}).filter(([p,v])=>/Multicall3\.sol$/i.test(p)&&v&&typeof v==='object'&&typeof v.content==='string');if(rows.length!==1)throw new Error(`source_denominator:${rows.length}`);const source=rows[0][1].content;if(sha(Buffer.from(source,'utf8'))!==expectedSourceSha)throw new Error('source_sha_mismatch');
          const probe=`// SPDX-License-Identifier: MIT\npragma solidity 0.8.12; contract Probe { uint256 public last; function receiveValue() external payable { last=msg.value; } function failCall() external payable { revert(\"probe fail\"); } }`;
          const input={language:'Solidity',sources:{'Multicall3.sol':{content:source},'Probe.sol':{content:probe}},settings:{optimizer:{enabled:true,runs:10000000},evmVersion:'london',outputSelection:{'*':{'*':['abi','evm.bytecode.object']}}}};
          const out=JSON.parse(solc.compile(JSON.stringify(input)));const errors=(out.errors??[]).filter(e=>e.severity==='error');if(errors.length)throw new Error(errors.map(e=>e.formattedMessage).join('\n'));
          const mc=out.contracts['Multicall3.sol'].Multicall3,pc=out.contracts['Probe.sol'].Probe;
          const server=ganache.server({logging:{quiet:true},wallet:{totalAccounts:2,defaultBalance:1000},chain:{hardfork:'london',chainId:1337}});await server.listen(8545);
          const tests=[];const check=(id,pass,details={})=>{tests.push({id,pass,...details});if(!pass)throw new Error(`value_behavior_failed:${id}:${JSON.stringify(details)}`)};
          try{
            const provider=new JsonRpcProvider('http://127.0.0.1:8545');const signer=await provider.getSigner(0);
            const multicall=await new ContractFactory(mc.abi,'0x'+mc.evm.bytecode.object,signer).deploy();await multicall.waitForDeployment();
            const target=await new ContractFactory(pc.abi,'0x'+pc.evm.bytecode.object,signer).deploy();await target.waitForDeployment();
            const mcAddr=await multicall.getAddress(),targetAddr=await target.getAddress();const iface=new Interface(pc.abi);const receiveData=iface.encodeFunctionData('receiveValue',[]),failData=iface.encodeFunctionData('failCall',[]);
            const rawBalance=async(addr)=>BigInt(await provider.send('eth_getBalance',[addr,'latest']));
            let mismatch=false;try{await multicall.aggregate3Value.staticCall([{target:targetAddr,allowFailure:false,value:123n,callData:receiveData}],{value:122n});}catch{mismatch=true;}check('value_sum_mismatch_reverts',mismatch);
            const targetBefore=await rawBalance(targetAddr),mcBefore=await rawBalance(mcAddr);
            const tx=await multicall.aggregate3Value([{target:targetAddr,allowFailure:false,value:123n,callData:receiveData}],{value:123n});const rc=await tx.wait();if(!rc||rc.status!==1)throw new Error('success_tx_receipt_invalid');
            const targetAfter=await rawBalance(targetAddr),mcAfter=await rawBalance(mcAddr),last=await target.last();
            check('successful_value_call_forwards_exact_value',targetAfter-targetBefore===123n,{targetBefore:String(targetBefore),targetAfter:String(targetAfter),delta:String(targetAfter-targetBefore),probeLast:String(last)});
            check('successful_value_call_leaves_no_new_multicall_balance',mcAfter===mcBefore,{mcBefore:String(mcBefore),mcAfter:String(mcAfter)});
            check('probe_observed_exact_msg_value',last===123n,{probeLast:String(last)});
            const retainedBefore=await rawBalance(mcAddr),targetFailBefore=await rawBalance(targetAddr);
            const failTx=await multicall.aggregate3Value([{target:targetAddr,allowFailure:true,value:77n,callData:failData}],{value:77n});const failRc=await failTx.wait();if(!failRc||failRc.status!==1)throw new Error('allowed_failure_tx_did_not_succeed');
            const retainedAfter=await rawBalance(mcAddr),targetFailAfter=await rawBalance(targetAddr);const retained=retainedAfter-retainedBefore;
            check('allowed_failed_value_subcall_retains_value_on_multicall',retained===77n,{retainedBefore:String(retainedBefore),retainedAfter:String(retainedAfter),retainedDelta:String(retained),targetDelta:String(targetFailAfter-targetFailBefore)});
            check('failed_subcall_did_not_transfer_value_to_target',targetFailAfter===targetFailBefore,{targetBefore:String(targetFailBefore),targetAfter:String(targetFailAfter)});
            const hasWithdraw=mc.abi.some(r=>r.type==='function'&&/(withdraw|sweep|recover|rescue)/i.test(String(r.name??'')));check('no_explicit_withdraw_or_sweep_function',!hasWithdraw,{hasWithdraw});
            const liveBal=await fetch('https://bsc-dataseed.binance.org/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_getBalance',params:[address,'latest']}),signal:AbortSignal.timeout(20000)});if(!liveBal.ok)throw new Error(`live_balance_failed:${liveBal.status}`);const liveBalanceWei=BigInt(String((await liveBal.json()).result??'0x0'));
            const receipt={schemaVersion:'velmere.r7.audit-basic-multicall3-value-behavior.v2',status:'PASS_VALUE_BEHAVIOR_PROVEN',exactDeployedSourceSha256:expectedSourceSha,compilerVersion:solc.version(),optimizerRuns:10000000,evmVersion:'london',tests,passed:tests.length,total:tests.length,currentDeployedBalanceWei:String(liveBalanceWei),findingCandidate:{id:'MC3-VALUE-RETENTION-ON-ALLOWED-FAILED-CALL',state:'CONFIRMED_BEHAVIOR_REQUIRES_SEVERITY_ADJUDICATION',severityCandidate:'medium',confidence:98,title:'Value remains in Multicall3 when a value-bearing allowed subcall fails',description:'aggregate3Value permits allowFailure=true. A failed value-bearing subcall reverts its value transfer while the outer Multicall3 transaction succeeds, leaving that portion of msg.value on Multicall3. The audited ABI exposes no explicit withdraw/sweep/recover/rescue function.',impactBoundary:'Confirmed caller-fund retention/loss-of-access behavior. No attacker theft or privilege escalation path is established.',remediationCandidate:'For value-bearing calls, disallow failure or explicitly refund failed-call value to the caller; alternatively document and enforce that allowFailure must not be used with nonzero value.',requiresIndependentAdjudication:true},paidProviderRequired:false,customerFinalCredit:false,truthBoundary:'This exact-source local-EVM test confirms value-retention semantics. Severity, production usage frequency and whether project documentation intentionally accepts this risk remain separate adjudication gates.'};
            fs.writeFileSync('../artifacts/r7/audit-basic/behavior/R7_AUDIT_BASIC_MULTICALL3_VALUE_BEHAVIOR_V2.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));
          }finally{await server.close();}
          NODE
          cd r7-value-work
          node run.mjs

      - name: Upload value behavior evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-multicall3-value-v2-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/r7/audit-basic/behavior/R7_AUDIT_BASIC_MULTICALL3_VALUE_BEHAVIOR_V2.json
          if-no-files-found: error
          retention-days: 30
