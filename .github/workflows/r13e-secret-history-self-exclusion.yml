name: R13E secret history scanner self-exclusion
on:
  push:
    branches: [r13e/backend-hardening-20260916]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r13e-secret-history-self-exclusion
  cancel-in-progress: true
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Exclude scanner's own probe literals from history search
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/security/scan-all-secrets.mjs')
          s=p.read_text(encoding='utf-8')
          old='const output = execSync(`git log -S "${probe}" --oneline -n 10`, {'
          new='const output = execSync(`git log -S "${probe}" --oneline -n 10 -- . ":(exclude)scripts/security/scan-all-secrets.mjs"`, {'
          if s.count(old)!=1:
            raise SystemExit(f'expected one scanner history command, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Run corrected scanner against full history
        shell: bash
        run: |
          set -euo pipefail
          node scripts/security/scan-all-secrets.mjs | tee r13e-secret-history-corrected.txt
      - name: Verify current tree and history are clean
        shell: python
        run: |
          import json
          d=json.load(open('reports/SECRET_HYGIENE_REPORT.json'))
          safe={
            'status':d.get('status'),
            'genuineCodebaseLeaksCount':d.get('genuineCodebaseLeaksCount'),
            'gitHistoryLeaksCount':d.get('gitHistoryLeaksCount'),
            'perimeterStatus':d.get('perimeterStatus'),
          }
          print(safe)
          if d.get('genuineCodebaseLeaksCount')!=0 or d.get('gitHistoryLeaksCount')!=0:
            raise SystemExit('real secret leak evidence remains after scanner self-exclusion')
      - name: Commit scanner fix
        shell: bash
        run: |
          git config user.name "Zombieland1234"
          git config user.email "velmere141@gmail.com"
          git add scripts/security/scan-all-secrets.mjs
          git commit -m "fix(r13e): exclude secret scanner probe literals from history audit"
          git push origin HEAD:r13e/backend-hardening-20260916
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r13e-secret-history-self-exclusion-${{ github.sha }}
          path: |
            r13e-secret-history-corrected.txt
            reports/SECRET_HYGIENE_REPORT.json
            reports/SECRET_HYGIENE_REPORT.md
          if-no-files-found: warn
          retention-days: 30