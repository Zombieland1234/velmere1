name: R6 Exact Current-Source Blob Availability Probe

on:
  push:
    branches:
      - velmere-r6-exact-r5-execution-20260823
    paths:
      - '.github/workflows/r6-export-branch-source.yml'
      - 'r6-runtime/r6-blob-probe.sh'
      - 'r6-runtime/R6_CHANGED_BLOB_MANIFEST_COMPACT.tsv.xz.b64.part-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r6-blob-availability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout R6 control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Probe R6 changed Git blobs
        shell: bash
        run: bash r6-runtime/R6-blob-probe.sh

      - name: Upload R6 blob availability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-git-blob-availability-probe
          path: r6-probe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
