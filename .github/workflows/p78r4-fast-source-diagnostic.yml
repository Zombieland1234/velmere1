name: P78R4 Fast Deterministic Source Diagnostic

on:
  push:
    branches:
      - velmere-p78r4-cross-unit-correlation-20260818
    paths:
      - '.github/workflows/p78r4-fast-source-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Expand support and reconstruct exact P78R3
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,zipfile
          parts=sorted(Path('p75-runtime').glob('bundle.part*'))
          raw=base64.b64decode(''.join(p.read_text(encoding='ascii').strip() for p in parts),validate=True)
          assert len(parts)==7 and hashlib.sha256(raw).hexdigest()=='467026e4c5751d42c6fb06fb4425d640f911a3990fc3f05fd2de99c03e68ffad'
          z=Path('p75-runtime/p75-ci-bundle.zip');z.write_bytes(raw)
          with zipfile.ZipFile(z) as a:a.extractall('p75-runtime')
          PY
          python3 p77-runtime/reconstruct-p77-support.py --parts-dir p77-runtime --output-dir p77-runtime
          mkdir -p p78r4-fast-out
          git config core.autocrlf false
          git config core.eol lf
          python3 p73-runtime/reconstruct-p73r7-exact.py --work-root p75-work --out-root p78r4-fast-out >/dev/null
          python3 p75-runtime/apply-p75-advanced-automation-runtime.py --source-root p75-work/source --parent-manifest p75-work/P73R7_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P75_BUILD_PROJECTION_MANIFEST.json --receipt p78r4-fast-out/P75.json >/dev/null
          python3 p76r2-runtime/reconstruct-p76-base-apply.py --parts-dir p76-runtime --output p76-runtime/apply-p76-advanced-release-automation.py >/dev/null
          python3 p76-runtime/apply-p76-advanced-release-automation.py --source-root p75-work/source --parent-manifest p75-work/P75_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P76_BUILD_PROJECTION_MANIFEST.json --receipt p78r4-fast-out/P76.json >/dev/null
          python3 p76r2-runtime/apply-p76r2-typescript-repair.py --source-root p75-work/source --parent-manifest p75-work/P76_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P76R2_BUILD_PROJECTION_MANIFEST.json --receipt p78r4-fast-out/P76R2.json >/dev/null
          python3 p77-runtime/apply-p77-deterministic-final-delivery.py --source-root p75-work/source --parent-manifest p75-work/P76R2_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P77_BUILD_PROJECTION_MANIFEST.json --receipt p78r4-fast-out/P77.json >/dev/null
          python3 p78-runtime/apply-p78r1-audit-authority-customer-path.py --source-root p75-work/source --parent-manifest p75-work/P77_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P78R1_BUILD_PROJECTION_MANIFEST.json --receipt p78r4-fast-out/P78R1.json >/dev/null
          python3 p78-runtime/apply-p78r2-verified-static-evidence-handoff.py --source-root p75-work/source --parent-manifest p75-work/P78R1_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P78R2_BUILD_PROJECTION_MANIFEST.json --receipt p78r4-fast-out/P78R2.json >/dev/null
          python3 p78-runtime/apply-p78r3-erc2771-multicall-detector.py --source-root p75-work/source --parent-manifest p75-work/P78R2_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P78R3_BUILD_PROJECTION_MANIFEST.json --receipt p78r4-fast-out/P78R3.json >/dev/null
          python3 - <<'PY'
          import json
          p=json.load(open('p75-work/P78R3_BUILD_PROJECTION_MANIFEST.json'))['projection']
          expected=(1602,21059203,'214c0ad793a36a61c5290baeb104d2e671387df5c07e42862143861aa13ef66f','6570f1ef462dcc2d84daf30576a84b2acc518d6ec16f6030b7f670280780b79f')
          got=(p['fileCount'],p['payloadBytes'],p['pathSetSha256'],p['sourceContentAggregateSha256'])
          if got!=expected: raise SystemExit(f'P78R3 parent identity mismatch:{got}:{expected}')
          PY

      - name: Apply R4
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          python3 p78-runtime/apply-p78r4-contract-correlation.py --source-root p75-work/source --parent-manifest p75-work/P78R3_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P78R4_BUILD_PROJECTION_MANIFEST.json --receipt p78r4-fast-out/P78R4_SOURCE_PATCH.json 2>&1 | tee p78r4-fast-out/APPLY.log
          code=${PIPESTATUS[0]}; printf '%s\n' "$code" > p78r4-fast-out/APPLY.exit; exit "$code"

      - name: Static R4
        id: static
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 p78-runtime/test-p78r4-static.py --source-root p75-work/source --parent-manifest p75-work/P78R3_BUILD_PROJECTION_MANIFEST.json --manifest p75-work/P78R4_BUILD_PROJECTION_MANIFEST.json --source-receipt p78r4-fast-out/P78R4_SOURCE_PATCH.json --receipt p78r4-fast-out/P78R4_STATIC_CONTROL.json 2>&1 | tee p78r4-fast-out/STATIC.log
          code=${PIPESTATUS[0]}; printf '%s\n' "$code" > p78r4-fast-out/STATIC.exit; exit "$code"

      - name: Publish diagnostic
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
        run: |
          set -euo pipefail
          rm -rf p78r4-fast-results
          mkdir -p p78r4-fast-results
          cp p78r4-fast-out/* p78r4-fast-results/ 2>/dev/null || true
          [ -f p75-work/P78R4_BUILD_PROJECTION_MANIFEST.json ] && cp p75-work/P78R4_BUILD_PROJECTION_MANIFEST.json p78r4-fast-results/ || true
          python3 - <<'PY'
          import json,os,pathlib
          m=pathlib.Path('p75-work/P78R4_BUILD_PROJECTION_MANIFEST.json')
          projection=json.loads(m.read_text())['projection'] if m.exists() else None
          pathlib.Path('p78r4-fast-results/P78R4_FAST_BOUNDARY.json').write_text(json.dumps({
            'schemaVersion':'velmere.p78r4.fast-source-diagnostic.v1','runId':os.environ.get('GITHUB_RUN_ID'),'sha':os.environ.get('GITHUB_SHA'),
            'applyOutcome':os.environ.get('APPLY_OUTCOME'),'staticOutcome':os.environ.get('STATIC_OUTCOME'),'projection':projection,
            'zeroFakeCredit':{'runtimeExploitability':0,'formalDetectorAccuracy':'WITHHELD','customerFinal':'0/20','auditFinalPdf':'0/3','rights':'2/203','paidValue':'0/10','saleEligible':'0/20','live':False}
          },indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- p78r4-fast-results
          git commit -m 'P78R4 publish fast source diagnostic'
          git fetch origin velmere-p78r4-cross-unit-correlation-20260818
          git rebase origin/velmere-p78r4-cross-unit-correlation-20260818
          git push origin HEAD:velmere-p78r4-cross-unit-correlation-20260818
