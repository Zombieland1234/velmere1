name: P41 Exact Windows Node24 Dependency Closure

# P41 exact P40 payload revision 4
on:
  push:
    branches:
      - velmere-p41-windows-dependency-closure-20260814
    paths:
      - '.github/workflows/p41-windows-dependency-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-windows-dependency-closure:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout P41 bridge
        uses: actions/checkout@v4

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Set up exact npm 11.16.0
        shell: pwsh
        run: |
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          node --version
          npm --version
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Exact Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'Exact npm mismatch' }

      - name: Execute exact dependency closure and offline replay
        shell: pwsh
        run: node p41-runtime/run-p41-wrapper.mjs

      - name: Upload exact closure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p41-exact-windows-node24-dependency-closure
          path: |
            p41-out/P41_EXACT_WINDOWS_NODE24_DEPENDENCY_CLOSURE_RECEIPT.json
            p41-out/dependency-cas-manifest.json
            p41-out/derived-dependency-list.json
            p41-out/cas
            p41-out/logs
            p41-out/project/package.json
            p41-out/project/package-lock.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
