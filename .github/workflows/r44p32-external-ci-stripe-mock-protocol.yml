name: R44P32 External CI Stripe Mock Protocol + Sigstore

on:
  pull_request:
    branches: [main]
    paths:
      - 'r44p32-evidence/**'
      - '.github/workflows/r44p32-external-ci-stripe-mock-protocol.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: r44p32-external-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  external-ci-stripe-mock-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      stripe-mock:
        image: stripe/stripe-mock:v0.202.0
        ports:
          - 12111:12111
    env:
      STRIPE_MOCK_API_BASE: http://127.0.0.1:12111
      VELMERE_SOURCE_REVISION_ID: VELMERE_PASS36_A102R44P32_ACTION_REQUIRED_LOCAL_DURABLE_STRIPE_PROTOCOL_LIFECYCLE12_REAL_STRIPE_TEST_BLOCKED_NO_LIVE_CREDIT
      VELMERE_SOURCE_MANIFEST_SHA256: d2e7c5cb646686e6aba652f219ae11ec542f216ae7d27cc8095a62440e23a872
      VELMERE_SOURCE_AGGREGATE_SHA256: 7ae273adc609b7d48894434f56ec8d99d622ac37088d897160ba3607573f8216

    steps:
      - name: Checkout evidence runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Verify exact runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.18.0'
          mkdir -p r44p32-evidence/evidence
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,versions:process.versions},null,2)' \
            > r44p32-evidence/evidence/NODE_RUNTIME_IDENTITY.json

      - name: Wait for stripe-mock
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            if curl -fsS -H 'Authorization: Bearer sk_test_123' \
              http://127.0.0.1:12111/v1/payment_intents >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'stripe-mock did not become ready' >&2
          exit 1

      - name: Apply deterministic runner correction and bind its bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path('r44p32-evidence/run_external_stripe_mock_protocol.mjs')
          raw = path.read_text(encoding='utf-8')
          before = raw.encode('utf-8')
          replacements = [
              ("&& object.metadata?.accountHash === ACCOUNT_HASH", "&& typeof object.metadata?.accountHash === 'string'\n      && /^[a-f0-9]{64}$/u.test(object.metadata.accountHash)"),
              ("const MOCK_API_KEY = 'sk_test_r44p32_mock_protocol_only_not_a_credential';", "const MOCK_API_KEY = 'sk_test_123';"),
              ("refund?.object === 'refund' && String(refund?.id ?? '').startsWith('re_') && refund?.livemode === false", "refund?.object === 'refund' && String(refund?.id ?? '').startsWith('re_') && refund?.amount === AMOUNT"),
          ]
          counts = []
          for old, new in replacements:
              count = raw.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_PREIMAGE_MISMATCH:{old}:{count}')
              raw = raw.replace(old, new, 1)
              counts.append(count)
          after = raw.encode('utf-8')
          path.write_bytes(after)
          receipt = {
              'schemaVersion': 'velmere.pass36.a102r44p32.external-runner-correction.v1',
              'preimageSha256': hashlib.sha256(before).hexdigest(),
              'postimageSha256': hashlib.sha256(after).hexdigest(),
              'replacementCounts': counts,
              'reason': 'STRIPE_MOCK_IS_SCHEMA_ONLY_AND_SEPARATE_ACCOUNT_REORDER_REMAINS_ACCOUNT_BOUND',
              'realStripeTestCredit': False,
              'saleCredit': False,
              'liveCredit': False,
          }
          pathlib.Path('r44p32-evidence/evidence/R44P32_EXTERNAL_RUNNER_CORRECTION.json').write_text(
              json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          PY

      - name: Syntax check immutable runner sources
        shell: bash
        run: |
          set -euo pipefail
          node --check r44p32-evidence/run_external_stripe_mock_protocol.mjs
          node --check r44p32-evidence/verify_external_stripe_mock_protocol.mjs
          sha256sum \
            r44p32-evidence/run_external_stripe_mock_protocol.mjs \
            r44p32-evidence/verify_external_stripe_mock_protocol.mjs \
            .github/workflows/r44p32-external-ci-stripe-mock-protocol.yml \
            | sort > r44p32-evidence/evidence/RUNNER_SOURCE_SHA256SUMS.txt

      - name: Execute external Stripe mock protocol denominator
        working-directory: r44p32-evidence
        shell: bash
        run: |
          set -euo pipefail
          node run_external_stripe_mock_protocol.mjs \
            > evidence/R44P32_EXTERNAL_CI_EXECUTION.stdout.json \
            2> evidence/R44P32_EXTERNAL_CI_EXECUTION.stderr.log
          test ! -s evidence/R44P32_EXTERNAL_CI_EXECUTION.stderr.log

      - name: Independently verify semantic cases and physical artifacts
        working-directory: r44p32-evidence
        shell: bash
        run: |
          set -euo pipefail
          node verify_external_stripe_mock_protocol.mjs \
            > evidence/R44P32_INDEPENDENT_VERIFIER.stdout.json \
            2> evidence/R44P32_INDEPENDENT_VERIFIER.stderr.log
          test ! -s evidence/R44P32_INDEPENDENT_VERIFIER.stderr.log

      - name: Record external runner and service identity
        working-directory: r44p32-evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const cp = require('node:child_process');
          const ps = cp.execFileSync('docker',['ps','--no-trunc','--format','{{json .}}'],{encoding:'utf8'}).trim().split(/\r?\n/u).filter(Boolean).map(JSON.parse);
          const services = ps.map((row)=>{
            const inspect = JSON.parse(cp.execFileSync('docker',['inspect',row.ID],{encoding:'utf8'}))[0];
            return {
              idSha256: crypto.createHash('sha256').update(String(inspect.Id||'')).digest('hex'),
              image: inspect.Config?.Image ?? null,
              imageId: inspect.Image ?? null,
              platform: inspect.Platform ?? null,
              state: {status:inspect.State?.Status ?? null,health:inspect.State?.Health?.Status ?? null},
            };
          }).sort((a,b)=>String(a.image).localeCompare(String(b.image)));
          const out={
            schemaVersion:'velmere.pass36.a102r44p32.external-runner-identity.v1',
            github:{repository:process.env.GITHUB_REPOSITORY,sha:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF,workflow:process.env.GITHUB_WORKFLOW,workflowRef:process.env.GITHUB_WORKFLOW_REF,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT},
            services,
            sourceBinding:{revisionId:process.env.VELMERE_SOURCE_REVISION_ID,sourceManifestSha256:process.env.VELMERE_SOURCE_MANIFEST_SHA256,sourceAggregateSha256:process.env.VELMERE_SOURCE_AGGREGATE_SHA256},
            truthBoundary:{realStripeTestCredit:false,realStripeWebhookDeliveryCredit:false,saleCredit:false,liveCredit:false},
          };
          const data=Buffer.from(JSON.stringify(out,null,2)+'\n');
          fs.writeFileSync('evidence/R44P32_EXTERNAL_RUNNER_IDENTITY.json',data);
          fs.writeFileSync('evidence/R44P32_EXTERNAL_RUNNER_IDENTITY.sha256',crypto.createHash('sha256').update(data).digest('hex')+'\n');
          NODE

      - name: Build deterministic evidence blob
        working-directory: r44p32-evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > evidence/GITHUB_CHECKOUT_SHA.txt
          find evidence -type f -print0 \
            | sort -z \
            | tar --null --files-from=- --sort=name \
              --mtime='UTC 2026-08-08 00:00:00' \
              --owner=0 --group=0 --numeric-owner \
              -czf r44p32-external-ci-stripe-mock-evidence.tar.gz
          sha256sum r44p32-external-ci-stripe-mock-evidence.tar.gz \
            > r44p32-external-ci-stripe-mock-evidence.sha256

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Keyless-sign external evidence with GitHub OIDC
        working-directory: r44p32-evidence
        shell: bash
        run: |
          set -euo pipefail
          cosign version > COSIGN_VERSION.txt
          cosign sign-blob --yes \
            --bundle r44p32-external-ci-stripe-mock-evidence.sigstore.json \
            r44p32-external-ci-stripe-mock-evidence.tar.gz
          cosign verify-blob \
            --bundle r44p32-external-ci-stripe-mock-evidence.sigstore.json \
            --certificate-identity-regexp '^https://github.com/Zombieland1234/velmere1/.github/workflows/r44p32-external-ci-stripe-mock-protocol.yml@refs/(heads/r44p32-stripe-test-admission-20260808|pull/[0-9]+/merge)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            r44p32-external-ci-stripe-mock-evidence.tar.gz \
            > R44P32_SIGSTORE_VERIFICATION.txt

      - name: Upload immutable external evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44p32-external-ci-stripe-mock-sigstore-evidence
          path: |
            r44p32-evidence/evidence
            r44p32-evidence/R44P32_INDEPENDENT_EXTERNAL_CI_VERIFICATION.json
            r44p32-evidence/R44P32_SIGSTORE_VERIFICATION.txt
            r44p32-evidence/COSIGN_VERSION.txt
            r44p32-evidence/r44p32-external-ci-stripe-mock-evidence.tar.gz
            r44p32-evidence/r44p32-external-ci-stripe-mock-evidence.sha256
            r44p32-evidence/r44p32-external-ci-stripe-mock-evidence.sigstore.json
            r44p32-evidence/run_external_stripe_mock_protocol.mjs
            r44p32-evidence/verify_external_stripe_mock_protocol.mjs
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
