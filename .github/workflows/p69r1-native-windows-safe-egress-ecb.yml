name: P69R1 Native Windows Safe Egress ECB Reference

on:
  push:
    branches:
      - velmere-p69r1-safe-egress-ecb-reference-20260816
  workflow_dispatch:

concurrency:
  group: p69r1-safe-egress-ecb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p69r1-current-source:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout P69R1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        id: npmcli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }
          $npmRoot=(npm root --global).Trim()
          $npmCli=(Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node --version
          npm --version
          python --version

      - name: Reconstruct exact six-file P69R1 current projection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config core.autocrlf false
          git config core.eol lf
          New-Item -ItemType Directory -Force p69r1-out | Out-Null
          python p49-build-projection/reconstruct-p49-direct-projection.py `
            --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json `
            --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f `
            --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json `
            --runner p49-build-projection/run-p47-product-windows-projection.mjs `
            --parts-root p49-build-projection/parts `
            --work-root p69r1-work `
            --output-root p69r1-out
          if ($LASTEXITCODE -ne 0) { throw "P46 reconstruction failed: $LASTEXITCODE" }
          python p66-runtime/apply-p66-audit-pdf-delta.py --source-root p69r1-work/source --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --output-manifest p69r1-work/P66.json | Tee-Object p69r1-out/P66_STAGE1.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 1 failed: $LASTEXITCODE" }
          python p66-runtime/finalize-p66-shield-pro-row-id.py --source-root p69r1-work/source --manifest p69r1-work/P66.json | Tee-Object p69r1-out/P66_STAGE2.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 2 failed: $LASTEXITCODE" }
          python p66-runtime/fix-p66-topology-ts-const.py --source-root p69r1-work/source --manifest p69r1-work/P66.json | Tee-Object p69r1-out/P66_STAGE3.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 3 failed: $LASTEXITCODE" }
          python p68-runtime/apply-p68-audit-customer-truth.py --source-root p69r1-work/source --manifest p69r1-work/P66.json --output-manifest p69r1-work/P68.json | Tee-Object p69r1-out/P68_STAGE.log
          if ($LASTEXITCODE -ne 0) { throw "P68 patch failed: $LASTEXITCODE" }
          python p69-runtime/apply-p69-ecb-reference-fx.py --source-root p69r1-work/source --manifest p69r1-work/P68.json --output-manifest p69r1-work/P69.json | Tee-Object p69r1-out/P69_STAGE.log
          if ($LASTEXITCODE -ne 0) { throw "P69 patch failed: $LASTEXITCODE" }
          python p69r1-runtime/apply-p69r1-safe-egress-node24-fix.py --source-root p69r1-work/source --manifest p69r1-work/P69.json --output-manifest p69r1-work/P69R1.json | Tee-Object p69r1-out/P69R1_SAFE_EGRESS_PATCH.log
          if ($LASTEXITCODE -ne 0) { throw "P69R1 safe-egress patch failed: $LASTEXITCODE" }
          $m=Get-Content p69r1-work/P69R1.json -Raw | ConvertFrom-Json
          if ($m.projection.fileCount -ne 1597 -or $m.projection.payloadBytes -ne 20973332 -or $m.projection.pathSetSha256 -ne 'b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73' -or $m.projection.sourceContentAggregateSha256 -ne 'eb7808e9779801228894e9f0eb179d816fe30a4810a0f50144ee5094cac7515b') { throw 'P69R1 projection identity mismatch' }
          $expected=@{
            'lib/network/safe-egress.ts'='af7fee5e7b1aabc125dd5c62f75394ba0a4bf4336852568163fadcbea9f6e70a';
            'lib/network/brokered-egress.ts'='b155f11034d6657d35ee3a4605c756ccbe034ea3ae53463bf796930fad9f68b1';
            'lib/market-integrity/real-markets-quote-hydration.ts'='0e66f15e5be1792c8f42d4ba0e68aee5354e9f90189404100d9126a8bcb37635';
            'lib/market-integrity/real-markets-route-orchestrator.ts'='189382dc2ba3416a7b1a700ae0ac9a80e5decd9a89b37a0175370fd30f292d28';
            'lib/market-integrity/pass4413-cross-asset-runtime-normalizers.ts'='4963988166f9d17699cce52a22470aa92ebe3c5c6ce58149f5867237afe75f72';
            'components/market-integrity/CrossAssetCollapseRadarPanel.tsx'='48e54bd9896fb6b3ae9f3d4295d2c63cc39a6bfa508bcfeeb0ae44cc9a765c88'
          }
          foreach($rel in $expected.Keys){ $actual=(Get-FileHash -LiteralPath (Join-Path 'p69r1-work/source' $rel) -Algorithm SHA256).Hash.ToLowerInvariant(); if($actual -ne $expected[$rel]){ throw "P69R1 source hash mismatch: $rel $actual" } }
          Copy-Item p69r1-work/P69R1.json p69r1-out/P69R1_BUILD_PROJECTION_MANIFEST.json

      - name: Verify corrected topology retained
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location p69r1-work/source
          try {
            node --experimental-strip-types -e "import('./lib/product/vlm-canonical-product-topology.ts').then(m=>{const r=m.VLM_CANONICAL_CUSTOMER_PRODUCTS,f=m.VLM_CANONICAL_PRODUCT_FAMILIES,p=m.VLM_INTERNAL_EXECUTION_PROFILES,t=m.VLM_CONTEXT_TRANSITIONS;const fake=r.filter(x=>['angel','whale-watch','market-impact','shield-map','risk-indicator'].includes(x.family)&&x.tier!==null);if(r.length!==20||f.length!==10||p.length!==20||t.length!==10||fake.length||f.some(x=>x.family==='pdf')||m.VLM_V16_TOPOLOGY_DENOMINATORS.legacy33ProductCompletionDenominatorRetired!==true)process.exit(2);console.log(JSON.stringify({status:'PASS_P69R1_TOPOLOGY_RETENTION',rows:20,families:10,profiles:20,transitions:10,fakeStandaloneTiers:0,pdfFamily:false}))}).catch(e=>{console.error(e);process.exit(1)})"
            if ($LASTEXITCODE -ne 0) { throw "P69R1 topology failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Exact Windows dependency semantic lint dual build on six-file source
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.npmcli.outputs.npm_cli }}
        run: |
          $ErrorActionPreference='Stop'
          python p60-runtime/build-p60-reconciled-runner.py --input p49-build-projection/run-p47-product-windows-projection.mjs --output p69r1-work/run-p69r1-windows.mjs --receipt p69r1-out/P69R1_BASE_RUNNER.json
          if ($LASTEXITCODE -ne 0) { throw 'base runner generation failed' }
          python p66-runtime/patch-p66-reconciled-runner.py --runner p69r1-work/run-p69r1-windows.mjs --receipt p69r1-out/P69R1_P66_RUNNER_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 runner patch failed' }
          python p68-runtime/patch-p68-reconciled-runner.py --runner p69r1-work/run-p69r1-windows.mjs --receipt p69r1-out/P69R1_P68_RUNNER_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P68 runner patch failed' }
          python p69-runtime/patch-p69-reconciled-runner.py --runner p69r1-work/run-p69r1-windows.mjs --receipt p69r1-out/P69R1_P69_RUNNER_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P69 runner patch failed' }
          python p69r1-runtime/patch-p69r1-reconciled-runner.py --runner p69r1-work/run-p69r1-windows.mjs --receipt p69r1-out/P69R1_CURRENT_RUNNER_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P69R1 runner patch failed' }
          $sha=(Get-FileHash p69r1-work/run-p69r1-windows.mjs -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '32f764862c8e8aa8133bca81d5df26fc894a8926ad0d058ad4beaf154a4c5cbc'){ throw "P69R1 runner identity mismatch: $sha" }
          node --check p69r1-work/run-p69r1-windows.mjs
          node p69r1-work/run-p69r1-windows.mjs --source-root p69r1-work/source --manifest p69r1-work/P69R1.json --output-dir p69r1-out
          if ($LASTEXITCODE -ne 0) { throw "P69R1 exact Windows engineering failed: $LASTEXITCODE" }

      - name: Execute current ECB reference customer sub-envelope through product route
        shell: pwsh
        env:
          P69_SOURCE_ROOT: ${{ github.workspace }}\p69r1-work\source
          P69_RESULT_DIR: ${{ github.workspace }}\p69r1-out
        run: |
          $ErrorActionPreference='Stop'
          node --import ./p69-runtime/register-p69-ts-loader.mjs ./p69-runtime/test-p69-ecb-reference-route.mjs
          if ($LASTEXITCODE -ne 0) { throw "P69R1 current ECB route failed: $LASTEXITCODE" }

      - name: Capture P69R1 boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p69r1-out | Out-Null
          $rightsPassed=0;$referenceState='NOT_EXECUTED_OR_FAILED'
          $rp='p69r1-out/P69_ECB_REFERENCE_PUBLIC_NETWORK_RIGHTS_RECEIPT.json'
          if(Test-Path $rp){$x=Get-Content $rp -Raw|ConvertFrom-Json;if($x.status -eq 'PASS_P69_ECB_REFERENCE_PUBLIC_NETWORK_FREE_DISPLAY_BOUNDED' -and $x.rightsMeasurement.passed -eq 2 -and $x.rightsMeasurement.currentUniqueRightsObligations -eq 203){$rightsPassed=2;$referenceState='PASS_BOUNDED_FREE_PUBLIC_DISPLAY'}}
          $r=[ordered]@{schemaVersion='velmere.p69r1.github-boundary.v1';runId='${{ github.run_id }}';runAttempt='${{ github.run_attempt }}';sha='${{ github.sha }}';ref='${{ github.ref }}';runnerOs='${{ runner.os }}';runnerArch='${{ runner.arch }}';imageOs=$env:ImageOS;node=(node --version 2>$null);npm=(npm --version 2>$null);changedBuildRelevantFiles=6;projectionFileCount=1597;projectionPayloadBytes=20973332;projectionPathSetSha256='b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73';projectionAggregateSha256='eb7808e9779801228894e9f0eb179d816fe30a4810a0f50144ee5094cac7515b';generatedNextEnvProjectionPayloadBytes=20973317;generatedNextEnvProjectionAggregateSha256='eea147d722fd8f552f84597443a40524fb344c10a9de55b19551cbfc29e1c919';safeEgressSha256='af7fee5e7b1aabc125dd5c62f75394ba0a4bf4336852568163fadcbea9f6e70a';rightsPassed=$rightsPassed;rightsDenominator=203;referenceEnvelopeState=$referenceState;customerFinalOutputs=0;realMarketsFinalRows='0/3';paidValueTransitions='0/10';saleEligibleRows=0;live=$false;worldClassProven=$false;truthBoundary='Six-file exact current source. Safe-egress Node24 all:true fix is product code. ECB reference rights credit, if present, is limited to two FREE_PUBLIC_DISPLAY reference fields. No market.price, executable quote, final Real Markets row, paid-value, sale, LIVE or WORLD_CLASS promotion.'}
          $r|ConvertTo-Json -Depth 8|Set-Content p69r1-out/P69R1_GITHUB_BOUNDARY.json -Encoding utf8

      - name: Upload P69R1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p69r1-safe-egress-ecb-reference
          path: p69r1-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
