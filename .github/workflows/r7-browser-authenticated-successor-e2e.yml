name: R7 Browser Basic Authenticated Successor E2E

on:
  push:
    branches:
      - velmere-r7-v15-diagnostic-extract-20260825
    paths:
      - '.github/workflows/r7-browser-authenticated-successor-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  browser-basic-e2e:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
      NEXT_PUBLIC_SUPABASE_URL: 'https://yljjyowcvjgjcamffnvd.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_RTqLeQRrAJl6seP0ShSJlA_hyNo4Yz2'
      R7_E2E_BASE_URL: 'http://127.0.0.1:3100'
    steps:
      - name: Checkout diagnostic control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruct exact R7 v15 and apply verified successor v3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $Parts=@(Get-ChildItem -LiteralPath 'r7-runtime/parts' -File | Sort-Object Name)
          if($Parts.Count -ne 36){throw "expected 36 transport parts, got $($Parts.Count)"}
          $Encoded=[System.Collections.Generic.List[string]]::new()
          foreach($Part in $Parts){$Encoded.Add((Get-Content -LiteralPath $Part.FullName -Raw).TrimEnd("`r","`n"))}
          [IO.File]::WriteAllBytes('r7-runtime/R7_EXECUTION_SLICE.tar.zst',[Convert]::FromBase64String([string]::Concat($Encoded)))
          $BundleHash=(Get-FileHash 'r7-runtime/R7_EXECUTION_SLICE.tar.zst' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($BundleHash -ne 'fb4c3d2a9524ec4f60f2d21cb430131bf11cfc99b108c96d2ad7d8543c941c87'){throw "bundle SHA mismatch: $BundleHash"}
          $Zstd=(Get-Command zstd.exe -ErrorAction Stop).Source
          & $Zstd -d -f 'r7-runtime/R7_EXECUTION_SLICE.tar.zst' -o 'r7-runtime/R7_EXECUTION_SLICE.tar'
          if($LASTEXITCODE -ne 0){throw 'zstd failed'}
          New-Item -ItemType Directory -Force 'r7-work' | Out-Null
          tar.exe -xf 'r7-runtime/R7_EXECUTION_SLICE.tar' -C 'r7-work'
          if($LASTEXITCODE -ne 0){throw 'tar extraction failed'}

          $Expected=[ordered]@{
            'part-00.txt'='e39368d03e2ee3c5805bfb7205d017115faa521f927ed252122c4ecdef5e4db5'
            'part-01.txt'='50a6ff7c6dca043d99957cc81decf85e8e836873ca3962ff60752d2911c6606e'
            'part-02.txt'='8eb4150e86e5fde7e20f235a07cb9442861c16f744cf0da3cb76343cf860ff75'
            'part-03.txt'='ef5b36a35005a506e59fc8827c0f5be83be9f30ced431cbcb5a0299ac90586c0'
            'part-04.txt'='70d5449534ba5bffc54895a6c67168d709fc05c829d84f3ac5b1d5151a56f659'
            'part-05.txt'='541db5da57af86ed06b0a796a77eede62ded2b5e9c7e11fc4ca881779b47e171'
          }
          $Segments=[System.Collections.Generic.List[string]]::new()
          foreach($Name in $Expected.Keys){
            $Path=Join-Path 'diagnostic-patches/v3-parts' $Name
            $Hash=(Get-FileHash $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if($Hash -ne $Expected[$Name]){throw "patch chunk SHA mismatch: $Name"}
            $Segments.Add((Get-Content -LiteralPath $Path -Raw).Trim())
          }
          $Joined=[string]::Concat($Segments)
          if($Joined.Length -ne 10788){throw "patch base64 length mismatch: $($Joined.Length)"}
          [IO.File]::WriteAllBytes('successor-v3.patch.gz',[Convert]::FromBase64String($Joined))
          if((Get-FileHash 'successor-v3.patch.gz' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cf34c02b25c7077c45f95eafe88b0b3ae184c6ce6e66ffdc7c4f63ef0aa7b7c4'){throw 'patch gzip SHA mismatch'}
          gzip -t successor-v3.patch.gz
          if($LASTEXITCODE -ne 0){throw 'patch gzip CRC failed'}
          gzip -d -f successor-v3.patch.gz
          if((Get-FileHash 'successor-v3.patch' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '147435282063175d633d06ce5c313c9c8b9887bbe389645c292dbf2596884a54'){throw 'patch SHA mismatch'}
          git apply --check --directory=r7-work successor-v3.patch
          if($LASTEXITCODE -ne 0){throw 'successor patch check failed'}
          git apply --directory=r7-work successor-v3.patch
          if($LASTEXITCODE -ne 0){throw 'successor patch apply failed'}

      - name: Materialize exact PDF font and setup Node
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'r7-work/r7-runtime/external-assets' | Out-Null
          Copy-Item 'r7-runtime/external-assets/manrope-pdf-latin-plus-ext.ttf' 'r7-work/r7-runtime/external-assets/manrope-pdf-latin-plus-ext.ttf' -Force
          Copy-Item 'r7-runtime/external-assets/OFL-Manrope.txt' 'r7-work/r7-runtime/external-assets/OFL-Manrope.txt' -Force
          if((Get-FileHash 'r7-work/r7-runtime/external-assets/manrope-pdf-latin-plus-ext.ttf' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a07eea516ecb22957f162d68a559462c9af0534487669969d500f8e92aece0fa'){throw 'font SHA mismatch'}
          $AbsoluteFont=(Resolve-Path 'r7-work/r7-runtime/external-assets/manrope-pdf-latin-plus-ext.ttf').Path
          Add-Content $env:GITHUB_ENV "VELMERE_PDF_FONT_PATH=$AbsoluteFont"

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Exact npm 11.16.0 and npm ci
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:RUNNER_TEMP
          try { npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false; if($LASTEXITCODE -ne 0){throw 'npm pin failed'} } finally { Pop-Location }
          if((node --version).Trim() -ne 'v24.18.0'){throw 'Node mismatch'}
          if((npm --version).Trim() -ne '11.16.0'){throw 'npm mismatch'}
          npm ci --ignore-scripts=false --audit=false --fund=false
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}

      - name: Acquire ephemeral owner-authorized users and server capability through GitHub OIDC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $OidcUrl="$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=velmere-r7-browser-e2e"
          $Oidc=(Invoke-RestMethod -Uri $OidcUrl -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}).value
          $Provision=Invoke-RestMethod -Method Post -Uri 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-browser-e2e-oidc-session' -Headers @{Authorization="Bearer $Oidc"} -ContentType 'application/json' -Body '{"action":"provision"}'
          if(-not $Provision.ok){throw 'OIDC provision failed'}
          foreach($Secret in @([string]$Provision.a.accessToken,[string]$Provision.b.accessToken,[string]$Provision.serverCapability)){ Write-Host "::add-mask::$Secret" }
          Add-Content $env:GITHUB_ENV "R7_E2E_USER_A_JWT=$($Provision.a.accessToken)"
          Add-Content $env:GITHUB_ENV "R7_E2E_USER_B_JWT=$($Provision.b.accessToken)"
          Add-Content $env:GITHUB_ENV "R7_E2E_USER_A_ID=$($Provision.a.userId)"
          Add-Content $env:GITHUB_ENV "R7_E2E_USER_B_ID=$($Provision.b.userId)"
          Add-Content $env:GITHUB_ENV "R7_E2E_ACCOUNT_A=$($Provision.a.accountId)"
          Add-Content $env:GITHUB_ENV "R7_E2E_ACCOUNT_B=$($Provision.b.accountId)"
          Add-Content $env:GITHUB_ENV "VELMERE_BROWSER_SERVER_CAPABILITY=$($Provision.serverCapability)"

          function New-Secret([int]$Bytes=48){ $b=New-Object byte[] $Bytes; [Security.Cryptography.RandomNumberGenerator]::Fill($b); [Convert]::ToBase64String($b) }
          $Trusted=New-Secret 48; $Source=New-Secret 48; $Render=New-Secret 48; $Provider=New-Secret 48
          foreach($Secret in @($Trusted,$Source,$Render,$Provider)){Write-Host "::add-mask::$Secret"}
          Add-Content $env:GITHUB_ENV "VELMERE_TRUSTED_ACCOUNT_HEADER_HMAC_SECRET_CURRENT=$Trusted"
          Add-Content $env:GITHUB_ENV "VELMERE_LENS_SOURCE_TOKEN_SECRET_CURRENT=$Source"
          Add-Content $env:GITHUB_ENV "VELMERE_LENS_RENDER_TOKEN_SECRET_CURRENT=$Render"
          Add-Content $env:GITHUB_ENV "VELMERE_PROVIDER_RECEIPT_SIGNING_SECRET=$Provider"

      - name: Start full Next.js product locally on GitHub Windows
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference='Stop'
          $Out=Join-Path $PWD 'R7_BROWSER_E2E_NEXT_STDOUT.log'
          $Err=Join-Path $PWD 'R7_BROWSER_E2E_NEXT_STDERR.log'
          $Process=Start-Process -FilePath 'npm.cmd' -ArgumentList @('run','dev','--','--webpack','-p','3100') -WorkingDirectory $PWD -RedirectStandardOutput $Out -RedirectStandardError $Err -PassThru
          $Process.Id | Set-Content -LiteralPath 'R7_BROWSER_E2E_NEXT_PID.txt'
          $Ready=$false
          for($i=0;$i -lt 120;$i++){
            Start-Sleep -Seconds 1
            if($Process.HasExited){ Get-Content $Out -Tail 100 -ErrorAction SilentlyContinue; Get-Content $Err -Tail 100 -ErrorAction SilentlyContinue; throw "Next dev exited: $($Process.ExitCode)" }
            try { $R=Invoke-WebRequest -Uri 'http://127.0.0.1:3100/' -UseBasicParsing -TimeoutSec 2; if($R.StatusCode -ge 200 -and $R.StatusCode -lt 500){$Ready=$true;break} } catch {}
          }
          if(-not $Ready){ Get-Content $Out -Tail 100 -ErrorAction SilentlyContinue; Get-Content $Err -Tail 100 -ErrorAction SilentlyContinue; throw 'Next dev did not become ready' }

      - name: Execute real Browser Basic product-route E2E
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference='Stop'
          @'
          import { createHash, randomBytes } from "node:crypto";
          import { signTrustedAccountHeaders } from "../../lib/security/trusted-account-header-boundary";

          const base=process.env.R7_E2E_BASE_URL!;
          const trusted=process.env.VELMERE_TRUSTED_ACCOUNT_HEADER_HMAC_SECRET_CURRENT!;
          const a={accountId:process.env.R7_E2E_ACCOUNT_A!,token:process.env.R7_E2E_USER_A_JWT!,label:"a"};
          const b={accountId:process.env.R7_E2E_ACCOUNT_B!,token:process.env.R7_E2E_USER_B_JWT!,label:"b"};
          const sha=(bytes:Uint8Array|Buffer)=>createHash("sha256").update(bytes).digest("hex");
          const assert=(value:unknown,message:string):asserts value=>{if(!value)throw new Error(message)};
          const safeJson=async(res:Response)=>{const text=await res.text(); try{return JSON.parse(text)}catch{throw new Error(`invalid_json_status_${res.status}:${text.slice(0,180)}`)}};
          function signed(account:typeof a,url:string,method="GET",body=""){
            const contentType=body?"application/json":"";
            const headers:any={
              ...signTrustedAccountHeaders({
                requestUrl:url,method,timestamp:Math.floor(Date.now()/1000),nonce:randomBytes(24).toString("base64url"),
                accountId:account.accountId,displayName:`R7 Browser E2E ${account.label.toUpperCase()}`,handle:`@r7.e2e.${account.label}`,provider:"server",
                contentType,body,secret:trusted,
              }),
              authorization:`Bearer ${account.token}`,
            };
            if(contentType)headers["content-type"]=contentType;
            return headers;
          }

          const searchUrl=`${base}/api/search?q=EUR%2FUSD&mode=market&locale=en`;
          const searchRes=await fetch(searchUrl,{headers:{"cache-control":"no-store"}});
          assert(searchRes.status===200,`search_status_${searchRes.status}`);
          const search=await safeJson(searchRes);
          const result=(Array.isArray(search.results)?search.results:[]).find((row:any)=>typeof row?.lensSourceToken==="string"&&row.lensSourceToken.length>40);
          assert(result,"search_no_tokenized_real_result");
          assert(Array.isArray(result.sources)&&result.sources.some((s:any)=>s?.id==="ecb-statistics"),"search_not_ecb_reference_result");
          assert(result.officialReferenceSnapshot&&typeof result.officialReferenceSnapshot.responseSha256==="string","ecb_exact_response_receipt_missing");
          const sourceToken=result.lensSourceToken as string;

          const previewBody=JSON.stringify({sourceToken});
          const previewRes=await fetch(`${base}/api/search/lens-report?format=json&tier=basic&transport=token`,{method:"POST",headers:{"content-type":"application/json"},body:previewBody});
          assert(previewRes.status===200,`preview_status_${previewRes.status}`);
          const preview=await safeJson(previewRes);
          assert(preview.ok===true&&typeof preview.renderToken==="string","render_token_missing");
          assert(preview.report?.deliveryAuthority?.rightsReceiptSha256,"rights_receipt_missing");
          const renderToken=preview.renderToken as string;

          const pdfUrl=`${base}/api/search/lens-report?format=pdf&tier=basic`;
          const pdfBody=JSON.stringify({renderToken});
          const pdfRes=await fetch(pdfUrl,{method:"POST",headers:signed(a,pdfUrl,"POST",pdfBody),body:pdfBody});
          if(pdfRes.status!==200){const text=await pdfRes.text();throw new Error(`pdf_status_${pdfRes.status}:${text.slice(0,240)}`)}
          assert((pdfRes.headers.get("content-type")??"").startsWith("application/pdf"),"pdf_content_type_invalid");
          assert(pdfRes.headers.get("x-velmere-durable-computation")==="supabase","durable_computation_not_supabase");
          const artifactId=pdfRes.headers.get("x-velmere-account-artifact-id")??"";
          assert(artifactId.length>=8,"account_artifact_id_missing");
          const pdf=Buffer.from(await pdfRes.arrayBuffer());
          assert(pdf.subarray(0,5).toString("ascii")==="%PDF-","pdf_magic_invalid");
          const pdfSha=sha(pdf);
          const headerSha=(pdfRes.headers.get("x-velmere-pdf-sha256")??"").replace(/^sha256:/,"");
          assert(headerSha===pdfSha,"pdf_response_sha_mismatch");

          const jsonUrl=`${base}/api/account/customer-artifact?id=${encodeURIComponent(artifactId)}&format=json`;
          const ownJsonRes=await fetch(jsonUrl,{headers:signed(a,jsonUrl)});
          assert(ownJsonRes.status===200,`own_json_status_${ownJsonRes.status}`);
          const ownJson=await safeJson(ownJsonRes);
          assert(ownJson.ok===true&&ownJson.artifact?.artifactId===artifactId,"own_artifact_json_invalid");
          assert(ownJson.artifact?.exactStoredPdf===true&&ownJson.artifact?.previewDownloadByteIdentical===true,"exact_pdf_parity_marker_missing");
          assert(String(ownJson.artifact?.pdfSha256??"").replace(/^sha256:/,"")===pdfSha,"stored_metadata_sha_mismatch");

          const crossRes=await fetch(jsonUrl,{headers:signed(b,jsonUrl)});
          assert(crossRes.status===404,`cross_account_not_denied_${crossRes.status}`);

          const storedPdfUrl=`${base}/api/account/customer-artifact?id=${encodeURIComponent(artifactId)}&format=pdf&disposition=download`;
          const storedPdfRes=await fetch(storedPdfUrl,{headers:signed(a,storedPdfUrl)});
          assert(storedPdfRes.status===200,`stored_pdf_status_${storedPdfRes.status}`);
          const storedPdf=Buffer.from(await storedPdfRes.arrayBuffer());
          assert(sha(storedPdf)===pdfSha,"stored_pdf_not_same_blob");

          const readbackAgain=await fetch(jsonUrl,{headers:signed(a,jsonUrl)});
          assert(readbackAgain.status===200,"repeat_readback_failed");

          const receipt={schemaVersion:"velmere.r7.browser-basic-authenticated-successor-e2e.v1",status:"PASS_BROWSER_BASIC_PRODUCT_ROUTE_E2E",source:"ECB_OFFICIAL_REFERENCE_RATE",externalProvider:"ECB",providerNetworkReal:true,sourceResponseSha256:result.officialReferenceSnapshot.responseSha256,rightsReceiptSha256:preview.report.deliveryAuthority.rightsReceiptSha256,accountAOwnReadback:true,accountBCrossAccountDenied:true,durableComputation:"supabase",exactPdfByteParity:true,pdfSha256:`sha256:${pdfSha}`,pdfByteLength:pdf.length,artifactId,serviceRoleInApplication:false,serverCapabilityUsed:true,vercelUsed:false,customerFinalCredit:false};
          await import("node:fs/promises").then(fs=>fs.writeFile("R7_BROWSER_BASIC_AUTHENTICATED_SUCCESSOR_E2E.json",JSON.stringify(receipt,null,2)+"\n"));
          console.log(JSON.stringify({...receipt,artifactId:"<redacted-id>",sourceResponseSha256:"<sha256>",rightsReceiptSha256:"<sha256>",pdfSha256:"<sha256>"},null,2));
          '@ | Set-Content -LiteralPath 'scripts/current-execution/r7-browser-successor-live-e2e.mts' -Encoding utf8
          npx tsx scripts/current-execution/r7-browser-successor-live-e2e.mts
          if($LASTEXITCODE -ne 0){Get-Content 'R7_BROWSER_E2E_NEXT_STDOUT.log' -Tail 160 -ErrorAction SilentlyContinue;Get-Content 'R7_BROWSER_E2E_NEXT_STDERR.log' -Tail 160 -ErrorAction SilentlyContinue;throw "Browser live E2E failed: $LASTEXITCODE"}

      - name: Stop local Next runtime
        if: always()
        shell: pwsh
        working-directory: r7-work
        run: |
          if(Test-Path 'R7_BROWSER_E2E_NEXT_PID.txt'){$PidValue=[int](Get-Content 'R7_BROWSER_E2E_NEXT_PID.txt' -Raw).Trim();Stop-Process -Id $PidValue -Force -ErrorAction SilentlyContinue}

      - name: Cleanup ephemeral Supabase E2E users
        if: always()
        shell: pwsh
        run: |
          if(-not $env:R7_E2E_USER_A_ID -or -not $env:R7_E2E_USER_B_ID){exit 0}
          try {$OidcUrl="$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=velmere-r7-browser-e2e";$Oidc=(Invoke-RestMethod -Uri $OidcUrl -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}).value;$Body=@{action='cleanup';userIds=@($env:R7_E2E_USER_A_ID,$env:R7_E2E_USER_B_ID)} | ConvertTo-Json -Compress;$Cleanup=Invoke-RestMethod -Method Post -Uri 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-browser-e2e-oidc-session' -Headers @{Authorization="Bearer $Oidc"} -ContentType 'application/json' -Body $Body;Write-Host "Ephemeral E2E users cleaned: $($Cleanup.deleted)/$($Cleanup.requested)"} catch {Write-Warning 'Ephemeral E2E cleanup request failed; follow-up cleanup required.'}

      - name: Upload Browser E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-browser-basic-authenticated-successor-e2e-${{ github.run_id }}
          path: |
            r7-work/R7_BROWSER_BASIC_AUTHENTICATED_SUCCESSOR_E2E.json
            r7-work/R7_BROWSER_E2E_NEXT_STDOUT.log
            r7-work/R7_BROWSER_E2E_NEXT_STDERR.log
          if-no-files-found: warn
          retention-days: 2
