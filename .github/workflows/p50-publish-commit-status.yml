name: P50 Publish Final Attempt Commit Status

on:
  workflow_run:
    workflows:
      - P50 Native Windows Final Attempt With Encoded Result
    types:
      - completed

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'velmere-p47-p46-build-projection-windows-20260815'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish exact run and artifact pointer as commit status
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = '${{ github.event.workflow_run.id }}'
          $attempt = '${{ github.event.workflow_run.run_attempt }}'
          $conclusion = '${{ github.event.workflow_run.conclusion }}'.ToLowerInvariant()
          $headSha = '${{ github.event.workflow_run.head_sha }}'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $artifactUrl = "https://api.github.com/repos/${{ github.repository }}/actions/runs/$runId/artifacts?per_page=100"
          $artifacts = Invoke-RestMethod -Method Get -Uri $artifactUrl -Headers $headers
          $artifact = $artifacts.artifacts |
            Where-Object { $_.name -like 'p50-final-native-windows-p46-projection-*' } |
            Sort-Object -Property created_at -Descending |
            Select-Object -First 1
          $artifactId = if ($null -eq $artifact) { '0' } else { [string]$artifact.id }
          $state = if ($conclusion -eq 'success') { 'success' } else { 'failure' }
          $description = "run=$runId attempt=$attempt result=$conclusion artifact=$artifactId"
          if ($description.Length -gt 140) { $description = $description.Substring(0,140) }
          $body = @{
            state = $state
            context = 'velmere/p50-final-native-windows'
            description = $description
            target_url = '${{ github.event.workflow_run.html_url }}'
          } | ConvertTo-Json
          $statusUrl = "https://api.github.com/repos/${{ github.repository }}/statuses/$headSha"
          Invoke-RestMethod -Method Post -Uri $statusUrl -Headers $headers -Body $body -ContentType 'application/json'
          Write-Host $description
