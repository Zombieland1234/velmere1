name: P51 Native Windows Hidden P43 Commit Projection

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - '.github/workflows/p51-native-windows-hidden-p43-commit-projection.yml'

concurrency:
  group: p51-native-windows-hidden-p43-commit-projection-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  P51_P43_COMMIT: 90021b3afdd56828db2baa1b88f249307dd6ad2e
  P51_P46_COMMIT: 2d37f3c711aaf63b7f263971fccc93c5748f654e

jobs:
  native-windows-hidden-commit-projection:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout isolated P47 control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set exact Git byte and path behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config core.autocrlf false
          git config core.eol lf
          git config core.longpaths true

      - name: Recover exact historical source commit by object id
        id: recover
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p51-out | Out-Null
          $candidates = @($env:P51_P46_COMMIT, $env:P51_P43_COMMIT)
          $selected = $null
          $attempts = @()
          foreach ($candidate in $candidates) {
            $stdout = Join-Path $env:RUNNER_TEMP "fetch-$candidate.out.txt"
            $stderr = Join-Path $env:RUNNER_TEMP "fetch-$candidate.err.txt"
            $proc = Start-Process -FilePath git -ArgumentList @('fetch','--no-tags','--depth=1','origin',"$candidate`:refs/p51-candidates/$candidate") -Wait -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $attempts += [ordered]@{
              commit = $candidate
              exitCode = $proc.ExitCode
              stdout = (Get-Content -Raw -ErrorAction SilentlyContinue $stdout)
              stderr = (Get-Content -Raw -ErrorAction SilentlyContinue $stderr)
            }
            if ($proc.ExitCode -eq 0) {
              git cat-file -e "$candidate^{commit}"
              if ($LASTEXITCODE -eq 0) { $selected = $candidate; break }
            }
          }
          $attemptReceipt = [ordered]@{
            schemaVersion = 'velmere.p51.hidden-commit-recovery.v1'
            candidates = $candidates
            selected = $selected
            attempts = $attempts
            timestampUtc = [DateTime]::UtcNow.ToString('o')
          }
          $attemptReceipt | ConvertTo-Json -Depth 8 | Set-Content p51-out/P51_HIDDEN_COMMIT_RECOVERY.json -Encoding utf8
          if (-not $selected) { throw 'Neither exact P46 nor exact P43 historical commit was fetchable by object id.' }
          git worktree add --detach p51-source $selected
          if ($LASTEXITCODE -ne 0) { throw "git worktree failed: $LASTEXITCODE" }
          "selected_commit=$selected" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0 and locate CLI
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw "Exact Node mismatch: $(node --version)" }
          if ((npm --version).Trim() -ne '11.16.0') { throw "Exact npm mismatch: $(npm --version)" }
          $npmRoot = (npm root --global).Trim()
          $npmCli = (Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node --version
          npm --version
          python --version

      - name: Materialize byte-exact 1597-row projection manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "from pathlib import Path; import hashlib; root=Path('p50-existing-branch/manifest-parts'); p3=(root/'part-03.b64').read_bytes()[:9201]+(root/'part-03-suffix-from-9201.b64').read_bytes(); p56=bytearray((root/'part-05-06.b64').read_bytes()); assert len(p56)==20000; p56[17052]=105; chunks=[(root/'part-00.b64').read_bytes(),(root/'part-01-02.b64').read_bytes(),p3,(root/'part-04.b64').read_bytes()[:10000],bytes(p56),(root/'part-07-08.b64').read_bytes(),(root/'part-09.b64').read_bytes()]; data=b''.join(chunks); assert len(data)==99080, len(data); digest=hashlib.sha256(data).hexdigest(); assert digest=='b8a5b2770d17b894b5622c595a364c55fb2b14eb634b85c82a75b0fa1c3f7806', digest; Path('p50-existing-branch/P50_EXISTING_BRANCH_PROJECTION_MANIFEST.tsv.xz.b64').write_bytes(data); print({'byteLength':len(data),'sha256':digest})"
          if ($LASTEXITCODE -ne 0) { throw "Exact manifest materialization failed: $LASTEXITCODE" }

      - name: Reconstruct exact P46 build projection from recovered commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python p50-existing-branch/reconstruct-p50-existing-branch-projection.py `
            --checkout-root p51-source `
            --manifest-b64 p50-existing-branch/P50_EXISTING_BRANCH_PROJECTION_MANIFEST.tsv.xz.b64 `
            --meta p50-existing-branch/P50_EXISTING_BRANCH_PROJECTION_META.json `
            --output-root p51-work/source `
            --receipt p51-out/P51_HIDDEN_COMMIT_PROJECTION_RECONSTRUCTION.json
          if ($LASTEXITCODE -ne 0) { throw "Projection reconstruction failed: $LASTEXITCODE" }

      - name: Execute dependency SWC semantic lint and dual-build campaign
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.toolchain.outputs.npm_cli }}
        run: |
          $ErrorActionPreference = 'Stop'
          node p50-existing-branch/run-p47-product-windows-projection.mjs `
            --source-root p51-work/source `
            --manifest p51-work/P51_RUNTIME_PROJECTION_MANIFEST.json `
            --output-dir p51-out
          if ($LASTEXITCODE -ne 0) { throw "Native Windows projection campaign failed: $LASTEXITCODE" }

      - name: Capture workflow boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p51-out | Out-Null
          $boundary = [ordered]@{
            schemaVersion = 'velmere.p51.hidden-p43-native-windows-boundary.v1'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            ref = '${{ github.ref }}'
            sha = '${{ github.sha }}'
            recoveredSourceCommit = '${{ steps.recover.outputs.selected_commit }}'
            runnerOs = '${{ runner.os }}'
            runnerArch = '${{ runner.arch }}'
            imageOs = $env:ImageOS
            node = (node --version 2>$null)
            npm = (npm --version 2>$null)
            timestampUtc = [DateTime]::UtcNow.ToString('o')
            exactProjectionManifestSha256 = 'b8a5b2770d17b894b5622c595a364c55fb2b14eb634b85c82a75b0fa1c3f7806'
            truthBoundary = 'Credit is limited to exact P46 build-relevant projection engineering execution. Browser, PDF, customer outputs, rights, value, sale and LIVE remain separate.'
          }
          $boundary | ConvertTo-Json -Depth 8 | Set-Content p51-out/P51_GITHUB_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload P51 native Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p51-native-windows-hidden-p43-commit-projection
          path: p51-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
