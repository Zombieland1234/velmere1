name: P73R5 Projection Calibration

on:
  push:
    branches:
      - velmere-p73r5-frozen-readme-authority-20260817
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p73r5-projection-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout P73R5 control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reconstruct exact LF-canonical P73R4R3 parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p73cal-out
          python p49-build-projection/reconstruct-p49-direct-projection.py --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --runner p49-build-projection/run-p47-product-windows-projection.mjs --parts-root p49-build-projection/parts --work-root p73cal-work --output-root p73cal-out
          python p66-runtime/apply-p66-audit-pdf-delta.py --source-root p73cal-work/source --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --output-manifest p73cal-work/P66.json
          python p66-runtime/finalize-p66-shield-pro-row-id.py --source-root p73cal-work/source --manifest p73cal-work/P66.json
          python p66-runtime/fix-p66-topology-ts-const.py --source-root p73cal-work/source --manifest p73cal-work/P66.json
          python p68-runtime/apply-p68-audit-customer-truth.py --source-root p73cal-work/source --manifest p73cal-work/P66.json --output-manifest p73cal-work/P68.json
          python p69-runtime/apply-p69-ecb-reference-fx.py --source-root p73cal-work/source --manifest p73cal-work/P68.json --output-manifest p73cal-work/P69.json
          python p69-runtime/fix-p69r2-node24-pinned-egress.py --source-root p73cal-work/source --manifest p73cal-work/P69.json --output-manifest p73cal-work/P69R2.json --receipt p73cal-out/P69R2.json
          python p71-runtime/apply-p71-owner-truth-advanced-automation.py --source-root p73cal-work/source --manifest p73cal-work/P69R2.json --output-manifest p73cal-work/P71.json --receipt p73cal-out/P71.json
          python p71-runtime/apply-p71r1-expanded-advanced-automation.py --source-root p73cal-work/source --manifest p73cal-work/P71.json --output-manifest p73cal-work/P71R1.json --receipt p73cal-out/P71R1.json
          python p71-runtime/apply-p71r2-optional-qa-status.py --source-root p73cal-work/source --manifest p73cal-work/P71R1.json --output-manifest p73cal-work/P71R2.json --receipt p73cal-out/P71R2.json
          python p71-runtime/apply-p71r3-remove-stale-disclosure.py --source-root p73cal-work/source --manifest p73cal-work/P71R2.json --output-manifest p73cal-work/P71R5.json --receipt p73cal-out/P71R3.json
          python p72-runtime/apply-p72-commercial-topology-measurement.py --source-root p73cal-work/source --manifest p73cal-work/P71R5.json --output-manifest p73cal-work/P72.json --receipt p73cal-out/P72.json
          python p72-runtime/apply-p72r3-typescript-contract-repair.py --source-root p73cal-work/source --manifest p73cal-work/P72.json --output-manifest p73cal-work/P72R3.json --receipt p73cal-out/P72R3.json
          python p73-runtime/apply-p73r4-adjudicated-authority-engine.py --source-root p73cal-work/source --manifest p73cal-work/P72R3.json --output-manifest p73cal-work/P73R4R3.json --receipt p73cal-out/P73R4R3.json
      - name: Calibrate P73R5 replacement row and next-env identities
        shell: bash
        run: |
          set -euo pipefail
          python p73-runtime/calibrate-p73r5-projection.py --manifest p73cal-work/P73R4R3.json --replacement p73-runtime/p73r5-authority-evidence-source.ts --receipt p73cal-out/P73R5_PROJECTION_CALIBRATION.json
      - name: Upload calibration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p73r5-projection-calibration
          path: p73cal-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
