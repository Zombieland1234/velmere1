name: R44P31 External CI Storage KMS Email + Sigstore

on:
  pull_request:
    branches: [main]
    paths:
      - 'r44p31-evidence/**'
      - '.github/workflows/r44p31-external-ci-storage-kms-email.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: r44p31-external-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  external-ci-storage-kms-email:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: s3,kms
          DEBUG: '0'
          AWS_DEFAULT_REGION: us-east-1
          S3_SKIP_SIGNATURE_VALIDATION: '0'
          ENFORCE_IAM: '1'
        ports:
          - 4566:4566
      mailpit:
        image: axllent/mailpit:v1.20.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_ENDPOINT: http://127.0.0.1:4566
      MAILPIT_API: http://127.0.0.1:8025
      MAILPIT_SMTP_HOST: 127.0.0.1
      MAILPIT_SMTP_PORT: '1025'
      VELMERE_SOURCE_REVISION_ID: VELMERE_PASS36_A102R44P30_ACTION_REQUIRED_EXACT_CURRENT_BYTE_LINUX_DUAL_BUILD_BROWSER_PDF_AND_PARENT_EXTERNAL_RLS_NO_LIVE_CREDIT
      VELMERE_SOURCE_MANIFEST_SHA256: f58cf1eebaf0ad35976afa919bb0f53452e963c1b269d93f578829d342b9fcfa
      VELMERE_SOURCE_AGGREGATE_SHA256: 3620bb9336c8b913dbc036c86d2d2a95fdc6c2dbd3fa9553f7397e856249e105

    steps:
      - name: Checkout evidence runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'
          cache-dependency-path: r44p31-evidence/requirements.txt

      - name: Wait for disposable services
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4566/_localstack/health >/dev/null \
              && curl -fsS http://127.0.0.1:8025/api/v1/info >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Disposable services did not become ready' >&2
          exit 1

      - name: Install exact Python dependency closure and record bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r44p31-evidence/wheelhouse r44p31-evidence/evidence
          python -m pip download --disable-pip-version-check \
            --dest r44p31-evidence/wheelhouse \
            -r r44p31-evidence/requirements.txt
          sha256sum r44p31-evidence/wheelhouse/* \
            | sort > r44p31-evidence/evidence/PYTHON_DEPENDENCY_SHA256SUMS.txt
          python -m pip install --disable-pip-version-check --no-index \
            --find-links r44p31-evidence/wheelhouse \
            -r r44p31-evidence/requirements.txt
          python -m pip freeze --all \
            | sort > r44p31-evidence/evidence/PYTHON_ENVIRONMENT_FREEZE.txt

      - name: Syntax check immutable runner sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            r44p31-evidence/run_external_storage_kms_email.py \
            r44p31-evidence/verify_external_storage_kms_email.py
          sha256sum \
            r44p31-evidence/run_external_storage_kms_email.py \
            r44p31-evidence/verify_external_storage_kms_email.py \
            r44p31-evidence/requirements.txt \
            .github/workflows/r44p31-external-ci-storage-kms-email.yml \
            | sort > r44p31-evidence/evidence/RUNNER_SOURCE_SHA256SUMS.txt

      - name: Execute actual disposable storage KMS and e-mail denominator
        working-directory: r44p31-evidence
        shell: bash
        run: |
          set -euo pipefail
          python run_external_storage_kms_email.py \
            > evidence/R44P31_EXTERNAL_CI_EXECUTION.stdout.json \
            2> evidence/R44P31_EXTERNAL_CI_EXECUTION.stderr.log
          test ! -s evidence/R44P31_EXTERNAL_CI_EXECUTION.stderr.log

      - name: Independently verify semantic cases and physical artifacts
        working-directory: r44p31-evidence
        shell: bash
        run: |
          set -euo pipefail
          python verify_external_storage_kms_email.py \
            > evidence/R44P31_INDEPENDENT_VERIFIER.stdout.json \
            2> evidence/R44P31_INDEPENDENT_VERIFIER.stderr.log
          test ! -s evidence/R44P31_INDEPENDENT_VERIFIER.stderr.log

      - name: Record external runner and service identities
        working-directory: r44p31-evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('evidence')
          ps = subprocess.run(['docker','ps','--no-trunc','--format','{{json .}}'], check=True, capture_output=True, text=True)
          rows = [json.loads(line) for line in ps.stdout.splitlines() if line.strip()]
          identities = []
          for row in rows:
              cid = row.get('ID')
              if not cid:
                  continue
              inspect = json.loads(subprocess.run(['docker','inspect',cid], check=True, capture_output=True, text=True).stdout)[0]
              config = inspect.get('Config') or {}
              identities.append({
                  'idSha256': hashlib.sha256(str(inspect.get('Id','')).encode()).hexdigest(),
                  'image': config.get('Image'),
                  'imageId': inspect.get('Image'),
                  'platform': inspect.get('Platform'),
                  'state': {
                      'status': (inspect.get('State') or {}).get('Status'),
                      'health': ((inspect.get('State') or {}).get('Health') or {}).get('Status'),
                  },
              })
          out = {
              'schemaVersion': 'velmere.pass36.a102r44p31.external-runner-identity.v1',
              'github': {
                  'repository': os.environ.get('GITHUB_REPOSITORY'),
                  'sha': os.environ.get('GITHUB_SHA'),
                  'ref': os.environ.get('GITHUB_REF'),
                  'workflow': os.environ.get('GITHUB_WORKFLOW'),
                  'workflowRef': os.environ.get('GITHUB_WORKFLOW_REF'),
                  'runId': os.environ.get('GITHUB_RUN_ID'),
                  'runAttempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              },
              'services': sorted(identities, key=lambda x: str(x.get('image'))),
              'sourceBinding': {
                  'revisionId': os.environ.get('VELMERE_SOURCE_REVISION_ID'),
                  'sourceManifestSha256': os.environ.get('VELMERE_SOURCE_MANIFEST_SHA256'),
                  'sourceAggregateSha256': os.environ.get('VELMERE_SOURCE_AGGREGATE_SHA256'),
              },
          }
          data=(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n').encode()
          (root/'R44P31_EXTERNAL_RUNNER_IDENTITY.json').write_bytes(data)
          (root/'R44P31_EXTERNAL_RUNNER_IDENTITY.sha256').write_text(hashlib.sha256(data).hexdigest()+'\n')
          PY

      - name: Build deterministic evidence blob
        working-directory: r44p31-evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > evidence/GITHUB_CHECKOUT_SHA.txt
          find evidence -type f -print0 \
            | sort -z \
            | tar --null --files-from=- --sort=name \
              --mtime='UTC 2026-08-08 00:00:00' \
              --owner=0 --group=0 --numeric-owner \
              -czf r44p31-external-ci-storage-kms-email-evidence.tar.gz
          sha256sum r44p31-external-ci-storage-kms-email-evidence.tar.gz \
            > r44p31-external-ci-storage-kms-email-evidence.sha256

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Keyless-sign external evidence with GitHub OIDC
        working-directory: r44p31-evidence
        shell: bash
        run: |
          set -euo pipefail
          cosign version > COSIGN_VERSION.txt
          cosign sign-blob --yes \
            --bundle r44p31-external-ci-storage-kms-email-evidence.sigstore.json \
            r44p31-external-ci-storage-kms-email-evidence.tar.gz
          cosign verify-blob \
            --bundle r44p31-external-ci-storage-kms-email-evidence.sigstore.json \
            --certificate-identity-regexp '^https://github.com/Zombieland1234/velmere1/.github/workflows/r44p31-external-ci-storage-kms-email.yml@refs/(heads/r44p31-external-ci-storage-kms-email-20260808|pull/[0-9]+/merge)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            r44p31-external-ci-storage-kms-email-evidence.tar.gz \
            > R44P31_SIGSTORE_VERIFICATION.txt

      - name: Upload immutable external evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44p31-external-ci-storage-kms-email-sigstore-evidence
          path: |
            r44p31-evidence/evidence
            r44p31-evidence/R44P31_INDEPENDENT_EXTERNAL_CI_VERIFICATION.json
            r44p31-evidence/R44P31_SIGSTORE_VERIFICATION.txt
            r44p31-evidence/COSIGN_VERSION.txt
            r44p31-evidence/r44p31-external-ci-storage-kms-email-evidence.tar.gz
            r44p31-evidence/r44p31-external-ci-storage-kms-email-evidence.sha256
            r44p31-evidence/r44p31-external-ci-storage-kms-email-evidence.sigstore.json
            r44p31-evidence/run_external_storage_kms_email.py
            r44p31-evidence/verify_external_storage_kms_email.py
            r44p31-evidence/requirements.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
