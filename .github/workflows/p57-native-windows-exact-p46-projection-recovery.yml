name: P57 Native Windows Exact P46 Projection Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - 'p57-runtime/**'
      - '.github/workflows/p57-native-windows-exact-p46-projection-recovery.yml'

concurrency:
  group: p57-native-windows-exact-p46-projection-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  exact-projection-recovery-and-native-windows-build:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout complete control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Bind exact npm 11.16.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          $nodeVersion = (node --version).Trim()
          $npmVersion = (npm --version).Trim()
          if ($nodeVersion -ne 'v24.18.0') { throw "Exact Node mismatch: $nodeVersion" }
          if ($npmVersion -ne '11.16.0') { throw "Exact npm mismatch: $npmVersion" }
          python --version
          node --version
          npm --version

      - name: Download expanded bounded source corpus
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p57-artifacts,p57-out | Out-Null
          $ids = @(
            9249064395,
            9248833200,
            9248727103,
            9248005614,
            9247359383,
            9247242322,
            9244498847,
            9244253420,
            9243844560,
            9241088047,
            9241075339,
            9240890355,
            9240887081,
            9240829808,
            9240795184,
            9240790292,
            9240741267,
            9240394027,
            9240318158,
            9240228788,
            9240053462,
            9239916672,
            9239901247,
            9239883623,
            9239768175,
            9237664353,
            9236169616,
            9236042399,
            9225444344,
            9223613655,
            9223201233,
            9223177830,
            9222973896,
            9222945149,
            9222937036,
            9222608060,
            9222548885,
            9222320942,
            9221064567,
            9221009603,
            9221006368,
            9220870977,
            9220807309,
            9217803514,
            9215504066
          )
          $inventory = @()
          foreach ($id in $ids) {
            $out = "p57-artifacts/$id.zip"
            $uri = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip"
            Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -Uri $uri -OutFile $out
            if (-not (Test-Path -LiteralPath $out -PathType Leaf)) { throw "Artifact download missing: $id" }
            $item = Get-Item -LiteralPath $out
            $inventory += [ordered]@{
              id = $id
              byteLength = $item.Length
              sha256 = (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $inventory | ConvertTo-Json -Depth 6 | Set-Content p57-out/P57_DOWNLOADED_CORPUS_INVENTORY.json -Encoding utf8

      - name: Reconstruct exact 1597-file P46 projection with corrected headerless manifest parser
        id: reconstruct
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python p57-runtime/run-fixed-p54-reconstruction.py `
            --checkout-root . `
            --corpus-root p57-artifacts `
            --output-root p57-source `
            --work-root p57-work `
            --receipt p57-out/P57_EXACT_P46_PROJECTION_RECONSTRUCTION_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { throw "Exact P46 projection reconstruction failed: $LASTEXITCODE" }

      - name: Execute exact native Windows npm lifecycle, semantic, lint and dual-build closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./p54-runtime/run-p54-native-windows.ps1 `
            -SourceRoot p57-source `
            -OutRoot p57-out/native-windows `
            -ReconstructionReceipt p57-out/P57_EXACT_P46_PROJECTION_RECONSTRUCTION_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { throw "Native Windows exact projection build failed: $LASTEXITCODE" }

      - name: Emit P57 workflow boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p57-out | Out-Null
          $reconstruction = $null
          $native = $null
          if (Test-Path -LiteralPath p57-out/P57_EXACT_P46_PROJECTION_RECONSTRUCTION_RECEIPT.json) {
            $reconstruction = Get-Content -LiteralPath p57-out/P57_EXACT_P46_PROJECTION_RECONSTRUCTION_RECEIPT.json -Raw -Encoding utf8 | ConvertFrom-Json
          }
          if (Test-Path -LiteralPath p57-out/native-windows/P54_NATIVE_WINDOWS_EXACT_P46_BUILD_EXECUTION_RECEIPT.json) {
            $native = Get-Content -LiteralPath p57-out/native-windows/P54_NATIVE_WINDOWS_EXACT_P46_BUILD_EXECUTION_RECEIPT.json -Raw -Encoding utf8 | ConvertFrom-Json
          }
          $boundary = [ordered]@{
            schemaVersion = 'velmere.p57.exact-p46-native-windows-recovery-boundary.v1'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            ref = '${{ github.ref }}'
            sha = '${{ github.sha }}'
            runnerOs = '${{ runner.os }}'
            runnerArch = '${{ runner.arch }}'
            imageOs = $env:ImageOS
            node = (node --version 2>$null)
            npm = (npm --version 2>$null)
            reconstructionStatus = $(if ($null -ne $reconstruction) { [string]$reconstruction.status } else { 'MISSING' })
            nativeWindowsStatus = $(if ($null -ne $native) { [string]$native.status } else { 'NOT_EXECUTED_OR_MISSING' })
            exactTarget = [ordered]@{
              fileCount = 1597
              payloadBytes = 20952834
              pathSetSha256 = 'b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73'
              sourceContentAggregateSha256 = '83fd00183e9d8a6c5ec1c27dba81ab99679e204b50e8f45f414a45abd2bd21b7'
            }
            truthBoundary = 'Credit is limited to exact 1597-file P46 build-relevant reconstruction and native Windows engineering execution. Full source, Browser, PDF, customer outputs, rights, value, sale and LIVE remain excluded.'
          }
          $boundary | ConvertTo-Json -Depth 12 | Set-Content p57-out/P57_GITHUB_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload P57 exact reconstruction and native Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p57-exact-p46-projection-native-windows-recovery
          path: p57-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
