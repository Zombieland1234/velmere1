name: R7 Market Impact Finalizer Dispatch

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-market-impact-finalizer-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-finalizer:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded Market Impact finalizer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(printf '{"ref":"%s"}' "$REF_NAME")
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/workflows/r7-market-impact-finalizer.yml/dispatches" \
            -d "$body")
          if [ "$code" != "204" ]; then
            cat response.txt
            exit 1
          fi
          echo "guarded Market Impact finalizer dispatched for $REF_NAME"