name: R7 Audit Basic Closure Orchestrator

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-closure-orchestrator.yml'
      - 'r7-audit-basic-trigger/**'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-audit-basic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: Zombieland1234/velmere1
      TARGET_REF: velmere-r7-successor-delta-20260825
    steps:
      - name: Dispatch real Audit Basic closure gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r7/audit-basic
          python - <<'PY'
          import json, os, subprocess

          repository = os.environ['REPOSITORY']
          ref = os.environ['TARGET_REF']
          workflows = [
              'r7-audit-basic-app-route-current-source-e2e.yml',
              'r7-audit-basic-prospective-frozen-benchmark.yml',
              'r7-audit-basic-real-engine-a01-a05-repair.yml',
              'r7-audit-basic-app-route-candidate-e2e.yml',
              'r7-audit-basic-multicall3-remediation-retest-v2.yml',
              'r7-audit-basic-aderyn-external.yml',
              'r7-audit-basic-lifecycle-e2e.yml',
              'r7-audit-basic-bridge-e2e-v2.yml',
          ]
          results = []
          for workflow in workflows:
              command = [
                  'gh', 'api', '--method', 'POST',
                  f'repos/{repository}/actions/workflows/{workflow}/dispatches',
                  '-f', f'ref={ref}',
              ]
              completed = subprocess.run(command, text=True, capture_output=True)
              results.append({
                  'workflow': workflow,
                  'exitCode': completed.returncode,
                  'dispatched': completed.returncode == 0,
                  'stderr': completed.stderr.strip()[:500],
              })
          receipt = {
              'schemaVersion': 'velmere.r7.audit-basic-closure-dispatch.v2',
              'repository': repository,
              'ref': ref,
              'results': results,
              'allDispatched': all(row['dispatched'] for row in results),
              'technicalMandatoryGatesRequested': [
                  'promoted_customer_app_route',
                  'prospective_frozen_benchmark',
                  'exact_current_velmere_a01_a05',
              ],
              'qualifiedHumanReviewDispatched': False,
              'customerFinalCredit': False,
              'truthBoundary': 'Dispatch proves only that physical Audit Basic technical gates were requested. Qualified-human review remains separate and is never impersonated. Each workflow result, exact-source binding, immutable customer lifecycle and formal ledger transition remain independently required.',
          }
          with open('artifacts/r7/audit-basic/R7_AUDIT_BASIC_CLOSURE_DISPATCH.json','w',encoding='utf-8') as handle:
              json.dump(receipt, handle, indent=2)
              handle.write('\n')
          print(json.dumps(receipt, indent=2))
          if not receipt['allDispatched']:
              raise SystemExit(1)
          PY

      - name: Upload dispatch receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-closure-dispatch-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/r7/audit-basic/R7_AUDIT_BASIC_CLOSURE_DISPATCH.json
          if-no-files-found: error
          retention-days: 14

# R7 closure trigger: successor-continuation
# 2026-08-29 explicit execution retrigger: dispatch the complete physical Audit Basic closure gate set.