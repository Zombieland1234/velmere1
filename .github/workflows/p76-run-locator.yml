name: P76 Run Locator

on:
  push:
    branches:
      - velmere-p76-advanced-release-automation-postgres-20260818

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  publish-main-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish exact main P76 run URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows/p76-exact-windows-advanced-release-postgres.yml/runs?head_sha=${HEAD_SHA}&per_page=10"
          target=""
          for i in $(seq 1 30); do
            target="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" | python -c 'import json,sys; x=json.load(sys.stdin); runs=x.get("workflow_runs",[]); print(runs[0]["html_url"] if runs else "")')"
            [ -n "$target" ] && break
            sleep 2
          done
          [ -n "$target" ] || { echo 'main P76 run not found'; exit 1; }
          payload="$(TARGET="$target" python -c 'import json,os; print(json.dumps({"state":"pending","target_url":os.environ["TARGET"],"description":"P76 exact Windows + PostgreSQL run","context":"velmere/P76"}))')"
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json' -d "$payload" "https://api.github.com/repos/${REPO}/statuses/${HEAD_SHA}" >/dev/null
          echo "P76_MAIN_RUN=${target}"
