name: R7 Audit Basic Lifecycle E2E

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-lifecycle-e2e.yml'
      - 'r7-harness/run-r7-audit-basic-lifecycle-e2e-current.ps1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r7-audit-basic-lifecycle-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-basic-lifecycle-e2e:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      SUPABASE_URL: 'https://yljjyowcvjgjcamffnvd.supabase.co'
      AUDIT_OIDC_AUDIENCE: 'velmere-r7-audit-basic-e2e'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Execute Audit Basic exact PDF lifecycle V2
        shell: pwsh
        run: ./r7-harness/run-r7-audit-basic-lifecycle-e2e-current.ps1

      - name: Upload Audit Basic lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-lifecycle-v2-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/r7/audit-basic/lifecycle/R7_AUDIT_BASIC_LIFECYCLE_E2E_V2.json
          if-no-files-found: warn
          retention-days: 30
