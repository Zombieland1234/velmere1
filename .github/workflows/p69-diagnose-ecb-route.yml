name: P69 Diagnose ECB Route

on:
  push:
    branches:
      - velmere-p69-ecb-reference-fx-customer-envelope-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false
      - shell: pwsh
        run: npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
      - name: Reconstruct exact P69 projection and install deps
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force p69-out | Out-Null
          python p49-build-projection/reconstruct-p49-direct-projection.py --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --runner p49-build-projection/run-p47-product-windows-projection.mjs --parts-root p49-build-projection/parts --work-root p69-work --output-root p69-out | Out-Null
          python p66-runtime/apply-p66-audit-pdf-delta.py --source-root p69-work/source --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --output-manifest p69-work/P66.json | Out-Null
          python p66-runtime/finalize-p66-shield-pro-row-id.py --source-root p69-work/source --manifest p69-work/P66.json | Out-Null
          python p66-runtime/fix-p66-topology-ts-const.py --source-root p69-work/source --manifest p69-work/P66.json | Out-Null
          python p68-runtime/apply-p68-audit-customer-truth.py --source-root p69-work/source --manifest p69-work/P66.json --output-manifest p69-work/P68.json | Out-Null
          python p69-runtime/apply-p69-ecb-reference-fx.py --source-root p69-work/source --manifest p69-work/P68.json --output-manifest p69-work/P69.json | Out-Null
          Push-Location p69-work/source
          try { npm ci --ignore-scripts --audit=false --fund=false } finally { Pop-Location }
      - name: Diagnose product route and direct ECB transport
        shell: pwsh
        env:
          P69_SOURCE_ROOT: ${{ github.workspace }}\p69-work\source
          P69_RESULT_DIR: ${{ github.workspace }}\p69-out
        run: node --import ./p69-runtime/register-p69-ts-loader.mjs ./p69-runtime/diagnose-p69-ecb-route.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p69-ecb-route-diagnostic
          path: p69-out/P69_ECB_ROUTE_DIAGNOSTIC.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
