name: R13D verified source
on:
  push:
    branches: [r13d/backend-hardening-20260916]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r13d-verified-source
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Apply deterministic nonvisual lint fixes
        shell: python
        run: |
          from pathlib import Path
          replacements={
            'lib/market-integrity/coingecko.ts':[('  let row = null;','  let row: MarketIntegrityRow | null;',1)],
            'lib/security/audit-canonical-report.ts':[('      let classification: "A" | "B" | "C" | "D" | "E" | "F" = "B";','      let classification: "A" | "B" | "C" | "D" | "E" | "F";',1)],
            'lib/security/formal/formal-engine.ts':[('      let status: InvariantStatus = "NOT_RUN";','      let status: InvariantStatus;',1)],
            'lib/security/freshness/data-freshness-engine.ts':[('  let status: FreshnessStatus = "LIVE";','  let status: FreshnessStatus;',1)],
            'lib/security/institutional-pipeline-gate.ts':[
              ('let evidenceIntegrity = false;','let evidenceIntegrity: boolean;',1),
              ('let formalIntegrity = false;\n','',1),('let scoringIntegrity = false;\n','',1),('let pdfIntegrity = false;\n','',1),
              ('formalIntegrity = formalFailures.length === 0;','const formalIntegrity = formalFailures.length === 0;',1),
              ('scoringIntegrity = scoringFailures.length === 0;','const scoringIntegrity = scoringFailures.length === 0;',1),
              ('pdfIntegrity = pdfFailures.length === 0;','const pdfIntegrity = pdfFailures.length === 0;',1)],
            'lib/security/market-evidence/market-provenance-engine.ts':[('    let darkPoolStatus: TraditionalMarketMetrics["darkPoolStatus"] = "NOT_OBSERVED_INSUFFICIENT_DATA";','    let darkPoolStatus: TraditionalMarketMetrics["darkPoolStatus"];',1)],
            'lib/security/transient-storage-verifier.ts':[('  let forensicSummary = "";','  let forensicSummary: string;',1)],
            'lib/security/unified-audit-pipeline.ts':[('        let invStatus: FormalInvariantRecord["status"] = "UNKNOWN";','        let invStatus: FormalInvariantRecord["status"];',1)],
            'lib/server/market-integrity-route-modules/investigator.ts':[('  let marketRow = null;','  let marketRow: Awaited<ReturnType<typeof providers.searchMarket>>;',1)],
            'lib/server/search-route-modules/lens-report.ts':[('  let deliveryBinding: R7BrowserEcbDeliveryBinding | BrowserDerivedDeliveryBinding | null = null;','  let deliveryBinding: R7BrowserEcbDeliveryBinding | BrowserDerivedDeliveryBinding | null;',1)],
            'scripts/customer-campaign/run_deep_product_100.mjs':[('  let status = 0;','  let status;',1),('  let blocked = false;','  let blocked;',1),('  let details = "";','  let details;',1)],
            'scripts/final/run-650-executions.ts':[('        let screenshotHash = "";\n','',1),('        screenshotHash = crypto.createHash("sha256").update(screenshotBuf).digest("hex");','        const screenshotHash = crypto.createHash("sha256").update(screenshotBuf).digest("hex");',1)],
            'scripts/pass/run-pass-02.ts':[('  let binanceData: any = null;','  let binanceData: any;',1)],
            'scripts/pass36/execute-pass14-auth-tenant-fuzzing.mjs':[('    let passed = false;','    let passed;',1)],
            'scripts/qa/generate-agent14-artifact.js':[('    let firewallCheckPassed = false;','    let firewallCheckPassed;',1)],
            'scripts/release_gate/run_100_customers.ts':[('    let taskPassed = false;','    let taskPassed: boolean;',2),('    let taskDesc = "";','    let taskDesc: string;',2),('    let asset = "";','    let asset: string;',1)],
            'scripts/run_50_ai_clients_simulation.ts':[('  let reason = "";','  let reason: string;',1)],
            'scripts/world-class/run-total-audit-furnace.ts':[('  let browser: Browser | null = null;','  let browser: Browser;',1)],
            'tests/adversarial/extended-mutation-testing.test.ts':[('  let survived = false;','  let survived: boolean;',1)],
          }
          total=0
          for name,reps in replacements.items():
            p=Path(name); s=p.read_text(encoding='utf-8')
            for old,new,want in reps:
              if s.count(old)!=want: raise SystemExit(f'{name}: expected {want} of {old!r}, found {s.count(old)}')
              s=s.replace(old,new); total+=want
            p.write_text(s,encoding='utf-8')
          p=Path('scripts/release_gate/package-velmere-final.mjs'); s=p.read_text(encoding='utf-8')
          for old,new in [
            ('  // 3. Package SCRIPTS','  void testsFilesCount;\n\n  // 3. Package SCRIPTS'),
            ('  // 7. Package REPORTS - SHIELD','  void scReportsCount;\n\n  // 7. Package REPORTS - SHIELD'),
            ('  // 8. Package REPORTS - REAL MARKETS','  void shieldReportsCount;\n\n  // 8. Package REPORTS - REAL MARKETS'),
            ('  // 9. Package VERIFIER','  void rmReportsCount;\n\n  // 9. Package VERIFIER'),
            ('  // 10. Package BENCHMARKS','  void verifierCount;\n\n  // 10. Package BENCHMARKS')]:
            if s.count(old)!=1: raise SystemExit(f'anchor mismatch: {old}')
            s=s.replace(old,new,1); total+=1
          p.write_text(s,encoding='utf-8')
          if total!=37: raise SystemExit(f'expected 37 edits, got {total}')
          print('edits',total)
      - name: Prove zero visual source modifications
        shell: python
        run: |
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          bad=[p for p in paths if p.startswith(('components/','public/','styles/')) or (p.startswith('app/') and not p.startswith('app/api/')) or p.lower().endswith(('.css','.scss','.sass','.less','.woff','.woff2','.ttf','.otf'))]
          if bad: raise SystemExit('VISUAL_CHANGE_FORBIDDEN: '+', '.join(bad))
          print('nonvisual changed files',len(paths))
      - name: Full ESLint classification
        shell: bash
        run: |
          npx eslint . --format json > r13d-eslint.json || true
          python - <<'PY'
          import json,collections,pathlib
          rows=json.load(open('r13d-eslint.json')); be=[]; ue=[]; ws=[]
          def norm(fp):
            fp=fp.replace('\\','/')
            marker='/velmere1/'
            if marker in fp: return fp.split(marker,1)[1]
            p=pathlib.PurePosixPath(fp)
            parts=list(p.parts)
            if 'velmere1' in parts: return '/'.join(parts[parts.index('velmere1')+1:])
            return fp.lstrip('./')
          def ui(p):
            low=p.lower()
            return p.startswith(('components/','public/','styles/')) or (p.startswith('app/') and not p.startswith('app/api/')) or low.endswith(('.css','.scss','.sass','.less','.woff','.woff2','.ttf','.otf'))
          for r in rows:
            rel=norm(r['filePath'])
            for m in r.get('messages',[]):
              rec={'file':rel,'line':m.get('line'),'rule':m.get('ruleId'),'message':m.get('message')}
              if m.get('severity')==2: (ue if ui(rel) else be).append(rec)
              else: ws.append(rec)
          summary={'backendHardErrors':len(be),'uiOwnedHardErrors':len(ue),'warnings':len(ws),'uiErrors':ue,'backendErrorRules':dict(collections.Counter(x['rule'] for x in be))}
          json.dump(summary,open('r13d-eslint-classification.json','w'),indent=2)
          print(json.dumps(summary,indent=2))
          if be: raise SystemExit(f'{len(be)} backend hard lint errors remain')
          PY
      - name: Full TypeScript
        run: npm run typecheck | tee r13d-typecheck.txt
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build | tee r13d-build.txt
      - name: Entitlement regression
        run: node --experimental-vm-modules --experimental-strip-types --test scripts/r13/*.test.mjs scripts/r13b/*.test.mjs | tee r13d-entitlement.tap
      - name: Red-team regression
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs --test test/security/adversarial-red-team.test.ts | tee r13d-redteam.tap
      - name: Commit and push verified source to isolated branch
        shell: bash
        run: |
          git config user.name "Zombieland1234"
          git config user.email "velmere141@gmail.com"
          git add lib app/api scripts tests test .agents || true
          git commit -m "fix(r13d): verified nonvisual hardening" || true
          git push --force-with-lease origin HEAD:refs/heads/r13d/verified-source-20260916
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r13d-verified-source-evidence-${{ github.sha }}
          path: |
            r13d-eslint.json
            r13d-eslint-classification.json
            r13d-typecheck.txt
            r13d-build.txt
            r13d-entitlement.tap
            r13d-redteam.tap
          if-no-files-found: warn
          retention-days: 14