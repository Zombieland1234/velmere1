name: R5 Exact Bounded Dependency CAS

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-r5-exact-bounded-deps-20260823
    paths:
      - .github/workflows/r5-exact-bounded-dependency-cas.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Download and verify exact bounded tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-exact-bounded-deps/cas
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const packages = [
            {
              name: 'react', version: '19.2.7',
              url: 'https://registry.npmjs.org/react/-/react-19.2.7.tgz',
              integrity: 'sha512-HNe9WslTbXmFK8o8cmwgAeJFSBvt1bPdHCVKtaaV+WlAN36mpT4hcRpwbf3fY56ar2oIXzsBpOAiIRHAdY0OlQ==',
              sha256: 'd0065884db7670ffb89046826995cf0d7754a31653d23908532e52671bf83d7d',
              byteLength: 24805,
            },
            {
              name: 'react-dom', version: '19.2.7',
              url: 'https://registry.npmjs.org/react-dom/-/react-dom-19.2.7.tgz',
              integrity: 'sha512-t0BRVXvbiE/o20Hfw669rLbMCDWtYZLvmJigy2f0MxsXF+71pxhR3xOkspmsO8h3ZlNzyibAmtCa3l4lYKk6gQ==',
              sha256: 'e47bae602149b38b90b452c89e53d2d60639fee09361d90374983a6aac62739e',
              byteLength: 1276388,
            },
            {
              name: 'scheduler', version: '0.27.0',
              url: 'https://registry.npmjs.org/scheduler/-/scheduler-0.27.0.tgz',
              integrity: 'sha512-eNv+WrVbKu1f3vbYJT/xtiF5syA5HPIMtf9IgY/nKg0sWqzAUEvqY/xm7OcZc/qafLx/iO9FgOmeSAp4v5ti/Q==',
              sha256: 'ab26ce35ce4032f04b78cfc5bbb4cfe13358e9fe7a5433a8aa6315c3debc5095',
              byteLength: 10015,
            },
            {
              name: 'typescript', version: '5.9.3',
              url: 'https://registry.npmjs.org/typescript/-/typescript-5.9.3.tgz',
              integrity: 'sha512-jl1vZzPDinLr9eUt3J/t7V6FgNEw9QjvBPdysz9KfQDD41fQrC2Y4vKQdiaUpFT4bXlb1RHhLpp8wtm6M5TgSw==',
              sha256: '10e108c9cf7d5f2879053dff18515fb405abf2ccef63eaaf017d9c571687a1d3',
              byteLength: 4377468,
            },
            {
              name: '@electric-sql/pglite', version: '0.5.4',
              url: 'https://registry.npmjs.org/@electric-sql/pglite/-/pglite-0.5.4.tgz',
              integrity: 'sha512-yYZUyyXrHU7tPlCjwZQJ6hIG9DscdCCn7Uk0mYKwC1FeHX286AbcmFveMiRBEak8e9iPupjsoVImN3yJZVed2g==',
              sha256: '2c0114a4d836358733a8414be1d1670b85e18cac561c598ad9de8cdb884fbd18',
              byteLength: 8778518,
            },
          ];

          const digest = (algorithm, bytes, encoding = 'hex') => crypto.createHash(algorithm).update(bytes).digest(encoding);
          const out = path.resolve('r5-exact-bounded-deps');
          const rows = [];

          (async () => {
            for (const item of packages) {
              const response = await fetch(item.url, { redirect: 'error', headers: { 'user-agent': 'Velmere-R5-Exact-Bounded-Dependency-Recovery/1.0' } });
              if (!response.ok) throw new Error(`download_failed:${item.name}:${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              const actualSha256 = digest('sha256', bytes);
              const actualIntegrity = `sha512-${digest('sha512', bytes, 'base64')}`;
              if (bytes.length !== item.byteLength) throw new Error(`byte_length_mismatch:${item.name}:${bytes.length}:${item.byteLength}`);
              if (actualSha256 !== item.sha256) throw new Error(`sha256_mismatch:${item.name}:${actualSha256}:${item.sha256}`);
              if (actualIntegrity !== item.integrity) throw new Error(`integrity_mismatch:${item.name}:${actualIntegrity}:${item.integrity}`);
              const casPath = path.join(out, 'cas', `${item.sha256}.tgz`);
              fs.writeFileSync(casPath, bytes);
              rows.push({
                ...item,
                actualSha256,
                actualIntegrity,
                downloadedByteLength: bytes.length,
                casFile: `cas/${item.sha256}.tgz`,
                status: 'PASS_EXACT_BYTES',
              });
            }
            const aggregate = crypto.createHash('sha256');
            for (const row of [...rows].sort((a,b) => a.casFile.localeCompare(b.casFile))) {
              aggregate.update(row.casFile); aggregate.update('\0');
              aggregate.update(fs.readFileSync(path.join(out, row.casFile))); aggregate.update('\0');
            }
            const receipt = {
              schemaVersion: 'velmere.r5.exact-bounded-dependency-cas.v1',
              generatedAt: new Date().toISOString(),
              sourceBinding: {
                packageLockSha256: 'e228adec08801e454ef5559a20f302110b4896a307c364195716218a376c48bb',
                historicalManifestSha256: '5c4fb690b19371b87da6252abce586f346648434aefec65222d02ef2cf675c3c',
              },
              runtime: { node: process.version, platform: process.platform, arch: process.arch },
              denominator: { required: packages.length, downloaded: rows.length, failed: 0 },
              aggregateSha256: aggregate.digest('hex'),
              rows,
              status: 'PASS_EXACT_BOUNDED_DEPENDENCY_BYTES',
              truthBoundary: 'Five exact tarballs only. This does not prove the full 618-tarball graph, lifecycle scripts, application build, staging, Windows, Customer FINAL, paid value, sale or LIVE.',
            };
            fs.writeFileSync(path.join(out, 'VELMERE_R5_EXACT_BOUNDED_DEPENDENCY_CAS_RECEIPT.json'), `${JSON.stringify(receipt, null, 2)}\n`);
            console.log(JSON.stringify({ status: receipt.status, denominator: receipt.denominator, aggregateSha256: receipt.aggregateSha256 }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Upload exact bounded CAS
        uses: actions/upload-artifact@v4
        with:
          name: r5-exact-bounded-dependency-cas
          path: r5-exact-bounded-deps
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
