name: P70R4 Exact Windows Audit Target PDF Identity

on:
  push:
    branches:
      - velmere-p70-audit-target-identity-20260817
  workflow_dispatch:

concurrency:
  group: p70r4-exact-windows-audit-target-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p70r4-current-source:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout P70R4 control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        id: npmcli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }
          $npmRoot=(npm root --global).Trim()
          $npmCli=(Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node --version
          npm --version
          python --version

      - name: Reconstruct exact P70R4 current product bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config core.autocrlf false
          git config core.eol lf
          New-Item -ItemType Directory -Force p70r4-out | Out-Null
          python p49-build-projection/reconstruct-p49-direct-projection.py `
            --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json `
            --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f `
            --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json `
            --runner p49-build-projection/run-p47-product-windows-projection.mjs `
            --parts-root p49-build-projection/parts `
            --work-root p70r4-work `
            --output-root p70r4-out
          if ($LASTEXITCODE -ne 0) { throw "P46 reconstruction failed: $LASTEXITCODE" }
          python p66-runtime/apply-p66-audit-pdf-delta.py --source-root p70r4-work/source --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --output-manifest p70r4-work/P66.json | Tee-Object -FilePath p70r4-out/P66_STAGE1.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage1 failed: $LASTEXITCODE" }
          python p66-runtime/finalize-p66-shield-pro-row-id.py --source-root p70r4-work/source --manifest p70r4-work/P66.json | Tee-Object -FilePath p70r4-out/P66_STAGE2.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage2 failed: $LASTEXITCODE" }
          python p66-runtime/fix-p66-topology-ts-const.py --source-root p70r4-work/source --manifest p70r4-work/P66.json | Tee-Object -FilePath p70r4-out/P66_STAGE3.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage3 failed: $LASTEXITCODE" }
          python p68-runtime/apply-p68-audit-customer-truth.py --source-root p70r4-work/source --manifest p70r4-work/P66.json --output-manifest p70r4-work/P68.json | Tee-Object -FilePath p70r4-out/P68_STAGE.log
          if ($LASTEXITCODE -ne 0) { throw "P68 stage failed: $LASTEXITCODE" }
          python p69-runtime/apply-p69-ecb-reference-fx.py --source-root p70r4-work/source --manifest p70r4-work/P68.json --output-manifest p70r4-work/P69.json | Tee-Object -FilePath p70r4-out/P69_STAGE.log
          if ($LASTEXITCODE -ne 0) { throw "P69 stage failed: $LASTEXITCODE" }
          python p69-runtime/fix-p69r2-node24-pinned-egress.py --source-root p70r4-work/source --manifest p70r4-work/P69.json --output-manifest p70r4-work/P69R2.json --receipt p70r4-out/P70R4_PARENT_P69R2_RECONSTRUCTION.json | Tee-Object -FilePath p70r4-out/P69R2_STAGE.log
          if ($LASTEXITCODE -ne 0) { throw "P69R2 stage failed: $LASTEXITCODE" }
          python p70-runtime/apply-p70-audit-target-identity.py --source-root p70r4-work/source --manifest p70r4-work/P69R2.json --output-manifest p70r4-work/P70.json --receipt p70r4-out/P70_AUDIT_TARGET_IDENTITY_SOURCE_REPAIR.json
          if ($LASTEXITCODE -ne 0) { throw "P70 source patch failed: $LASTEXITCODE" }
          python p70-runtime/apply-p70r1-numbered-target-renderer.py --source-root p70r4-work/source --manifest p70r4-work/P70.json --output-manifest p70r4-work/P70R4.json --receipt p70r4-out/P70R4_NUMBERED_TARGET_RENDERER_REPAIR.json
          if ($LASTEXITCODE -ne 0) { throw "P70R4 renderer patch failed: $LASTEXITCODE" }
          $m=Get-Content p70r4-work/P70R4.json -Raw | ConvertFrom-Json
          if ($m.projection.fileCount -ne 1597 -or $m.projection.payloadBytes -ne 20973292 -or $m.projection.pathSetSha256 -ne 'b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73' -or $m.projection.sourceContentAggregateSha256 -ne '6d400af1c8a042b9f1b9876744dc4e00d8786bb480a989cb78b477674760ee54') { throw 'P70R4 projection identity mismatch' }
          Copy-Item p70r4-work/P70R4.json p70r4-out/P70R4_BUILD_PROJECTION_MANIFEST.json

      - name: Verify owner corrected topology remains exact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location p70r4-work/source
          try {
            node --experimental-strip-types -e "import('./lib/product/vlm-canonical-product-topology.ts').then(m=>{const r=m.VLM_CANONICAL_CUSTOMER_PRODUCTS,f=m.VLM_CANONICAL_PRODUCT_FAMILIES,p=m.VLM_INTERNAL_EXECUTION_PROFILES,t=m.VLM_CONTEXT_TRANSITIONS;const fake=r.filter(x=>['angel','whale-watch','market-impact','shield-map','risk-indicator'].includes(x.family)&&x.tier!==null);if(r.length!==20||f.length!==10||p.length!==20||t.length!==10||fake.length||f.some(x=>x.family==='pdf')||m.VLM_V16_TOPOLOGY_DENOMINATORS.legacy33ProductCompletionDenominatorRetired!==true)process.exit(2);console.log(JSON.stringify({status:'PASS_P70R4_TOPOLOGY_RETENTION',rows:20,families:10,profiles:20,transitions:10,fakeStandaloneTiers:0,pdfFamily:false}))}).catch(e=>{console.error(e);process.exit(1)})"
            if ($LASTEXITCODE -ne 0) { throw "P70R4 topology verifier failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Exact Windows dependency semantic lint and dual build
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.npmcli.outputs.npm_cli }}
        run: |
          $ErrorActionPreference='Stop'
          python p60-runtime/build-p60-reconciled-runner.py --input p49-build-projection/run-p47-product-windows-projection.mjs --output p70r4-work/run-p70r4-reconciled-windows-projection.mjs --receipt p70r4-out/P70R4_BASE_RECONCILED_RUNNER.json
          if ($LASTEXITCODE -ne 0) { throw 'base runner generation failed' }
          python p66-runtime/patch-p66-reconciled-runner.py --runner p70r4-work/run-p70r4-reconciled-windows-projection.mjs --receipt p70r4-out/P70R4_P66_NEXT_ENV_PATCH.json
          python p68-runtime/patch-p68-reconciled-runner.py --runner p70r4-work/run-p70r4-reconciled-windows-projection.mjs --receipt p70r4-out/P70R4_P68_NEXT_ENV_PATCH.json
          python p69-runtime/patch-p69-reconciled-runner.py --runner p70r4-work/run-p70r4-reconciled-windows-projection.mjs --receipt p70r4-out/P70R4_P69_NEXT_ENV_PATCH.json
          python p69-runtime/patch-p69r2-reconciled-runner.py --runner p70r4-work/run-p70r4-reconciled-windows-projection.mjs --receipt p70r4-out/P70R4_P69R2_NEXT_ENV_PATCH.json
          python p70-runtime/patch-p70-reconciled-runner.py --runner p70r4-work/run-p70r4-reconciled-windows-projection.mjs --receipt p70r4-out/P70R4_P70_NEXT_ENV_PATCH.json
          python p70-runtime/patch-p70r1-reconciled-runner.py --runner p70r4-work/run-p70r4-reconciled-windows-projection.mjs --receipt p70r4-out/P70R4_CURRENT_NEXT_ENV_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P70R4 runner adaptation failed' }
          node --check p70r4-work/run-p70r4-reconciled-windows-projection.mjs
          if ($LASTEXITCODE -ne 0) { throw 'P70R4 runner parse failed' }
          node p70r4-work/run-p70r4-reconciled-windows-projection.mjs --source-root p70r4-work/source --manifest p70r4-work/P70R4.json --output-dir p70r4-out
          if ($LASTEXITCODE -ne 0) { throw "P70R4 exact Windows engineering failed: $LASTEXITCODE" }

      - name: Execute Audit account target identity runtime
        shell: pwsh
        env:
          P69_SOURCE_ROOT: ${{ github.workspace }}\p70r4-work\source
          P70_SOURCE_ROOT: ${{ github.workspace }}\p70r4-work\source
          P70_RESULT_DIR: ${{ github.workspace }}\p70r4-out
        run: |
          $ErrorActionPreference='Stop'
          node --import ./p69-runtime/register-p69-ts-loader.mjs ./p70-runtime/test-p70-audit-target-identity.mjs
          if ($LASTEXITCODE -ne 0) { throw "P70R4 target identity runtime failed: $LASTEXITCODE" }

      - name: Install pinned solc 0.8.12
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force p70r4-toolchain | Out-Null
          '{"private":true}' | Set-Content p70r4-toolchain/package.json -Encoding utf8
          node "${{ steps.npmcli.outputs.npm_cli }}" install --prefix p70r4-toolchain solc@0.8.12 --ignore-scripts --audit=false --fund=false --save-exact
          if ($LASTEXITCODE -ne 0) { throw "solc install failed: $LASTEXITCODE" }
          $v=node -e "const s=require('./p70r4-toolchain/node_modules/solc'); process.stdout.write(s.version())"
          if (-not $v.StartsWith('0.8.12+commit.f00d7308')) { throw "solc mismatch: $v" }
          $v | Set-Content p70r4-out/P70R4_SOLC_VERSION.txt -Encoding utf8

      - name: Execute real deployed Audit reference evidence
        shell: pwsh
        env:
          P69_SOURCE_ROOT: ${{ github.workspace }}\p70r4-work\source
          P70_SOURCE_ROOT: ${{ github.workspace }}\p70r4-work\source
          P70_RESULT_DIR: ${{ github.workspace }}\p70r4-out
          P70_SOLC_ROOT: ${{ github.workspace }}\p70r4-toolchain
        run: |
          $ErrorActionPreference='Stop'
          node --import ./p69-runtime/register-p69-ts-loader.mjs ./p70-runtime/run-p70-real-multicall3-audit-expanded-rpc.mjs
          if ($LASTEXITCODE -ne 0) { throw "P70R4 real deployed Audit reference failed: $LASTEXITCODE" }

      - name: Verify exact target physically encoded in all 9 PDFs
        shell: pwsh
        env:
          P70_RESULT_DIR: ${{ github.workspace }}\p70r4-out
        run: |
          $ErrorActionPreference='Stop'
          node ./p70-runtime/verify-p70r4-real-pdf-target-bytes.mjs
          if ($LASTEXITCODE -ne 0) { throw "P70R4 physical target PDF verification failed: $LASTEXITCODE" }

      - name: Capture P70R4 workflow boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p70r4-out | Out-Null
          $refState='NOT_EXECUTED_OR_FAILED'; $targetState='NOT_EXECUTED_OR_FAILED'; $pdfTargetState='NOT_EXECUTED_OR_FAILED'
          if(Test-Path 'p70r4-out/P70_REAL_DEPLOYED_AUDIT_REFERENCE_EVIDENCE.json'){$e=Get-Content 'p70r4-out/P70_REAL_DEPLOYED_AUDIT_REFERENCE_EVIDENCE.json' -Raw|ConvertFrom-Json;if($e.credit.realDeployedReferenceTarget -eq 1 -and $e.credit.realChainProviderQuorum -eq $true -and $e.credit.sourceRuntimeBinding -eq $true -and $e.credit.realTargetAuditPdfCases -eq 9){$refState='PASS_REAL_REFERENCE_NO_PROMOTION'}}
          if(Test-Path 'p70r4-out/P70_AUDIT_TARGET_IDENTITY_RUNTIME.json'){$t=Get-Content 'p70r4-out/P70_AUDIT_TARGET_IDENTITY_RUNTIME.json' -Raw|ConvertFrom-Json;if($t.status -eq 'PASS_P70_AUDIT_TARGET_IDENTITY_BOUND_NO_PROMOTION'){$targetState='PASS_BOUNDED'}}
          if(Test-Path 'p70r4-out/P70R4_REAL_REFERENCE_PDF_TARGET_BYTES.json'){$p=Get-Content 'p70r4-out/P70R4_REAL_REFERENCE_PDF_TARGET_BYTES.json' -Raw|ConvertFrom-Json;if($p.status -eq 'PASS_P70R4_TARGET_ADDRESS_PHYSICALLY_ENCODED_9_OF_9_NO_PROMOTION'){$pdfTargetState='PASS_9_OF_9'}}
          $b=[ordered]@{schemaVersion='velmere.p70r4.github-workflow-boundary.v1';runId='${{ github.run_id }}';runAttempt='${{ github.run_attempt }}';sha='${{ github.sha }}';ref='${{ github.ref }}';runnerOs='${{ runner.os }}';runnerArch='${{ runner.arch }}';imageOs=$env:ImageOS;node=(node --version 2>$null);npm=(npm --version 2>$null);changedBuildRelevantFilesSinceP69R2=2;projectionFileCount=1597;projectionPayloadBytes=20973292;projectionPathSetSha256='b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73';projectionAggregateSha256='6d400af1c8a042b9f1b9876744dc4e00d8786bb480a989cb78b477674760ee54';generatedNextEnvProjectionPayloadBytes=20973277;generatedNextEnvProjectionAggregateSha256='59c64fedd078e5e4f9f0989f8fe9a973c23ff0dc4cb810b8da564447ad08e172';targetIdentityState=$targetState;realReferenceState=$refState;physicalPdfTargetState=$pdfTargetState;productFamilies=10;customerFacingRows=20;currentExecutionProfiles=20;paidValueTransitions=10;rightsPassed=2;rightsDenominator=203;customerFinalOutputs=0;auditFinalCustomerPdfs=0;saleEligibleRows=0;live=$false;worldClassProven=$false;truthBoundary='P70R4 closes the discovered Audit target-address rendering defect on exact current bytes and verifies one real deployed reference target plus nine internal tier/locale PDFs at physical byte level. These remain internal reference artifacts and grant no vulnerability-ground-truth, customer-final, final Audit PDF, provider-rights, paid-value, sale, LIVE or WORLD_CLASS promotion.'}
          $b | ConvertTo-Json -Depth 8 | Set-Content p70r4-out/P70R4_GITHUB_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload P70R4 exact Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p70r4-exact-windows-audit-target-pdf-identity
          path: p70r4-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
