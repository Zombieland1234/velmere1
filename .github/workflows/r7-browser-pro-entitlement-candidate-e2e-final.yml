name: R7 Browser Pro Entitlement Candidate E2E Final

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-browser-pro-entitlement-candidate-e2e-final.yml'
      - 'r7-browser-pro-harness/**'
      - 'r7-risk-v5/run-r7-risk-v5-exact-windows-execution-slice-fixed.ps1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r7-browser-pro-entitlement-candidate-e2e-final-accelerated-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-pro-candidate-e2e-final:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - name: Checkout exact Browser Pro candidate controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Prepare exact hash-bound Risk/Browser base
        shell: pwsh
        run: ./r7-risk-v5/run-r7-risk-v5-exact-windows-execution-slice-fixed.ps1 -Mode Prepare

      - name: Apply Browser Pro entitlement candidate patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'r7-work/artifacts/r7/browser-pro' | Out-Null
          & node 'r7-browser-pro-harness/patch-browser-pro-entitlement-bridge-candidate-v2.mjs' 'r7-work' | Tee-Object -FilePath 'r7-work/artifacts/r7/browser-pro/R7_BROWSER_PRO_ENTITLEMENT_PATCH_RECEIPT.json'
          if ($LASTEXITCODE -ne 0) { throw "browser_pro_candidate_patch_failed:$LASTEXITCODE" }

      - name: Validate Browser Pro post-patch engineering gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'r7-work'
          try {
            npm run typecheck 2>&1 | Tee-Object -FilePath 'artifacts/r7/browser-pro/R7_BROWSER_PRO_TYPESCRIPT.log'
            if ($LASTEXITCODE -ne 0) { throw "browser_pro_typecheck_failed:$LASTEXITCODE" }
            & node 'node_modules/eslint/bin/eslint.js' 'lib/commerce/vlm-advanced-only-access-policy.ts' 'lib/server/lazy-route-modules/security--audit-watch--pro-pdf--token.ts' 2>&1 | Tee-Object -FilePath 'artifacts/r7/browser-pro/R7_BROWSER_PRO_PATCH_ESLINT.log'
            if ($LASTEXITCODE -ne 0) { throw "browser_pro_patch_lint_failed:$LASTEXITCODE" }
            npm run build:webpack 2>&1 | Tee-Object -FilePath 'artifacts/r7/browser-pro/R7_BROWSER_PRO_WEBPACK.log'
            if ($LASTEXITCODE -ne 0) { throw "browser_pro_webpack_failed:$LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Execute and record Browser Pro canonical candidate E2E
        shell: pwsh
        run: ./r7-browser-pro-harness/run-r7-browser-pro-entitlement-candidate-e2e-final.ps1

      - name: Upload Browser Pro canonical candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-browser-pro-entitlement-candidate-final-${{ github.sha }}-${{ github.run_id }}
          path: |
            r7-work/artifacts/r7/browser-pro
            r7-work/artifacts/r7/windows
            r7-work/artifacts/r7/current-execution
            r7-work/R7_EXECUTION_SLICE_MANIFEST.json
            r7-work/R7_EXECUTION_SLICE_MANIFEST.tsv
            r7-work/R7_NPM_CI.log
            r7-risk-v5/R7_RISK_V5_PATCH_RECEIPT.json
            r7-risk-runner-work/R7_RISK_V5_EFFECTIVE_WINDOWS_RUNNER_RECEIPT.json
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
