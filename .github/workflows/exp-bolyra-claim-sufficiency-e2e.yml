name: EXP Bolyra Claim Sufficiency E2E

on:
  workflow_dispatch:
  push:
    branches:
      - exp/bolyra-claim-sufficiency-v0
    paths:
      - '.github/workflows/exp-bolyra-claim-sufficiency-e2e.yml'
      - 'scripts/experiments/claim-sufficiency-v0.mjs'
      - 'artifacts/experiments/bolyra/**'

permissions:
  contents: read

jobs:
  bolyra-to-velmere:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOLYRA_SHA: 5b68cd3316fcfcc8fd7a4bd8729425d89038346d
    steps:
      - name: Checkout Velmere experiment
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Checkout pinned public Bolyra source
        uses: actions/checkout@v4
        with:
          repository: bolyra/bolyra
          ref: ${{ env.BOLYRA_SHA }}
          path: _external/bolyra
          persist-credentials: false

      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/experiments/bolyra-e2e
          printf '%s\n' "${GITHUB_SHA}" > artifacts/experiments/bolyra-e2e/velmere-experiment-sha.txt
          git -C _external/bolyra rev-parse HEAD > artifacts/experiments/bolyra-e2e/bolyra-source-sha.txt
          test "$(cat artifacts/experiments/bolyra-e2e/bolyra-source-sha.txt)" = "${BOLYRA_SHA}"
          sha256sum _external/bolyra/integrations/receipts/test/chain.test.ts > artifacts/experiments/bolyra-e2e/bolyra-chain-test.sha256

      - name: Install Bolyra receipt test dependencies
        working-directory: _external/bolyra/integrations/receipts
        run: npm ci

      - name: Run official Bolyra tail-truncation tests unchanged
        working-directory: _external/bolyra/integrations/receipts
        shell: bash
        run: |
          set -euo pipefail
          npx jest test/chain.test.ts --runInBand --testNamePattern='tail truncation' --json --outputFile="$GITHUB_WORKSPACE/artifacts/experiments/bolyra-e2e/bolyra-jest-result.json"

      - name: Convert official test result into declared upstream evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/experiments/bolyra-e2e/bolyra-jest-result.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          const assertions = (j.testResults || []).flatMap(t => t.assertionResults || []);
          const status = (needle) => assertions.find(a => (a.fullName || a.title || '').includes(needle))?.status;
          const noExpectation = status('cannot detect tail truncation without external expectations');
          const expectedCount = status('detects tail truncation when expectedCount is provided');
          const expectedHead = status('detects tail truncation when expectedHeadHash is provided');
          const required = { noExpectation, expectedCount, expectedHead };
          for (const [k,v] of Object.entries(required)) {
            if (v !== 'passed') throw new Error(`required official Bolyra assertion did not pass: ${k}=${v}`);
          }
          const evidence = {
            schema: 'velmere.upstream-test-evidence.v1',
            upstream: {
              repository: 'bolyra/bolyra',
              commitSha: process.env.BOLYRA_SHA,
              testFile: 'integrations/receipts/test/chain.test.ts',
              execution: 'official test file executed unchanged with Jest; selected tests exercise real signed ReceiptChain instances created by Bolyra test code'
            },
            assertions: {
              tailTruncationWithoutExternalExpectation: noExpectation,
              tailTruncationDetectedWithExpectedCount: expectedCount,
              tailTruncationDetectedWithExpectedHeadHash: expectedHead
            },
            truthBoundary: 'This proves the selected official Bolyra tests passed at the pinned public commit. It is upstream machine evidence for Velmere claim-sufficiency evaluation, not a security audit or certification of Bolyra.'
          };
          fs.writeFileSync('artifacts/experiments/bolyra-e2e/bolyra-upstream-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE

      - name: Build Velmere claim-sufficiency case from upstream machine evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const upstream = JSON.parse(fs.readFileSync('artifacts/experiments/bolyra-e2e/bolyra-upstream-evidence.json', 'utf8'));
          const passed = (v) => v === 'passed' ? 'VERIFIED_TRUE' : 'VERIFIED_FALSE';
          const c = {
            caseId: 'bolyra-official-signed-chain-tail-truncation-e2e-v1',
            subject: {
              vendor: 'Bolyra',
              repository: upstream.upstream.repository,
              upstreamCommitSha: upstream.upstream.commitSha,
              testFile: upstream.upstream.testFile,
              velmereExperimentSha: process.env.GITHUB_SHA,
              boundary: 'Official Bolyra signed-chain tests are upstream machine evidence; Velmere evaluates claim sufficiency and does not reimplement Bolyra cryptography.'
            },
            evidence: [
              {
                id: 'official_tail_truncation_without_expectation_test_passed',
                state: passed(upstream.assertions.tailTruncationWithoutExternalExpectation),
                provenance: 'Pinned official Bolyra chain.test.ts Jest result.'
              },
              {
                id: 'official_expected_count_detection_test_passed',
                state: passed(upstream.assertions.tailTruncationDetectedWithExpectedCount),
                provenance: 'Pinned official Bolyra chain.test.ts Jest result.'
              },
              {
                id: 'official_expected_head_detection_test_passed',
                state: passed(upstream.assertions.tailTruncationDetectedWithExpectedHeadHash),
                provenance: 'Pinned official Bolyra chain.test.ts Jest result.'
              },
              {
                id: 'trusted_expected_count_matches_presented_checkpoint',
                state: 'MISSING',
                provenance: 'The evaluated presented-log boundary deliberately supplies no independently trusted expectedCount.'
              },
              {
                id: 'trusted_expected_head_hash_matches_presented_checkpoint',
                state: 'MISSING',
                provenance: 'The evaluated presented-log boundary deliberately supplies no independently trusted expectedHeadHash/checkpoint anchor.'
              }
            ],
            claims: [
              {
                id: 'claim-presented-prefix-can-be-internally-valid',
                text: 'A tail-truncated presented receipt-chain prefix can remain internally valid when no external tail expectation is supplied.',
                scopeCovered: true,
                requirements: [
                  { id: 'official-bolyra-behavior', mode: 'all', critical: true, evidence: ['official_tail_truncation_without_expectation_test_passed'] }
                ]
              },
              {
                id: 'claim-presented-log-is-complete-through-checkpoint',
                text: 'The presented receipts are the complete receipt history through the claimed checkpoint.',
                scopeCovered: true,
                requirements: [
                  { id: 'internal-prefix-validity-behavior', mode: 'all', critical: true, evidence: ['official_tail_truncation_without_expectation_test_passed'] },
                  { id: 'external-tail-completeness-anchor', mode: 'any', critical: true, evidence: ['trusted_expected_count_matches_presented_checkpoint', 'trusted_expected_head_hash_matches_presented_checkpoint'] }
                ]
              }
            ]
          };
          fs.writeFileSync('artifacts/experiments/bolyra-e2e/velmere-bolyra-e2e.case.json', JSON.stringify(c, null, 2) + '\n');
          NODE

      - name: Run Velmere Claim Sufficiency Prototype
        shell: bash
        run: |
          set -euo pipefail
          node scripts/experiments/claim-sufficiency-v0.mjs \
            artifacts/experiments/bolyra-e2e/velmere-bolyra-e2e.case.json \
            artifacts/experiments/bolyra-e2e/velmere-bolyra-e2e.result.json

      - name: Assert cross-system result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const dir = 'artifacts/experiments/bolyra-e2e';
          const result = JSON.parse(fs.readFileSync(`${dir}/velmere-bolyra-e2e.result.json`, 'utf8'));
          const byId = Object.fromEntries(result.claims.map(c => [c.id, c]));
          const narrow = byId['claim-presented-prefix-can-be-internally-valid'];
          const broad = byId['claim-presented-log-is-complete-through-checkpoint'];
          if (narrow?.verdict !== 'SUPPORTED') throw new Error(`narrow claim expected SUPPORTED, got ${narrow?.verdict}`);
          if (broad?.verdict !== 'UNKNOWN') throw new Error(`broad claim expected UNKNOWN, got ${broad?.verdict}`);
          const missingIds = new Set((broad.missingEvidence || []).map(x => x.evidenceId));
          if (!missingIds.has('trusted_expected_count_matches_presented_checkpoint')) throw new Error('missing expectedCount evidence not reported');
          if (!missingIds.has('trusted_expected_head_hash_matches_presented_checkpoint')) throw new Error('missing expectedHeadHash evidence not reported');
          const hash = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const report = {
            schema: 'velmere.bolyra-cross-system-e2e-report.v1',
            velmereExperimentSha: process.env.GITHUB_SHA,
            bolyraSourceSha: process.env.BOLYRA_SHA,
            officialBolyraTestsExecutedUnchanged: true,
            upstreamCryptoBehavior: {
              tailTruncationWithoutExpectation: 'PASS (official test confirms verifier returns internally consistent)',
              expectedCountDetectsTailTruncation: 'PASS',
              expectedHeadHashDetectsTailTruncation: 'PASS'
            },
            velmereClaimSufficiency: {
              narrowClaim: narrow.verdict,
              broaderCompletenessClaim: broad.verdict,
              missingEvidence: [...missingIds]
            },
            truthBoundary: 'Synthetic/public interoperability test. Official Bolyra signed-chain test results are consumed as upstream machine evidence. This is not an audit, certification, endorsement, partnership claim, or production validation.',
            sha256: {
              bolyraJestResult: hash(`${dir}/bolyra-jest-result.json`),
              upstreamEvidence: hash(`${dir}/bolyra-upstream-evidence.json`),
              velmereCase: hash(`${dir}/velmere-bolyra-e2e.case.json`),
              velmereResult: hash(`${dir}/velmere-bolyra-e2e.result.json`)
            }
          };
          fs.writeFileSync(`${dir}/VELMERE_BOLYRA_CROSS_SYSTEM_E2E_REPORT_v1.json`, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: velmere-bolyra-cross-system-e2e
          path: artifacts/experiments/bolyra-e2e/
          if-no-files-found: error
