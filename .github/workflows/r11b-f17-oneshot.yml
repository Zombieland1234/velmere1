name: R11B F17 One-Shot Patch

on:
  push:
    branches: [r11b-f17-payment-authority-v1]

permissions:
  contents: write

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  patch-f17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Apply exact F17 source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/security/SecurityAuditsCleanPage.tsx')
          s = p.read_text()
          old = '''      if (event.data?.type === "VELMERE_STRIPE_PAYMENT_SUCCESS") {
                completeAuditPaymentSuccess(tier);'''
          new = '''      if (event.data?.type === "VELMERE_STRIPE_CHECKOUT_RETURNED") {
                // The popup return is only a browser navigation signal. It is never
                // payment or entitlement authority; verify the exact session server-side.
                void (async () => {
                  setIsAuditStripeLoading(true);
                  try {
                    const res = await fetch(`/api/checkout/stripe-analysis?sessionId=${encodeURIComponent(sessionId)}`);
                    if (res.ok) {
                      const checkData = await res.json();
                      if (checkData.ok && checkData.paid) {
                        completeAuditPaymentSuccess(tier);
                        return;
                      }
                    }
                    setAuditStripeError("Płatność nie została jeszcze potwierdzona przez serwer.");
                  } catch {
                    setAuditStripeError("Nie udało się zweryfikować płatności po stronie serwera.");
                  }
                  setIsAuditStripeLoading(false);
                })();'''
          if old in s:
              s2 = s.replace(old, new, 1)
              if old in s2:
                  raise SystemExit('old F17 authority block remains after single replacement')
              p.write_text(s2)
              print('F17 patch applied')
          elif new in s:
              print('F17 patch already present; no source rewrite needed')
          else:
              raise SystemExit('expected F17 authority block not found')
          PY
      - name: Verify F17 authority contract
        run: node scripts/r11/verify-paid-browser-authority.mjs
      - name: Commit source patch when changed
        shell: bash
        run: |
          if git diff --quiet -- components/security/SecurityAuditsCleanPage.tsx; then
            echo 'No source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/security/SecurityAuditsCleanPage.tsx
          git commit -m 'fix(r11b): make server payment state authoritative'
          git push origin HEAD:r11b-f17-payment-authority-v1
