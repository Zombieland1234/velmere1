name: PASS26 Visual Provenance One-Shot

on:
  push:
    branches:
      - r11b-audit-hardening-v6-clean

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run visual freeze provenance audit
        run: node scripts/pass14/audit-visual-freeze-provenance.mjs
      - name: Upload provenance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pass26-visual-provenance-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: .velmere/pass26-diagnostics/visual-freeze-provenance-v2.json
