name: R7 Audit Basic Bridge E2E

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-bridge-e2e.yml'
      - 'r7-harness/run-r7-audit-basic-bridge-e2e-current.ps1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r7-audit-basic-bridge-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-basic-bridge-e2e:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      SUPABASE_URL: 'https://yljjyowcvjgjcamffnvd.supabase.co'
      SUPABASE_ANON_KEY: 'sb_publishable_RTqLeQRrAJl6seP0ShSJlA_hyNo4Yz2'
      AUDIT_OIDC_AUDIENCE: 'velmere-r7-audit-basic-e2e'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Execute secure Audit Basic bridge E2E
        shell: pwsh
        run: ./r7-harness/run-r7-audit-basic-bridge-e2e-current.ps1

      - name: Upload Audit Basic bridge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-bridge-e2e-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/r7/audit-basic/R7_AUDIT_BASIC_BRIDGE_E2E.json
          if-no-files-found: warn
          retention-days: 14
