name: R11B F10 Fixture Path Fix

on:
  push:
    branches: [r11b-internal-hardening]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Apply exact two-file patch
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['scripts/pass4992/supply-chain-release.mjs','scripts/pass4992/test-supply-chain-release.mjs']:
            p=Path(name); s=p.read_text(); old='synthetic/pass4992-secret-fingerprint.fixture'; new='synthetic/pass4992-secret-fingerprint.txt'
            assert s.count(old)==1, (name,s.count(old))
            p.write_text(s.replace(old,new))
          PY
      - name: Verify F10 semantics
        run: |
          node scripts/pass4992/test-supply-chain-release.mjs
          git checkout -- artifacts/pass4992/PASS4992_SUPPLY_CHAIN_ADVERSARIAL_TEST.json
          npm run typecheck:direct
      - name: Exact write scope
        run: |
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' scripts/pass4992/supply-chain-release.mjs scripts/pass4992/test-supply-chain-release.mjs | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Commit verified correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/pass4992/supply-chain-release.mjs scripts/pass4992/test-supply-chain-release.mjs
          git commit -m "fix(r11b): make synthetic fingerprint fixture scannable"
          git push origin HEAD:r11b-internal-hardening
