name: R44P8 Local Deployed Reproduction 50 of 50

on:
  pull_request:
    branches: [main]
    paths:
      - 'r44p8-local-deployment/**'
      - '.github/workflows/r44p8-local-deployed-reproduction.yml'

permissions:
  contents: read

jobs:
  deploy-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SOLC_SHA256: fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Foundry 1.2.3
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3

      - name: Install and verify exact solc 0.8.24
        shell: bash
        run: |
          set -euo pipefail
          SOLC_BINARY="$RUNNER_TEMP/solc-linux-amd64-v0.8.24+commit.e11b9ed9"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$SOLC_BINARY" \
            'https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/linux-amd64/solc-linux-amd64-v0.8.24%2Bcommit.e11b9ed9'
          chmod 0755 "$SOLC_BINARY"
          test "$(sha256sum "$SOLC_BINARY" | awk '{print $1}')" = "$EXPECTED_SOLC_SHA256"
          "$SOLC_BINARY" --version | grep -F '0.8.24'
          forge --version | grep -F '1.2.3'
          cast --version | grep -F '1.2.3'
          anvil --version | grep -F '1.2.3'
          echo "VELMERE_SOLC_BINARY=$SOLC_BINARY" >> "$GITHUB_ENV"

      - name: Prepare exact 50-case corpus and patched verifier
        working-directory: r44p8-local-deployment
        shell: bash
        run: |
          set -euo pipefail
          cp ../r44p4-official-toolchain/contracts-batch-*.json .
          python - <<'PY'
          from pathlib import Path
          p=Path('run_local_deployment_reproduction.py')
          s=p.read_text(encoding='utf-8')
          old_a='creation_hex = artifact["bytecode"]["object"]'
          new_a='creation_hex = artifact["bytecode"]["object"].removeprefix("0x")'
          old_b='expected_runtime_hex = artifact["deployedBytecode"]["object"]'
          new_b='expected_runtime_hex = artifact["deployedBytecode"]["object"].removeprefix("0x")'
          assert s.count(old_a)==1 and s.count(old_b)==1
          s=s.replace(old_a,new_a).replace(old_b,new_b)
          p.write_text(s,encoding='utf-8',newline='\n')
          print('RUNNER_HEX_PREFIX_FIX_APPLIED')
          PY
          python -m py_compile run_local_deployment_reproduction.py
          python - <<'PY'
          import glob, json
          cases=[]
          for p in sorted(glob.glob('contracts-batch-*.json')):
              cases.extend(json.load(open(p,encoding='utf-8')))
          targets=json.load(open('deployment-targets.json',encoding='utf-8'))['cases']
          assert len(cases)==50
          assert len({x['case_id'] for x in cases})==50
          assert len(targets)==50
          assert {x['case_id'] for x in targets}=={x['case_id'] for x in cases}
          print('CORPUS_AND_TARGETS_OK',len(cases))
          PY

      - name: Deploy and reproduce 50 project-owned contracts
        working-directory: r44p8-local-deployment
        shell: bash
        run: |
          set -euo pipefail
          python run_local_deployment_reproduction.py | tee execution-summary.log

      - name: Independently verify denominator and truth boundary
        working-directory: r44p8-local-deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('evidence/LOCAL_DEPLOYED_REPRODUCTION_LEDGER.json')
          x=json.loads(p.read_text())
          assert x['status']=='PASS_LOCAL_DEPLOYED_REPRODUCTION_50_OF_50'
          assert x['caseCount']==50
          assert x['deploymentExecutionsCompleted']==50
          assert x['uniqueContractAddresses']==50
          assert x['uniqueTransactionHashes']==50
          assert x['sourceToCreationInputReproductions']==50
          assert x['runtimeBytecodeReproductions']==50
          assert x['projectOwnedRightsRows']==50
          assert x['realExternalDeployedContractAuditCredit']==0
          assert x['independentAdjudicationCredit']==0
          assert x['customerCredit']==0
          assert x['liveCredit']==0
          assert len(x['rows'])==50
          assert len({r['caseId'] for r in x['rows']})==50
          assert all(r['officialDeploymentExecutionCredit'] is True for r in x['rows'])
          assert all(r['realExternalDeployedContractAuditCredit'] is False for r in x['rows'])
          assert all(r['sourceToCreationInputReproduction'] is True for r in x['rows'])
          assert all(r['runtimeBytecodeReproductionMaskedImmutables'] is True for r in x['rows'])
          print('LEDGER_50_OF_50_VERIFIED',hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Package evidence
        if: always()
        working-directory: r44p8-local-deployment
        shell: bash
        run: |
          set -euo pipefail
          if test -d evidence; then
            tar --sort=name --mtime='UTC 2026-08-03' --owner=0 --group=0 --numeric-owner \
              -czf r44p8-local-deployed-reproduction-evidence.tar.gz evidence execution-summary.log
            sha256sum r44p8-local-deployed-reproduction-evidence.tar.gz > r44p8-local-deployed-reproduction-evidence.sha256
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44p8-local-deployed-reproduction-evidence
          path: |
            r44p8-local-deployment/evidence
            r44p8-local-deployment/execution-summary.log
            r44p8-local-deployment/r44p8-local-deployed-reproduction-evidence.tar.gz
            r44p8-local-deployment/r44p8-local-deployed-reproduction-evidence.sha256
          if-no-files-found: warn
          retention-days: 14
