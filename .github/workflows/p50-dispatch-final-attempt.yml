name: P50 Dispatch Final Attempt

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - '.github/workflows/p50-dispatch-final-attempt.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch P50 final attempt on current branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{ ref = 'velmere-p47-p46-build-projection-windows-20260815' } | ConvertTo-Json
          $url = 'https://api.github.com/repos/${{ github.repository }}/actions/workflows/p50-native-windows-final-attempt.yml/dispatches'
          Invoke-RestMethod -Method Post -Uri $url -Headers $headers -Body $body -ContentType 'application/json'
          Write-Host 'Dispatched P50 final attempt.'
