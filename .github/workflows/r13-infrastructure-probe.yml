name: R13 infrastructure preflight (not product E2E)
on:
  push:
    branches: [r13/backend-integration-20260916]
    paths:
      - scripts/r13/**
      - lib/checkout/runtime-payment-authority.ts
      - lib/stripe/server.ts
      - app/api/internal/r13/release/route.ts
      - .github/workflows/r13-infrastructure-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r13-infra-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Test exact backend changes without installing application dependencies
        run: node --experimental-strip-types --test scripts/r13/*.test.mjs > r13-component-tests.tap 2>&1
      - name: Read-only service connectivity and mode preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          R13_PROBE_OUTPUT: r13-infrastructure-probe.json
        run: node scripts/r13/infrastructure-probe.mjs
      - name: Preserve failures and redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r13-infrastructure-${{ github.sha }}
          path: |
            r13-component-tests.tap
            r13-infrastructure-probe.json
          if-no-files-found: error
          retention-days: 7
