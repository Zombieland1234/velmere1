name: R7 Audit Basic Frozen Benchmark Exact Current Source

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-frozen-benchmark-current-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-audit-basic-frozen-benchmark-current-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-benchmark-current-source:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      R7_RISK_FULL_SOURCE_AGGREGATE_SHA256: '50d59f5f028ef73b279fa3930889fcbf2ab5bc5e36ab4e8cec97be5ed49be67e'
      R7_RISK_FULL_SOURCE_MANIFEST_SHA256: 'af63491cf2922c6391d25fcf25a7d8efb6e76d128f4f9ca1dcf07b36471b0a2f'
      R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256: 'f83f28de6add73eee70d9086f2705241243661d64b5c9fd579b17b359050a221'
      R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256: 'b947314bb696fb8f9153c34d46ba825c5897e9f8cc8cf911a5f31113aa5fc01f'
      R7_RISK_BUNDLE_SHA256: '8e3c66471d534310e1142c3671d43bb556e35b6901c847c9596eea14e8815967'
      R7_PACKAGE_JSON_SHA256: '384932e8183ff4ced7850556ee21bb7b71f9a86add02112a4e434bc09f457a61'
      R7_PACKAGE_LOCK_SHA256: '5924aa0d679ebd78bcd6da01815fdd4b6ff503db45b17697c00168c06af7de61'
      FROZEN_POLICY_SOURCE_PATH: 'config/pass35/a19-audit-static-benchmark-policy.json'
      FROZEN_POLICY_CONTROL_PATH: 'r7-evidence/frozen-controls/a19-audit-static-benchmark-policy.json'
      FROZEN_POLICY_BYTES: '3033'
      FROZEN_POLICY_SHA256: 'eebb6d52ce1ee3521519245a879323e76bbea583b848d30331a332d8773ad920'
      FROZEN_TEST_SOURCE_PATH: 'scripts/pass35/test-a19-audit-static-benchmark.mjs'
      FROZEN_TEST_CONTROL_PATH: 'r7-evidence/frozen-controls/test-a19-audit-static-benchmark.mjs'
      FROZEN_TEST_BYTES: '1697'
      FROZEN_TEST_SHA256: '52c9fd5f1d3fd2b704d6be200a1e75d6fe2ba1d5db3154b166a4c88587616b71'
      FROZEN_RUNTIME_PATH: 'lib/security/pass35-a19-audit-static-benchmark-runtime.mjs'
      FROZEN_RUNTIME_BYTES: '25733'
      FROZEN_RUNTIME_SHA256: '376c0d62724295ae0d1eb2b96dd7596b9cbac176093196b13fff76f129e8a221'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'

    steps:
      - name: Checkout controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct exact current source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1' -Mode Prepare
          if ($LASTEXITCODE -ne 0) { throw "exact_current_source_prepare_failed:$LASTEXITCODE" }

      - name: Bind and materialize exact frozen controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const sha=(b)=>crypto.createHash('sha256').update(b).digest('hex');
          const manifestBytes=fs.readFileSync('r7-work/CURRENT_CANDIDATE_CONTENT_MANIFEST.tsv');
          if(sha(manifestBytes)!==process.env.R7_RISK_FULL_SOURCE_MANIFEST_SHA256) throw new Error('full_source_manifest_sha_mismatch');
          const lines=manifestBytes.toString('utf8').trimEnd().split(/\r?\n/);
          if(lines.shift()!=='path\tbytes\tsha256') throw new Error('full_source_manifest_header_invalid');
          const rows=new Map(lines.map(line=>{const [p,b,s]=line.split('\t');return [p,{bytes:Number(b),sha256:s}]}));
          const controls=[
            {sourcePath:process.env.FROZEN_POLICY_SOURCE_PATH,controlPath:process.env.FROZEN_POLICY_CONTROL_PATH,bytes:Number(process.env.FROZEN_POLICY_BYTES),sha256:process.env.FROZEN_POLICY_SHA256},
            {sourcePath:process.env.FROZEN_TEST_SOURCE_PATH,controlPath:process.env.FROZEN_TEST_CONTROL_PATH,bytes:Number(process.env.FROZEN_TEST_BYTES),sha256:process.env.FROZEN_TEST_SHA256},
          ];
          for(const c of controls){
            const row=rows.get(c.sourcePath); if(!row||row.bytes!==c.bytes||row.sha256!==c.sha256) throw new Error(`manifest_binding_failed:${c.sourcePath}`);
            const bytes=fs.readFileSync(c.controlPath); if(bytes.length!==c.bytes||sha(bytes)!==c.sha256) throw new Error(`control_byte_identity_failed:${c.controlPath}`);
          }
          const runtimeRow=rows.get(process.env.FROZEN_RUNTIME_PATH);
          if(!runtimeRow||runtimeRow.bytes!==Number(process.env.FROZEN_RUNTIME_BYTES)||runtimeRow.sha256!==process.env.FROZEN_RUNTIME_SHA256) throw new Error('runtime_full_source_binding_failed');
          const executionManifestBytes=fs.readFileSync('r7-work/R7_EXECUTION_SLICE_MANIFEST.json');
          if(sha(executionManifestBytes)!==process.env.R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256) throw new Error('execution_manifest_sha_mismatch');
          const execution=JSON.parse(executionManifestBytes);
          const erow=execution.files.find(r=>r.path===process.env.FROZEN_RUNTIME_PATH);
          if(!erow||erow.byteLength!==Number(process.env.FROZEN_RUNTIME_BYTES)||erow.sha256!==process.env.FROZEN_RUNTIME_SHA256) throw new Error('runtime_execution_binding_failed');
          const runtimeBytes=fs.readFileSync(path.join('r7-work',process.env.FROZEN_RUNTIME_PATH));
          if(runtimeBytes.length!==erow.byteLength||sha(runtimeBytes)!==erow.sha256) throw new Error('runtime_physical_identity_failed');
          fs.rmSync('r7-frozen-run',{recursive:true,force:true});
          for(const p of [process.env.FROZEN_POLICY_SOURCE_PATH,process.env.FROZEN_TEST_SOURCE_PATH,process.env.FROZEN_RUNTIME_PATH]) fs.mkdirSync(path.dirname(path.join('r7-frozen-run',p)),{recursive:true});
          fs.copyFileSync(process.env.FROZEN_POLICY_CONTROL_PATH,path.join('r7-frozen-run',process.env.FROZEN_POLICY_SOURCE_PATH));
          fs.copyFileSync(process.env.FROZEN_TEST_CONTROL_PATH,path.join('r7-frozen-run',process.env.FROZEN_TEST_SOURCE_PATH));
          fs.copyFileSync(path.join('r7-work',process.env.FROZEN_RUNTIME_PATH),path.join('r7-frozen-run',process.env.FROZEN_RUNTIME_PATH));
          console.log(JSON.stringify({status:'PASS_FROZEN_CONTROLS_MATERIALIZED',fullSourceManifestSha256:sha(manifestBytes),executionManifestSha256:sha(executionManifestBytes),controls:controls.map(({sourcePath,bytes,sha256})=>({sourcePath,bytes,sha256})),runtime:{path:process.env.FROZEN_RUNTIME_PATH,bytes:runtimeBytes.length,sha256:sha(runtimeBytes)},customerFinalCredit:false},null,2));
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw "frozen_materialization_failed:$LASTEXITCODE" }

      - name: Execute frozen contract test and deterministic benchmark twice
        shell: pwsh
        working-directory: r7-frozen-run
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/pass35/test-a19-audit-static-benchmark.mjs | Tee-Object -FilePath R7_AUDIT_BASIC_FROZEN_BENCHMARK_TEST.log
          if ($LASTEXITCODE -ne 0) { throw "frozen_contract_test_failed:$LASTEXITCODE" }
          @'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { runA19AuditStaticBenchmark, verifyA19AuditStaticBenchmark, verifyA19AuditStaticPolicy } from './lib/security/pass35-a19-audit-static-benchmark-runtime.mjs';
          const sha=(b)=>crypto.createHash('sha256').update(b).digest('hex');
          const policyBytes=fs.readFileSync('config/pass35/a19-audit-static-benchmark-policy.json');
          const testBytes=fs.readFileSync('scripts/pass35/test-a19-audit-static-benchmark.mjs');
          const runtimeBytes=fs.readFileSync('lib/security/pass35-a19-audit-static-benchmark-runtime.mjs');
          if(policyBytes.length!==Number(process.env.FROZEN_POLICY_BYTES)||sha(policyBytes)!==process.env.FROZEN_POLICY_SHA256) throw new Error('policy_runtime_identity_failed');
          if(testBytes.length!==Number(process.env.FROZEN_TEST_BYTES)||sha(testBytes)!==process.env.FROZEN_TEST_SHA256) throw new Error('test_runtime_identity_failed');
          if(runtimeBytes.length!==Number(process.env.FROZEN_RUNTIME_BYTES)||sha(runtimeBytes)!==process.env.FROZEN_RUNTIME_SHA256) throw new Error('runtime_runtime_identity_failed');
          const policy=JSON.parse(policyBytes.toString('utf8'));
          if(!verifyA19AuditStaticPolicy(policy)) throw new Error('frozen_policy_invalid');
          const run1=runA19AuditStaticBenchmark(policy);
          const run2=runA19AuditStaticBenchmark(policy);
          if(!verifyA19AuditStaticBenchmark(run1,policy)||!verifyA19AuditStaticBenchmark(run2,policy)) throw new Error('frozen_runtime_verification_failed');
          if(JSON.stringify(run1)!==JSON.stringify(run2)) throw new Error('frozen_benchmark_not_repeatable');
          if(!run1.localStaticBenchmarkPass||run1.failedGates.length!==0) throw new Error(`frozen_gates_failed:${run1.failedGates.join(',')}`);
          if(run1.denominators.cases!==240||run1.denominators.frozenTest!==90||run1.denominators.mutations!==2880) throw new Error('frozen_denominator_mismatch');
          if(run1.frozen.recall<0.95||run1.frozen.specificity<0.95||run1.frozen.precision<0.95||run1.frozen.f1<0.95||run1.frozen.severityAccuracy<0.95||run1.mutation.killRate<0.99||run1.frozen.fp!==0) throw new Error('frozen_quality_threshold_failed');
          if(run1.paidGateEligible!==false||run1.independentExternalFamily!==false||run1.fullAuditClaimAllowed!==false) throw new Error('frozen_hard_stop_regression');
          const receipt={
            schemaVersion:'velmere.r7.audit-basic-frozen-benchmark-execution.v1',
            status:'PASS_PROSPECTIVE_FROZEN_BENCHMARK',
            github:{runId:process.env.GITHUB_RUN_ID,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),headSha:process.env.GITHUB_SHA},
            exactCurrentSource:{fullSourceAggregateSha256:process.env.R7_RISK_FULL_SOURCE_AGGREGATE_SHA256,fullSourceManifestSha256:process.env.R7_RISK_FULL_SOURCE_MANIFEST_SHA256,executionSliceAggregateSha256:process.env.R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256,executionSliceManifestSha256:process.env.R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256,executionBundleSha256:process.env.R7_RISK_BUNDLE_SHA256},
            frozenBeforeExecution:true,
            controls:{policy:{path:process.env.FROZEN_POLICY_SOURCE_PATH,bytes:policyBytes.length,sha256:sha(policyBytes)},test:{path:process.env.FROZEN_TEST_SOURCE_PATH,bytes:testBytes.length,sha256:sha(testBytes)},runtime:{path:process.env.FROZEN_RUNTIME_PATH,bytes:runtimeBytes.length,sha256:sha(runtimeBytes)}},
            results:{integritySha256:`sha256:${run1.integritySha256}`,families:run1.denominators.families,cases:run1.denominators.cases,vulnerable:run1.denominators.vulnerable,remediated:run1.denominators.remediated,frozenTest:run1.denominators.frozenTest,mutations:run1.denominators.mutations,frozen:run1.frozen,mutation:run1.mutation,failedGates:run1.failedGates,repeatability:'PASS_BYTE_IDENTICAL_JSON_X2'},
            hardStops:{paidGateEligible:false,independentExternalFamily:false,fullAuditClaimAllowed:false,replacesQualifiedHumanReview:false,exploitabilityClaimed:false},
            customerFinalCredit:false,
            truthBoundary:'The frozen benchmark is now physically executed with exact controls bound to the current full-source authority. It measures deterministic local structural prescreen quality only and cannot replace external analyzers, qualified-human review, exploitability proof, or create Audit Basic FINAL by itself.'
          };
          fs.mkdirSync('artifacts',{recursive:true});
          fs.writeFileSync('artifacts/R7_AUDIT_BASIC_FROZEN_BENCHMARK_CURRENT_SOURCE.json',JSON.stringify(receipt,null,2)+'\n');
          fs.writeFileSync('artifacts/R7_AUDIT_BASIC_FROZEN_BENCHMARK_RUNTIME.json',JSON.stringify(run1,null,2)+'\n');
          console.log(JSON.stringify({status:receipt.status,cases:run1.denominators.cases,frozenCases:run1.denominators.frozenTest,mutations:run1.denominators.mutations,frozenRecall:run1.frozen.recall,frozenSpecificity:run1.frozen.specificity,frozenPrecision:run1.frozen.precision,frozenF1:run1.frozen.f1,severityAccuracy:run1.frozen.severityAccuracy,mutationKillRate:run1.mutation.killRate,repeatability:receipt.results.repeatability,paidGateEligible:false,customerFinalCredit:false},null,2));
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw "frozen_benchmark_execution_failed:$LASTEXITCODE" }

      - name: Upload frozen benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-frozen-benchmark-current-source-${{ github.sha }}-${{ github.run_id }}
          path: |
            r7-frozen-run/artifacts/R7_AUDIT_BASIC_FROZEN_BENCHMARK_CURRENT_SOURCE.json
            r7-frozen-run/artifacts/R7_AUDIT_BASIC_FROZEN_BENCHMARK_RUNTIME.json
            r7-frozen-run/R7_AUDIT_BASIC_FROZEN_BENCHMARK_TEST.log
          if-no-files-found: warn
          retention-days: 30