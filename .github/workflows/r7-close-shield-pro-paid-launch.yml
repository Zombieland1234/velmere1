name: R7 Shield Pro Paid Closure Launcher
on:
  push:
    branches:
      - r7-close-shield-pro-paid-20260830
    paths:
      - '.github/workflows/r7-close-shield-pro-paid-launch.yml'
      - '.github/workflows/r7-shield-pro-paid-closure-run-v3.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch branch-bound Shield Pro Paid closure runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run r7-shield-pro-paid-closure-run-v3.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "dispatched Shield Pro Paid closure v3 on $GITHUB_REF_NAME"