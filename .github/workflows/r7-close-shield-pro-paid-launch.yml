name: R7 Shield Pro Paid Closure Launcher
on:
  push:
    branches:
      - r7-close-shield-pro-paid-20260830
    paths:
      - '.github/workflows/r7-close-shield-pro-paid-launch.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Shield Pro Paid customer E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run r7-shield-pro-paid-customer-workspace-e2e-v1.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "dispatched Shield Pro Paid canonical closure on $GITHUB_REF_NAME"
