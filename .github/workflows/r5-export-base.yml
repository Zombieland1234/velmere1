name: R5 Export Base Source

on:
  push:
    branches:
      - velmere-r5-current-byte-dependency-windows-20260823
    paths:
      - '.github/workflows/r5-export-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build source identity receipt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git r5-base-export
          mkdir -p r5-base-export
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root=pathlib.Path('.')
          out=pathlib.Path('r5-base-export')
          excluded={'.git','r5-base-export'}
          rows=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              rel=p.as_posix()
              if any(rel==x or rel.startswith(x+'/') for x in excluded):
                  continue
              b=p.read_bytes()
              rows.append((rel,len(b),hashlib.sha256(b).hexdigest()))
          body=''.join(f'{h}\t{s}\t{p}\n' for p,s,h in rows).encode()
          receipt={
            'schema':'velmere.r5.base-source-export.v1',
            'branch':os.environ.get('GITHUB_REF_NAME'),
            'sourceSha':os.environ.get('GITHUB_SHA'),
            'fileCount':len(rows),
            'totalBytes':sum(r[1] for r in rows),
            'aggregateIdentitySha256':hashlib.sha256(body).hexdigest(),
          }
          (out/'R5_BASE_SOURCE_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          (out/'R5_BASE_SOURCE_MANIFEST.tsv').write_bytes(body)
          for rel,_,_ in rows:
              dst=out/'source'/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(root/rel,dst)
          PY

      - name: Upload base source
        uses: actions/upload-artifact@v4
        with:
          name: r5-base-source
          path: r5-base-export
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
