name: R7 Audit Basic Multicall3 Remediation Retest V2

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-multicall3-remediation-retest-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retest-bounded-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Install pinned test stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r7-remediation-v2 artifacts/r7/audit-basic/remediation
          cd r7-remediation-v2
          npm init -y >/dev/null
          npm install --audit=false --fund=false solc@0.8.12 ethers@6.15.0 ganache@7.9.2

      - name: Patch exact deployed source and prove retention path removed
        shell: bash
        run: |
          set -euo pipefail
          cat > r7-remediation-v2/run.mjs <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import ganache from 'ganache';
          import solc from 'solc';
          import { ContractFactory, Interface, JsonRpcProvider } from 'ethers';
          const sha=(v)=>createHash('sha256').update(v).digest('hex');
          const originalSha='3f05fc95b3bfd3d41e96fa281e00a71302e35b8fff59f81f399a419cdb9f577e';
          const address='0xca11bde05977b3631167028862be2a173976ca11';
          const sr=await fetch(`https://sourcify.dev/server/v2/contract/56/${address}?fields=all`,{headers:{accept:'application/json','user-agent':'velmere-r7-remediation-v2'},signal:AbortSignal.timeout(25000)});
          if(!sr.ok) throw new Error(`sourcify_fetch_failed:${sr.status}`);
          const sc=await sr.json(); if(sc.match!=='exact_match') throw new Error('sourcify_not_exact_match');
          const rows=Object.entries(sc.sources??{}).filter(([p,v])=>/Multicall3\.sol$/i.test(p)&&v&&typeof v==='object'&&typeof v.content==='string');
          if(rows.length!==1) throw new Error(`source_denominator:${rows.length}`);
          const source=rows[0][1].content; if(sha(Buffer.from(source,'utf8'))!==originalSha) throw new Error('source_sha_mismatch');

          const re=/^(\s*)uint256 val = calli\.value;\r?$/gm;
          const matches=[...source.matchAll(re)];
          if(matches.length!==1) throw new Error(`remediation_anchor_count:${matches.length}`);
          const indent=matches[0][1];
          const guard=`${indent}uint256 val = calli.value;\n${indent}require(!(calli.allowFailure && val != 0), "Multicall3: value+allowFailure unsupported");`;
          const patched=source.replace(re,guard);
          if(patched===source) throw new Error('remediation_patch_not_applied');
          const patchedSha=sha(Buffer.from(patched,'utf8'));
          const probe=`// SPDX-License-Identifier: MIT\npragma solidity 0.8.12; contract Probe { uint256 public last; function receiveValue() external payable { last=msg.value; } function failCall() external payable { revert(\"probe fail\"); } }`;
          const input={language:'Solidity',sources:{'Multicall3.sol':{content:patched},'Probe.sol':{content:probe}},settings:{optimizer:{enabled:true,runs:10000000},evmVersion:'london',outputSelection:{'*':{'*':['abi','evm.bytecode.object']}}}};
          const out=JSON.parse(solc.compile(JSON.stringify(input)));
          const errors=(out.errors??[]).filter(e=>e.severity==='error'); if(errors.length) throw new Error(errors.map(e=>e.formattedMessage).join('\n'));
          const mc=out.contracts['Multicall3.sol'].Multicall3, pc=out.contracts['Probe.sol'].Probe;
          const server=ganache.server({logging:{quiet:true},wallet:{totalAccounts:2,defaultBalance:1000},chain:{hardfork:'london',chainId:1337}}); await server.listen(8545);
          const tests=[]; const check=(id,pass,details={})=>{tests.push({id,pass,...details});if(!pass)throw new Error(`retest_failed:${id}:${JSON.stringify(details)}`);};
          try{
            const provider=new JsonRpcProvider('http://127.0.0.1:8545'); const signer=await provider.getSigner(0);
            const multicall=await new ContractFactory(mc.abi,'0x'+mc.evm.bytecode.object,signer).deploy(); await multicall.waitForDeployment();
            const target=await new ContractFactory(pc.abi,'0x'+pc.evm.bytecode.object,signer).deploy(); await target.waitForDeployment();
            const mcAddr=await multicall.getAddress(), targetAddr=await target.getAddress(); const iface=new Interface(pc.abi);
            const receiveData=iface.encodeFunctionData('receiveValue',[]), failData=iface.encodeFunctionData('failCall',[]);
            const bal=async(a)=>BigInt(await provider.send('eth_getBalance',[a,'latest']));

            const before=await bal(mcAddr); let nonzeroAllowedReverted=false;
            try{await multicall.aggregate3Value.staticCall([{target:targetAddr,allowFailure:true,value:77n,callData:failData}],{value:77n});}catch{nonzeroAllowedReverted=true;}
            check('nonzero_value_plus_allowFailure_reverts',nonzeroAllowedReverted);
            check('rejected_path_retains_no_value',(await bal(mcAddr))===before,{before:String(before),after:String(await bal(mcAddr))});

            const okTx=await multicall.aggregate3Value([{target:targetAddr,allowFailure:false,value:123n,callData:receiveData}],{value:123n});
            const okRc=await okTx.wait(); check('normal_successful_value_call_preserved',okRc?.status===1);
            check('normal_value_call_target_received_123',(await target.last())===123n,{targetLast:String(await target.last())});

            const zeroAllowed=await multicall.aggregate3Value.staticCall([{target:targetAddr,allowFailure:true,value:0n,callData:failData}],{value:0n});
            check('zero_value_allowFailure_preserved',zeroAllowed.length===1&&zeroAllowed[0].success===false);
            let zeroStrictReverted=false; try{await multicall.aggregate3Value.staticCall([{target:targetAddr,allowFailure:false,value:0n,callData:failData}],{value:0n});}catch{zeroStrictReverted=true;}
            check('zero_value_disallowFailure_still_reverts',zeroStrictReverted);

            const receipt={schemaVersion:'velmere.r7.audit-basic-remediation-retest.v2',status:'PASS_REMEDIATION_RETEST',findingId:'MC3-VALUE-RETENTION-ON-ALLOWED-FAILED-CALL',originalExactDeployedSourceSha256:originalSha,patchedSourceSha256:patchedSha,patchType:'BOUNDED_LOCAL_REMEDIATION_CANDIDATE',patch:'require(!(calli.allowFailure && val != 0), "Multicall3: value+allowFailure unsupported")',tests,passed:tests.filter(t=>t.pass).length,total:tests.length,regressionBoundary:'Successful non-failure-tolerant value calls and zero-value allowFailure behavior remain supported.',productionDeploymentModified:false,paidProviderRequired:false,customerFinalCredit:false,truthBoundary:'Local exact-source patch/retest proves this bounded guard removes the reproduced value-retention path while preserving tested intended behaviors. It does not modify the deployed contract or prove every downstream compatibility constraint.'};
            fs.writeFileSync('../artifacts/r7/audit-basic/remediation/R7_AUDIT_BASIC_MULTICALL3_REMEDIATION_RETEST_V2.json',JSON.stringify(receipt,null,2)+'\n'); console.log(JSON.stringify(receipt,null,2));
          }finally{await server.close();}
          NODE
          cd r7-remediation-v2
          node run.mjs

      - name: Upload remediation V2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-remediation-v2-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/r7/audit-basic/remediation/R7_AUDIT_BASIC_MULTICALL3_REMEDIATION_RETEST_V2.json
          if-no-files-found: error
          retention-days: 30
