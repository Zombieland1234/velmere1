name: R7 Audit Basic Real Engine A01 A05 Repaired

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-real-engine-a01-a05-repair.yml'
      - 'r7-evidence/R7_AUDIT_BASIC_MULTICALL3_ADJUDICATION_PACKET.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-audit-basic-real-engine-a01-a05-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-engine-on-exact-current-source:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      R7_RISK_FULL_SOURCE_AGGREGATE_SHA256: '50d59f5f028ef73b279fa3930889fcbf2ab5bc5e36ab4e8cec97be5ed49be67e'
      R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256: 'f83f28de6add73eee70d9086f2705241243661d64b5c9fd579b17b359050a221'
      R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256: 'b947314bb696fb8f9153c34d46ba825c5897e9f8cc8cf911a5f31113aa5fc01f'
      R7_RISK_BUNDLE_SHA256: '8e3c66471d534310e1142c3671d43bb556e35b6901c847c9596eea14e8815967'
      R7_PACKAGE_JSON_SHA256: '384932e8183ff4ced7850556ee21bb7b71f9a86add02112a4e434bc09f457a61'
      R7_PACKAGE_LOCK_SHA256: '5924aa0d679ebd78bcd6da01815fdd4b6ff503db45b17697c00168c06af7de61'
      EXACT_DEPLOYED_SOURCE_SHA256: '3f05fc95b3bfd3d41e96fa281e00a71302e35b8fff59f81f399a419cdb9f577e'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'

    steps:
      - name: Checkout exact controls and adjudication packet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct exact current source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1' -Mode Prepare
          if ($LASTEXITCODE -ne 0) { throw "exact_current_source_prepare_failed:$LASTEXITCODE" }

      - name: Install exact legacy compiler in isolated analysis workspace
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'r7-audit-engine-deps' | Out-Null
          Push-Location 'r7-audit-engine-deps'
          try {
            npm init -y | Out-Null
            npm install --audit=false --fund=false solc@0.8.12
            if ($LASTEXITCODE -ne 0) { throw 'solc_0_8_12_install_failed' }
            $Version = node -e "const s=require('solc'); process.stdout.write(s.version())"
            if (-not $Version.StartsWith('0.8.12+commit.f00d7308')) { throw "solc_version_mismatch:$Version" }
          } finally { Pop-Location }

      - name: Execute real A01-A05 with Windows-safe ESM imports
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';

          const require = createRequire(import.meta.url);
          const solc = require(path.join(process.cwd(), 'r7-audit-engine-deps', 'node_modules', 'solc'));
          const astModuleUrl = pathToFileURL(path.join(process.cwd(), 'r7-work', 'lib', 'security', 'solidity-compiler-ast-runtime.mjs')).href;
          const engineModuleUrl = pathToFileURL(path.join(process.cwd(), 'r7-work', 'lib', 'security', 'audit-a01-a05-engine.ts')).href;
          const { analyzeSolidityCompilerOutputAst, verifySolidityCompilerAstEvidence } = await import(astModuleUrl);
          const { executePass35AuditA01A05 } = await import(engineModuleUrl);
          const sha = (value) => createHash('sha256').update(value).digest('hex');
          const sourceSha = '3f05fc95b3bfd3d41e96fa281e00a71302e35b8fff59f81f399a419cdb9f577e';
          const runtimeSha = '2756d7c52baee85cacb504f6ee1df7aad6809ac8d94a4a111d76991f90d36d6e';
          const address = '0xca11bde05977b3631167028862be2a173976ca11';

          const sr = await fetch(`https://sourcify.dev/server/v2/contract/56/${address}?fields=all`, {
            headers: { accept: 'application/json', 'user-agent': 'velmere-r7-real-engine-repair' },
            signal: AbortSignal.timeout(25000),
          });
          if (!sr.ok) throw new Error(`sourcify_fetch_failed:${sr.status}`);
          const raw = await sr.text();
          const sc = JSON.parse(raw);
          if (sc.match !== 'exact_match') throw new Error('sourcify_not_exact_match');
          const rows = Object.entries(sc.sources ?? {}).filter(([p, v]) => /Multicall3\.sol$/i.test(p) && v && typeof v === 'object' && typeof v.content === 'string');
          if (rows.length !== 1) throw new Error(`source_denominator:${rows.length}`);
          const [sourcePath, record] = rows[0];
          const source = record.content;
          if (sha(Buffer.from(source, 'utf8')) !== sourceSha) throw new Error('exact_deployed_source_sha_mismatch');

          const settings = sc.compilation?.compilerSettings ?? {};
          const input = {
            language: 'Solidity',
            sources: { [sourcePath]: { content: source } },
            settings: {
              ...settings,
              outputSelection: { '*': { '': ['ast'], '*': ['abi', 'storageLayout', 'ir', 'irOptimized', 'evm.bytecode.object', 'evm.deployedBytecode.object', 'evm.methodIdentifiers'] } },
            },
          };
          const compilerOutput = JSON.parse(solc.compile(JSON.stringify(input)));
          const errors = (compilerOutput.errors ?? []).filter((r) => r.severity === 'error');
          if (errors.length) throw new Error(errors.map((r) => r.formattedMessage ?? r.message).join('\n'));

          const sourceFiles = [{ path: sourcePath, content: source }];
          const astEvidence = analyzeSolidityCompilerOutputAst({
            sourceFiles,
            compilerVersion: '0.8.12+commit.f00d7308',
            expectedCompilerVersionPrefix: '0.8.12+commit.f00d7308',
            compilerOutput,
          });
          const astVerification = verifySolidityCompilerAstEvidence(astEvidence, {
            sourceFiles,
            expectedCompilerVersionPrefix: '0.8.12+commit.f00d7308',
          });
          if (astVerification.ok !== true) throw new Error(`compiler_ast_evidence_verification_failed:${JSON.stringify(astVerification)}`);

          const onchain = String(sc.runtimeBytecode?.onchainBytecode ?? '').toLowerCase();
          const recompiled = String(sc.runtimeBytecode?.recompiledBytecode ?? '').toLowerCase();
          if (!/^0x[0-9a-f]{200,}$/.test(onchain) || !/^0x[0-9a-f]{200,}$/.test(recompiled)) throw new Error('runtime_bytecode_missing');
          const liveRes = await fetch('https://bsc-dataseed.binance.org/', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_getCode', params: [address, 'latest'] }),
            signal: AbortSignal.timeout(20000),
          });
          if (!liveRes.ok) throw new Error(`bsc_rpc_failed:${liveRes.status}`);
          const live = String((await liveRes.json()).result ?? '').toLowerCase();
          if (live !== onchain) throw new Error('live_runtime_not_sourcify_onchain');
          if (sha(Buffer.from(live.slice(2), 'hex')) !== runtimeSha) throw new Error('runtime_sha_mismatch');

          const observedAt = new Date().toISOString();
          const auditInput = {
            schemaVersion: 'velmere.pass35.audit-a01-a05-input.v1',
            inputClass: 'CUSTOMER_SUPPLIED_VERIFIED',
            caseRef: 'AUD-REAL-MULTICALL3-56',
            observedAt,
            chainId: '56',
            chainName: 'BSC',
            contractAddress: address,
            projectName: 'Multicall3',
            sourceFiles,
            abi: sc.abi,
            sourceProvenance: {
              provider: 'Sourcify API v2',
              sourceReference: `https://sourcify.dev/server/v2/contract/56/${address}?fields=all`,
              verifiedSource: true,
              observedAt,
              responseSha256: `sha256:${sha(Buffer.from(raw, 'utf8'))}`,
            },
            compiler: {
              family: 'solc',
              version: '0.8.12+commit.f00d7308',
              optimizerEnabled: settings.optimizer?.enabled ?? null,
              optimizerRuns: settings.optimizer?.runs ?? null,
              evmVersion: settings.evmVersion ?? null,
              viaIR: settings.viaIR ?? null,
              settings,
            },
            compiledRuntimeBytecode: recompiled,
            deployedRuntimeBytecode: live,
            compilerAstEvidence: astEvidence,
            compilerDeploymentBinding: null,
            compilerProxyBinding: null,
          };

          const report = executePass35AuditA01A05(auditInput);
          const adjudication = JSON.parse(fs.readFileSync('r7-evidence/R7_AUDIT_BASIC_MULTICALL3_ADJUDICATION_PACKET.json', 'utf8'));
          if (adjudication.reviewState?.twoIndependentExternalFamiliesExecuted !== true || adjudication.reviewState?.qualifiedHumanArchitectureReview !== false) {
            throw new Error('adjudication_packet_boundary_invalid');
          }

          const envelope = {
            schemaVersion: 'velmere.r7.audit-basic-real-engine-exact-current-source.v1',
            status: 'PASS_REAL_ENGINE_EXECUTED_ON_EXACT_CURRENT_SOURCE',
            github: { runId: process.env.GITHUB_RUN_ID, headSha: process.env.GITHUB_SHA, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT) },
            exactCurrentSource: {
              fullSourceAggregateSha256: process.env.R7_RISK_FULL_SOURCE_AGGREGATE_SHA256,
              executionSliceAggregateSha256: process.env.R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256,
              executionSliceManifestSha256: process.env.R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256,
              executionBundleSha256: process.env.R7_RISK_BUNDLE_SHA256,
            },
            target: { chainId: '56', address, exactDeployedSourceSha256: sourceSha, runtimeSha256: runtimeSha, sourcifyMatch: sc.match },
            compilerAst: { verification: astVerification, selfDigestSha256: astEvidence.selfDigestSha256, findings: astEvidence.findings.length },
            twoIndependentExternalFamiliesAvailable: true,
            humanReviewStillRequired: true,
            customerFinalCredit: false,
            report,
            adjudicationPacketPath: 'r7-evidence/R7_AUDIT_BASIC_MULTICALL3_ADJUDICATION_PACKET.json',
            truthBoundary: 'The exact current Velmere A01-A05 engine executed against verified deployed Multicall3 evidence with a verified compiler AST. Qualified-human architecture/business-logic review and higher-order final adjudication remain separate and are not impersonated by this workflow.',
          };
          fs.mkdirSync('artifacts/r7/audit-basic/real-engine', { recursive: true });
          fs.writeFileSync('artifacts/r7/audit-basic/real-engine/R7_AUDIT_BASIC_REAL_ENGINE_A01_A05_EXACT_CURRENT_SOURCE.json', `${JSON.stringify(envelope, null, 2)}\n`);
          console.log(JSON.stringify({
            status: envelope.status,
            exactCurrentSource: envelope.exactCurrentSource,
            target: envelope.target,
            compilerAst: envelope.compilerAst,
            controls: report.controls,
            bytecodeComparison: report.bytecodeComparison,
            staticFamilies: report.staticFamilies,
            summary: report.summary,
            reportSha256: report.reportSha256,
            humanReviewStillRequired: true,
            customerFinalCredit: false,
          }, null, 2));
          '@ | node --experimental-strip-types
          if ($LASTEXITCODE -ne 0) { throw "real_engine_execution_failed:$LASTEXITCODE" }

      - name: Upload repaired real-engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-real-engine-repaired-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/r7/audit-basic/real-engine/R7_AUDIT_BASIC_REAL_ENGINE_A01_A05_EXACT_CURRENT_SOURCE.json
            r7-work/R7_EXECUTION_SLICE_MANIFEST.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30