name: R44P26 Exact Node 24.18 Runtime Intake

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r44p26-exact-node-runtime.yml'

permissions:
  contents: read

jobs:
  exact-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_VERSION: '24.18.0'
      EXPECTED_ARCHIVE_SHA256: 'efced36c041a7a43e8b4a4b35cb929bef7747c1c7442e693901a0b4f06467e1d'
      EXPECTED_NPM_VERSION: '11.16.0'
      SOURCE_RELEASE_TAG: '24.18.0-28070977815'
      SOURCE_RELEASE_ASSET_ID: '456200824'
    steps:
      - uses: actions/checkout@v4
      - name: Download and diagnose exact runtime
        id: intake
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p r44p26-runtime
          ARCHIVE="r44p26-runtime/node-${NODE_VERSION}-linux-x64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$ARCHIVE" \
            "https://github.com/actions/node-versions/releases/download/${SOURCE_RELEASE_TAG}/node-${NODE_VERSION}-linux-x64.tar.gz" || exit 10
          ACTUAL_SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          printf '%s  %s\n' "$ACTUAL_SHA" "$(basename "$ARCHIVE")" | tee r44p26-runtime/archive.sha256
          printf 'EXPECTED_SHA=%s\nACTUAL_SHA=%s\n' "$EXPECTED_ARCHIVE_SHA256" "$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_ARCHIVE_SHA256" || exit 11
          tar -tzf "$ARCHIVE" | sed -n '1,25p' > r44p26-runtime/archive-head.txt || exit 12
          tar -xzf "$ARCHIVE" -C r44p26-runtime || exit 13
          ROOT="r44p26-runtime"
          printf 'RUNTIME_ROOT=%s\n' "$ROOT" | tee r44p26-runtime/runtime-root.txt
          find "$ROOT" -maxdepth 3 \( -type f -o -type l \) | sort | sed -n '1,100p' > r44p26-runtime/runtime-tree-head.txt
          test -x "$ROOT/bin/node" || exit 14
          test -f "$ROOT/lib/node_modules/npm/bin/npm-cli.js" || exit 15
          NODE_ACTUAL="$($ROOT/bin/node --version)"
          NPM_ACTUAL="$($ROOT/bin/node "$ROOT/lib/node_modules/npm/bin/npm-cli.js" --version)"
          VERSIONS="$($ROOT/bin/node -e 'console.log(JSON.stringify(process.versions))')"
          printf 'NODE_ACTUAL=%s\nNPM_ACTUAL=%s\nVERSIONS=%s\n' "$NODE_ACTUAL" "$NPM_ACTUAL" "$VERSIONS" | tee r44p26-runtime/runtime-diagnostics.txt
          "$ROOT/bin/node" -e 'console.log(JSON.stringify({node:process.version,...process.versions},null,2))' > r44p26-runtime/runtime-versions.json
          sha256sum "$ROOT/bin/node" | tee r44p26-runtime/node-binary.sha256
          test "$NODE_ACTUAL" = "v${NODE_VERSION}" || exit 16
          test "$NPM_ACTUAL" = "$EXPECTED_NPM_VERSION" || exit 17
          "$ROOT/bin/node" -e 'if(process.version!=="v24.18.0")process.exit(1); if(!String(process.versions.v8).startsWith("13.6.233"))process.exit(2)' || exit 18
      - name: Write provenance receipt
        if: steps.intake.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,os,datetime
          root=pathlib.Path('r44p26-runtime')
          archive=root/f"node-{os.environ['NODE_VERSION']}-linux-x64.tar.gz"
          runtime=root
          def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          node=runtime/'bin/node'
          npm=runtime/'lib/node_modules/npm/bin/npm-cli.js'
          receipt={
            'schemaVersion':'velmere.pass36.a102r44p26.exact-node-runtime-intake.v1',
            'status':'PASS_EXACT_NODE_RUNTIME_INTAKE',
            'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'source':{
              'repository':'actions/node-versions',
              'releaseTag':os.environ['SOURCE_RELEASE_TAG'],
              'releaseAssetId':int(os.environ['SOURCE_RELEASE_ASSET_ID']),
              'releaseAssetName':archive.name,
              'releaseAssetSha256':sha(archive),
              'githubCheckoutSha':os.environ.get('GITHUB_SHA'),
            },
            'runtime':{
              'nodeVersion':subprocess.check_output([node,'--version'],text=True).strip(),
              'npmVersion':subprocess.check_output([node,npm,'--version'],text=True).strip(),
              'versions':json.loads((root/'runtime-versions.json').read_text()),
              'nodeBinarySha256':sha(node),
              'archiveBytes':archive.stat().st_size,
            },
            'truthBoundary':{
              'exactRuntimeIdentity':True,
              'officialNodeOrgArchiveHashCredit':False,
              'actionsSetupNodeMirrorCredit':True,
              'projectDependencyCredit':False,
              'projectBuildCredit':False,
              'browserCredit':False,
              'stagingCredit':False,
              'saleCredit':False,
              'liveCredit':False,
            }
          }
          (root/'R44P26_EXACT_NODE_RUNTIME_INTAKE.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - name: Upload exact runtime intake or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44p26-exact-node-runtime
          path: |
            r44p26-runtime/node-24.18.0-linux-x64.tar.gz
            r44p26-runtime/archive.sha256
            r44p26-runtime/archive-head.txt
            r44p26-runtime/runtime-root.txt
            r44p26-runtime/runtime-tree-head.txt
            r44p26-runtime/runtime-diagnostics.txt
            r44p26-runtime/node-binary.sha256
            r44p26-runtime/runtime-versions.json
            r44p26-runtime/R44P26_EXACT_NODE_RUNTIME_INTAKE.json
          if-no-files-found: warn
          retention-days: 14
