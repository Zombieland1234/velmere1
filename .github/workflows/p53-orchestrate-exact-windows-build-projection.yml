name: P53 Orchestrate Exact Native Windows P46 Build Projection

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - '.github/workflows/p53-orchestrate-exact-windows-build-projection.yml'

concurrency:
  group: p53-orchestrate-exact-windows-build-projection-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  dispatch-wait-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_WORKFLOW: p47-windows-build-relevant-projection.yml
      TARGET_BRANCH: velmere-p47-p46-build-projection-windows-20260815
      EVIDENCE_ROOT: artifacts/closure/p53/github-run
    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Dispatch target exact-Windows projection workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          started_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          started_epoch="$(date -u +%s)"
          printf '%s\n' "$started_utc" > "$EVIDENCE_ROOT/P53_DISPATCH_STARTED_UTC.txt"
          printf '%s\n' "$started_epoch" > "$EVIDENCE_ROOT/P53_DISPATCH_STARTED_EPOCH.txt"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches"
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({'ref': os.environ['TARGET_BRANCH']}))
          PY
          )"
          code="$(curl --silent --show-error --location --output "$EVIDENCE_ROOT/P53_DISPATCH_RESPONSE.txt" --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" \
            --data "$payload")"
          printf '%s\n' "$code" > "$EVIDENCE_ROOT/P53_DISPATCH_HTTP_CODE.txt"
          if [ "$code" != '204' ]; then
            echo "Workflow dispatch failed with HTTP $code" >&2
            cat "$EVIDENCE_ROOT/P53_DISPATCH_RESPONSE.txt" >&2 || true
            exit 1
          fi
          echo "started_epoch=$started_epoch" >> "$GITHUB_OUTPUT"

      - name: Resolve dispatched run ID
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_EPOCH: ${{ steps.dispatch.outputs.started_epoch }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=20"
          run_id=''
          for attempt in $(seq 1 90); do
            curl --fail --silent --show-error --location \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" > "$EVIDENCE_ROOT/P53_TARGET_RUNS_QUERY.json"
            run_id="$(python - "$EVIDENCE_ROOT/P53_TARGET_RUNS_QUERY.json" "$STARTED_EPOCH" <<'PY'
          import datetime as dt, json, sys
          path, floor = sys.argv[1], int(sys.argv[2]) - 10
          data = json.load(open(path, encoding='utf-8'))
          candidates=[]
          for run in data.get('workflow_runs', []):
              created=run.get('created_at')
              if not created: continue
              epoch=int(dt.datetime.fromisoformat(created.replace('Z','+00:00')).timestamp())
              if epoch >= floor:
                  candidates.append((epoch, int(run['id'])))
          print(max(candidates)[1] if candidates else '')
          PY
          )"
            if [ -n "$run_id" ]; then break; fi
            sleep 4
          done
          if [ -z "$run_id" ]; then
            echo 'Unable to resolve dispatched target run ID' >&2
            exit 1
          fi
          printf '%s\n' "$run_id" > "$EVIDENCE_ROOT/P53_TARGET_RUN_ID.txt"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for target run and capture final metadata
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          conclusion=''
          for attempt in $(seq 1 720); do
            curl --fail --silent --show-error --location \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" > "$EVIDENCE_ROOT/P53_TARGET_RUN.json"
            read -r status conclusion < <(python - "$EVIDENCE_ROOT/P53_TARGET_RUN.json" <<'PY'
          import json, sys
          run=json.load(open(sys.argv[1], encoding='utf-8'))
          print(run.get('status',''), run.get('conclusion') or '')
          PY
          )
            printf '%s %s\n' "$status" "$conclusion"
            if [ "$status" = 'completed' ]; then break; fi
            sleep 10
          done
          if [ "$(python - "$EVIDENCE_ROOT/P53_TARGET_RUN.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8')).get('status',''))
          PY
          )" != 'completed' ]; then
            echo 'Target run did not complete within timeout' >&2
            exit 1
          fi
          printf '%s\n' "$conclusion" > "$EVIDENCE_ROOT/P53_TARGET_CONCLUSION.txt"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Download target logs, jobs and all artifacts
        if: always() && steps.resolve.outputs.run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          headers=(--header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GH_TOKEN}" --header 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail --silent --show-error --location "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > "$EVIDENCE_ROOT/P53_TARGET_JOBS.json"
          logs_code="$(curl --silent --show-error --location --output "$EVIDENCE_ROOT/P53_TARGET_LOGS.zip" --write-out '%{http_code}' "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs")"
          printf '%s\n' "$logs_code" > "$EVIDENCE_ROOT/P53_TARGET_LOGS_HTTP_CODE.txt"
          curl --fail --silent --show-error --location "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > "$EVIDENCE_ROOT/P53_TARGET_ARTIFACTS.json"
          mkdir -p "$EVIDENCE_ROOT/downloaded-artifacts"
          python - "$EVIDENCE_ROOT/P53_TARGET_ARTIFACTS.json" <<'PY' > "$EVIDENCE_ROOT/P53_ARTIFACT_DOWNLOAD_PLAN.tsv"
          import json,sys
          for a in json.load(open(sys.argv[1],encoding='utf-8')).get('artifacts',[]):
              print(f"{a['id']}\t{a['name']}\t{a.get('size_in_bytes',0)}\t{a.get('archive_download_url','')}")
          PY
          while IFS=$'\t' read -r artifact_id artifact_name artifact_size artifact_url; do
            [ -n "$artifact_id" ] || continue
            safe_name="$(printf '%s' "$artifact_name" | tr -cs 'A-Za-z0-9._-' '_')"
            curl --fail --silent --show-error --location "${headers[@]}" "$artifact_url" \
              --output "$EVIDENCE_ROOT/downloaded-artifacts/${artifact_id}__${safe_name}.zip"
          done < "$EVIDENCE_ROOT/P53_ARTIFACT_DOWNLOAD_PLAN.tsv"
          python - "$EVIDENCE_ROOT" <<'PY'
          import hashlib,json,os,sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[1])
          inventory=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  inventory.append({'path':p.relative_to(root).as_posix(),'byteLength':p.stat().st_size,'sha256':h})
          (root/'P53_EVIDENCE_INVENTORY.json').write_text(json.dumps({'schemaVersion':'velmere.p53.github-run-evidence-inventory.v1','files':inventory},indent=2)+'\n',encoding='utf-8')
          for z in sorted((root/'downloaded-artifacts').glob('*.zip')):
              out=z.with_suffix('')
              out.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(z) as archive:
                  archive.testzip()
                  archive.extractall(out)
          PY

      - name: Build fail-closed adjudication summary
        if: always()
        shell: bash
        env:
          TARGET_CONCLUSION: ${{ steps.wait.outputs.conclusion }}
          TARGET_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          python - "$EVIDENCE_ROOT" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          run={}
          jobs={}
          artifacts={}
          for name,target in [('P53_TARGET_RUN.json',run),('P53_TARGET_JOBS.json',jobs),('P53_TARGET_ARTIFACTS.json',artifacts)]:
              p=root/name
              if p.is_file():
                  target.update(json.loads(p.read_text(encoding='utf-8')))
          receipts=[]
          for p in sorted(root.rglob('*.json')):
              if p.name.startswith('P53_'): continue
              try:
                  value=json.loads(p.read_text(encoding='utf-8-sig'))
              except Exception:
                  continue
              if isinstance(value,dict):
                  receipts.append({'path':p.relative_to(root).as_posix(),'schemaVersion':value.get('schemaVersion'),'status':value.get('status'),'decision':value.get('decision'),'classification':value.get('classification')})
          job_rows=[]
          for job in jobs.get('jobs',[]):
              job_rows.append({'id':job.get('id'),'name':job.get('name'),'status':job.get('status'),'conclusion':job.get('conclusion'),'startedAt':job.get('started_at'),'completedAt':job.get('completed_at'),'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion'),'number':s.get('number')} for s in job.get('steps',[])]})
          summary={
              'schemaVersion':'velmere.p53.exact-native-windows-build-projection-adjudication.v1',
              'status':'PASS' if run.get('conclusion')=='success' else 'FAIL',
              'decision':'PASS_TARGET_WORKFLOW_SUCCESS' if run.get('conclusion')=='success' else 'FAIL_CLOSED_TARGET_WORKFLOW_NOT_SUCCESS',
              'targetWorkflow':'p47-windows-build-relevant-projection.yml',
              'targetBranch':'velmere-p47-p46-build-projection-windows-20260815',
              'targetRun':{
                  'id':run.get('id'),'runNumber':run.get('run_number'),'runAttempt':run.get('run_attempt'),'status':run.get('status'),'conclusion':run.get('conclusion'),'event':run.get('event'),'headBranch':run.get('head_branch'),'headSha':run.get('head_sha'),'createdAt':run.get('created_at'),'updatedAt':run.get('updated_at'),'runStartedAt':run.get('run_started_at')
              },
              'jobs':job_rows,
              'artifactCount':artifacts.get('total_count',0),
              'receipts':receipts,
              'creditBoundary':'Success can close only the exact 1597-file P46 build-relevant projection on native Windows. Full 6666-file current-source Windows, Browser, PDF, final customer outputs, rights, material tier deltas and sale eligibility remain separate.',
              'globalStatus':'NO_GO'
          }
          encoded=json.dumps(summary,sort_keys=True,separators=(',',':')).encode()
          summary['integritySha256']=hashlib.sha256(encoded).hexdigest()
          (root/'P53_EXACT_WINDOWS_BUILD_PROJECTION_ADJUDICATION.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit immutable P53 GitHub evidence to branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'velmere-evidence-bot'
          git config user.email 'velmere-evidence-bot@users.noreply.github.com'
          git add "$EVIDENCE_ROOT"
          if git diff --cached --quiet; then
            echo 'No new P53 evidence to commit.'
            exit 0
          fi
          git commit -m 'P53: capture exact native Windows build-projection evidence [skip ci]'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Fail orchestration when target did not pass
        if: always()
        shell: bash
        env:
          TARGET_CONCLUSION: ${{ steps.wait.outputs.conclusion }}
        run: |
          if [ "$TARGET_CONCLUSION" != 'success' ]; then
            echo "Target workflow conclusion: $TARGET_CONCLUSION" >&2
            exit 1
          fi
