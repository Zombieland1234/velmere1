name: P69 Native Windows ECB Reference FX Customer Envelope

on:
  push:
    branches:
      - velmere-p69-ecb-reference-fx-customer-envelope-20260816
  workflow_dispatch:

concurrency:
  group: p69-native-windows-ecb-reference-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p69-native-windows-current-source:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout P69 control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        id: npmcli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }
          $npmRoot=(npm root --global).Trim()
          $npmCli=(Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node --version
          npm --version
          python --version

      - name: Reconstruct P46 then apply P66 P68 P69 source deltas
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config core.autocrlf false
          git config core.eol lf
          New-Item -ItemType Directory -Force p69-out | Out-Null
          python p49-build-projection/reconstruct-p49-direct-projection.py `
            --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json `
            --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f `
            --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json `
            --runner p49-build-projection/run-p47-product-windows-projection.mjs `
            --parts-root p49-build-projection/parts `
            --work-root p69-work `
            --output-root p69-out
          if ($LASTEXITCODE -ne 0) { throw "P46 reconstruction failed: $LASTEXITCODE" }
          python p66-runtime/apply-p66-audit-pdf-delta.py --source-root p69-work/source --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --output-manifest p69-work/P66_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p69-out/P66_STAGE1.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 1 failed: $LASTEXITCODE" }
          python p66-runtime/finalize-p66-shield-pro-row-id.py --source-root p69-work/source --manifest p69-work/P66_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p69-out/P66_STAGE2.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 2 failed: $LASTEXITCODE" }
          python p66-runtime/fix-p66-topology-ts-const.py --source-root p69-work/source --manifest p69-work/P66_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p69-out/P66_STAGE3.log
          if ($LASTEXITCODE -ne 0) { throw "P66 stage 3 failed: $LASTEXITCODE" }
          python p68-runtime/apply-p68-audit-customer-truth.py --source-root p69-work/source --manifest p69-work/P66_BUILD_PROJECTION_MANIFEST.json --output-manifest p69-work/P68_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p69-out/P68_STAGE.log
          if ($LASTEXITCODE -ne 0) { throw "P68 source patch failed: $LASTEXITCODE" }
          python p69-runtime/apply-p69-ecb-reference-fx.py --source-root p69-work/source --manifest p69-work/P68_BUILD_PROJECTION_MANIFEST.json --output-manifest p69-work/P69_BUILD_PROJECTION_MANIFEST.json | Tee-Object -FilePath p69-out/P69_SOURCE_PATCH.log
          if ($LASTEXITCODE -ne 0) { throw "P69 source patch failed: $LASTEXITCODE" }
          $m=Get-Content p69-work/P69_BUILD_PROJECTION_MANIFEST.json -Raw | ConvertFrom-Json
          if ($m.projection.fileCount -ne 1597 -or $m.projection.payloadBytes -ne 20972925 -or $m.projection.pathSetSha256 -ne 'b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73' -or $m.projection.sourceContentAggregateSha256 -ne '5454819675a912e9791e143d48d61385622e1ab3f494253ea28c6a9a10895d71') { throw 'P69 manifest identity mismatch' }
          $expected=@{
            'lib/network/brokered-egress.ts'='b155f11034d6657d35ee3a4605c756ccbe034ea3ae53463bf796930fad9f68b1';
            'lib/market-integrity/real-markets-quote-hydration.ts'='0e66f15e5be1792c8f42d4ba0e68aee5354e9f90189404100d9126a8bcb37635';
            'lib/market-integrity/real-markets-route-orchestrator.ts'='189382dc2ba3416a7b1a700ae0ac9a80e5decd9a89b37a0175370fd30f292d28';
            'lib/market-integrity/pass4413-cross-asset-runtime-normalizers.ts'='4963988166f9d17699cce52a22470aa92ebe3c5c6ce58149f5867237afe75f72';
            'components/market-integrity/CrossAssetCollapseRadarPanel.tsx'='48e54bd9896fb6b3ae9f3d4295d2c63cc39a6bfa508bcfeeb0ae44cc9a765c88'
          }
          foreach($rel in $expected.Keys){ $actual=(Get-FileHash -LiteralPath (Join-Path 'p69-work/source' $rel) -Algorithm SHA256).Hash.ToLowerInvariant(); if($actual -ne $expected[$rel]){throw "P69 source hash mismatch: $rel $actual"} }
          Copy-Item p69-work/P69_BUILD_PROJECTION_MANIFEST.json p69-out/

      - name: Verify owner corrected topology remains exact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location p69-work/source
          try {
            node --experimental-strip-types -e "import('./lib/product/vlm-canonical-product-topology.ts').then(m=>{const r=m.VLM_CANONICAL_CUSTOMER_PRODUCTS,f=m.VLM_CANONICAL_PRODUCT_FAMILIES,p=m.VLM_INTERNAL_EXECUTION_PROFILES,t=m.VLM_CONTEXT_TRANSITIONS;const fake=r.filter(x=>['angel','whale-watch','market-impact','shield-map','risk-indicator'].includes(x.family)&&x.tier!==null);if(r.length!==20||f.length!==10||p.length!==20||t.length!==10||fake.length||f.some(x=>x.family==='pdf')||m.VLM_V16_TOPOLOGY_DENOMINATORS.legacy33ProductCompletionDenominatorRetired!==true)process.exit(2);console.log(JSON.stringify({status:'PASS_P69_TOPOLOGY_RETENTION',rows:20,families:10,profiles:20,transitions:10,fakeStandaloneTiers:0,pdfFamily:false}))}).catch(e=>{console.error(e);process.exit(1)})"
            if ($LASTEXITCODE -ne 0) { throw "P69 topology verifier failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Exact Windows dependency semantic lint and dual build
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.npmcli.outputs.npm_cli }}
        run: |
          $ErrorActionPreference='Stop'
          python p60-runtime/build-p60-reconciled-runner.py --input p49-build-projection/run-p47-product-windows-projection.mjs --output p69-work/run-p69-reconciled-windows-projection.mjs --receipt p69-out/P69_BASE_RECONCILED_RUNNER.json
          if ($LASTEXITCODE -ne 0) { throw 'base runner generation failed' }
          python p66-runtime/patch-p66-reconciled-runner.py --runner p69-work/run-p69-reconciled-windows-projection.mjs --receipt p69-out/P69_P66_NEXT_ENV_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 runner adaptation failed' }
          python p68-runtime/patch-p68-reconciled-runner.py --runner p69-work/run-p69-reconciled-windows-projection.mjs --receipt p69-out/P69_P68_NEXT_ENV_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P68 runner adaptation failed' }
          python p69-runtime/patch-p69-reconciled-runner.py --runner p69-work/run-p69-reconciled-windows-projection.mjs --receipt p69-out/P69_CURRENT_NEXT_ENV_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P69 runner adaptation failed' }
          node --check p69-work/run-p69-reconciled-windows-projection.mjs
          if ($LASTEXITCODE -ne 0) { throw 'P69 runner parse failed' }
          node p69-work/run-p69-reconciled-windows-projection.mjs --source-root p69-work/source --manifest p69-work/P69_BUILD_PROJECTION_MANIFEST.json --output-dir p69-out
          if ($LASTEXITCODE -ne 0) { throw "P69 exact Windows engineering failed: $LASTEXITCODE" }

      - name: Execute current public ECB reference customer sub-envelope
        shell: pwsh
        env:
          P68_SOURCE_ROOT: ${{ github.workspace }}\p69-work\source
          P69_SOURCE_ROOT: ${{ github.workspace }}\p69-work\source
          P69_RESULT_DIR: ${{ github.workspace }}\p69-out
        run: |
          $ErrorActionPreference='Stop'
          node --import ./p68-runtime/register-p68-ts-loader.mjs ./p69-runtime/test-p69-ecb-reference-route.mjs
          if ($LASTEXITCODE -ne 0) { throw "P69 ECB customer envelope failed: $LASTEXITCODE" }

      - name: Capture P69 workflow boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p69-out | Out-Null
          $rightsPassed=0
          $rightsDenominator=203
          $referenceState='NOT_EXECUTED_OR_FAILED'
          $receiptPath='p69-out/P69_ECB_REFERENCE_PUBLIC_NETWORK_RIGHTS_RECEIPT.json'
          if(Test-Path -LiteralPath $receiptPath){
            $receipt=Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if($receipt.status -eq 'PASS_P69_ECB_REFERENCE_PUBLIC_NETWORK_FREE_DISPLAY_BOUNDED' -and $receipt.rightsMeasurement.currentUniqueRightsObligations -eq 203 -and $receipt.rightsMeasurement.passed -eq 2){
              $rightsPassed=2
              $referenceState='PASS_BOUNDED_FREE_PUBLIC_DISPLAY'
            }
          }
          $r=[ordered]@{
            schemaVersion='velmere.p69.github-workflow-boundary.v1';runId='${{ github.run_id }}';runAttempt='${{ github.run_attempt }}';sha='${{ github.sha }}';ref='${{ github.ref }}';runnerOs='${{ runner.os }}';runnerArch='${{ runner.arch }}';imageOs=$env:ImageOS;node=(node --version 2>$null);npm=(npm --version 2>$null);
            changedBuildRelevantFiles=5;projectionFileCount=1597;projectionPayloadBytes=20972925;projectionPathSetSha256='b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73';projectionAggregateSha256='5454819675a912e9791e143d48d61385622e1ab3f494253ea28c6a9a10895d71';generatedNextEnvProjectionPayloadBytes=20972910;generatedNextEnvProjectionAggregateSha256='5d5670a7a20d1e0ea320c29be3df9a38b75269d9251f304871f941827ccee3be';
            productFamilies=10;customerFacingRows=20;currentExecutionProfiles=20;paidValueTransitions=10;rightsPassed=$rightsPassed;rightsDenominator=$rightsDenominator;referenceEnvelopeState=$referenceState;customerFinalOutputs=0;realMarketsFinalRows='0/3';saleEligibleRows=0;live=$false;worldClassProven=$false;
            truthBoundary='Exact Windows current-source proof plus current public ECB direct EUR reference-rate sub-envelope. Any rights credit is limited to two free-public-display reference fields only. It is not market.price, not executable, not a full Real Markets output, and grants no paid-value, sale, LIVE or WORLD_CLASS credit.'
          }
          $r | ConvertTo-Json -Depth 8 | Set-Content p69-out/P69_GITHUB_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload P69 exact Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p69-native-windows-ecb-reference-fx
          path: p69-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
