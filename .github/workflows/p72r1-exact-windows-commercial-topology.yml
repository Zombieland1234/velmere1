name: P72R3 Exact Windows Commercial Topology Measurement

on:
  push:
    branches:
      - velmere-p72-commercial-topology-measurement-20260817
  workflow_dispatch:

concurrency:
  group: p72r3-commercial-topology-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p72r3-current-product:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout exact P72R3 control head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        id: npmcli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }
          $npmRoot=(npm root --global).Trim()
          $npmCli=(Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Reconstruct exact P71R5 parent and apply P72 plus P72R3 repairs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config core.autocrlf false
          git config core.eol lf
          New-Item -ItemType Directory -Force p72r3-out | Out-Null
          python p49-build-projection/reconstruct-p49-direct-projection.py --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --runner p49-build-projection/run-p47-product-windows-projection.mjs --parts-root p49-build-projection/parts --work-root p72r3-work --output-root p72r3-out
          if ($LASTEXITCODE -ne 0) { throw 'P46 reconstruction failed' }
          python p66-runtime/apply-p66-audit-pdf-delta.py --source-root p72r3-work/source --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --output-manifest p72r3-work/P66.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 stage1 failed' }
          python p66-runtime/finalize-p66-shield-pro-row-id.py --source-root p72r3-work/source --manifest p72r3-work/P66.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 stage2 failed' }
          python p66-runtime/fix-p66-topology-ts-const.py --source-root p72r3-work/source --manifest p72r3-work/P66.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 stage3 failed' }
          python p68-runtime/apply-p68-audit-customer-truth.py --source-root p72r3-work/source --manifest p72r3-work/P66.json --output-manifest p72r3-work/P68.json
          if ($LASTEXITCODE -ne 0) { throw 'P68 failed' }
          python p69-runtime/apply-p69-ecb-reference-fx.py --source-root p72r3-work/source --manifest p72r3-work/P68.json --output-manifest p72r3-work/P69.json
          if ($LASTEXITCODE -ne 0) { throw 'P69 failed' }
          python p69-runtime/fix-p69r2-node24-pinned-egress.py --source-root p72r3-work/source --manifest p72r3-work/P69.json --output-manifest p72r3-work/P69R2.json --receipt p72r3-out/P69R2.json
          if ($LASTEXITCODE -ne 0) { throw 'P69R2 failed' }
          python p71-runtime/apply-p71-owner-truth-advanced-automation.py --source-root p72r3-work/source --manifest p72r3-work/P69R2.json --output-manifest p72r3-work/P71.json --receipt p72r3-out/P71.json
          if ($LASTEXITCODE -ne 0) { throw 'P71 failed' }
          python p71-runtime/apply-p71r1-expanded-advanced-automation.py --source-root p72r3-work/source --manifest p72r3-work/P71.json --output-manifest p72r3-work/P71R1.json --receipt p72r3-out/P71R1.json
          if ($LASTEXITCODE -ne 0) { throw 'P71R1 failed' }
          python p71-runtime/apply-p71r2-optional-qa-status.py --source-root p72r3-work/source --manifest p72r3-work/P71R1.json --output-manifest p72r3-work/P71R2.json --receipt p72r3-out/P71R2.json
          if ($LASTEXITCODE -ne 0) { throw 'P71R2 failed' }
          python p71-runtime/apply-p71r3-remove-stale-disclosure.py --source-root p72r3-work/source --manifest p72r3-work/P71R2.json --output-manifest p72r3-work/P71R5.json --receipt p72r3-out/P71R3.json
          if ($LASTEXITCODE -ne 0) { throw 'P71R3 failed' }
          $p=Get-Content p72r3-work/P71R5.json -Raw | ConvertFrom-Json
          if($p.projection.fileCount -ne 1597 -or $p.projection.payloadBytes -ne 20981047 -or $p.projection.sourceContentAggregateSha256 -ne 'ad00eb69fef750a106ed36828dfa22e5590181e9903d062132596519f494af5d') { throw 'P71R5 parent identity mismatch' }
          python p72-runtime/apply-p72-commercial-topology-measurement.py --source-root p72r3-work/source --manifest p72r3-work/P71R5.json --output-manifest p72r3-work/P72.json --receipt p72r3-out/P72_SOURCE_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P72 calibrated patch failed' }
          $p72=Get-Content p72r3-work/P72.json -Raw | ConvertFrom-Json
          if($p72.projection.fileCount -ne 1597 -or $p72.projection.payloadBytes -ne 20988558 -or $p72.projection.sourceContentAggregateSha256 -ne '712aaefaf774d59f3b329cfd107fbbc5519329dd5ad71d3cd2262a1e8042ea9b') { throw 'P72 candidate identity mismatch' }
          python p72-runtime/apply-p72r3-typescript-contract-repair.py --source-root p72r3-work/source --manifest p72r3-work/P72.json --output-manifest p72r3-work/P72R3_BUILD_PROJECTION_MANIFEST.json --receipt p72r3-out/P72R3_SOURCE_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P72R3 TypeScript repair failed' }
          $m=Get-Content p72r3-work/P72R3_BUILD_PROJECTION_MANIFEST.json -Raw | ConvertFrom-Json
          if($m.projection.fileCount -ne 1597 -or $m.projection.payloadBytes -ne 20988569 -or $m.projection.pathSetSha256 -ne 'b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73' -or $m.projection.sourceContentAggregateSha256 -ne '4db46e951d3f7f2cc04f61418279b9347bc21b4300b7152aa3e2c77395216252') { throw 'P72R3 product identity mismatch' }
          Copy-Item p72r3-work/P72R3_BUILD_PROJECTION_MANIFEST.json p72r3-out/
          Copy-Item p72-runtime/P72_OUTPUT_METADATA_CALIBRATION_RECEIPT.json p72r3-out/
          Copy-Item p72-runtime/P72_PRODUCT_SPEC_SPLIT_RECEIPT.json p72r3-out/

      - name: Static fail-closed and TypeScript-repair invariants
        shell: pwsh
        env:
          P72_SOURCE_ROOT: ${{ github.workspace }}\p72r3-work\source
          P72_RESULT_DIR: ${{ github.workspace }}\p72r3-out
        run: |
          $ErrorActionPreference='Stop'
          node p72-runtime/test-p72-endpoint-failclosed.mjs
          if ($LASTEXITCODE -ne 0) { throw 'P72 static fail-closed test failed' }
          $readiness=Get-Content 'p72r3-work/source/app/api/checkout/vlm-service/readiness/route.ts' -Raw
          $field=Get-Content 'p72r3-work/source/lib/commerce/vlm-field-level-readiness.ts' -Raw
          if($readiness -notmatch 'const commercial = tier && family'){ throw 'P72R3 commercial declaration repair missing' }
          if($field.Contains('NO_SAE_SUBSTITUTE')){ throw 'P72R3 invalid alternative strategy literal remains' }
          if(([regex]::Matches($field,'NO_SAFE_SUBSTITUTE')).Count -lt 5){ throw 'P72R3 safe-substitute literals unexpectedly missing' }

      - name: Exact Windows TypeScript ESLint Webpack Turbopack
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.npmcli.outputs.npm_cli }}
        run: |
          $ErrorActionPreference='Stop'
          python p60-runtime/build-p60-reconciled-runner.py --input p49-build-projection/run-p47-product-windows-projection.mjs --output p72r3-work/run-p72r3.mjs --receipt p72r3-out/RUNNER_P60.json
          if ($LASTEXITCODE -ne 0) { throw 'P60 runner failed' }
          python p66-runtime/patch-p66-reconciled-runner.py --runner p72r3-work/run-p72r3.mjs --receipt p72r3-out/RUNNER_P66.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 runner failed' }
          python p68-runtime/patch-p68-reconciled-runner.py --runner p72r3-work/run-p72r3.mjs --receipt p72r3-out/RUNNER_P68.json
          if ($LASTEXITCODE -ne 0) { throw 'P68 runner failed' }
          python p69-runtime/patch-p69-reconciled-runner.py --runner p72r3-work/run-p72r3.mjs --receipt p72r3-out/RUNNER_P69.json
          if ($LASTEXITCODE -ne 0) { throw 'P69 runner failed' }
          python p69-runtime/patch-p69r2-reconciled-runner.py --runner p72r3-work/run-p72r3.mjs --receipt p72r3-out/RUNNER_P69R2.json
          if ($LASTEXITCODE -ne 0) { throw 'P69R2 runner failed' }
          python p71-runtime/patch-p71-reconciled-runner.py --runner p72r3-work/run-p72r3.mjs --receipt p72r3-out/RUNNER_P71.json
          if ($LASTEXITCODE -ne 0) { throw 'P71 runner failed' }
          python p71-runtime/patch-p71r1-reconciled-runner.py --runner p72r3-work/run-p72r3.mjs --receipt p72r3-out/RUNNER_P71R1.json
          if ($LASTEXITCODE -ne 0) { throw 'P71R1 runner failed' }
          python p71-runtime/patch-p71r3-reconciled-runner.py --runner p72r3-work/run-p72r3.mjs --receipt p72r3-out/RUNNER_P71R3.json
          if ($LASTEXITCODE -ne 0) { throw 'P71R3 runner failed' }
          python p72-runtime/patch-p72-reconciled-runner.py --runner p72r3-work/run-p72r3.mjs --receipt p72r3-out/RUNNER_P72.json
          if ($LASTEXITCODE -ne 0) { throw 'P72 runner failed' }
          python p72-runtime/patch-p72r3-reconciled-runner.py --runner p72r3-work/run-p72r3.mjs --receipt p72r3-out/RUNNER_P72R3.json
          if ($LASTEXITCODE -ne 0) { throw 'P72R3 runner failed' }
          node --check p72r3-work/run-p72r3.mjs
          if ($LASTEXITCODE -ne 0) { throw 'P72R3 runner parse failed' }
          node p72r3-work/run-p72r3.mjs --source-root p72r3-work/source --manifest p72r3-work/P72R3_BUILD_PROJECTION_MANIFEST.json --output-dir p72r3-out
          if ($LASTEXITCODE -ne 0) { throw 'P72R3 exact engineering failed' }

      - name: Execute commercial topology runtime tests
        shell: pwsh
        env:
          P72_SOURCE_ROOT: ${{ github.workspace }}\p72r3-work\source
          P72_RESULT_DIR: ${{ github.workspace }}\p72r3-out
        run: |
          $ErrorActionPreference='Stop'
          Push-Location p72r3-work/source
          try {
            node ./node_modules/tsx/dist/cli.mjs ../../p72-runtime/test-p72-commercial-topology-runtime.ts | Tee-Object ../..\p72r3-out\P72_RUNTIME.log
            if ($LASTEXITCODE -ne 0) { throw 'P72 commercial topology runtime failed' }
          } finally { Pop-Location }

      - name: Capture current source delta and boundary
        if: always()
        shell: pwsh
        run: |
          $root='p72r3-work/source';$dst='p72r3-out/source-delta'
          $paths=@('lib/commerce/vlm-commercial-readiness.ts','lib/commerce/vlm-field-level-readiness.ts','lib/commerce/vlm-evidence-availability.ts','app/api/checkout/vlm-service/route.ts','app/api/checkout/vlm-service/readiness/route.ts')
          foreach($rel in $paths){$s=Join-Path $root $rel;if(Test-Path $s){$t=Join-Path $dst $rel;New-Item -ItemType Directory -Force(Split-Path $t)|Out-Null;Copy-Item $s $t}}
          $eng='NOT_EXECUTED_OR_FAILED';$runtime='NOT_EXECUTED_OR_FAILED'
          if(Test-Path 'p72r3-out/P47_EXACT_WINDOWS_BUILD_RELEVANT_PROJECTION_RECEIPT.json'){$x=Get-Content 'p72r3-out/P47_EXACT_WINDOWS_BUILD_RELEVANT_PROJECTION_RECEIPT.json' -Raw|ConvertFrom-Json;if($x.status -eq 'PASS'){$eng='PASS'}}
          if(Test-Path 'p72r3-out/P72_COMMERCIAL_TOPOLOGY_RUNTIME_TEST.json'){$x=Get-Content 'p72r3-out/P72_COMMERCIAL_TOPOLOGY_RUNTIME_TEST.json' -Raw|ConvertFrom-Json;if($x.status -eq 'PASS'){$runtime='PASS'}}
          [ordered]@{schemaVersion='velmere.p72r3.github-boundary.v1';runId='${{ github.run_id }}';sha='${{ github.sha }}';failedRunsZeroCredit=@('32024197810','32026094320','32026719658','32027345245','32027667575');projectionFileCount=1597;projectionPayloadBytes=20988569;projectionAggregateSha256='4db46e951d3f7f2cc04f61418279b9347bc21b4300b7152aa3e2c77395216252';generatedNextEnvPayloadBytes=20988554;generatedNextEnvAggregateSha256='9eda1cb4d61b81887f8ab5fe623305647ec20e90493ed5dc059adc0979f9d25c';engineering=$eng;runtimeTopology=$runtime;families=10;customerRows=20;profiles=20;paidTransitions=10;pdfProductFamily=$false;shieldProIndependent=$true;rights='2/203';customerFinal='0/20';paidValue='0/10';sale='0/20';live=$false;worldClassProven=$false;truthBoundary='P72R3 corrects commercial/readiness topology plus the two exact TypeScript defects discovered by native Windows. No release numerator promotion.'}|ConvertTo-Json -Depth 8|Set-Content p72r3-out/P72R3_GITHUB_BOUNDARY.json -Encoding utf8

      - name: Upload P72R3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p72r3-commercial-topology-exact-windows
          path: p72r3-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
