name: R44P14 Diagnose Compressed Inputs

on:
  pull_request:
    branches: [main]
    paths:
      - 'r44p14-evidence/**'
      - '.github/workflows/r44p14-diagnose-compressed-inputs.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test each encoded input independently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,pathlib
          root=pathlib.Path('r44p14-evidence')
          rows=[]
          for name in ['analyzer.mjs.gz.b64','run_r44p14_external.mjs.gz.b64','parent_predictions.json.gz.b64']:
              p=root/name
              text=p.read_text().strip()
              row={'name':name,'chars':len(text)}
              try:
                  decoded=base64.b64decode(text,validate=True)
                  row['decodedBytes']=len(decoded)
                  raw=gzip.decompress(decoded)
                  row['rawBytes']=len(raw)
                  row['status']='PASS'
              except Exception as exc:
                  row['status']='FAIL'
                  row['error']=type(exc).__name__+':'+str(exc)
              rows.append(row)
          import json
          print(json.dumps(rows,indent=2))
          if any(row['status']!='PASS' for row in rows): raise SystemExit(1)
          PY
