name: R44P36 Exact Missing npm Tarballs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r44p36-zustand-4-5-7-artifact.yml'

permissions:
  contents: read

jobs:
  package-missing-tarballs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Pack exact missing tarballs
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.18.0'
          test "$(npm --version)" = '11.16.0'
          mkdir -p r44p36-toolchain
          cd r44p36-toolchain
          packages=(
            'p-locate@4.1.0' 'p-limit@3.1.0' 'p-limit@2.3.0'
            'ox@0.9.3' 'ox@0.6.9' 'ox@0.14.30' 'optionator@0.9.4'
            'on-exit-leak-free@2.1.2' 'ofetch@1.5.1' 'object-hash@3.0.0'
            'object-assign@4.1.1' 'normalize-path@3.0.0' 'node-releases@2.0.51'
            'node-mock-http@1.0.5' 'node-fetch@2.7.0' 'node-fetch-native@1.6.7'
            'node-addon-api@7.1.1' 'next@16.2.12' 'next-intl@4.13.0'
            'next-intl-swc-plugin-extractor@4.13.4' 'negotiator@1.0.0'
            'natural-compare@1.4.0' 'nanoid@3.3.16' 'mz@2.7.0'
            'multiformats@9.9.0' 'ms@2.1.3' 'motion-utils@12.39.0'
            'motion-dom@12.43.0' 'mipd@0.0.7' 'minimatch@10.2.6'
            'mime-types@2.1.35' 'mime-db@1.52.0' 'micromatch@4.0.8'
            'meshoptimizer@1.1.1' 'merge2@1.4.1' 'md5@2.3.0'
            'math-intrinsics@1.1.0' 'lucide-react@0.475.0' 'lru-cache@5.1.1'
            'lru-cache@11.5.2' 'locate-path@6.0.0' 'locate-path@5.0.0'
            'lit@3.3.0' 'lit-html@3.3.3' 'lit-element@4.2.2'
            'lines-and-columns@1.2.4' 'lilconfig@3.1.3' 'levn@0.4.1'
            'keyvaluestorage-interface@1.0.0' 'keyv@4.5.4' 'json5@2.2.3'
            'json-stable-stringify-without-jsonify@1.0.1' 'json-schema-traverse@0.4.1'
            'json-buffer@3.0.1' 'jsesc@3.1.0' 'js-tokens@4.0.0'
            'jose@6.2.7' 'jiti@1.21.7' 'isows@1.0.7' 'isexe@2.0.0'
            'is-retry-allowed@2.2.0' 'is-number@7.0.0' 'is-glob@4.0.3'
            'is-fullwidth-code-point@3.0.0' 'is-extglob@2.1.1'
            'is-core-module@2.16.2' 'is-buffer@1.1.6' 'is-binary-path@2.1.0'
            'iron-webcrypto@1.2.1' 'intl-messageformat@11.2.13'
            'imurmurhash@0.1.4' 'ignore@7.0.6' 'ignore@5.3.2'
            'ieee754@1.2.1' 'idb-keyval@6.2.1' 'icu-minify@4.13.4'
            'iceberg-js@0.8.1' 'https-proxy-agent@5.0.1'
            'hermes-parser@0.25.1' 'hermes-estree@0.25.1'
            'hasown@2.0.4' 'has-tostringtag@1.0.2' 'has-symbols@1.1.0'
            'h3@1.15.11' 'gopd@1.2.0' 'globals@17.3.0'
            'glob-parent@6.0.2' 'glob-parent@5.1.2' 'get-proto@1.0.1'
            'get-nonce@1.0.1' 'get-intrinsic@1.3.0' 'get-caller-file@2.0.5'
            'gensync@1.0.0-beta.2' 'function-bind@1.1.2'
            'fsevents@2.3.3' 'fsevents@2.3.2' 'framer-motion@12.40.0'
            'fraction.js@5.3.4' 'form-data@4.0.6' 'follow-redirects@1.16.0'
            'flatted@3.4.4' 'flat-cache@4.0.1' 'find-up@5.0.0'
            'find-up@4.1.0' 'fill-range@7.1.1' 'file-entry-cache@8.0.0'
            'fflate@0.8.3' 'fdir@6.5.0' 'fastq@1.20.1'
            'fast-levenshtein@2.0.6' 'fast-json-stable-stringify@2.1.0'
            'fast-glob@3.3.3' 'fast-glob@3.3.1' 'fast-deep-equal@3.1.3'
          )
          for spec in "${packages[@]}"; do
            npm pack "$spec" --registry=https://registry.npmjs.org --ignore-scripts
          done
          sha256sum *.tgz | sort > EXACT_MISSING_TARBALLS_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r44p36-exact-missing-npm-tarballs
          path: r44p36-toolchain
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
