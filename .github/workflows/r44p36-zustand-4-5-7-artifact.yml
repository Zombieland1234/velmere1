name: R44P36 Exact Full Lockfile npm Tarballs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r44p36-zustand-4-5-7-artifact.yml'

permissions:
  contents: read

jobs:
  package-lockfile-tarballs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Pack exact lockfile tarballs
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.18.0'
          test "$(npm --version)" = '11.16.0'
          mkdir -p r44p36-toolchain
          cd r44p36-toolchain
          printf '%s' '' | base64 -d | gzip -d > package-specs.txt
          while IFS= read -r spec; do
            spec="${spec#\'}"
            spec="${spec%\'}"
            test -n "$spec" || continue
            npm pack "$spec" --registry=https://registry.npmjs.org --ignore-scripts
          done < package-specs.txt
          sha256sum *.tgz | sort > EXACT_LOCKFILE_TARBALLS_SHA256SUMS.txt
          test "$(find . -maxdepth 1 -name '*.tgz' | wc -l)" -ge 600
      - uses: actions/upload-artifact@v4
        with:
          name: r44p36-exact-lockfile-npm-tarballs
          path: r44p36-toolchain
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
