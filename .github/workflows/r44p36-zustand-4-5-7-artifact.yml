name: R44P36 Exact Missing npm Tarballs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r44p36-zustand-4-5-7-artifact.yml'

permissions:
  contents: read

jobs:
  package-missing-tarballs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Pack exact missing tarballs
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.18.0'
          test "$(npm --version)" = '11.16.0'
          mkdir -p r44p36-toolchain
          cd r44p36-toolchain
          packages=(
            'zustand@4.5.7'
            'zod-validation-error@4.0.2'
            'zod@3.25.76'
            'yocto-queue@0.1.0'
            'yargs-parser@18.1.3'
            'yargs@15.4.1'
            'yallist@3.1.1'
            'y18n@4.0.3'
            'ws@8.21.0'
            'wrap-ansi@6.2.0'
            'word-wrap@1.2.5'
            'which-module@2.0.1'
            'which@2.0.2'
            'whatwg-url@5.0.0'
            'webidl-conversions@3.0.1'
            'wagmi@3.7.3'
            'viem@2.54.6'
            'valtio@2.1.7'
            'util-deprecate@1.0.2'
            'use-sync-external-store@1.6.0'
            'use-sidecar@1.1.3'
            'use-intl@4.13.4'
            'use-callback-ref@1.3.3'
            'uri-js@4.4.1'
            'update-browserslist-db@1.2.3'
            'undici-types@7.18.2'
            'uncrypto@0.1.3'
            'uint8arrays@3.1.1'
            'ufo@1.6.4'
            'typescript-eslint@8.65.0'
            'typescript@5.9.3'
            'type-check@0.4.0'
            'tsx@4.22.4'
          )
          for spec in "${packages[@]}"; do
            npm pack "$spec" --registry=https://registry.npmjs.org --ignore-scripts
          done
          sha256sum *.tgz | sort > EXACT_MISSING_TARBALLS_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r44p36-exact-missing-npm-tarballs
          path: r44p36-toolchain
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
