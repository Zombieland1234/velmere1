name: R44P36 Exact Missing npm Tarballs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r44p36-zustand-4-5-7-artifact.yml'

permissions:
  contents: read

jobs:
  package-missing-tarballs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Pack exact missing tarballs
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.18.0'
          test "$(npm --version)" = '11.16.0'
          mkdir -p r44p36-toolchain
          cd r44p36-toolchain
          packages=(
            'zustand@5.0.3' 'zustand@5.0.0' 'zod@3.22.4' 'ws@7.5.13'
            'unstorage@1.17.5' 'undici-types@7.29.0' 'tslib@2.8.1' 'tslib@1.14.1'
            'ts-interface-checker@0.1.13' 'ts-api-utils@2.5.0' 'tr46@0.0.3'
            'to-regex-range@5.0.1' 'tinyglobby@0.2.17' 'three@0.184.0'
            'thread-stream@3.2.0' 'thenify@3.3.1' 'thenify-all@1.6.0'
            'tailwindcss@3.4.19' 'tailwind-merge@2.6.1' 'swr@2.4.1'
            'supports-preserve-symlinks-flag@1.0.0' 'sucrase@3.35.1'
            'styled-jsx@5.1.6' 'stripe@22.2.0' 'strip-ansi@6.0.1'
            'string-width@4.2.3' 'split2@4.2.0' 'source-map-js@1.2.1'
            'sonic-boom@4.2.1' 'slow-redact@0.3.2' 'shebang-regex@3.0.0'
            'shebang-command@2.0.0' 'sharp@0.35.3' 'set-blocking@2.0.0'
            'semver@7.8.5' 'semver@7.7.2' 'semver@6.3.1'
            'scheduler@0.27.0' 'safe-stable-stringify@2.5.0'
            'run-parallel@1.2.0' 'reusify@1.1.0' 'resolve@1.22.12'
            'require-main-filename@2.0.0' 'require-directory@2.1.1'
            'real-require@0.2.0' 'readdirp@5.0.0' 'readdirp@3.6.0'
            'read-cache@1.0.0' 'react@19.2.7' 'react-style-singleton@2.2.3'
            'react-remove-scroll@2.7.2' 'react-remove-scroll-bar@2.3.8'
            'react-dom@19.2.7' 'radix3@1.1.2' 'quick-format-unescaped@4.0.4'
            'queue-microtask@1.2.3' 'qrcode@1.5.3' 'punycode@2.3.1'
            'proxy-from-env@2.1.0' 'proxy-compare@3.0.1' 'process-warning@5.1.0'
            'prelude-ls@1.2.1' 'preact@10.24.2' 'postcss@8.5.19'
            'postcss-value-parser@4.2.0' 'postcss-selector-parser@6.1.2'
            'postcss-nested@6.2.0' 'postcss-load-config@6.0.1'
            'postcss-js@4.1.0' 'postcss-import@15.1.0' 'po-parser@2.1.1'
            'pngjs@5.0.0' 'playwright@1.60.0' 'playwright-core@1.60.0'
            'pirates@4.0.7' 'pino@10.0.0' 'pino-std-serializers@7.1.0'
            'pino-abstract-transport@2.0.0' 'pify@2.3.0' 'picomatch@4.0.5'
            'picocolors@1.1.1' 'path-parse@1.0.7' 'path-key@3.1.1'
            'path-exists@4.0.0' 'p-try@2.2.0' 'p-locate@5.0.0'
          )
          for spec in "${packages[@]}"; do
            npm pack "$spec" --registry=https://registry.npmjs.org --ignore-scripts
          done
          sha256sum *.tgz | sort > EXACT_MISSING_TARBALLS_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r44p36-exact-missing-npm-tarballs
          path: r44p36-toolchain
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
