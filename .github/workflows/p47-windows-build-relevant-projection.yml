name: P47 Native Windows Exact P46 Build-Relevant Projection

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - "scripts/pass47/**"
      - "config/pass47/**"
      - ".github/workflows/p47-windows-build-relevant-projection.yml"

concurrency:
  group: p47-windows-build-relevant-projection-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  native-windows-build-relevant-projection:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout isolated P47 projection branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0 and locate CLI
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Exact Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'Exact npm mismatch' }
          $npmRoot = (npm root --global).Trim()
          $npmCli = Join-Path $npmRoot 'npm/bin/npm-cli.js'
          if (-not (Test-Path -LiteralPath $npmCli -PathType Leaf)) { throw "npm CLI missing: $npmCli" }
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node --version
          npm --version
          python --version

      - name: Download exact retained P42 tracked-source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "31791166532"
          name: p42-branch-source-snapshot
          path: p47-input/p42

      - name: Reconstruct and verify exact P46 build-relevant projection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/pass47/reconstruct-p47-projection.py `
            --manifest config/pass47/P47_BUILD_PROJECTION_MANIFEST.json `
            --base-gzip p47-input/p42/branch-source-tracked.tar.gz `
            --parts-root config/pass47/patch `
            --work-root p47-work `
            --output-root p47-out
          if ($LASTEXITCODE -ne 0) { throw "Projection reconstruction failed: $LASTEXITCODE" }

      - name: Execute native Windows dependency, semantic, lint and dual-build campaign
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.toolchain.outputs.npm_cli }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/pass47/run-p47-product-windows-projection.mjs `
            --source-root p47-work/source `
            --manifest config/pass47/P47_BUILD_PROJECTION_MANIFEST.json `
            --output-dir p47-out
          if ($LASTEXITCODE -ne 0) { throw "Native Windows projection campaign failed: $LASTEXITCODE" }

      - name: Capture workflow boundary receipt
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p47-out | Out-Null
          $boundary = [ordered]@{
            schemaVersion = 'velmere.p47.github-workflow-boundary.v1'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            workflow = '${{ github.workflow }}'
            ref = '${{ github.ref }}'
            sha = '${{ github.sha }}'
            runnerOs = '${{ runner.os }}'
            runnerArch = '${{ runner.arch }}'
            imageOs = $env:ImageOS
            node = (node --version 2>$null)
            npm = (npm --version 2>$null)
            timestampUtc = [DateTime]::UtcNow.ToString('o')
            truthBoundary = 'This workflow may credit only the exact P46 build-relevant projection. It does not prove full 6666-file Windows source closure or any Browser/PDF/customer/value/rights/sale gate.'
          }
          $boundary | ConvertTo-Json -Depth 6 | Set-Content p47-out/P47_GITHUB_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload P47 native Windows evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p47-native-windows-exact-p46-build-relevant-projection
          path: p47-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
