name: P76 Exact Windows Automated Release + PostgreSQL

on:
  push:
    branches:
      - velmere-p76-advanced-release-automation-postgres-20260818
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p76-advanced-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p76-current-product:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout exact P76 control head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Expand pinned P75 parent bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'p75-runtime/bundle.part*' | Sort-Object Name
          if($parts.Count-ne7){throw "P75 bundle part count mismatch: $($parts.Count)"}
          $b64=''; foreach($part in $parts){$b64 += (Get-Content $part.FullName -Raw).Trim()}
          [IO.File]::WriteAllBytes('p75-runtime/p75-ci-bundle.zip',[Convert]::FromBase64String($b64))
          $sha=(Get-FileHash 'p75-runtime/p75-ci-bundle.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha-ne'467026e4c5751d42c6fb06fb4425d640f911a3990fc3f05fd2de99c03e68ffad'){throw "P75 CI bundle SHA mismatch: $sha"}
          Expand-Archive -LiteralPath 'p75-runtime/p75-ci-bundle.zip' -DestinationPath 'p75-runtime' -Force

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        id: npmcli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }
          $npmRoot=(npm root --global).Trim(); $npmCli=(Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Reconstruct P73R7 and replay exact P75 parent
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config core.autocrlf false; git config core.eol lf
          python p73-runtime/reconstruct-p73r7-exact.py --work-root p75-work --out-root p76-out
          if($LASTEXITCODE-ne0){throw 'P73R7 reconstruction failed'}
          python p75-runtime/apply-p75-advanced-automation-runtime.py `
            --source-root p75-work/source `
            --parent-manifest p75-work/P73R7_BUILD_PROJECTION_MANIFEST.json `
            --manifest p75-work/P75_BUILD_PROJECTION_MANIFEST.json `
            --receipt p76-out/P75_PARENT_SOURCE_PATCH.json
          if($LASTEXITCODE-ne0){throw 'P75 parent replay failed'}

      - name: Apply exact P76 source delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -c "from pathlib import Path; parts=sorted(Path('p76-runtime').glob('apply.part*')); data=b''.join(x.read_bytes() for x in parts); Path('p76-runtime/apply-p76-advanced-release-automation.py').write_bytes(data); import hashlib; assert len(parts)==4 and hashlib.sha256(data).hexdigest()=='73d5378a6645b9d82caa43cbf25786435d4f377bbbfe7a63b31f4bbe75e83561'"
          if($LASTEXITCODE-ne0){throw 'P76 patch bundle reconstruction failed'}
          python p76-runtime/apply-p76-advanced-release-automation.py `
            --source-root p75-work/source `
            --parent-manifest p75-work/P75_BUILD_PROJECTION_MANIFEST.json `
            --manifest p75-work/P76_BUILD_PROJECTION_MANIFEST.json `
            --receipt p76-out/P76_SOURCE_PATCH.json
          if($LASTEXITCODE-ne0){throw 'P76 source delta failed'}
          Copy-Item p75-work/P76_BUILD_PROJECTION_MANIFEST.json p76-out/

      - name: P76 static release-authority controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python p76-runtime/test-p76-static.py --source-root p75-work/source --receipt p76-out/P76_STATIC_CONTROL.json
          if($LASTEXITCODE-ne0){throw 'P76 static controls failed'}

      - name: Exact Windows TypeScript ESLint Webpack Turbopack
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.npmcli.outputs.npm_cli }}
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$cmd){ Invoke-Expression $cmd; if($LASTEXITCODE-ne0){throw "failed: $cmd"} }
          Run "python p60-runtime/build-p60-reconciled-runner.py --input p49-build-projection/run-p47-product-windows-projection.mjs --output p75-work/run-p76.mjs --receipt p76-out/RUNNER_P60.json"
          Run "python p66-runtime/patch-p66-reconciled-runner.py --runner p75-work/run-p76.mjs --receipt p76-out/RUNNER_P66.json"
          Run "python p68-runtime/patch-p68-reconciled-runner.py --runner p75-work/run-p76.mjs --receipt p76-out/RUNNER_P68.json"
          Run "python p69-runtime/patch-p69-reconciled-runner.py --runner p75-work/run-p76.mjs --receipt p76-out/RUNNER_P69.json"
          Run "python p69-runtime/patch-p69r2-reconciled-runner.py --runner p75-work/run-p76.mjs --receipt p76-out/RUNNER_P69R2.json"
          Run "python p71-runtime/patch-p71-reconciled-runner.py --runner p75-work/run-p76.mjs --receipt p76-out/RUNNER_P71.json"
          Run "python p71-runtime/patch-p71r1-reconciled-runner.py --runner p75-work/run-p76.mjs --receipt p76-out/RUNNER_P71R1.json"
          Run "python p71-runtime/patch-p71r3-reconciled-runner.py --runner p75-work/run-p76.mjs --receipt p76-out/RUNNER_P71R3.json"
          Run "python p72-runtime/patch-p72-reconciled-runner.py --runner p75-work/run-p76.mjs --receipt p76-out/RUNNER_P72.json"
          Run "python p72-runtime/patch-p72r3-reconciled-runner.py --runner p75-work/run-p76.mjs --receipt p76-out/RUNNER_P72R3.json"
          Run "python p73-runtime/patch-p73r4-reconciled-runner.py --runner p75-work/run-p76.mjs --receipt p76-out/RUNNER_P73R4.json"
          Run "python p73-runtime/patch-p73r7-reconciled-runner.py --runner p75-work/run-p76.mjs --manifest p75-work/P73R7_BUILD_PROJECTION_MANIFEST.json --receipt p76-out/RUNNER_P73R7.json"
          Run "python p75-runtime/patch-p75-reconciled-runner.py --runner p75-work/run-p76.mjs --manifest p75-work/P75_BUILD_PROJECTION_MANIFEST.json --receipt p76-out/RUNNER_P75.json"
          Run "python p76-runtime/patch-p76-reconciled-runner.py --runner p75-work/run-p76.mjs --manifest p75-work/P76_BUILD_PROJECTION_MANIFEST.json --receipt p76-out/RUNNER_P76.json"
          Run "node --check p75-work/run-p76.mjs"
          Run "node p75-work/run-p76.mjs --source-root p75-work/source --manifest p75-work/P76_BUILD_PROJECTION_MANIFEST.json --output-dir p76-out"

      - name: P73 authority regression on P76 bytes
        shell: pwsh
        env:
          P73_RESULT_DIR: ${{ github.workspace }}\p76-out
          P73_SOURCE_ROOT: ${{ github.workspace }}\p75-work\source
          TSX_TSCONFIG_PATH: ${{ github.workspace }}\p75-work\source\tsconfig.json
        run: |
          $ErrorActionPreference='Stop'; Push-Location p75-work/source
          try { node ./node_modules/tsx/dist/cli.mjs ../../p73-runtime/test-p73r7-full-authority.ts | Tee-Object ../..\p76-out\P76_P73_AUTHORITY_REGRESSION.log; if($LASTEXITCODE-ne0){throw 'P73 regression failed'} } finally { Pop-Location }

      - name: P75 Advanced automation regression
        shell: pwsh
        env:
          NODE_ENV: test
          P75_RESULT_DIR: ${{ github.workspace }}\p76-out
          TSX_TSCONFIG_PATH: ${{ github.workspace }}\p75-work\source\tsconfig.json
        run: |
          $ErrorActionPreference='Stop'; Push-Location p75-work/source
          try { node ./node_modules/tsx/dist/cli.mjs ../../p75-runtime/test-p75-advanced-memory.ts | Tee-Object ../..\p76-out\P76_P75_MEMORY_REGRESSION.log; if($LASTEXITCODE-ne0){throw 'P75 memory regression failed'} } finally { Pop-Location }

      - name: P76 automated release runtime
        shell: pwsh
        env:
          NODE_ENV: test
          P76_RESULT_DIR: ${{ github.workspace }}\p76-out
          TSX_TSCONFIG_PATH: ${{ github.workspace }}\p75-work\source\tsconfig.json
        run: |
          $ErrorActionPreference='Stop'; Push-Location p75-work/source
          try { node ./node_modules/tsx/dist/cli.mjs ../../p76-runtime/test-p76-release-envelope.ts | Tee-Object ../..\p76-out\P76_RELEASE_ENVELOPE_RUNTIME.log; if($LASTEXITCODE-ne0){throw 'P76 release runtime failed'} } finally { Pop-Location }

      - name: Capture P76 Windows boundary
        if: always()
        shell: pwsh
        run: |
          $eng='FAIL';$static='FAIL';$release='FAIL';$p75='FAIL';$p73='FAIL';$m=$null
          if(Test-Path 'p76-out/P47_EXACT_WINDOWS_BUILD_RELEVANT_PROJECTION_RECEIPT.json'){$x=Get-Content 'p76-out/P47_EXACT_WINDOWS_BUILD_RELEVANT_PROJECTION_RECEIPT.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$eng='PASS'}}
          if(Test-Path 'p76-out/P76_STATIC_CONTROL.json'){$x=Get-Content 'p76-out/P76_STATIC_CONTROL.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$static='PASS'}}
          if(Test-Path 'p76-out/P76_RELEASE_ENVELOPE_RUNTIME.json'){$x=Get-Content 'p76-out/P76_RELEASE_ENVELOPE_RUNTIME.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$release='PASS'}}
          if(Test-Path 'p76-out/P75_ADVANCED_MEMORY_RUNTIME.json'){$x=Get-Content 'p76-out/P75_ADVANCED_MEMORY_RUNTIME.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$p75='PASS'}}
          if(Test-Path 'p76-out/P73R7_FULL_AUTHORITY_INTEGRATION_TEST.json'){$x=Get-Content 'p76-out/P73R7_FULL_AUTHORITY_INTEGRATION_TEST.json' -Raw|ConvertFrom-Json;if($x.status-eq'PASS'){$p73='PASS'}}
          if(Test-Path 'p75-work/P76_BUILD_PROJECTION_MANIFEST.json'){$m=Get-Content 'p75-work/P76_BUILD_PROJECTION_MANIFEST.json' -Raw|ConvertFrom-Json}
          [ordered]@{schemaVersion='velmere.p76.windows-boundary.v1';runId='${{ github.run_id }}';sha='${{ github.sha }}';projection=if($m){$m.projection}else{$null};engineering=$eng;staticControl=$static;releaseRuntime=$release;p75AutomationRegression=$p75;p73AuthorityRegression=$p73;customerFinal='0/20';auditFinalPdf='0/3';rights='2/203';paidValue='0/10';sale='0/20';live=$false;truthBoundary='P76 Windows credit is limited to automated release-authority correctness on exact current bytes. PostgreSQL durability is proven in a separate job. No customer FINAL/PDF/right/value/sale/LIVE credit.'}|ConvertTo-Json -Depth 10|Set-Content p76-out/P76_WINDOWS_BOUNDARY.json -Encoding utf8

      - name: Upload P76 Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p76-advanced-release-exact-windows
          path: p76-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  p76-postgres-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velmere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d velmere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velmere
    steps:
      - name: Checkout exact P76 control head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Expand and verify exact P75 migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,zipfile
          parts=sorted(Path('p75-runtime').glob('bundle.part*'))
          assert len(parts)==7, len(parts)
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts))
          assert hashlib.sha256(raw).hexdigest()=='467026e4c5751d42c6fb06fb4425d640f911a3990fc3f05fd2de99c03e68ffad'
          Path('p75-runtime/p75-ci-bundle.zip').write_bytes(raw)
          with zipfile.ZipFile('p75-runtime/p75-ci-bundle.zip') as z:z.extractall('p75-runtime')
          mig=Path('p75-runtime/P75_ADVANCED_AUTOMATION_MIGRATION.sql').read_bytes()
          assert hashlib.sha256(mig).hexdigest()=='fa56abf0a1dc4d72794ea916e7569f06fe5b601865fee1cd23198737a1773cc2'
          PY

      - name: Apply bootstrap and exact P75 migration to real PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f p76-runtime/P76_POSTGRES_BOOTSTRAP.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f p75-runtime/P75_ADVANCED_AUTOMATION_MIGRATION.sql

      - name: Execute transaction, retry, idempotence and immutability proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p76-postgres-out
          result="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Aqt -f p76-runtime/P76_POSTGRES_RUNTIME_TEST.sql | tail -n 1)"
          printf '%s\n' "$result" | tee p76-postgres-out/P76_POSTGRES_RUNTIME.json
          python - <<'PY'
          import json
          x=json.load(open('p76-postgres-out/P76_POSTGRES_RUNTIME.json'))
          assert x['status']=='PASS',x
          assert x['reviewState']=='completed',x
          assert x['snapshotCount']==1,x
          assert x['humanReviewRequired'] is False,x
          assert x['historyEvents']==['automation_claimed','review_requeued','automation_claimed','automation_completed'],x
          assert all(q=='advanced_automation' for q in x['queueLanes']),x
          PY

      - name: Capture PostgreSQL truth boundary
        if: always()
        shell: bash
        run: |
          mkdir -p p76-postgres-out
          python - <<'PY'
          import json,os
          p='p76-postgres-out/P76_POSTGRES_RUNTIME.json'; ok=False
          if os.path.exists(p):
            try: ok=json.load(open(p)).get('status')=='PASS'
            except Exception: pass
          json.dump({'schemaVersion':'velmere.p76.postgres-boundary.v1','status':'PASS' if ok else 'FAIL','realPostgreSQLTransactionProof':ok,'liveProductionSupabaseDeployment':False,'customerFinal':'0/20','auditFinalPdf':'0/3','rights':'2/203','paidValue':'0/10','sale':'0/20','live':False,'truthBoundary':'This proves the exact P75 SQL on a real PostgreSQL 16 transaction engine. It does not claim production Supabase deployment or customer/release credit.'},open('p76-postgres-out/P76_POSTGRES_BOUNDARY.json','w'),indent=2)
          PY

      - name: Upload P76 PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p76-postgres-transaction-proof
          path: p76-postgres-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
