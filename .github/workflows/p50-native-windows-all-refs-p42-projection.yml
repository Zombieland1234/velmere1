name: P50 Native Windows All-Refs P42 P46 Projection

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - 'p50-existing-branch/reconstruct-p50-from-all-refs.py'
      - '.github/workflows/p50-native-windows-all-refs-p42-projection.yml'

concurrency:
  group: p50-native-windows-all-refs-p42-projection-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  native-windows-all-refs-p42-projection:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout isolated P47 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every reachable repository ref
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config core.autocrlf false
          git config core.eol lf
          git fetch --force origin "+refs/heads/*:refs/remotes/origin/*" "+refs/pull/*/head:refs/remotes/pull/*/head" "+refs/pull/*/merge:refs/remotes/pull/*/merge"
          if ($LASTEXITCODE -ne 0) { throw "Fetch all refs failed: $LASTEXITCODE" }

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0 and locate CLI
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          $nodeVersion = (node --version).Trim()
          $npmVersion = (npm --version).Trim()
          if ($nodeVersion -ne 'v24.18.0') { throw "Exact Node mismatch: $nodeVersion" }
          if ($npmVersion -ne '11.16.0') { throw "Exact npm mismatch: $npmVersion" }
          $npmRoot = (npm root --global).Trim()
          $npmCli = (Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          if (-not (Test-Path -LiteralPath $npmCli -PathType Leaf)) { throw "npm CLI missing: $npmCli" }
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node --version
          npm --version
          python --version

      - name: Download retained exact P42 tracked-source snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '31791166532'
          name: p42-branch-source-snapshot
          path: p50-seeds/p42

      - name: Extract P42 source seed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p50-seeds/p42-source | Out-Null
          tar -xzf p50-seeds/p42/branch-source-tracked.tar.gz -C p50-seeds/p42-source
          if ($LASTEXITCODE -ne 0) { throw "P42 source extraction failed: $LASTEXITCODE" }

      - name: Materialize byte-exact projection manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "from pathlib import Path; import hashlib; root=Path('p50-existing-branch/manifest-parts'); p3=(root/'part-03.b64').read_bytes()[:9201]+(root/'part-03-suffix-from-9201.b64').read_bytes(); p56=bytearray((root/'part-05-06.b64').read_bytes()); assert len(p56)==20000; p56[17052]=105; chunks=[(root/'part-00.b64').read_bytes(),(root/'part-01-02.b64').read_bytes(),p3,(root/'part-04.b64').read_bytes()[:10000],bytes(p56),(root/'part-07-08.b64').read_bytes(),(root/'part-09.b64').read_bytes()]; data=b''.join(chunks); assert len(data)==99080, len(data); digest=hashlib.sha256(data).hexdigest(); assert digest=='b8a5b2770d17b894b5622c595a364c55fb2b14eb634b85c82a75b0fa1c3f7806', digest; Path('p50-existing-branch/P50_EXISTING_BRANCH_PROJECTION_MANIFEST.tsv.xz.b64').write_bytes(data); print({'byteLength':len(data),'sha256':digest})"
          if ($LASTEXITCODE -ne 0) { throw "Exact manifest materialization failed: $LASTEXITCODE" }

      - name: Reconstruct exact projection from all reachable Git and P42 bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p50-out | Out-Null
          python p50-existing-branch/reconstruct-p50-from-all-refs.py `
            --repo . `
            --seed-root p50-seeds/p42-source `
            --manifest-b64 p50-existing-branch/P50_EXISTING_BRANCH_PROJECTION_MANIFEST.tsv.xz.b64 `
            --meta p50-existing-branch/P50_EXISTING_BRANCH_PROJECTION_META.json `
            --output-root p50-work/source `
            --receipt p50-out/P50_ALL_REFS_P42_PROJECTION_RECONSTRUCTION_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { throw "All-refs P42 projection reconstruction failed: $LASTEXITCODE" }

      - name: Execute dependency SWC semantic lint and dual-build campaign
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.toolchain.outputs.npm_cli }}
        run: |
          $ErrorActionPreference = 'Stop'
          node p50-existing-branch/run-p47-product-windows-projection.mjs `
            --source-root p50-work/source `
            --manifest p50-work/P50_RUNTIME_PROJECTION_MANIFEST.json `
            --output-dir p50-out
          if ($LASTEXITCODE -ne 0) { throw "Native Windows projection campaign failed: $LASTEXITCODE" }

      - name: Capture workflow boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p50-out | Out-Null
          $boundary = [ordered]@{
            schemaVersion = 'velmere.p50.github-all-refs-p42-projection-boundary.v1'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            workflow = '${{ github.workflow }}'
            ref = '${{ github.ref }}'
            sha = '${{ github.sha }}'
            runnerOs = '${{ runner.os }}'
            runnerArch = '${{ runner.arch }}'
            imageOs = $env:ImageOS
            node = (node --version 2>$null)
            npm = (npm --version 2>$null)
            timestampUtc = [DateTime]::UtcNow.ToString('o')
            exactManifestBase64Sha256 = 'b8a5b2770d17b894b5622c595a364c55fb2b14eb634b85c82a75b0fa1c3f7806'
            truthBoundary = 'Credit is limited to the exact 1597-file P46 build-relevant projection. Full P46 source Browser PDF customer outputs rights value and sale remain excluded.'
          }
          $boundary | ConvertTo-Json -Depth 6 | Set-Content p50-out/P50_GITHUB_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload P50 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p50-native-windows-all-refs-p42-p46-projection
          path: p50-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
