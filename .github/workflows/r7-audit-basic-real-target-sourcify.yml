name: R7 Audit Basic Real Target Sourcify Full Match

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-real-target-sourcify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-source-deployment-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify Sourcify v2 exact deployment source and current runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r7/audit-basic
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const address='0xca11bde05977b3631167028862be2a173976ca11';
          const chainId='56';
          const expectedSourceSha='3f05fc95b3bfd3d41e96fa281e00a71302e35b8fff59f81f399a419cdb9f577e';
          const apiUrl=`https://sourcify.dev/server/v2/contract/${chainId}/${address}?fields=all`;
          const sha=(value)=>createHash('sha256').update(value).digest('hex');
          const res=await fetch(apiUrl,{headers:{accept:'application/json','user-agent':'velmere-r7-audit-sourcify-v2'},signal:AbortSignal.timeout(25000)});
          if(!res.ok) throw new Error(`sourcify_v2_contract_missing:${res.status}`);
          const raw=await res.text(); const c=JSON.parse(raw);
          if(c.match!=='exact_match') throw new Error(`sourcify_v2_not_exact_match:${String(c.match)}`);
          if(c.runtimeMatch&&c.runtimeMatch!=='exact_match') throw new Error(`sourcify_v2_runtime_not_exact_match:${String(c.runtimeMatch)}`);
          const rows=Object.entries(c.sources??{}).filter(([p,v])=>/Multicall3\.sol$/i.test(p)&&v&&typeof v==='object'&&typeof v.content==='string');
          if(rows.length!==1) throw new Error(`sourcify_source_denominator:${rows.length}`);
          const [sourcePath,record]=rows[0]; const source=record.content;
          if(!/SPDX-License-Identifier:\s*MIT/.test(source)) throw new Error('sourcify_source_not_mit');
          const deployedSourceSha=sha(Buffer.from(source,'utf8'));
          if(deployedSourceSha!==expectedSourceSha) throw new Error(`deployed_source_sha_unexpected:${deployedSourceSha}`);
          const onchain=String(c.runtimeBytecode?.onchainBytecode??'').toLowerCase();
          if(!/^0x[0-9a-f]{200,}$/.test(onchain)) throw new Error('sourcify_onchain_runtime_missing');
          const rpc=await fetch('https://bsc-dataseed.binance.org/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_getCode',params:[address,'latest']}),signal:AbortSignal.timeout(20000)});
          if(!rpc.ok) throw new Error(`bsc_currentness_rpc_failed:${rpc.status}`);
          const live=String((await rpc.json()).result??'').toLowerCase(); if(live!==onchain) throw new Error('current_bsc_runtime_differs_from_sourcify_onchain');

          const repo='mds1/multicall3'; const gh={accept:'application/vnd.github+json','user-agent':'velmere-r7-audit-sourcify-v2'};
          const metaRes=await fetch(`https://api.github.com/repos/${repo}`,{headers:gh,signal:AbortSignal.timeout(20000)}); if(!metaRes.ok) throw new Error(`upstream_repo_failed:${metaRes.status}`); const meta=await metaRes.json();
          const commitRes=await fetch(`https://api.github.com/repos/${repo}/commits/${meta.default_branch}`,{headers:gh,signal:AbortSignal.timeout(20000)}); if(!commitRes.ok) throw new Error(`upstream_commit_failed:${commitRes.status}`); const commit=await commitRes.json(); const head=String(commit.sha??'').toLowerCase();
          const treeRes=await fetch(`https://api.github.com/repos/${repo}/git/trees/${head}?recursive=1`,{headers:gh,signal:AbortSignal.timeout(20000)}); if(!treeRes.ok) throw new Error(`upstream_tree_failed:${treeRes.status}`); const tree=await treeRes.json();
          const upPath=(tree.tree??[]).find((r)=>r.type==='blob'&&/(^|\/)Multicall3\.sol$/.test(String(r.path??'')))?.path??null;
          let currentHeadSourceSha=null;
          if(upPath){const up=await fetch(`https://raw.githubusercontent.com/${repo}/${head}/${upPath}`,{headers:{'user-agent':'velmere-r7-audit-sourcify-v2'},signal:AbortSignal.timeout(20000)});if(up.ok)currentHeadSourceSha=sha(Buffer.from(await up.text(),'utf8'));}
          const receipt={schemaVersion:'velmere.r7.audit-basic-source-deployment-equivalence.v3',status:'PASS_SOURCIFY_V2_EXACT_DEPLOYMENT_SOURCE',chainId,contractAddress:address,sourcifyApiVersion:'v2',sourcifyApiUrl:apiUrl,sourcifyMatch:c.match,creationMatch:c.creationMatch??null,runtimeMatch:c.runtimeMatch??null,verifiedAt:c.verifiedAt??null,matchId:c.matchId!=null?String(c.matchId):null,apiResponseSha256:sha(Buffer.from(raw,'utf8')),sourcePath,exactDeployedSourceSha256:deployedSourceSha,sourceLicense:'MIT',currentBscRuntimeEqualSourcifyOnchain:true,currentBscRuntimeSha256:sha(Buffer.from(live.slice(2),'hex')),upstreamRepository:repo,currentUpstreamHead:head,currentUpstreamSourcePath:upPath,currentUpstreamSourceSha256:currentHeadSourceSha,currentUpstreamHeadEqualDeployedSource:currentHeadSourceSha===deployedSourceSha,upstreamHeadState:currentHeadSourceSha===deployedSourceSha?'SAME_AS_DEPLOYED_SOURCE':'DIVERGED_FROM_DEPLOYED_SOURCE',deployedSourceAuthority:'SOURCIFY_EXACT_MATCH',derivedFindingsCustomerPublishable:true,paidProviderRequired:false,customerFinalCredit:false,truthBoundary:'Sourcify API v2 exact_match binds the exact MIT source to the verified deployment. Current repository HEAD is tracked separately and may legitimately diverge; it is never substituted for the deployed source.'};
          fs.writeFileSync('artifacts/r7/audit-basic/R7_AUDIT_BASIC_REAL_TARGET_SOURCIFY_FULL_MATCH.json',JSON.stringify(receipt,null,2)+'\n'); console.log(JSON.stringify(receipt,null,2));
          NODE

      - name: Upload source equivalence receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-sourcify-v2-exact-deployment-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/r7/audit-basic/R7_AUDIT_BASIC_REAL_TARGET_SOURCIFY_FULL_MATCH.json
          if-no-files-found: error
          retention-days: 30
