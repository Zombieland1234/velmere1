name: P43 Branch Source Inventory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p43-branch-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout inventory bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Inventory all remote branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p p43-branch-inventory
          python - <<'PY'
          import json, subprocess
          refs = subprocess.check_output(['git','for-each-ref','--format=%(refname:short)','refs/remotes/origin/'], text=True).splitlines()
          rows=[]
          for ref in sorted(r for r in refs if r != 'origin/HEAD'):
              paths=subprocess.check_output(['git','ls-tree','-r','--name-only',ref], text=True).splitlines()
              top={}
              for p in paths:
                  head=p.split('/',1)[0]
                  top[head]=top.get(head,0)+1
              rows.append({'ref':ref,'commit':subprocess.check_output(['git','rev-parse',ref],text=True).strip(),'trackedFiles':len(paths),'hasPackageJson':'package.json' in paths,'hasApp':any(p.startswith('app/') for p in paths),'hasLib':any(p.startswith('lib/') for p in paths),'hasScripts':any(p.startswith('scripts/') for p in paths),'topLevelCounts':dict(sorted(top.items()))})
          rows.sort(key=lambda r:(-r['trackedFiles'],r['ref']))
          out={'schema':'velmere.p43.github-branch-source-inventory.v1','status':'PASS','branchCount':len(rows),'rows':rows}
          open('p43-branch-inventory/P43_GITHUB_BRANCH_SOURCE_INVENTORY.json','w').write(json.dumps(out,indent=2)+'\n')
          for row in rows[:20]: print(row['trackedFiles'],row['ref'],row['commit'])
          PY
          sha256sum p43-branch-inventory/P43_GITHUB_BRANCH_SOURCE_INVENTORY.json > p43-branch-inventory/P43_GITHUB_BRANCH_SOURCE_INVENTORY.sha256

      - name: Upload inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p43-github-branch-source-inventory
          path: p43-branch-inventory
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
