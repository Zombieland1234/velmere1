name: R7 Shield Pro Basic Customer Terminal E2E

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-shield-pro-basic-customer-e2e-v2.yml'
      - 'r7-shield-pro-basic-v2/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r7-shield-pro-basic-v2-customer-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shield-pro-basic-customer-e2e:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout exact Shield Pro Basic controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Execute hosted PL EN DE customer terminal contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-JsonPost([string]$Uri,[hashtable]$Headers,[object]$Body) {
            $Json = $Body | ConvertTo-Json -Depth 50 -Compress
            $Response = Invoke-WebRequest -Uri $Uri -Method Post -Headers $Headers -ContentType 'application/json' -Body $Json -SkipHttpErrorCheck -TimeoutSec 30
            $Parsed = $null
            try { $Parsed = $Response.Content | ConvertFrom-Json -Depth 100 } catch { }
            return [pscustomobject]@{ Status=[int]$Response.StatusCode; Body=$Parsed; Raw=[string]$Response.Content }
          }
          function Assert([bool]$Condition,[string]$Message) { if (-not $Condition) { throw $Message } }
          # canonical customer contract unchanged; this comment only retriggers the guarded run on current HEAD
          if (-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN) { throw 'shield_pro_basic_oidc_environment_missing' }
          $Separator = if ($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')) { '&' } else { '?' }
          $TokenResponse = Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL+$Separator+'audience='+[Uri]::EscapeDataString('velmere-r7-shield-pro-basic-v2-e2e')) -Headers @{ Authorization='Bearer '+$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN } -Method Get -TimeoutSec 20
          $Oidc = [string]$TokenResponse.value
          Assert ([bool]$Oidc) 'shield_pro_basic_oidc_token_missing'
          Write-Host "::add-mask::$Oidc"
          $HelperUrl = 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-shield-pro-basic-v2-e2e-oidc'
          $BridgeUrl = 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-shield-pro-basic-v2-public-bridge'
          $CapabilityResponse = Invoke-JsonPost $HelperUrl @{ Authorization='Bearer '+$Oidc; Accept='application/json' } @{ action='capability' }
          Assert ($CapabilityResponse.Status -eq 200 -and $CapabilityResponse.Body.ok -eq $true) ('shield_pro_basic_capability_failed:'+($CapabilityResponse.Raw.Substring(0,[Math]::Min(400,$CapabilityResponse.Raw.Length))))
          $Capability = [string]$CapabilityResponse.Body.shieldProBasicServerCapability
          Assert ($Capability.Length -ge 48 -and $Capability.Length -le 256) 'shield_pro_basic_capability_contract_invalid'
          Write-Host "::add-mask::$Capability"
          $Headers = @{ 'x-velmere-shield-pro-basic-v2-server-capability'=$Capability; Accept='application/json' }
          $ExpectedTitles = @{ pl='Shield Pro Basic — terminal triage'; en='Shield Pro Basic — triage terminal'; de='Shield Pro Basic — Triage-Terminal' }
          $RequiredEventDigests = @('sha256:fd4a3a3b66f5a030e951cc0c592a847197260418282b3f71b4fdacdc9b8aa861','sha256:0aa92b05d736f5a3691be2420b77a0da7ff800d27707cb6f976d4626deb4f65e')
          $Locales = [ordered]@{}
          foreach ($Locale in @('pl','en','de')) {
            $Result = Invoke-JsonPost $BridgeUrl $Headers @{ schemaVersion='velmere.r7.shield-pro-basic-terminal-request.v2'; assetId='multicall3-bsc'; locale=$Locale }
            Assert ($Result.Status -eq 200 -and $Result.Body.ok -eq $true) "shield_pro_basic_${Locale}_status_$($Result.Status)"
            Assert ($Result.Body.schemaVersion -eq 'velmere.r7.shield-pro-basic-customer-terminal.v2') "shield_pro_basic_${Locale}_schema_invalid"
            Assert ($Result.Body.productSlug -eq 'shield-pro-basic' -and [int]$Result.Body.productOrdinal -eq 10) "shield_pro_basic_${Locale}_identity_invalid"
            Assert ($Result.Body.tier -eq 'basic' -and $Result.Body.freeBasic -eq $true -and $Result.Body.paidValueCredit -eq $false) "shield_pro_basic_${Locale}_free_basic_invalid"
            Assert ($Result.Body.productContract -eq 'BOUNDED_SINGLE_TARGET_FREE_DEFENSIVE_TRIAGE_TERMINAL') "shield_pro_basic_${Locale}_contract_invalid"
            Assert ($Result.Body.title -eq $ExpectedTitles[$Locale]) "shield_pro_basic_${Locale}_title_invalid"
            Assert ($Result.Body.asset.assetId -eq 'multicall3-bsc') "shield_pro_basic_${Locale}_asset_invalid"
            Assert ($Result.Body.asset.canonicalAssetId -eq 'eip155:56:0xca11bde05977b3631167028862be2a173976ca11') "shield_pro_basic_${Locale}_canonical_invalid"
            Assert (@($Result.Body.cards).Count -eq 8) "shield_pro_basic_${Locale}_cards_invalid"
            Assert (@($Result.Body.operatorTable).Count -eq 2) "shield_pro_basic_${Locale}_table_invalid"
            Assert (@($Result.Body.actionQueue).Count -eq 4) "shield_pro_basic_${Locale}_queue_invalid"
            Assert (@($Result.Body.cards | Where-Object { $_.id -eq 'posture' }).Count -eq 1) "shield_pro_basic_${Locale}_posture_card_missing"
            Assert (@($Result.Body.cards | Where-Object { $_.id -eq 'provenance' }).Count -eq 1) "shield_pro_basic_${Locale}_provenance_card_missing"
            Assert ([int]$Result.Body.structuredPayload.historyCount -eq 2 -and [int]$Result.Body.structuredPayload.comparabilitySegments -eq 2) "shield_pro_basic_${Locale}_history_contract_invalid"
            $ActualEventDigests = @($Result.Body.structuredPayload.requiredEventDigests)
            Assert ($ActualEventDigests.Count -eq 2) "shield_pro_basic_${Locale}_event_denominator_invalid"
            foreach ($Digest in $RequiredEventDigests) { Assert ($ActualEventDigests -contains $Digest) "shield_pro_basic_${Locale}_event_digest_missing" }
            Assert ($Result.Body.rights.sourceClass -eq 'VELMERE_GENERATED_PUBLIC_EVIDENCE_FROM_DIRECT_CHAIN_BOUND_SOURCE') "shield_pro_basic_${Locale}_rights_source_invalid"
            Assert ([int]$Result.Body.rights.providerNetworkCalls -eq 0) "shield_pro_basic_${Locale}_provider_call_invalid"
            Assert ($Result.Body.rights.rawProviderPayloadReturned -eq $false -and $Result.Body.rights.externalProviderRedistributionClaimed -eq $false) "shield_pro_basic_${Locale}_rights_boundary_invalid"
            Assert ($Result.Body.serviceRoleReturned -eq $false -and $Result.Body.rawCapabilityReturned -eq $false) "shield_pro_basic_${Locale}_secret_boundary_invalid"
            Assert (([string]$Result.Body.uncertaintyDisclosure).Length -ge 40) "shield_pro_basic_${Locale}_uncertainty_missing"
            try { $ObservedAt=[DateTimeOffset]$Result.Body.currentness.observedAt; $SourceAsOf=[DateTimeOffset]$Result.Body.currentness.sourceAsOf } catch { throw "shield_pro_basic_${Locale}_timestamp_parse_invalid" }
            $Now=[DateTimeOffset]::UtcNow
            Assert ($ObservedAt -le $Now.AddMinutes(5) -and $SourceAsOf -le $Now.AddMinutes(5)) "shield_pro_basic_${Locale}_future_timestamp_invalid"
            Assert ($ObservedAt -ge $Now.AddDays(-7) -and $SourceAsOf -ge $Now.AddDays(-7)) "shield_pro_basic_${Locale}_stale_invalid"
            $Serialized = $Result.Body | ConvertTo-Json -Depth 100 -Compress
            foreach ($Forbidden in @('SUPABASE_SERVICE_ROLE_KEY','x-velmere-shield-pro-basic-v2-server-capability',$Capability)) { Assert (-not $Serialized.Contains($Forbidden)) "shield_pro_basic_${Locale}_private_value_leak" }
            $Locales[$Locale] = [ordered]@{ title=[string]$Result.Body.title; cards=@($Result.Body.cards).Count; tableRows=@($Result.Body.operatorTable).Count; queueActions=@($Result.Body.actionQueue).Count; currentEventDigest=[string]$Result.Body.structuredPayload.currentEvent.eventDigest; sourceAsOf=$SourceAsOf.ToUniversalTime().ToString('o',[Globalization.CultureInfo]::InvariantCulture) }
          }
          $Invalid = Invoke-JsonPost $BridgeUrl @{ 'x-velmere-shield-pro-basic-v2-server-capability'=('x'*64); Accept='application/json' } @{ schemaVersion='velmere.r7.shield-pro-basic-terminal-request.v2'; assetId='multicall3-bsc'; locale='en' }; Assert ($Invalid.Status -eq 403) "shield_pro_basic_invalid_capability_not_denied_$($Invalid.Status)"
          $Missing = Invoke-JsonPost $BridgeUrl $Headers @{ schemaVersion='velmere.r7.shield-pro-basic-terminal-request.v2'; assetId='unknown-terminal-asset'; locale='en' }; Assert ($Missing.Status -eq 404) "shield_pro_basic_missing_asset_not_closed_$($Missing.Status)"
          $BadLocale = Invoke-JsonPost $BridgeUrl $Headers @{ schemaVersion='velmere.r7.shield-pro-basic-terminal-request.v2'; assetId='multicall3-bsc'; locale='fr' }; Assert ($BadLocale.Status -eq 400) "shield_pro_basic_bad_locale_not_rejected_$($BadLocale.Status)"
          $UnknownField = Invoke-JsonPost $BridgeUrl $Headers @{ schemaVersion='velmere.r7.shield-pro-basic-terminal-request.v2'; assetId='multicall3-bsc'; locale='en'; admin=$true }; Assert ($UnknownField.Status -eq 400) "shield_pro_basic_unknown_field_not_rejected_$($UnknownField.Status)"
          $WrongMethod = Invoke-WebRequest -Uri $BridgeUrl -Method Get -SkipHttpErrorCheck -TimeoutSec 30; Assert ([int]$WrongMethod.StatusCode -eq 405) "shield_pro_basic_wrong_method_not_rejected_$([int]$WrongMethod.StatusCode)"
          $LargeBody = '{"schemaVersion":"velmere.r7.shield-pro-basic-terminal-request.v2","assetId":"multicall3-bsc","locale":"en","padding":"' + ('a'*5000) + '"}'; $Oversized = Invoke-WebRequest -Uri $BridgeUrl -Method Post -Headers $Headers -ContentType 'application/json' -Body $LargeBody -SkipHttpErrorCheck -TimeoutSec 30; Assert ([int]$Oversized.StatusCode -eq 413) "shield_pro_basic_oversized_not_rejected_$([int]$Oversized.StatusCode)"
          New-Item -ItemType Directory -Force -Path 'artifacts/r7/shield-pro-basic-v2' | Out-Null
          $Receipt = [ordered]@{ schemaVersion='velmere.r7.shield-pro-basic-v2-customer-terminal-e2e.v1'; status='PASS_SHIELD_PRO_BASIC_V2_CUSTOMER_TERMINAL_E2E'; github=@{ runId=$env:GITHUB_RUN_ID; runAttempt=[int]$env:GITHUB_RUN_ATTEMPT; headSha=$env:GITHUB_SHA }; product=@{ productOrdinal=10; productSlug='shield-pro-basic'; tier='basic'; freeBasic=$true; paidValueCredit=$false; contract='BOUNDED_SINGLE_TARGET_FREE_DEFENSIVE_TRIAGE_TERMINAL'; locales=$Locales; cardCount=8; operatorTableRows=2; actionQueueItems=4; structuredPayload=$true; canonicalAssetId='eip155:56:0xca11bde05977b3631167028862be2a173976ca11' }; evidence=@{ requiredEventDigests=$RequiredEventDigests; historyEvents=2; comparabilitySegments=2; providerNetworkCalls=0; sourceClass='VELMERE_GENERATED_PUBLIC_EVIDENCE_FROM_DIRECT_CHAIN_BOUND_SOURCE' }; negatives=@{ invalidCapabilityDenied=$true; missingAssetFailClosed=$true; unsupportedLocaleRejected=$true; unknownFieldRejected=$true; wrongMethodRejected=$true; oversizedBodyRejected=$true }; privacy=@{ serviceRoleInApplication=$false; rawCapabilityReturned=$false; rawProviderPayloadReturned=$false }; customerFinalCredit=$false; truthBoundary='Hosted PL/EN/DE customer terminal evidence passed. Only the guarded finalizer may append Shield Pro Basic FINAL after exact GitHub run, artifact, component, source-authority, database-definition, event, rights, and freshness binding.' }
          $Receipt | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath 'artifacts/r7/shield-pro-basic-v2/R7_SHIELD_PRO_BASIC_V2_CUSTOMER_TERMINAL_E2E.json' -Encoding utf8
          Write-Host ($Receipt | ConvertTo-Json -Depth 100)

      - name: Upload Shield Pro Basic customer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-shield-pro-basic-v2-customer-e2e-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/r7/shield-pro-basic-v2/R7_SHIELD_PRO_BASIC_V2_CUSTOMER_TERMINAL_E2E.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  finalize-shield-pro-basic:
    needs: shield-pro-basic-customer-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guarded append-only Shield Pro Basic finalization and re-read
        shell: bash
        run: |
          set -euo pipefail
          separator='?'; case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) separator='&';; esac
          oidc="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=velmere-r7-shield-pro-basic-v2-finalizer" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$oidc"
          response=''
          for attempt in $(seq 1 15); do
            response="$(curl --silent --show-error -X POST -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' -d '{"action":"finalize"}' 'https://yljjyowcvjgjcamffnvd.supabase.co/functions/v1/r7-shield-pro-basic-v2-finalizer-oidc')"
            if python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") is True else 1)' <<<"$response"; then break; fi
            sleep 2
          done
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["RESPONSE"])
          if data.get("ok") is not True:
              raise SystemExit(f"Shield Pro Basic finalization failed: {data}")
          result = data.get("result") or {}
          reread = data.get("ledgerReRead") or {}
          if result.get("productSlug") != "shield-pro-basic" or result.get("finalStatus") != "FINAL":
              raise SystemExit(f"Shield Pro Basic finalization contract invalid: {data}")
          if reread.get("product_slug") != "shield-pro-basic" or reread.get("final_status") != "FINAL" or int(reread.get("product_ordinal", 0)) != 10:
              raise SystemExit(f"Shield Pro Basic ledger reread invalid: {data}")
          print(json.dumps({"schemaVersion":"velmere.r7.shield-pro-basic-v2-finalization-receipt.v1","status":"FINAL","result":result,"ledgerReRead":reread,"serviceRoleReturned":False}, indent=2))
          PY
