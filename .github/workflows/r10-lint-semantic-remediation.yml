name: R10 Semantic Lint Remediation

on:
  push:
    branches:
      - r10-lint-remediation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r10-lint-semantic-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  VELMERE_OFFLINE_TS_FORCE_BUILTIN: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout lint branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install lockfile
        run: npm ci --ignore-scripts
      - name: Apply guarded semantic lint patch
        run: node scripts/r10/patch-release-lint-semantic.mjs
      - name: Targeted lint on semantic patch files
        run: |
          npx eslint \
            app/api/market-integrity/export/route.ts \
            components/market-integrity/AssetAreaChart.tsx \
            components/market-integrity/ShieldMapCommandClient.tsx \
            components/market-integrity/ShieldRealMarketsParityClient.tsx \
            lib/commerce/vlm-paid-access-client.ts \
            lib/market-integrity/coingecko.ts \
            lib/market-integrity/risk-ledger.ts \
            lib/security/audit-canonical-report.ts \
            lib/security/formal/formal-engine.ts \
            lib/security/freshness/data-freshness-engine.ts \
            lib/security/input-sanitizer.ts \
            lib/security/institutional-pipeline-gate.ts \
            lib/security/market-evidence/market-provenance-engine.ts \
            lib/security/transient-storage-verifier.ts \
            lib/security/unified-audit-pipeline.ts \
            lib/server/search-route-modules/lens-report.ts
      - name: Direct TypeScript
        run: npm run typecheck:direct
      - name: Security regression
        run: npm run security:regression
      - name: Input sanitizer focused regression
        run: |
          node --import ./scripts/pass11/register-offline-ts-loader.mjs - <<'NODE'
          const { sanitizeContractInput } = await import('./lib/security/input-sanitizer.ts');
          const got = sanitizeContractInput(' A\u0000B\u001fC\u007f<script>x</script> ');
          if (got !== 'ABCx') throw new Error(`sanitizer_regression:${JSON.stringify(got)}`);
          console.log(got);
          NODE
      - name: Production build
        run: npm run build
      - name: Validate write scope and commit verified source changes
        run: |
          git diff --name-only > /tmp/changed.txt
          allowed='^(app/api/market-integrity/export/route\.ts|components/market-integrity/AssetAreaChart\.tsx|components/market-integrity/ShieldMapCommandClient\.tsx|components/market-integrity/ShieldRealMarketsParityClient\.tsx|lib/commerce/vlm-paid-access-client\.ts|lib/market-integrity/coingecko\.ts|lib/market-integrity/risk-ledger\.ts|lib/security/audit-canonical-report\.ts|lib/security/formal/formal-engine\.ts|lib/security/freshness/data-freshness-engine\.ts|lib/security/input-sanitizer\.ts|lib/security/institutional-pipeline-gate\.ts|lib/security/market-evidence/market-provenance-engine\.ts|lib/security/transient-storage-verifier\.ts|lib/security/unified-audit-pipeline\.ts|lib/server/search-route-modules/lens-report\.ts)$'
          bad="$(grep -Ev "$allowed" /tmp/changed.txt || true)"
          if [ -n "$bad" ]; then echo "Unexpected write scope:"; echo "$bad"; exit 1; fi
          git config user.name "velmere-r10-lint-semantic"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -d '\n' git add -- < /tmp/changed.txt
          git commit -m "fix(r10): close semantic release-source lint errors [lint]"
          git push origin HEAD:r10-lint-remediation
      - name: Upload semantic lint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r10-lint-semantic-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/r10/**
