name: R44P14 Weak Category Recall and Control Suppression

on:
  pull_request:
    branches: [main]
    paths:
      - 'r44p14-evidence/**'
      - '.github/workflows/r44p14-weak-category-recall-control-suppression.yml'

permissions:
  contents: read

jobs:
  external-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATASET_COMMIT: 230e649123477eff332742a59a1c7cc6dc286cab
      EXPECTED_ANALYZER_SHA256: 50274debd62ba328e864eb781bdc696f8ecce56cb8343180db00c4b7d56964dc
      EXPECTED_BASELINE_SHA256: 2ebd7ab0b5783adc0a025b0f54851a87f4b1b9dd8b6d1d50cb6924ec0b242bc9
      EXPECTED_RUNNER_SHA256: 53b9b9c5700c0d12897f449b60fc20d0426f495c6537b443f2d88278a707d96f
      EXPECTED_HELPER_SHA256: 0917061c9f149e61dcf943baf120a74e92a0367b9874fee91f950a03910146d6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned SmartBugs corpus
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/smartbugs/smartbugs-curated.git r44p14-evidence/smartbugs-curated
          git -C r44p14-evidence/smartbugs-curated fetch --depth 1 origin "$DATASET_COMMIT"
          git -C r44p14-evidence/smartbugs-curated checkout --detach "$DATASET_COMMIT"
          test "$(git -C r44p14-evidence/smartbugs-curated rev-parse HEAD)" = "$DATASET_COMMIT"

      - name: Reconstruct hash-bound analyzer and baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,pathlib
          root=pathlib.Path('r44p14-evidence')
          root.joinpath('analyzer.mjs').write_bytes(gzip.decompress(base64.b64decode(root.joinpath('analyzer.mjs.gz.b64').read_text().strip())))
          root.joinpath('R44P14_R44P13_BASELINE_SNAPSHOT.json').write_bytes(gzip.decompress(base64.b64decode(root.joinpath('r44p13-baseline.json.gz.b64').read_text().strip())))
          PY
          test "$(sha256sum r44p14-evidence/analyzer.mjs | awk '{print $1}')" = "$EXPECTED_ANALYZER_SHA256"
          test "$(sha256sum r44p14-evidence/R44P14_R44P13_BASELINE_SNAPSHOT.json | awk '{print $1}')" = "$EXPECTED_BASELINE_SHA256"
          test "$(sha256sum r44p14-evidence/run_external_remediation.py | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA256"
          test "$(sha256sum r44p14-evidence/analyze_file.mjs | awk '{print $1}')" = "$EXPECTED_HELPER_SHA256"
          python -m py_compile r44p14-evidence/run_external_remediation.py
          node --check r44p14-evidence/analyzer.mjs
          node --check r44p14-evidence/analyze_file.mjs
          node --version | grep -F 'v24.18.0'

      - name: Execute external recall and false-alert remediation
        working-directory: r44p14-evidence
        shell: bash
        run: |
          set -euo pipefail
          python run_external_remediation.py | tee execution-summary.log

      - name: Independently verify denominator, improvement and truth boundary
        working-directory: r44p14-evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          evidence=root/'evidence'
          ledger_path=evidence/'R44P14_EXTERNAL_ACCURACY_REMEDIATION_LEDGER.json'
          summary_path=evidence/'R44P14_EXTERNAL_ACCURACY_REMEDIATION_SUMMARY.json'
          ledger=json.loads(ledger_path.read_text())
          summary=json.loads(summary_path.read_text())
          assert summary['status']=='PASS_EXTERNAL_REMEDIATION_EXECUTED'
          assert ledger['dataset']['commit']=='230e649123477eff332742a59a1c7cc6dc286cab'
          assert ledger['denominators']['cases']==69
          assert ledger['denominators']['controls']==12
          assert len(ledger['cases'])==69 and len({x['caseId'] for x in ledger['cases']})==69
          assert len(ledger['controls'])==12 and len({x['controlId'] for x in ledger['controls']})==12
          assert ledger['analyzer']['class']=='STRUCTURED_TOKEN_CONTROL_FLOW_V2_NOT_COMPILER_AST'
          assert ledger['analyzer']['compilerAstCredit'] is False
          assert ledger['analyzer']['failures']==0
          assert summary['currentRecall'] >= summary['baselineRecall']
          assert summary['currentControlFlagRate'] <= summary['baselineControlFlagRate']
          for category in ('access_control','denial_of_service','front_running','short_addresses'):
              delta=ledger['categoryDelta'][category]
              assert delta['currentRecall'] >= delta['baselineRecall'], (category,delta)
          assert ledger['categoryDelta']['short_addresses']['currentRecall'] > 0
          assert ledger['categoryDelta']['access_control']['currentRecall'] > ledger['categoryDelta']['access_control']['baselineRecall']
          assert ledger['categoryDelta']['denial_of_service']['currentRecall'] > ledger['categoryDelta']['denial_of_service']['baselineRecall']
          assert ledger['categoryDelta']['front_running']['currentRecall'] > ledger['categoryDelta']['front_running']['baselineRecall']
          receipts=list((evidence/'receipts').glob('*.json'))
          assert len(receipts)==69
          for row in ledger['cases']:
              receipt=evidence/'receipts'/f"{row['caseId']}.json"
              assert receipt.is_file()
              assert hashlib.sha256(receipt.read_bytes()).hexdigest()==row['receiptSha256']
              parsed=json.loads(receipt.read_text())
              assert parsed['sourceSha256']==row['sourceSha256']
              assert parsed['datasetCommit']==ledger['dataset']['commit']
              assert parsed['truthBoundary']['formalPrecision'] is False
              assert parsed['truthBoundary']['saleCredit'] is False
              assert parsed['truthBoundary']['liveCredit'] is False
          tb=ledger['truthBoundary']
          assert tb['externalLabeledRecallBaseline'] is True
          assert tb['formalPrecision'] is False
          assert tb['severityCalibration'] is False
          assert tb['modernProtocolRepresentativeness'] is False
          assert tb['businessLogicCoverage'] is False
          assert tb['commercialRightsApproved'] is False
          assert tb['customerCredit'] is False
          assert tb['paidTierCredit'] is False
          assert tb['liveCredit'] is False
          assert tb['worldClassProven'] is False
          result={
            'schemaVersion':'velmere.pass36.a102r44p14.external-evidence-verification.v1',
            'status':'PASS',
            'checks':31,
            'passed':31,
            'failed':0,
            'cases':69,
            'controls':12,
            'baselineRecall':summary['baselineRecall'],
            'currentRecall':summary['currentRecall'],
            'baselineControlFlagRate':summary['baselineControlFlagRate'],
            'currentControlFlagRate':summary['currentControlFlagRate'],
            'ledgerSha256':hashlib.sha256(ledger_path.read_bytes()).hexdigest(),
          }
          (root/'R44P14_INDEPENDENT_EVIDENCE_VERIFICATION.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Build redacted deterministic evidence archive
        if: always()
        working-directory: r44p14-evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > GITHUB_CHECKOUT_SHA.txt
          mkdir -p packaged-evidence
          cp -f evidence/R44P14_EXTERNAL_ACCURACY_REMEDIATION_LEDGER.json packaged-evidence/ 2>/dev/null || true
          cp -f evidence/R44P14_EXTERNAL_ACCURACY_REMEDIATION_SUMMARY.json packaged-evidence/ 2>/dev/null || true
          cp -R evidence/receipts packaged-evidence/ 2>/dev/null || true
          cp -f execution-summary.log GITHUB_CHECKOUT_SHA.txt R44P14_INDEPENDENT_EVIDENCE_VERIFICATION.json packaged-evidence/ 2>/dev/null || true
          sha256sum analyzer.mjs R44P14_R44P13_BASELINE_SNAPSHOT.json run_external_remediation.py analyze_file.mjs > packaged-evidence/RUNNER_INPUT_SHA256.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('packaged-evidence'); rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes(); rows.append({'path':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          Path('R44P14_EVIDENCE_FILE_MANIFEST.json').write_text(json.dumps({'fileCount':len(rows),'files':rows},indent=2,sort_keys=True)+'\n')
          PY
          cp R44P14_EVIDENCE_FILE_MANIFEST.json packaged-evidence/
          tar --sort=name --mtime='UTC 2026-08-04' --owner=0 --group=0 --numeric-owner -czf r44p14-external-remediation-evidence.tar.gz packaged-evidence
          sha256sum r44p14-external-remediation-evidence.tar.gz > r44p14-external-remediation-evidence.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44p14-external-remediation-evidence
          path: |
            r44p14-evidence/packaged-evidence
            r44p14-evidence/R44P14_EVIDENCE_FILE_MANIFEST.json
            r44p14-evidence/r44p14-external-remediation-evidence.tar.gz
            r44p14-evidence/r44p14-external-remediation-evidence.sha256
          if-no-files-found: warn
          retention-days: 14
