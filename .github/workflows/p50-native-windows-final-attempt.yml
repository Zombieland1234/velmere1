name: P50 Native Windows Final Attempt With Encoded Result

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - '.github/workflows/p50-native-windows-final-attempt.yml'

concurrency:
  group: p50-native-windows-final-attempt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  execute:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Exact npm toolchain
        id: toolchain
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p50-final-out | Out-Null
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          $nodeVersion = (node --version).Trim()
          $npmVersion = (npm --version).Trim()
          if ($nodeVersion -ne 'v24.18.0') { throw "Exact Node mismatch: $nodeVersion" }
          if ($npmVersion -ne '11.16.0') { throw "Exact npm mismatch: $npmVersion" }
          $npmRoot = (npm root --global).Trim()
          $npmCli = (Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          if (-not (Test-Path -LiteralPath $npmCli -PathType Leaf)) { throw "npm CLI missing: $npmCli" }
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          [ordered]@{schemaVersion='velmere.p50.toolchain.v1';status='PASS';node=$nodeVersion;npm=$npmVersion;npmCli=$npmCli;imageOs=$env:ImageOS} | ConvertTo-Json -Depth 4 | Set-Content p50-final-out/P50_TOOLCHAIN_RECEIPT.json -Encoding utf8

      - name: Materialize exact P46 projection candidate
        id: materialize
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force p50-final-out | Out-Null
          New-Item -ItemType Directory -Force p50-final-work | Out-Null
          $commit = '2d37f3c711aaf63b7f263971fccc93c5748f654e'
          $direct = $false
          $mode = 'UNSET'
          git fetch --no-tags --depth=1 origin $commit 2>&1 | Tee-Object -FilePath p50-final-out/01-direct-fetch.log
          if ($LASTEXITCODE -eq 0) {
            git cat-file -e "$commit^{commit}"
            if ($LASTEXITCODE -eq 0) {
              git worktree add --detach p50-final-work/full $commit 2>&1 | Tee-Object -FilePath p50-final-out/02-direct-worktree.log
              if ($LASTEXITCODE -eq 0) {
                $observed = (git -C p50-final-work/full rev-parse HEAD).Trim()
                if ($observed -eq $commit) { $direct = $true; $mode = 'EXACT_P46_COMMIT_WORKTREE' }
              }
            }
          }
          if (-not $direct) {
            if (Test-Path p50-final-work/full) { Remove-Item -Recurse -Force p50-final-work/full }
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' 2>&1 | Tee-Object -FilePath p50-final-out/03-all-ref-fetch.log
            if ($LASTEXITCODE -ne 0) { throw "All-ref fallback fetch failed: $LASTEXITCODE" }
            git worktree add --detach p50-final-work/full HEAD 2>&1 | Tee-Object -FilePath p50-final-out/04-fallback-worktree.log
            if ($LASTEXITCODE -ne 0) { throw "Fallback worktree failed: $LASTEXITCODE" }
            python -c "from pathlib import Path; import subprocess; rows=[('4d2c2d51a2ab2cde2d293195960fded6462456e8','config/pass36/a59-build-graph-route-css-budget-recovery.json'),('3f15e90c86c315b0b934bd741be260d2c7eab797','scripts/a60-exact-final-byte-build-browser-acceptance.mjs'),('83025b8122ae726e1f23ad6ea62dab1f71ca3fb8','scripts/pass36/a79-exact-build-browser-lib.mjs')]; root=Path('p50-final-work/full'); [(root/p).parent.mkdir(parents=True,exist_ok=True) or (root/p).write_bytes(subprocess.check_output(['git','cat-file','blob',s])) for s,p in rows]"
            if ($LASTEXITCODE -ne 0) { throw "Three-blob overlay failed: $LASTEXITCODE" }
            $mode = 'HASH_VERIFIED_THREE_BLOB_OVERLAY_ON_BRANCH'
          }
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          [ordered]@{schemaVersion='velmere.p50.materialization.v2';status='PASS_CANDIDATE';mode=$mode;exactP46Commit=$commit;directExactCommit=$direct;branchSha='${{ github.sha }}';truthBoundary='No credit until exact 1597-file identity and engineering gates pass.'} | ConvertTo-Json -Depth 5 | Set-Content p50-final-out/P50_MATERIALIZATION_RECEIPT.json -Encoding utf8

      - name: Exact 1597-file projection reconstruction
        id: reconstruct
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python p50-existing-branch/reconstruct-p50-by-selection.py `
            --checkout-root p50-final-work/full `
            --meta p50-existing-branch/P50_EXISTING_BRANCH_PROJECTION_META.json `
            --output-root p50-final-work/source `
            --receipt p50-final-out/P50_RECONSTRUCTION_RECEIPT.json `
            --rows-output p50-final-out/P50_OBSERVED_ROWS.json
          if ($LASTEXITCODE -ne 0) { throw "Exact projection reconstruction failed: $LASTEXITCODE" }

      - name: Native Windows dependency semantic lint dual-build campaign
        id: campaign
        continue-on-error: true
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.toolchain.outputs.npm_cli }}
        run: |
          $ErrorActionPreference = 'Stop'
          node p50-existing-branch/run-p47-product-windows-projection.mjs `
            --source-root p50-final-work/source `
            --manifest p50-final-work/P50_RUNTIME_PROJECTION_MANIFEST.json `
            --output-dir p50-final-out
          if ($LASTEXITCODE -ne 0) { throw "Native Windows projection campaign failed: $LASTEXITCODE" }

      - name: Write final workflow boundary
        id: boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force p50-final-out | Out-Null
          $pass = ('${{ steps.toolchain.outcome }}' -eq 'success' -and '${{ steps.materialize.outcome }}' -eq 'success' -and '${{ steps.reconstruct.outcome }}' -eq 'success' -and '${{ steps.campaign.outcome }}' -eq 'success')
          $boundary = [ordered]@{
            schemaVersion = 'velmere.p50.native-windows-final-attempt-boundary.v1'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            branchSha = '${{ github.sha }}'
            exactP46Commit = '2d37f3c711aaf63b7f263971fccc93c5748f654e'
            runnerOs = '${{ runner.os }}'
            runnerArch = '${{ runner.arch }}'
            imageOs = $env:ImageOS
            node = (node --version 2>$null)
            npm = (npm --version 2>$null)
            materializationMode = '${{ steps.materialize.outputs.mode }}'
            outcomes = [ordered]@{
              checkout='${{ steps.checkout.outcome }}'
              setupNode='${{ steps.setup_node.outcome }}'
              toolchain='${{ steps.toolchain.outcome }}'
              materialize='${{ steps.materialize.outcome }}'
              reconstruct='${{ steps.reconstruct.outcome }}'
              campaign='${{ steps.campaign.outcome }}'
            }
            exactProjectionEngineeringPass = $pass
            globalStatus = 'NO_GO'
            browserDistinctSkus = '0/3'
            pdfIndependentReplay = '0/1'
            saleEligible = '0/17'
            truthBoundary = 'PASS is limited to the exact 1597-file P46 build-relevant projection. Full source, Browser, PDF, customer outputs, rights and paid value are excluded.'
            timestampUtc = [DateTime]::UtcNow.ToString('o')
          }
          $boundary | ConvertTo-Json -Depth 8 | Set-Content p50-final-out/P50_FINAL_WORKFLOW_BOUNDARY.json -Encoding utf8

      - name: Upload exact evidence artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p50-final-native-windows-p46-projection-${{ github.run_id }}
          path: p50-final-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish encoded result branch and pointer
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = '${{ github.run_id }}'
          $artifactId = '${{ steps.upload.outputs.artifact-id }}'
          if ([string]::IsNullOrWhiteSpace($artifactId)) { $artifactId = '0' }
          $overall = if ('${{ steps.campaign.outcome }}' -eq 'success') { 'pass' } else { 'fail' }
          $branch = "p50-final-result-$runId-$overall-artifact-$artifactId"
          $resultDir = 'p50-results/final-attempt'
          New-Item -ItemType Directory -Force $resultDir | Out-Null
          [ordered]@{
            schemaVersion='velmere.p50.final-attempt-pointer.v1'
            runId=$runId
            artifactId=$artifactId
            encodedResultBranch=$branch
            branchShaAtStart='${{ github.sha }}'
            outcomes=[ordered]@{
              toolchain='${{ steps.toolchain.outcome }}'
              materialize='${{ steps.materialize.outcome }}'
              reconstruct='${{ steps.reconstruct.outcome }}'
              campaign='${{ steps.campaign.outcome }}'
              upload='${{ steps.upload.outcome }}'
            }
            materializationMode='${{ steps.materialize.outputs.mode }}'
            engineeringPass=($overall -eq 'pass')
            globalStatus='NO_GO'
          } | ConvertTo-Json -Depth 8 | Set-Content "$resultDir/P50_FINAL_ATTEMPT_POINTER.json" -Encoding utf8
          git config user.name 'velmere-p50-final-bot'
          git config user.email 'velmere-p50-final-bot@users.noreply.github.com'
          git add $resultDir
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "P50: persist final-attempt run $runId pointer [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          }
          git push origin "HEAD:refs/heads/$branch"
          Write-Host "Published $branch"
