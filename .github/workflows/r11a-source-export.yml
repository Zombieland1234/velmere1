name: R11A Clean Full Source Package

on:
  push:
    branches:
      - r11-redteam-remediation
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 144152c5a3d19145631d60c0a4713ea6d1ba80dc
  PACKAGE_NAME: VELMERE_R11A_CLEAN_FULL_SOURCE_CANDIDATE_144152c5.zip

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact proven R11A source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 144152c5a3d19145631d60c0a4713ea6d1ba80dc
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Bind exact source and runtime
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Build clean tracked-source projection
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, shutil, json, os, zipfile, hashlib
          root=Path.cwd(); stage=Path('/tmp/velmere-clean/velmere1-r11a-clean-144152c5'); stage.mkdir(parents=True,exist_ok=True)
          tracked=[x.decode() for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          runtime_required_files={'artifacts/r7/providers/R7_ECB_USAGE_POLICY_REVIEW_20260824.json'}
          excluded_prefixes=(
            'artifacts/','audit_artifacts/','coverage/','docs/','evaluation/','evidence/','fixtures/','playwright-report/','receipts/','reports/','test-results/',
            '.velmere/','_velmere/','VELMERE_WORLD_CLASS_VERIFICATION/','P51_NATIVE_WINDOWS_EXACT_BUNDLE_PROJECTION/','VELMERE_KNOWLEDGE/',
            'config/supply-chain-license-archive-cas-pass4825/','config/supply-chain-install-script-archive-cas-pass4825/','config/preflight-snapshots/',
            'dowody','raporty','velmere-final/','velmere-top5-pack/','pliki/','scratch/','naprawa/','verifier/','preview_screenshots/','audit_captures'
          )
          archive_ext=('.zip','.tar.gz','.tgz','.7z')
          root_drop_prefixes=('VELMERE_','FINAL_','ULTIMATE_','MASTER_','P51_','P52_','P72','P73','P75','P76','P77','P78','P79','P88','P89','P90','P91','P92','P93','P94','P96','P97','P98','P99','P101','AUDIT_','CLAIM_','EVIDENCE_','EXECUTION_','FORMAL_','FUZZING_','HUMAN_','LEGACY_','MARKET_','PACKAGE_','PROVENANCE_','RAPORT_','RELEASE_','REMEDIATION_','REPRODUCIBILITY_','RISK_','SECURITY_','SMART_','TASKS_','TOP_')
          root_drop_ext=('.txt','.tsv','.patch','.cmd','.ps1','.png','.jpg','.jpeg')
          def excluded(path):
            if path in runtime_required_files: return None
            if path.startswith(excluded_prefixes): return 'proof_or_generated_plane'
            if path.endswith(archive_ext) or path.endswith('.log'): return 'archive_or_log'
            if '/' not in path:
              name=Path(path).name
              if name.startswith(root_drop_prefixes) or name.lower().endswith(root_drop_ext): return 'root_historical_material'
            return None
          included=[]; excluded_rows=[]; included_bytes=excluded_bytes=0; by_top={}
          for rel in tracked:
            src=root/rel
            if not src.exists() or src.is_dir(): continue
            size=src.stat().st_size; reason=excluded(rel)
            if reason:
              excluded_rows.append({'path':rel,'bytes':size,'reason':reason}); excluded_bytes+=size; continue
            dst=stage/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
            included.append(rel); included_bytes+=size; top=rel.split('/',1)[0]; by_top[top]=by_top.get(top,0)+size
          required=['package.json','package-lock.json','next.config.mjs','tsconfig.json','app','components','lib','config','public','scripts']
          missing=[p for p in required if not (stage/p).exists()]
          if missing: raise SystemExit('clean_package_required_inputs_missing:'+','.join(missing))
          for p in runtime_required_files:
            if not (stage/p).is_file(): raise SystemExit('runtime_required_input_missing:'+p)
          meta={'schemaVersion':'velmere.r11a.clean-source-package.v3','sourceSha':os.environ['SOURCE_SHA'],'includedFileCount':len(included),'includedBytes':included_bytes,'excludedFileCount':len(excluded_rows),'excludedBytes':excluded_bytes,'runtimeRequiredEvidenceInputs':sorted(runtime_required_files),'topLevelIncludedBytes':dict(sorted(by_top.items(),key=lambda kv:kv[1],reverse=True)),'excluded':excluded_rows,'truthBoundary':'Clean full source/development package. Generated report/evidence/history planes are excluded except exact files proven build/runtime dependencies. Source, configs, scripts, tests/migrations and runtime assets remain. Package is validated after extraction.'}
          Path('/tmp/CLEAN_PACKAGE_METADATA.json').write_text(json.dumps(meta,indent=2)+'\n')
          out=Path('/tmp')/os.environ['PACKAGE_NAME']; prefix=stage.parent
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in sorted(stage.rglob('*')):
              if p.is_file(): z.write(p,p.relative_to(prefix))
          digest=hashlib.sha256(out.read_bytes()).hexdigest(); Path('/tmp/CLEAN_PACKAGE_SHA256.txt').write_text(f'{digest}  {out.name}\n')
          print(json.dumps({'zipBytes':out.stat().st_size,'sha256':digest,'includedFiles':len(included),'excludedFiles':len(excluded_rows),'topIncluded':list(meta['topLevelIncludedBytes'].items())[:20]},indent=2))
          if out.stat().st_size > 180*1024*1024: raise SystemExit('clean_package_too_large_over_180MiB')
          PY
      - name: Validate clean ZIP from scratch
        run: |
          mkdir -p /tmp/clean-verify
          unzip -q "/tmp/$PACKAGE_NAME" -d /tmp/clean-verify
          cd /tmp/clean-verify/velmere1-r11a-clean-144152c5
          npm ci --ignore-scripts
          npm run typecheck:direct
          npm run security:regression
          npm run build
      - name: Write clean-package verification receipt
        run: |
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          z=Path('/tmp')/os.environ['PACKAGE_NAME']; meta=json.loads(Path('/tmp/CLEAN_PACKAGE_METADATA.json').read_text())
          r={'schemaVersion':'velmere.r11a.clean-source-package-verification.v3','sourceSha':os.environ['SOURCE_SHA'],'zipSha256':hashlib.sha256(z.read_bytes()).hexdigest(),'zipBytes':z.stat().st_size,'includedFileCount':meta['includedFileCount'],'excludedFileCount':meta['excludedFileCount'],'runtimeRequiredEvidenceInputs':meta['runtimeRequiredEvidenceInputs'],'npmCi':'PASS','directTypeScript':'PASS','securityRegression':'PASS','productionBuild':'PASS','officialRelease':False,'productionCredit':False}
          Path('/tmp/CLEAN_PACKAGE_VERIFICATION.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Upload validated clean source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: velmere-r11a-clean-full-source-144152c5
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          path: |
            /tmp/VELMERE_R11A_CLEAN_FULL_SOURCE_CANDIDATE_144152c5.zip
            /tmp/CLEAN_PACKAGE_SHA256.txt
            /tmp/CLEAN_PACKAGE_METADATA.json
            /tmp/CLEAN_PACKAGE_VERIFICATION.json
