name: R10 Candidate Truth Gate

on:
  push:
    branches:
      - r10-candidate-truth-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r10-candidate-truth-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  VELMERE_OFFLINE_TS_FORCE_BUILTIN: "1"

jobs:
  truth:
    name: Claim, evidence, instrument and build truth
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Verify exact bundled toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Test offline TS loader bare Node builtins
        run: node scripts/r10/test-offline-ts-loader-node-builtins.mjs

      - name: Test release truth scanner
        run: node scripts/r10/test-release-truth-gate.mjs

      - name: Test claim-to-evidence binding
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/r10/test-claim-evidence-binding.ts

      - name: Test exact-scope claim blocker
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/r10/test-claim-audit-blocker-evidence-status.ts

      - name: Test canonical instrument identity
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/r10/test-canonical-instrument-identity.ts

      - name: Test local integrity attestation truth
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/r10/test-local-integrity-attestation.ts

      - name: Test fail-closed R10 customer report boundary
        run: node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/r10/test-r10-canonical-report-truth.ts

      - name: Test dynamic active workflow inventory
        run: node scripts/r10/test-active-workflow-audit.mjs

      - name: Audit all active workflows dynamically
        run: node scripts/r10/verify-active-workflows.mjs --write --output artifacts/r10/R10_ACTIVE_WORKFLOW_AUDIT.json

      - name: Test authority genesis reset
        run: node scripts/r10/test-authority-genesis.mjs

      - name: Verify authority genesis reset policy
        run: node scripts/r10/verify-authority-genesis.mjs --write --output artifacts/r10/R10_AUTHORITY_GENESIS_RECEIPT.json

      - name: Scan candidate release truth
        run: node scripts/r10/verify-release-truth.mjs --write --output artifacts/r10/R10_RELEASE_TRUTH_RECEIPT.json

      - name: Upload R10 truth receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r10-truth-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/r10/R10_RELEASE_TRUTH_RECEIPT.json
            artifacts/r10/R10_ACTIVE_WORKFLOW_AUDIT.json
            artifacts/r10/R10_AUTHORITY_GENESIS_RECEIPT.json
