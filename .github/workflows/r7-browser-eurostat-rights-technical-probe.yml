name: R7 Browser Eurostat Rights Technical Probe

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-browser-eurostat-rights-technical-probe.yml'
      - 'r7-browser-rights/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-browser-eurostat-rights-technical-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eurostat-technical-rights-probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout exact Browser rights controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Probe exact bounded Eurostat HICP surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node r7-browser-rights/probe-eurostat-hicp-paid-authority-v1.mjs
          if ($LASTEXITCODE -ne 0) { throw "browser_eurostat_technical_probe_failed:$LASTEXITCODE" }
          $Receipt = Get-Content -Raw -LiteralPath 'artifacts/r7/browser-rights/R7_BROWSER_EUROSTAT_TECHNICAL_PROBE.json' | ConvertFrom-Json
          if ($Receipt.status -ne 'PASS_TECHNICAL_ACCESS_WITHHELD_EXTERNAL_LEGAL_APPROVAL') { throw 'browser_eurostat_probe_truth_boundary_invalid' }
          if ($Receipt.legalApprovalRecorded -ne $false -or $Receipt.customerFinalCredit -ne $false -or $Receipt.paidValueFinalCredit -ne $false) { throw 'browser_eurostat_probe_claimed_forbidden_credit' }

      - name: Upload no-credit technical and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-browser-eurostat-rights-technical-probe-${{ github.sha }}-${{ github.run_id }}
          path: |
            r7-browser-rights/R7_BROWSER_EUROSTAT_PAID_RIGHTS_REVIEW_PACKET_20260828.json
            artifacts/r7/browser-rights/R7_BROWSER_EUROSTAT_TECHNICAL_PROBE.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 14
