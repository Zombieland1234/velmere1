name: R7 Audit Basic Frozen Benchmark Binding Probe

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-frozen-binding-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-audit-basic-frozen-binding-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bind-frozen-controls:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      R7_RISK_FULL_SOURCE_AGGREGATE_SHA256: '50d59f5f028ef73b279fa3930889fcbf2ab5bc5e36ab4e8cec97be5ed49be67e'
      R7_RISK_FULL_SOURCE_MANIFEST_SHA256: 'af63491cf2922c6391d25fcf25a7d8efb6e76d128f4f9ca1dcf07b36471b0a2f'
      R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256: 'f83f28de6add73eee70d9086f2705241243661d64b5c9fd579b17b359050a221'
      R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256: 'b947314bb696fb8f9153c34d46ba825c5897e9f8cc8cf911a5f31113aa5fc01f'
      R7_RISK_BUNDLE_SHA256: '8e3c66471d534310e1142c3671d43bb556e35b6901c847c9596eea14e8815967'
      R7_PACKAGE_JSON_SHA256: '384932e8183ff4ced7850556ee21bb7b71f9a86add02112a4e434bc09f457a61'
      R7_PACKAGE_LOCK_SHA256: '5924aa0d679ebd78bcd6da01815fdd4b6ff503db45b17697c00168c06af7de61'
      FROZEN_POLICY_PATH: 'config/pass35/a19-audit-static-benchmark-policy.json'
      FROZEN_POLICY_BYTES: '3033'
      FROZEN_POLICY_SHA256: 'eebb6d52ce1ee3521519245a879323e76bbea583b848d30331a332d8773ad920'
      FROZEN_TEST_PATH: 'scripts/pass35/test-a19-audit-static-benchmark.mjs'
      FROZEN_TEST_BYTES: '1697'
      FROZEN_TEST_SHA256: '52c9fd5f1d3fd2b704d6be200a1e75d6fe2ba1d5db3154b166a4c88587616b71'
      FROZEN_RUNTIME_PATH: 'lib/security/pass35-a19-audit-static-benchmark-runtime.mjs'
      FROZEN_RUNTIME_BYTES: '25733'
      FROZEN_RUNTIME_SHA256: '376c0d62724295ae0d1eb2b96dd7596b9cbac176093196b13fff76f129e8a221'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'

    steps:
      - name: Checkout exact controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Reconstruct exact current source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1' -Mode Prepare
          if ($LASTEXITCODE -ne 0) { throw "exact_current_source_prepare_failed:$LASTEXITCODE" }

      - name: Prove frozen control identities against current full-source authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const digest = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const manifestPath = 'r7-work/CURRENT_CANDIDATE_CONTENT_MANIFEST.tsv';
          const executionManifestPath = 'r7-work/R7_EXECUTION_SLICE_MANIFEST.json';
          const manifestBytes = fs.readFileSync(manifestPath);
          if (digest(manifestBytes) !== process.env.R7_RISK_FULL_SOURCE_MANIFEST_SHA256) {
            throw new Error('current_full_source_manifest_sha_mismatch');
          }
          const rows = new Map();
          const lines = manifestBytes.toString('utf8').trimEnd().split(/\r?\n/);
          if (lines.shift() !== 'path\tbytes\tsha256') throw new Error('current_full_source_manifest_header_invalid');
          for (const line of lines) {
            const [path, bytes, sha256] = line.split('\t');
            if (!path || !bytes || !sha256) throw new Error(`current_full_source_manifest_row_invalid:${line}`);
            if (rows.has(path)) throw new Error(`current_full_source_manifest_duplicate:${path}`);
            rows.set(path, { bytes: Number(bytes), sha256 });
          }
          const expected = [
            [process.env.FROZEN_POLICY_PATH, Number(process.env.FROZEN_POLICY_BYTES), process.env.FROZEN_POLICY_SHA256],
            [process.env.FROZEN_TEST_PATH, Number(process.env.FROZEN_TEST_BYTES), process.env.FROZEN_TEST_SHA256],
            [process.env.FROZEN_RUNTIME_PATH, Number(process.env.FROZEN_RUNTIME_BYTES), process.env.FROZEN_RUNTIME_SHA256],
          ];
          const bound = [];
          for (const [path, bytes, sha256] of expected) {
            const row = rows.get(path);
            if (!row) throw new Error(`frozen_control_missing_from_current_full_source:${path}`);
            if (row.bytes !== bytes || row.sha256 !== sha256) {
              throw new Error(`frozen_control_identity_mismatch:${path}:${row.bytes}:${row.sha256}`);
            }
            bound.push({ path, bytes, sha256 });
          }

          const executionManifestBytes = fs.readFileSync(executionManifestPath);
          if (digest(executionManifestBytes) !== process.env.R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256) {
            throw new Error('execution_slice_manifest_sha_mismatch');
          }
          const executionManifest = JSON.parse(executionManifestBytes);
          const runtimeRow = executionManifest.files.find((row) => row.path === process.env.FROZEN_RUNTIME_PATH);
          if (!runtimeRow || runtimeRow.byteLength !== Number(process.env.FROZEN_RUNTIME_BYTES) || runtimeRow.sha256 !== process.env.FROZEN_RUNTIME_SHA256) {
            throw new Error('frozen_runtime_execution_slice_binding_invalid');
          }
          const runtimeBytes = fs.readFileSync(`r7-work/${process.env.FROZEN_RUNTIME_PATH}`);
          if (runtimeBytes.length !== runtimeRow.byteLength || digest(runtimeBytes) !== runtimeRow.sha256) {
            throw new Error('frozen_runtime_physical_byte_identity_invalid');
          }

          const receipt = {
            schemaVersion: 'velmere.r7.audit-basic-frozen-benchmark-binding.v1',
            status: 'PASS_FROZEN_CONTROLS_BOUND_TO_EXACT_CURRENT_FULL_SOURCE',
            github: {
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              headSha: process.env.GITHUB_SHA,
            },
            exactCurrentSource: {
              fullSourceAggregateSha256: process.env.R7_RISK_FULL_SOURCE_AGGREGATE_SHA256,
              fullSourceManifestSha256: process.env.R7_RISK_FULL_SOURCE_MANIFEST_SHA256,
              executionSliceAggregateSha256: process.env.R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256,
              executionSliceManifestSha256: process.env.R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256,
              executionBundleSha256: process.env.R7_RISK_BUNDLE_SHA256,
            },
            boundControls: bound,
            runtimePhysicalByteIdentity: true,
            policyAndTestFullSourceBoundButNotExecutionSliceMaterialized: true,
            benchmarkExecuted: false,
            paidGateEligible: false,
            customerFinalCredit: false,
            replacesQualifiedHumanReview: false,
            truthBoundary: 'This probe proves only that the benchmark policy, test wrapper, and runtime identities are present in the exact current full-source manifest and that the runtime bytes are physically present in the exact execution slice. It does not execute the benchmark or create Audit Basic FINAL credit.',
          };
          fs.mkdirSync('artifacts/r7/audit-basic', { recursive: true });
          fs.writeFileSync('artifacts/r7/audit-basic/R7_AUDIT_BASIC_FROZEN_BINDING_RECEIPT.json', `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify(receipt, null, 2));
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw "frozen_binding_probe_failed:$LASTEXITCODE" }

      - name: Upload frozen binding receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-frozen-binding-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/r7/audit-basic/R7_AUDIT_BASIC_FROZEN_BINDING_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30