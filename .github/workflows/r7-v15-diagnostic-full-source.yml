name: R7 v15 Diagnostic Full Execution Slice

on:
  push:
    branches:
      - velmere-r7-v15-diagnostic-extract-20260825
    paths:
      - '.github/workflows/r7-v15-diagnostic-full-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-exact-slice:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruct exact R7 v15 execution slice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Parts = @(Get-ChildItem -LiteralPath 'r7-runtime/parts' -File | Sort-Object Name)
          if ($Parts.Count -ne 36) { throw "expected 36 transport parts, got $($Parts.Count)" }
          $EncodedParts = [System.Collections.Generic.List[string]]::new()
          foreach ($PartFile in $Parts) { $EncodedParts.Add((Get-Content -LiteralPath $PartFile.FullName -Raw).TrimEnd("`r", "`n")) }
          [IO.File]::WriteAllBytes('r7-runtime/R7_EXECUTION_SLICE.tar.zst', [Convert]::FromBase64String([string]::Concat($EncodedParts)))
          $BundleHash = (Get-FileHash -LiteralPath 'r7-runtime/R7_EXECUTION_SLICE.tar.zst' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($BundleHash -ne 'fb4c3d2a9524ec4f60f2d21cb430131bf11cfc99b108c96d2ad7d8543c941c87') { throw "bundle SHA mismatch: $BundleHash" }
          $Zstd = (Get-Command zstd.exe -ErrorAction Stop).Source
          & $Zstd -d -f 'r7-runtime/R7_EXECUTION_SLICE.tar.zst' -o 'r7-runtime/R7_EXECUTION_SLICE.tar'
          if ($LASTEXITCODE -ne 0) { throw "zstd failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path 'r7-work' | Out-Null
          tar.exe -xf 'r7-runtime/R7_EXECUTION_SLICE.tar' -C 'r7-work'
          if ($LASTEXITCODE -ne 0) { throw "tar extraction failed: $LASTEXITCODE" }
          $Manifest = Get-Content -LiteralPath 'r7-work/R7_EXECUTION_SLICE_MANIFEST.json' -Raw | ConvertFrom-Json
          if ([int]$Manifest.fileCount -ne 3504 -or [int64]$Manifest.payloadByteLength -ne 63023964) { throw 'execution slice denominator mismatch' }
          [ordered]@{
            schemaVersion='velmere.r7.v15.full-execution-slice-diagnostic.v1'
            sourceAuthorityGithubSha='5bcba78e697e2bd0c6584289a72ffa153502affb'
            executionBundleSha256=$BundleHash
            fileCount=[int]$Manifest.fileCount
            payloadByteLength=[int64]$Manifest.payloadByteLength
            secretsIncluded=$false
            customerFinalCredit=$false
          } | ConvertTo-Json | Set-Content -LiteralPath 'r7-work/R7_DIAGNOSTIC_EXPORT_RECEIPT.json' -Encoding utf8

      - name: Upload exact execution slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-v15-exact-execution-slice-${{ github.run_id }}
          path: r7-work
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
