name: R7 Final Exact Windows Current-Source Campaign

on:
  push:
    branches:
      - velmere-r7-final-exact-windows-20260824
    paths:
      - '.gitattributes'
      - '.github/workflows/r7-final-exact-windows.yml'
      - 'R7_GITHUB_EXECUTION_SURFACE_RECEIPT.json'
      - 'r7-runtime/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-final-exact-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-windows-current-source:
    runs-on: windows-2025
    timeout-minutes: 210
    env:
      R7_CANDIDATE: 'R7_MERGED_CURRENT_SOURCE'
      R7_PART_COUNT: '36'
      R7_FILE_COUNT: '3491'
      R7_PAYLOAD_BYTE_LENGTH: '62839471'
      R7_BUNDLE_SHA256: 'df6005d298025a1946789945e4292c216d78f5a99c12fc2a9f43e6d9fe0c2977'
      R7_EXECUTION_SLICE_AGGREGATE_SHA256: '4094445089204c3b7fb056cbada62aca51305eca420db135b6116cae36ca1289'
      R7_EXECUTION_SLICE_MANIFEST_SHA256: '8bfb4be592873ab1806ff9c9af51546158c040082fb3a746306fae5ff6163cc4'
      R7_FULL_SOURCE_AGGREGATE_SHA256: '1de4865453668ef952f84c1fcb31575efb13f5fb5adecc52c71b8350ef1f61ec'
      R7_FULL_SOURCE_MANIFEST_SHA256: '4d3e46fa55b125e743b3b3d9b1da58a50014251efad7a0a39d5764aa17fd818c'
      R7_PACKAGE_JSON_SHA256: 'de067fe9cd5611ebf9c719ca0be30e5b149d19b002268a0ce496acb10f871c1c'
      R7_PACKAGE_LOCK_SHA256: 'e228adec08801e454ef5559a20f302110b4896a307c364195716218a376c48bb'
      R7_TRANSPORT_RECEIPT_SHA256: 'd926d18bdd6c4934e71062474c6036c070a0110b816b0de26cb29140adaff8ca'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - name: Checkout exact R7 execution control head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact control tree and reconstruct exact bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ObservedHead = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $ObservedHead -ne $env:GITHUB_SHA) { throw "checkout SHA mismatch: $ObservedHead" }
          & git diff --exit-code -- .
          if ($LASTEXITCODE -ne 0) { throw 'checkout worktree is not byte-clean' }

          $SurfacePath = 'R7_GITHUB_EXECUTION_SURFACE_RECEIPT.json'
          $Surface = Get-Content -LiteralPath $SurfacePath -Raw | ConvertFrom-Json
          if ($Surface.schemaVersion -ne 'velmere.r7.github-execution-surface.v4') { throw 'surface schema mismatch' }
          if ($Surface.candidate -ne $env:R7_CANDIDATE) { throw 'surface candidate mismatch' }
          $ExpectedTracked = @($Surface.files | ForEach-Object { [string]$_.path }) + @([string]$Surface.selfExcludedPath) | Sort-Object
          $ObservedTracked = @(& git ls-files) | Sort-Object
          if ($LASTEXITCODE -ne 0) { throw 'git ls-files failed' }
          if (($ExpectedTracked -join "`n") -ne ($ObservedTracked -join "`n")) { throw 'exact Git tree path-set mismatch' }
          if ($ObservedTracked.Count -ne [int]$Surface.expectedTrackedFileCount) { throw 'exact Git tree denominator mismatch' }
          foreach ($Row in @($Surface.files)) {
            $Path = [string]$Row.path
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "missing surface file: $Path" }
            if ((Get-Item -LiteralPath $Path).Length -ne [int64]$Row.byteLength) { throw "surface byte length mismatch: $Path" }
            $Hash = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Hash -ne [string]$Row.sha256) { throw "surface SHA mismatch: $Path" }
          }
          $WorkflowHash = (Get-FileHash -LiteralPath '.github/workflows/r7-final-exact-windows.yml' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($WorkflowHash -ne [string]$Surface.workflow.sha256) { throw 'workflow SHA mismatch' }
          $TransportPath = 'r7-runtime/R7_WINDOWS_EXECUTION_TRANSPORT_RECEIPT.json'
          $TransportHash = (Get-FileHash -LiteralPath $TransportPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($TransportHash -ne $env:R7_TRANSPORT_RECEIPT_SHA256 -or $TransportHash -ne [string]$Surface.transportReceiptSha256) { throw 'transport receipt SHA mismatch' }
          $Transport = Get-Content -LiteralPath $TransportPath -Raw | ConvertFrom-Json
          if ($Transport.schemaVersion -ne 'velmere.r7.windows-execution-transport.v4') { throw 'transport schema mismatch' }
          if ([int]$Transport.partCount -ne [int]$env:R7_PART_COUNT) { throw 'transport part denominator mismatch' }
          if ([string]$Transport.bundle.sha256 -ne $env:R7_BUNDLE_SHA256) { throw 'transport bundle binding mismatch' }
          if ([string]$Transport.sourceBinding.fullSourceAggregateSha256 -ne $env:R7_FULL_SOURCE_AGGREGATE_SHA256) { throw 'transport full-source binding mismatch' }
          if ([string]$Transport.sourceBinding.executionSliceAggregateSha256 -ne $env:R7_EXECUTION_SLICE_AGGREGATE_SHA256) { throw 'transport execution binding mismatch' }
          if ([string]$Transport.sourceBinding.executionSliceManifestSha256 -ne $env:R7_EXECUTION_SLICE_MANIFEST_SHA256) { throw 'transport manifest binding mismatch' }
          if ([string]$Transport.secretScan.status -ne 'PASS_SECRETS_0' -or [int]$Transport.secretScan.findingCount -ne 0 -or [int]$Transport.secretScan.secrets -ne 0) { throw 'transport secret scan is not clean' }
          $SecretScanPath = 'r7-runtime/R7_SUCCESSOR_SECRET_SCAN_RECEIPT.json'
          $SecretScanHash = (Get-FileHash -LiteralPath $SecretScanPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($SecretScanHash -ne [string]$Surface.secretScanReceiptSha256) { throw 'secret scan receipt SHA mismatch' }
          $SecretScan = Get-Content -LiteralPath $SecretScanPath -Raw | ConvertFrom-Json
          if ([string]$SecretScan.status -ne 'PASS_SECRETS_0' -or [int]$SecretScan.findingCount -ne 0 -or [int]$SecretScan.secrets -ne 0 -or [bool]$SecretScan.rawSecretValuesRetained) { throw 'successor source/archive/surface secret scan is not clean' }
          if ([int]$Surface.secretScan.findingCount -ne 0 -or [int]$Surface.secretScan.secrets -ne 0) { throw 'surface receipt secrets denominator mismatch' }

          $PhysicalParts = @(Get-ChildItem -LiteralPath 'r7-runtime/parts' -File | Sort-Object Name)
          $ExpectedPartPaths = @($Transport.parts | ForEach-Object { 'r7-runtime/' + [string]$_.path }) | Sort-Object
          $ObservedPartPaths = @($PhysicalParts | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1).Replace('\','/') }) | Sort-Object
          if ($PhysicalParts.Count -ne [int]$env:R7_PART_COUNT -or ($ExpectedPartPaths -join "`n") -ne ($ObservedPartPaths -join "`n")) { throw 'physical transport part path-set mismatch' }
          $EncodedParts = [System.Collections.Generic.List[string]]::new()
          foreach ($Row in @($Transport.parts)) {
            $Path = 'r7-runtime/' + [string]$Row.path
            if ((Get-Item -LiteralPath $Path).Length -ne [int64]$Row.byteLength) { throw "part byte length mismatch: $Path" }
            $Hash = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Hash -ne [string]$Row.sha256) { throw "part SHA mismatch: $Path" }
            $Part = (Get-Content -LiteralPath $Path -Raw).TrimEnd("`r", "`n")
            if ($Part.Length -ne [int]$Row.base64CharacterLength -or $Part -notmatch '^[A-Za-z0-9+/]*={0,2}$') { throw "part base64 contract mismatch: $Path" }
            $EncodedParts.Add($Part)
          }
          $Encoded = [string]::Concat($EncodedParts)
          if ($Encoded.Length -ne [int64]$Transport.base64EncodedLength) { throw 'joined base64 length mismatch' }
          [IO.File]::WriteAllBytes('r7-runtime/R7_EXECUTION_SLICE.tar.zst', [Convert]::FromBase64String($Encoded))
          $BundleHash = (Get-FileHash -LiteralPath 'r7-runtime/R7_EXECUTION_SLICE.tar.zst' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($BundleHash -ne $env:R7_BUNDLE_SHA256) { throw "bundle SHA mismatch: $BundleHash" }
          $Zstd = (Get-Command zstd.exe -ErrorAction Stop).Source
          & $Zstd -d -f 'r7-runtime/R7_EXECUTION_SLICE.tar.zst' -o 'r7-runtime/R7_EXECUTION_SLICE.tar'
          if ($LASTEXITCODE -ne 0) { throw "zstd failed: $LASTEXITCODE" }
          $TarHash = (Get-FileHash -LiteralPath 'r7-runtime/R7_EXECUTION_SLICE.tar' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($TarHash -ne [string]$Transport.tar.sha256) { throw 'tar SHA mismatch' }
          New-Item -ItemType Directory -Force -Path 'r7-work' | Out-Null
          tar.exe -xf 'r7-runtime/R7_EXECUTION_SLICE.tar' -C 'r7-work'
          if ($LASTEXITCODE -ne 0) { throw "tar extraction failed: $LASTEXITCODE" }

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Verify every transported execution-slice byte
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const digest = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const manifestBytes = fs.readFileSync('R7_EXECUTION_SLICE_MANIFEST.json');
          if (digest(manifestBytes) !== process.env.R7_EXECUTION_SLICE_MANIFEST_SHA256) throw new Error('manifest_sha_mismatch');
          const manifest = JSON.parse(manifestBytes);
          if (manifest.schemaVersion !== 'velmere.r7.execution-slice-manifest.v3' || manifest.candidate !== process.env.R7_CANDIDATE) throw new Error('manifest_identity_mismatch');
          if (manifest.fileCount !== Number(process.env.R7_FILE_COUNT) || manifest.payloadByteLength !== Number(process.env.R7_PAYLOAD_BYTE_LENGTH) || manifest.testDenominator !== 52) throw new Error('manifest_denominator_mismatch');
          const normalize = (value) => path.posix.normalize(value);
          const listed = manifest.files.map((row) => row.path);
          const additional = manifest.archiveAdditionalPaths;
          const expected = [...listed, ...additional].sort();
          if (new Set(expected).size !== expected.length || new Set(expected.map((value) => value.toLowerCase())).size !== expected.length) throw new Error('manifest_duplicate_or_windows_case_collision');
          for (const value of expected) if (!value || value.startsWith('/') || value.includes('\\') || normalize(value) !== value || value.split('/').includes('..')) throw new Error(`unsafe_manifest_path:${value}`);
          const observed = [];
          const walk = (directory, prefix = '') => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const rel = prefix ? `${prefix}/${entry.name}` : entry.name;
              const absolute = path.join(directory, entry.name);
              const info = fs.lstatSync(absolute);
              if (info.isSymbolicLink()) throw new Error(`symbolic_link_denied:${rel}`);
              if (entry.isDirectory()) walk(absolute, rel);
              else if (entry.isFile()) observed.push(rel);
              else throw new Error(`non_regular_path_denied:${rel}`);
            }
          };
          walk('.');
          observed.sort();
          if (JSON.stringify(observed) !== JSON.stringify(expected)) throw new Error(`archive_path_set_mismatch:${observed.length}/${expected.length}`);
          let body = '';
          let payloadByteLength = 0;
          for (const row of manifest.files) {
            const bytes = fs.readFileSync(row.path);
            const observedSha = digest(bytes);
            if (bytes.length !== row.byteLength || observedSha !== row.sha256) throw new Error(`identity_mismatch:${row.path}`);
            body += `${row.sha256}\t${row.byteLength}\t${row.path}\n`;
            payloadByteLength += bytes.length;
          }
          const aggregate = digest(Buffer.from(body));
          if (aggregate !== process.env.R7_EXECUTION_SLICE_AGGREGATE_SHA256 || manifest.aggregateIdentitySha256 !== aggregate || payloadByteLength !== manifest.payloadByteLength) throw new Error(`aggregate_mismatch:${aggregate}`);
          if (!fs.readFileSync('R7_EXECUTION_SLICE_MANIFEST.tsv').equals(Buffer.from(body))) throw new Error('manifest_tsv_mismatch');
          const packageSha = digest(fs.readFileSync('package.json'));
          const lockSha = digest(fs.readFileSync('package-lock.json'));
          if (packageSha !== process.env.R7_PACKAGE_JSON_SHA256 || lockSha !== process.env.R7_PACKAGE_LOCK_SHA256) throw new Error('dependency_source_sha_mismatch');
          const full = manifest.fullSource;
          const fullIdentity = JSON.parse(fs.readFileSync(full.identityPath, 'utf8'));
          if (full.aggregateIdentitySha256 !== process.env.R7_FULL_SOURCE_AGGREGATE_SHA256 || full.manifestWithHeaderSha256 !== process.env.R7_FULL_SOURCE_MANIFEST_SHA256) throw new Error('full_source_manifest_binding_mismatch');
          if (digest(fs.readFileSync(full.manifestPath)) !== full.manifestWithHeaderSha256 || fullIdentity.aggregateIdentitySha256 !== full.aggregateIdentitySha256 || fullIdentity.manifestWithHeaderSha256 !== full.manifestWithHeaderSha256) throw new Error('full_source_identity_mismatch');
          const receipt = {schemaVersion:'velmere.r7.exact-transported-slice-verification.v1',status:'PASS',candidate:manifest.candidate,archiveEntryCount:expected.length,fileCount:manifest.fileCount,payloadByteLength,fullSourceAggregateSha256:full.aggregateIdentitySha256,executionSliceAggregateSha256:aggregate,executionSliceManifestSha256:digest(manifestBytes),packageJsonSha256:packageSha,packageLockSha256:lockSha,testDenominator:manifest.testDenominator,customerFinalCredit:false};
          fs.mkdirSync('artifacts/r7/windows',{recursive:true});
          fs.writeFileSync('artifacts/r7/windows/R7_EXACT_TRANSPORTED_SLICE_VERIFICATION.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw "execution-slice verification failed: $LASTEXITCODE" }

      - name: Pin exact npm 11.16.0 and run full lifecycle npm ci
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference = 'Stop'
          # Bootstrap outside the project root: the checked-in project contract
          # already requires npm 11.16.0 and an older setup-node npm must not
          # evaluate that devEngines boundary before it has upgraded itself.
          Push-Location $env:RUNNER_TEMP
          try {
            npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
            if ($LASTEXITCODE -ne 0) { throw "npm CLI pin failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $ObservedNodeVersion = (node --version).Trim()
          if ($ObservedNodeVersion -ne 'v24.18.0') { throw "Node mismatch: $ObservedNodeVersion" }
          $ObservedNpmVersion = (npm --version).Trim()
          if ($ObservedNpmVersion -ne '11.16.0') { throw "npm mismatch: $ObservedNpmVersion" }
          $env:npm_config_ignore_scripts = 'false'
          $EffectiveIgnoreScripts = (npm config get ignore-scripts).Trim().ToLowerInvariant()
          if ($EffectiveIgnoreScripts -ne 'false') { throw "ignore-scripts override failed: $EffectiveIgnoreScripts" }
          npm ci --ignore-scripts=false --audit=false --fund=false 2>&1 | Tee-Object -FilePath 'R7_NPM_CI.log'
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed: $LASTEXITCODE" }
          if (-not (Select-String -LiteralPath 'R7_NPM_CI.log' -SimpleMatch 'Velmere runtime OK: v24.18.0 / npm 11.16.0' -Quiet)) { throw 'root preinstall lifecycle marker missing' }
          # Pass only values already observed and fail-closed above to the Node
          # receipt process. Directly spawning the Windows npm shim from Node 24
          # can fail with spawnSync EINVAL even after npm ci itself succeeded.
          $env:R7_VERIFIED_NODE_VERSION = $ObservedNodeVersion
          $env:R7_VERIFIED_NPM_VERSION = $ObservedNpmVersion
          $env:R7_VERIFIED_NPM_IGNORE_SCRIPTS = $EffectiveIgnoreScripts
          if (-not $env:GITHUB_ENV) { throw 'GitHub environment file is unavailable' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "R7_VERIFIED_NODE_VERSION=$ObservedNodeVersion" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "R7_VERIFIED_NPM_VERSION=$ObservedNpmVersion" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "R7_VERIFIED_NPM_IGNORE_SCRIPTS=$EffectiveIgnoreScripts" -Encoding utf8
          @'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const pkg=n=>JSON.parse(fs.readFileSync(`node_modules/${n}/package.json`,'utf8')).version;
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const hasInstallScript=Object.entries(lock.packages||{}).filter(([,value])=>value?.hasInstallScript===true).map(([name])=>name);
          const node=process.env.R7_VERIFIED_NODE_VERSION;
          const npm=process.env.R7_VERIFIED_NPM_VERSION;
          const effectiveIgnoreScripts=process.env.R7_VERIFIED_NPM_IGNORE_SCRIPTS;
          if(node!=='v24.18.0')throw new Error(`verified_node_version_missing_or_invalid:${node??'missing'}`);
          if(npm!=='11.16.0')throw new Error(`verified_npm_version_missing_or_invalid:${npm??'missing'}`);
          if(effectiveIgnoreScripts!=='false')throw new Error('effective_ignore_scripts_not_false');
          const packages={pglite:pkg('@electric-sql/pglite'),react:pkg('react'),reactDom:pkg('react-dom'),typescript:pkg('typescript'),next:pkg('next')};
          if(packages.pglite!=='0.5.4'||packages.react!=='19.2.7'||packages.reactDom!=='19.2.7'||packages.typescript!=='5.9.3'||packages.next!=='16.2.12')throw new Error(`exact_package_version_mismatch:${JSON.stringify(packages)}`);
          const log=fs.readFileSync('R7_NPM_CI.log');
          const receipt={schemaVersion:'velmere.r7.exact-windows-dependency.v2',status:'PASS',runtime:{platform:process.platform,arch:process.arch,node:process.version,npm,imageOs:process.env.ImageOS,runnerOs:process.env.RUNNER_OS},source:{packageJsonSha256:sha('package.json'),packageLockSha256:sha('package-lock.json')},packages,projectInstall:{command:'npm ci --ignore-scripts=false --audit=false --fund=false',effectiveIgnoreScripts:false,lifecycleScriptsEnabled:true,rootPreinstallObserved:log.includes(Buffer.from('Velmere runtime OK: v24.18.0 / npm 11.16.0')),lockedPackagesDeclaringInstallScript:hasInstallScript,logSha256:crypto.createHash('sha256').update(log).digest('hex')},npmCliBootstrap:{command:'npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false',ignoreScripts:true},customerFinalCredit:false};
          fs.writeFileSync('artifacts/r7/windows/R7_EXACT_WINDOWS_DEPENDENCY_RECEIPT.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw "dependency receipt failed: $LASTEXITCODE" }

      - name: Exact Webpack production build
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force '.next' -ErrorAction SilentlyContinue
          npm run build:webpack 2>&1 | Tee-Object -FilePath 'artifacts/r7/windows/R7_WEBPACK.log'
          $WebpackExitCode = $LASTEXITCODE
          if ($WebpackExitCode -ne 0) {
            try {
              $CompilerLog = Get-ChildItem -LiteralPath '.velmere/deployment-builds' -Filter '*-webpack-compile.log' -File -ErrorAction Stop | Sort-Object -Property LastWriteTimeUtc -Descending | Select-Object -First 1
              if ($null -ne $CompilerLog) {
                Write-Host '=== Webpack compiler output tail ==='
                Get-Content -LiteralPath $CompilerLog.FullName -Tail 300 -ErrorAction Stop
                Write-Host '=== End Webpack compiler output tail ==='
              } else {
                Write-Warning 'Webpack compiler log was not found'
              }
            } catch {
              Write-Warning 'Webpack compiler log tail unavailable'
            }
            throw "Webpack build failed: $WebpackExitCode"
          }

      - name: TypeScript zero-error after generated-route types
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference = 'Stop'
          npm run typecheck 2>&1 | Tee-Object -FilePath 'artifacts/r7/windows/R7_TYPESCRIPT.log'
          $TypeScriptExitCode = $LASTEXITCODE
          if ($TypeScriptExitCode -ne 0) {
            $TypeScriptReceipt = 'artifacts/pass13/PASS13_PARTITIONED_TYPESCRIPT.json'
            if (Test-Path -LiteralPath $TypeScriptReceipt -PathType Leaf) {
              Write-Host '=== TypeScript exact diagnostics receipt ==='
              $TypeScriptResult = Get-Content -LiteralPath $TypeScriptReceipt -Raw | ConvertFrom-Json
              foreach ($Partition in $TypeScriptResult.partitions) {
                foreach ($Diagnostic in $Partition.diagnostics) { Write-Host ([string]$Diagnostic) }
              }
              foreach ($Diagnostic in $TypeScriptResult.toolingSyntaxErrors) { Write-Host ([string]$Diagnostic) }
              Write-Host '=== End TypeScript exact diagnostics receipt ==='
            } else {
              Write-Warning 'TypeScript diagnostics receipt was not found'
            }
            throw "TypeScript failed: $TypeScriptExitCode"
          }

      - name: ESLint zero-warning
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference = 'Stop'
          npm run lint 2>&1 | Tee-Object -FilePath 'artifacts/r7/windows/R7_ESLINT.log'
          if ($LASTEXITCODE -ne 0) { throw "ESLint failed: $LASTEXITCODE" }

      - name: Exact Turbopack production build
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force '.next' -ErrorAction SilentlyContinue
          npm run build:turbopack 2>&1 | Tee-Object -FilePath 'artifacts/r7/windows/R7_TURBOPACK.log'
          $TurbopackExitCode = $LASTEXITCODE
          if ($TurbopackExitCode -ne 0) {
            try {
              $CompilerLog = Get-ChildItem -LiteralPath '.velmere/deployment-builds' -Filter '*-turbopack-compile.log' -File -ErrorAction Stop | Sort-Object -Property LastWriteTimeUtc -Descending | Select-Object -First 1
              if ($null -ne $CompilerLog) {
                Write-Host '=== Turbopack compiler output tail ==='
                Get-Content -LiteralPath $CompilerLog.FullName -Tail 300 -ErrorAction Stop
                Write-Host '=== End Turbopack compiler output tail ==='
              } else {
                Write-Warning 'Turbopack compiler log was not found'
              }
            } catch {
              Write-Warning 'Turbopack compiler log tail unavailable'
            }
            throw "Turbopack build failed: $TurbopackExitCode"
          }

      - name: Full merged 52-test campaign run 1
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/r7/run-r7-current-execution-campaign.mjs --run-label windows-run1 2>&1 | Tee-Object -FilePath 'artifacts/r7/windows/R7_CAMPAIGN_RUN1.log'
          if ($LASTEXITCODE -ne 0) { throw "campaign run1 failed: $LASTEXITCODE" }

      - name: Full merged 52-test campaign run 2
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/r7/run-r7-current-execution-campaign.mjs --run-label windows-run2 2>&1 | Tee-Object -FilePath 'artifacts/r7/windows/R7_CAMPAIGN_RUN2.log'
          if ($LASTEXITCODE -ne 0) { throw "campaign run2 failed: $LASTEXITCODE" }

      - name: Verify repeatability and write final exact authority receipt
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/r7/compare-r7-campaigns.mjs `
            artifacts/r7/current-execution/R7_CURRENT_EXECUTION_CAMPAIGN_windows-run1.json `
            artifacts/r7/current-execution/R7_CURRENT_EXECUTION_CAMPAIGN_windows-run2.json
          if ($LASTEXITCODE -ne 0) { throw "repeatability failed: $LASTEXITCODE" }
          @'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const one=read('artifacts/r7/current-execution/R7_CURRENT_EXECUTION_CAMPAIGN_windows-run1.json');
          const two=read('artifacts/r7/current-execution/R7_CURRENT_EXECUTION_CAMPAIGN_windows-run2.json');
          const repeat=read('artifacts/r7/current-execution/R7_CURRENT_EXECUTION_REPEATABILITY.json');
