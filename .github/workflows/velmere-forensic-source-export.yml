name: Velmere pinned source evidence export
on:
  push:
    branches: [audit/release-evidence-recovery-20260914]
    paths: [.github/workflows/velmere-forensic-source-export.yml]
permissions:
  contents: read
concurrency:
  group: velmere-forensic-source-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 565b1c088cc56062fae7ce56612bd24dfbf6eb66
          persist-credentials: false
          fetch-depth: 1
      - name: Export source bytes without executing application code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 565b1c088cc56062fae7ce56612bd24dfbf6eb66
          mkdir -p /tmp/velmere-source-evidence /tmp/velmere-source-parts
          git archive --format=zip --prefix=velmere-source/ HEAD > /tmp/source-565b1c0.zip
          git ls-tree -rl HEAD > /tmp/velmere-source-evidence/git-tree.txt
          git rev-parse HEAD HEAD^{tree} > /tmp/velmere-source-evidence/identity.txt
          sha256sum /tmp/source-565b1c0.zip > /tmp/velmere-source-evidence/archive.sha256
          split -b 200M -d -a 2 /tmp/source-565b1c0.zip /tmp/velmere-source-parts/source.part-
          sha256sum /tmp/velmere-source-parts/* > /tmp/velmere-source-evidence/parts.sha256
          printf '%s\n' 'Pinned public Git source only. NOT the canonical R12A ZIP. No application, security or release tests executed. Join source.part-* in numeric order to reconstruct source-565b1c0.zip and verify archive.sha256. No secrets or deployment environment exported.' > /tmp/velmere-source-evidence/BOUNDARY.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: velmere-source-565b1c0-manifest
          path: /tmp/velmere-source-evidence/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: velmere-source-565b1c0-part-00
          path: /tmp/velmere-source-parts/source.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: velmere-source-565b1c0-part-01
          path: /tmp/velmere-source-parts/source.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: velmere-source-565b1c0-part-02
          path: /tmp/velmere-source-parts/source.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: velmere-source-565b1c0-part-03
          path: /tmp/velmere-source-parts/source.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
