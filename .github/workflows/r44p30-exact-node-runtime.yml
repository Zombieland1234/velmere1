name: R44P30 Exact Node 24.18.0 and Canonical npm Cache

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r44p30-exact-node-runtime.yml'
      - 'r44p30-runtime/**'

permissions:
  contents: read

concurrency:
  group: r44p30-exact-node-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-runtime-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruct and semantically verify canonical tarball URL set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r44p30-runtime/evidence r44p30-runtime/npm-cache
          base64 -d r44p30-runtime/npm-resolved-urls.txt.gz.b64 \
            > r44p30-runtime/npm-resolved-urls.txt.gz
          gzip -t r44p30-runtime/npm-resolved-urls.txt.gz
          gzip -dc r44p30-runtime/npm-resolved-urls.txt.gz \
            > r44p30-runtime/npm-resolved-urls.txt
          test "$(wc -l < r44p30-runtime/npm-resolved-urls.txt)" = '618'
          LC_ALL=C sort -u r44p30-runtime/npm-resolved-urls.txt \
            > /tmp/sorted-unique-urls.txt
          cmp /tmp/sorted-unique-urls.txt r44p30-runtime/npm-resolved-urls.txt
          awk '/^https:\/\/registry\.npmjs\.org\/.+\.tgz$/ { n++ } END { exit !(n==618) }' \
            r44p30-runtime/npm-resolved-urls.txt
          grep -Fx 'https://registry.npmjs.org/zustand/-/zustand-4.5.7.tgz' \
            r44p30-runtime/npm-resolved-urls.txt
          sha256sum r44p30-runtime/npm-resolved-urls.txt* \
            | sort > r44p30-runtime/evidence/CANONICAL_URL_SET_SHA256SUMS.txt
          wc -c r44p30-runtime/npm-resolved-urls.txt* \
            > r44p30-runtime/evidence/CANONICAL_URL_SET_SIZES.txt

      - name: Download and verify exact Node distribution
        shell: bash
        run: |
          set -euo pipefail
          cd r44p30-runtime
          curl --fail --location --retry 4 --retry-all-errors \
            --output node-v24.18.0-linux-x64.tar.xz \
            https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz
          printf '%s  %s\n' \
            '55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742' \
            'node-v24.18.0-linux-x64.tar.xz' > expected.sha256
          sha256sum --check expected.sha256
          tar -xJf node-v24.18.0-linux-x64.tar.xz
          test "$(./node-v24.18.0-linux-x64/bin/node --version)" = 'v24.18.0'
          test "$(./node-v24.18.0-linux-x64/bin/npm --version)" = '11.16.0'
          sha256sum node-v24.18.0-linux-x64.tar.xz > evidence/NODE_ARCHIVE_SHA256SUMS.txt
          ./node-v24.18.0-linux-x64/bin/node -p \
            'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,versions:process.versions},null,2)' \
            > evidence/NODE_RUNTIME_IDENTITY.json
          ./node-v24.18.0-linux-x64/bin/npm --version > evidence/NPM_VERSION.txt
          printf '%s\n' "$GITHUB_SHA" > evidence/GITHUB_CHECKOUT_SHA.txt

      - name: Populate exact npm cache from canonical URL set
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/r44p30-runtime/node-v24.18.0-linux-x64/bin:$PATH"
          test "$(node --version)" = 'v24.18.0'
          test "$(npm --version)" = '11.16.0'
          split -l 30 r44p30-runtime/npm-resolved-urls.txt /tmp/npm-url-batch-
          for batch in /tmp/npm-url-batch-*; do
            mapfile -t urls < "$batch"
            npm cache add \
              --cache "$PWD/r44p30-runtime/npm-cache" \
              --prefer-online \
              --no-audit --no-fund \
              "${urls[@]}"
          done
          npm cache verify --cache "$PWD/r44p30-runtime/npm-cache" \
            > r44p30-runtime/evidence/NPM_CACHE_VERIFY.txt
          test -d r44p30-runtime/npm-cache/_cacache/content-v2
          find r44p30-runtime/npm-cache -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > r44p30-runtime/evidence/NPM_CACHE_FILE_SHA256SUMS.txt

      - name: Build deterministic runtime/cache bundle
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name \
            --mtime='UTC 2026-08-07 00:00:00' \
            --owner=0 --group=0 --numeric-owner \
            -cJf r44p30-runtime/r44p30-exact-node-and-npm-cache.tar.xz \
            -C r44p30-runtime \
            node-v24.18.0-linux-x64.tar.xz \
            npm-cache \
            npm-resolved-urls.txt \
            evidence
          sha256sum r44p30-runtime/r44p30-exact-node-and-npm-cache.tar.xz \
            > r44p30-runtime/R44P30_RUNTIME_CACHE_BUNDLE_SHA256SUMS.txt

      - name: Upload exact runtime/cache bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44p30-exact-node-and-canonical-npm-cache
          path: |
            r44p30-runtime/r44p30-exact-node-and-npm-cache.tar.xz
            r44p30-runtime/R44P30_RUNTIME_CACHE_BUNDLE_SHA256SUMS.txt
            r44p30-runtime/evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
