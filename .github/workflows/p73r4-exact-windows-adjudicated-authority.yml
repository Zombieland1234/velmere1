name: P73R4 Exact Windows Adjudicated Authority Engine

on:
  push:
    branches:
      - velmere-p73-audit-ancient8-ground-truth-20260817
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p73r4-exact-windows-adjudicated-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p73r4-current-product:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout exact P73R4 control head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Pin exact npm 11.16.0
        id: npmcli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          if ((node --version).Trim() -ne 'v24.18.0') { throw 'Node mismatch' }
          if ((npm --version).Trim() -ne '11.16.0') { throw 'npm mismatch' }
          $npmRoot=(npm root --global).Trim()
          $npmCli=(Resolve-Path -LiteralPath (Join-Path $npmRoot 'npm/bin/npm-cli.js')).Path
          "npm_cli=$npmCli" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Reconstruct exact P72R3 parent and apply guarded P73R4 delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config core.autocrlf false
          git config core.eol lf
          New-Item -ItemType Directory -Force p73r4-out | Out-Null

          python p49-build-projection/reconstruct-p49-direct-projection.py --transport-manifest p49-build-projection/P49_DIRECT_PROJECTION_TRANSPORT_MANIFEST.json --expected-transport-manifest-sha256 b0be014f6191437023cb4e598972043025d02cf658b05b29566e4c7920a1ad8f --projection-manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --runner p49-build-projection/run-p47-product-windows-projection.mjs --parts-root p49-build-projection/parts --work-root p73r4-work --output-root p73r4-out
          if ($LASTEXITCODE -ne 0) { throw 'P46 reconstruction failed' }
          python p66-runtime/apply-p66-audit-pdf-delta.py --source-root p73r4-work/source --manifest p49-build-projection/P47_BUILD_PROJECTION_MANIFEST.json --output-manifest p73r4-work/P66.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 stage1 failed' }
          python p66-runtime/finalize-p66-shield-pro-row-id.py --source-root p73r4-work/source --manifest p73r4-work/P66.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 stage2 failed' }
          python p66-runtime/fix-p66-topology-ts-const.py --source-root p73r4-work/source --manifest p73r4-work/P66.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 stage3 failed' }
          python p68-runtime/apply-p68-audit-customer-truth.py --source-root p73r4-work/source --manifest p73r4-work/P66.json --output-manifest p73r4-work/P68.json
          if ($LASTEXITCODE -ne 0) { throw 'P68 failed' }
          python p69-runtime/apply-p69-ecb-reference-fx.py --source-root p73r4-work/source --manifest p73r4-work/P68.json --output-manifest p73r4-work/P69.json
          if ($LASTEXITCODE -ne 0) { throw 'P69 failed' }
          python p69-runtime/fix-p69r2-node24-pinned-egress.py --source-root p73r4-work/source --manifest p73r4-work/P69.json --output-manifest p73r4-work/P69R2.json --receipt p73r4-out/P69R2.json
          if ($LASTEXITCODE -ne 0) { throw 'P69R2 failed' }
          python p71-runtime/apply-p71-owner-truth-advanced-automation.py --source-root p73r4-work/source --manifest p73r4-work/P69R2.json --output-manifest p73r4-work/P71.json --receipt p73r4-out/P71.json
          if ($LASTEXITCODE -ne 0) { throw 'P71 failed' }
          python p71-runtime/apply-p71r1-expanded-advanced-automation.py --source-root p73r4-work/source --manifest p73r4-work/P71.json --output-manifest p73r4-work/P71R1.json --receipt p73r4-out/P71R1.json
          if ($LASTEXITCODE -ne 0) { throw 'P71R1 failed' }
          python p71-runtime/apply-p71r2-optional-qa-status.py --source-root p73r4-work/source --manifest p73r4-work/P71R1.json --output-manifest p73r4-work/P71R2.json --receipt p73r4-out/P71R2.json
          if ($LASTEXITCODE -ne 0) { throw 'P71R2 failed' }
          python p71-runtime/apply-p71r3-remove-stale-disclosure.py --source-root p73r4-work/source --manifest p73r4-work/P71R2.json --output-manifest p73r4-work/P71R5.json --receipt p73r4-out/P71R3.json
          if ($LASTEXITCODE -ne 0) { throw 'P71R3 failed' }
          python p72-runtime/apply-p72-commercial-topology-measurement.py --source-root p73r4-work/source --manifest p73r4-work/P71R5.json --output-manifest p73r4-work/P72.json --receipt p73r4-out/P72_SOURCE_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P72 failed' }
          python p72-runtime/apply-p72r3-typescript-contract-repair.py --source-root p73r4-work/source --manifest p73r4-work/P72.json --output-manifest p73r4-work/P72R3_BUILD_PROJECTION_MANIFEST.json --receipt p73r4-out/P72R3_SOURCE_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P72R3 failed' }

          $parent=Get-Content p73r4-work/P72R3_BUILD_PROJECTION_MANIFEST.json -Raw | ConvertFrom-Json
          if($parent.projection.fileCount -ne 1597 -or $parent.projection.payloadBytes -ne 20988569 -or $parent.projection.pathSetSha256 -ne 'b8d9b3c2753e3f7f0c0b3a6054cf8c254d2a91b9c9c5d8f37310add478ac3f73' -or $parent.projection.sourceContentAggregateSha256 -ne '4db46e951d3f7f2cc04f61418279b9347bc21b4300b7152aa3e2c77395216252') { throw 'P72R3 parent identity mismatch' }

          python p73-runtime/apply-p73r4-adjudicated-authority-engine.py --source-root p73r4-work/source --manifest p73r4-work/P72R3_BUILD_PROJECTION_MANIFEST.json --output-manifest p73r4-work/P73R4_BUILD_PROJECTION_MANIFEST.json --receipt p73r4-out/P73R4_SOURCE_PATCH.json
          if ($LASTEXITCODE -ne 0) { throw 'P73R4 guarded product patch failed' }
          $m=Get-Content p73r4-work/P73R4_BUILD_PROJECTION_MANIFEST.json -Raw | ConvertFrom-Json
          if($m.projection.fileCount -ne 1598 -or $m.projection.payloadBytes -ne 21015520 -or $m.projection.pathSetSha256 -ne '9cb47f15e73ec678e32fe214b8e2947a4bfbaa624d8fb5101650296700d3dd25' -or $m.projection.sourceContentAggregateSha256 -ne 'd0306b565af73939691a34554e4f7e57543f6d3b91d778a9c93ebf25f5ffd377') { throw 'P73R4 product identity mismatch' }
          Copy-Item p73r4-work/P73R4_BUILD_PROJECTION_MANIFEST.json p73r4-out/

      - name: Static authority and fail-closed invariants
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $provider=Get-Content 'p73r4-work/source/lib/security/audit-provider-runtime-client.ts' -Raw
          $authority=Get-Content 'p73r4-work/source/lib/security/audit-adjudicated-authority-evidence.ts' -Raw
          $readiness=Get-Content 'p73r4-work/source/lib/security/audit-paid-evidence-readiness.ts' -Raw
          $pipeline=Get-Content 'p73r4-work/source/lib/security/audit-customer-report-pipeline.ts' -Raw
          $route=Get-Content 'p73r4-work/source/lib/server/security-route-modules/audit-report-assembler.ts' -Raw
          if($provider -notmatch 'ancient8:\s*"888888888"'){ throw 'Ancient8 chain binding missing' }
          if($authority -notmatch 'verifyAuditAdjudicatedAuthorityEvidence'){ throw 'Authority self-verifier missing' }
          if($authority -notmatch 'current_runtime_bytecode_quorum_unavailable'){ throw 'Runtime-unverified blocker missing' }
          if($authority -notmatch 'new Set\(value\.receipts\.map\(\(item\) => item\.upstreamRoot\)\)\.size < 2'){ throw 'Independent-root quorum missing' }
          if($readiness -notmatch 'input\.tier === "basic"'){ throw 'Basic-only authority supplement guard missing' }
          if($pipeline -notmatch 'tier: "pro".*authorityEvidence: null'){ throw 'Pro authority isolation missing' }
          if($pipeline -notmatch 'tier: "advanced".*authorityEvidence: null'){ throw 'Advanced authority isolation missing' }
          if($route -notmatch 'buildAuditAdjudicatedAuthorityEvidence'){ throw 'Route authority builder missing' }
          if($route -notmatch 'searchParams\.get\("docsUrl"\)'){ throw 'Route docsUrl binding missing' }
          if($route -notmatch 'searchParams\.get\("githubUrl"\)'){ throw 'Route githubUrl binding missing' }

      - name: Exact Windows TypeScript ESLint Webpack Turbopack
        shell: pwsh
        env:
          P47_NPM_CLI_PATH: ${{ steps.npmcli.outputs.npm_cli }}
        run: |
          $ErrorActionPreference='Stop'
          python p60-runtime/build-p60-reconciled-runner.py --input p49-build-projection/run-p47-product-windows-projection.mjs --output p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P60.json
          if ($LASTEXITCODE -ne 0) { throw 'P60 runner failed' }
          python p66-runtime/patch-p66-reconciled-runner.py --runner p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P66.json
          if ($LASTEXITCODE -ne 0) { throw 'P66 runner failed' }
          python p68-runtime/patch-p68-reconciled-runner.py --runner p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P68.json
          if ($LASTEXITCODE -ne 0) { throw 'P68 runner failed' }
          python p69-runtime/patch-p69-reconciled-runner.py --runner p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P69.json
          if ($LASTEXITCODE -ne 0) { throw 'P69 runner failed' }
          python p69-runtime/patch-p69r2-reconciled-runner.py --runner p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P69R2.json
          if ($LASTEXITCODE -ne 0) { throw 'P69R2 runner failed' }
          python p71-runtime/patch-p71-reconciled-runner.py --runner p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P71.json
          if ($LASTEXITCODE -ne 0) { throw 'P71 runner failed' }
          python p71-runtime/patch-p71r1-reconciled-runner.py --runner p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P71R1.json
          if ($LASTEXITCODE -ne 0) { throw 'P71R1 runner failed' }
          python p71-runtime/patch-p71r3-reconciled-runner.py --runner p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P71R3.json
          if ($LASTEXITCODE -ne 0) { throw 'P71R3 runner failed' }
          python p72-runtime/patch-p72-reconciled-runner.py --runner p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P72.json
          if ($LASTEXITCODE -ne 0) { throw 'P72 runner failed' }
          python p72-runtime/patch-p72r3-reconciled-runner.py --runner p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P72R3.json
          if ($LASTEXITCODE -ne 0) { throw 'P72R3 runner failed' }
          python p73-runtime/patch-p73r4-reconciled-runner.py --runner p73r4-work/run-p73r4.mjs --receipt p73r4-out/RUNNER_P73R4.json
          if ($LASTEXITCODE -ne 0) { throw 'P73R4 runner failed' }
          node --check p73r4-work/run-p73r4.mjs
          if ($LASTEXITCODE -ne 0) { throw 'P73R4 runner parse failed' }
          node p73r4-work/run-p73r4.mjs --source-root p73r4-work/source --manifest p73r4-work/P73R4_BUILD_PROJECTION_MANIFEST.json --output-dir p73r4-out
          if ($LASTEXITCODE -ne 0) { throw 'P73R4 exact engineering failed' }

      - name: Execute live adjudicated authority runtime tests
        shell: pwsh
        env:
          P73_RESULT_DIR: ${{ github.workspace }}\p73r4-out
          TSX_TSCONFIG_PATH: ${{ github.workspace }}\p73r4-work\source\tsconfig.json
        run: |
          $ErrorActionPreference='Stop'
          Push-Location p73r4-work/source
          try {
            node ./node_modules/tsx/dist/cli.mjs ../../p73-runtime/test-p73r4-adjudicated-authority-runtime.ts | Tee-Object ../..\p73r4-out\P73R4_AUTHORITY_RUNTIME.log
            if ($LASTEXITCODE -ne 0) { throw 'P73R4 authority runtime failed' }
          } finally { Pop-Location }

      - name: Capture P73R4 boundary
        if: always()
        shell: pwsh
        run: |
          $eng='NOT_EXECUTED_OR_FAILED';$runtime='NOT_EXECUTED_OR_FAILED'
          if(Test-Path 'p73r4-out/P47_EXACT_WINDOWS_BUILD_RELEVANT_PROJECTION_RECEIPT.json'){$x=Get-Content 'p73r4-out/P47_EXACT_WINDOWS_BUILD_RELEVANT_PROJECTION_RECEIPT.json' -Raw|ConvertFrom-Json;if($x.status -eq 'PASS'){$eng='PASS'}}
          if(Test-Path 'p73r4-out/P73R4_ADJUDICATED_AUTHORITY_RUNTIME_TEST.json'){$x=Get-Content 'p73r4-out/P73R4_ADJUDICATED_AUTHORITY_RUNTIME_TEST.json' -Raw|ConvertFrom-Json;if($x.status -eq 'PASS'){$runtime='PASS'}}
          [ordered]@{
            schemaVersion='velmere.p73r4.github-boundary.v1';runId='${{ github.run_id }}';sha='${{ github.sha }}';
            parentRevision='P72R3';parentAggregateSha256='4db46e951d3f7f2cc04f61418279b9347bc21b4300b7152aa3e2c77395216252';
            projectionFileCount=1598;projectionPayloadBytes=21015520;projectionPathSetSha256='9cb47f15e73ec678e32fe214b8e2947a4bfbaa624d8fb5101650296700d3dd25';projectionAggregateSha256='d0306b565af73939691a34554e4f7e57543f6d3b91d778a9c93ebf25f5ffd377';
            generatedNextEnvPayloadBytes=21015505;generatedNextEnvAggregateSha256='7040ed310df042104f9628d68a18f0afa7a4497b1aaab5ead0434b452a65a076';
            engineering=$eng;authorityRuntime=$runtime;deploymentGroundTruthCases=1;currentRuntimeBytecodeCases=0;vulnerabilityGroundTruthCases=0;
            customerFinal='0/20';auditFinalPdf='0/3';rights='2/203';paidValue='0/10';sale='0/20';live=$false;worldClassProven=$false;
            truthBoundary='P73R4 validates the generic server-fetched adjudicated dual-authority deployment-identity engine, Ancient8 chain binding, claim/risk projection and Basic-only authority readiness supplement. Existing strict provider lanes remain intact and Pro/Advanced are not unlocked. This pass grants zero customer FINAL/PDF, rights, paid-value, sale, LIVE or WORLD_CLASS credit.'
          }|ConvertTo-Json -Depth 8|Set-Content p73r4-out/P73R4_GITHUB_BOUNDARY.json -Encoding utf8

      - name: Upload P73R4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p73r4-adjudicated-authority-exact-windows
          path: p73r4-out
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
