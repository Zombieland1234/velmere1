name: R11B i18n Source Candidate

on:
  push:
    branches: [r11b-integration-v8-clean]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Build exact source candidates without source writes
        run: node scripts/r11/build-i18n-source-candidates.mjs "$RUNNER_TEMP/r11b-i18n-candidates"
      - name: Prove checkout unchanged
        run: git diff --exit-code
      - name: Upload candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r11b-i18n-candidates-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/r11b-i18n-candidates
