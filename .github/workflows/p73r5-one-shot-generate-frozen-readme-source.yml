name: P73R5 Frozen README Source Generator

on:
  push:
    branches:
      - velmere-p73r5-frozen-readme-authority-20260817
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p73r5-frozen-readme-source-generator
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'P73R5 generate frozen README authority source') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Generate and validate P73R5 source
        shell: bash
        run: python p73-runtime/generate-p73r5-frozen-readme-source.py

      - name: Commit generated ordinary control files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Velmere Closure Bot'
          git config user.email 'velmere141@gmail.com'
          git add p73-runtime/p73r5-authority-evidence-source.ts p73-runtime/P73R5_SOURCE_GENERATION_RECEIPT.json
          git commit -m 'P73R5 generate frozen README authority source'
          git push origin HEAD:velmere-p73r5-frozen-readme-authority-20260817
