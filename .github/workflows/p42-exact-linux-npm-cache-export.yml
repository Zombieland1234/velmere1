name: P42 Exact Linux NPM Cache Export

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p42-exact-linux-npm-cache-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout dependency bridge
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Assert exact npm 11.16.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0 --ignore-scripts --audit=false --fund=false
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Decode exact current package and lock payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p42-linux-out/project p42-linux-out/npm-cache p42-linux-out/logs
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const zlib = require('node:zlib');
          const base = path.resolve('p41-runtime');
          const out = path.resolve('p42-linux-out/project');
          const sha = b => crypto.createHash('sha256').update(b).digest('hex');
          const repaired = ['payload.fix-02-0','payload.fix-02-1'].map(n => fs.readFileSync(path.join(base,n),'utf8').trim()).join('');
          if (sha(Buffer.from(repaired)) !== 'a0955da49c4e98bde742ddd4fcaa9a384edf3a29a93097d47267b799bfd63568') throw new Error('repair fragment mismatch');
          fs.writeFileSync(path.join(base,'payload.part-02'), repaired);
          const parts = Array.from({length:7},(_,i)=>path.join(base,`payload.part-${String(i).padStart(2,'0')}`));
          const b64 = parts.map(p=>fs.readFileSync(p,'utf8').trim()).join('');
          const compressed = Buffer.from(b64,'base64');
          if (sha(compressed) !== '5b1423b61d346fdbff9d92c0ce4f30be40357f8edb09f36bf77e44025acdb061') throw new Error('compressed payload mismatch');
          const payload = JSON.parse(zlib.brotliDecompressSync(compressed).toString('utf8'));
          const pkg = Buffer.from(payload.packageJson,'utf8');
          const lock = Buffer.from(payload.packageLock,'utf8');
          if (sha(pkg) !== '04aa4b393337fffa6e02ef54ad7668fe8136b038b0d924b208158a095b6f70a5') throw new Error('package mismatch');
          if (sha(lock) !== 'e228adec08801e454ef5559a20f302110b4896a307c364195716218a376c48bb') throw new Error('lock mismatch');
          fs.writeFileSync(path.join(out,'package.json'),pkg);
          fs.writeFileSync(path.join(out,'package-lock.json'),lock);
          NODE

      - name: Build platform-complete Linux npm cache and prove offline replay
        shell: bash
        run: |
          set -euo pipefail
          cd p42-linux-out/project
          npm ci --ignore-scripts --audit=false --fund=false --prefer-online --cache ../npm-cache --loglevel=notice > ../logs/npm-ci-online.stdout.log 2> ../logs/npm-ci-online.stderr.log
          npm ls --all --json > ../logs/npm-ls-online.json
          rm -rf node_modules
          npm ci --offline --ignore-scripts --audit=false --fund=false --cache ../npm-cache --loglevel=notice > ../logs/npm-ci-offline.stdout.log 2> ../logs/npm-ci-offline.stderr.log
          npm ls --all --json > ../logs/npm-ls-offline.json
          node -e "require('@parcel/watcher'); console.log(require.resolve('@parcel/watcher-linux-x64-glibc'))" > ../logs/parcel-watcher-resolution.txt

      - name: Write exact Linux cache receipt
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'), path=require('node:path'), crypto=require('node:crypto');
          const root=path.resolve('p42-linux-out'); const cache=path.join(root,'npm-cache');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const files=[]; const walk=d=>{for(const n of fs.readdirSync(d)){const p=path.join(d,n),s=fs.statSync(p); if(s.isDirectory()) walk(p); else files.push(p)}}; walk(cache);
          const receipt={schema:'velmere.p42.exact-linux-npm-cache-export.v1',generatedAt:new Date().toISOString(),status:'PASS',runtime:{nodeVersion:process.version,npmVersion:require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),platform:process.platform,arch:process.arch},binding:{packageJsonSha256:'04aa4b393337fffa6e02ef54ad7668fe8136b038b0d924b208158a095b6f70a5',packageLockSha256:'e228adec08801e454ef5559a20f302110b4896a307c364195716218a376c48bb'},cache:{fileCount:files.length,byteLength:files.reduce((s,p)=>s+fs.statSync(p).size,0)},npmCi:{online:'PASS',offline:'PASS',ignoreScripts:true},nativeResolution:{parcelWatcherLinuxX64Glibc:'PASS',resolutionLogSha256:sha(path.join(root,'logs','parcel-watcher-resolution.txt'))},limitations:['Lifecycle/install scripts were not executed.','This cache is platform-complete for exact Linux current package/lock replay; it is not native Windows full-source build proof.']};
          fs.writeFileSync(path.join(root,'P42_EXACT_LINUX_NPM_CACHE_EXPORT_RECEIPT.json'),JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Upload exact Linux npm cache
        uses: actions/upload-artifact@v4
        with:
          name: p42-exact-linux-npm-cache
          path: |
            p42-linux-out/P42_EXACT_LINUX_NPM_CACHE_EXPORT_RECEIPT.json
            p42-linux-out/npm-cache
            p42-linux-out/logs
            p42-linux-out/project/package.json
            p42-linux-out/project/package-lock.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
