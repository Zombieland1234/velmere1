name: P50 Publish Native Windows Status Branch

on:
  workflow_run:
    workflows:
      - P50 Native Windows Exact Projection With Persisted Pointer
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  publish-status-branch:
    if: github.event.workflow_run.head_branch == 'velmere-p47-p46-build-projection-windows-20260815'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout result branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: velmere-p47-p46-build-projection-windows-20260815
          fetch-depth: 1
          persist-credentials: true

      - name: Resolve artifact and publish encoded status branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = '${{ github.event.workflow_run.id }}'
          $attempt = '${{ github.event.workflow_run.run_attempt }}'
          $conclusion = '${{ github.event.workflow_run.conclusion }}'.ToLowerInvariant()
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $url = "https://api.github.com/repos/${{ github.repository }}/actions/runs/$runId/artifacts?per_page=100"
          $response = Invoke-RestMethod -Method Get -Uri $url -Headers $headers
          $artifact = $response.artifacts |
            Where-Object { $_.name -like 'p50-native-windows-exact-p46-build-projection-*' } |
            Sort-Object -Property created_at -Descending |
            Select-Object -First 1
          $artifactId = if ($null -eq $artifact) { '0' } else { [string]$artifact.id }
          $branch = "p50-result-$runId-attempt-$attempt-$conclusion-artifact-$artifactId"
          $branch = $branch -replace '[^a-z0-9._/-]', '-'
          git config user.name 'velmere-p50-status-bot'
          git config user.email 'velmere-p50-status-bot@users.noreply.github.com'
          git push origin "HEAD:refs/heads/$branch"
          Write-Host "Published $branch"
