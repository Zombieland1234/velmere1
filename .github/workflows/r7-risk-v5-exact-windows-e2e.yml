name: R7 Risk Indicator V5 Exact Windows

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-risk-v5-exact-windows-e2e.yml'
      - 'r7-risk-v5/**'
      - 'r7-risk-harness/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r7-risk-v5-exact-windows-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-windows-and-customer-e2e:
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - name: Checkout exact Risk v5 transport
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Execute Risk v5 exact Windows 52x2 campaign
        shell: pwsh
        run: ./r7-risk-v5/run-r7-risk-v5-exact-windows.ps1

      - name: Execute Risk v5 exact-source customer route E2E
        shell: pwsh
        run: ./r7-risk-harness/run-r7-risk-v5-customer-e2e.ps1

      - name: Upload Risk v5 exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-risk-v5-exact-windows-e2e-${{ github.sha }}-${{ github.run_id }}
          path: |
            r7-work/artifacts/r7/windows
            r7-work/artifacts/r7/current-execution
            r7-work/artifacts/r7/risk
            r7-work/artifacts/pass13/PASS13_PARTITIONED_ESLINT.json
            r7-work/artifacts/pass13/PASS13_PARTITIONED_TYPESCRIPT.json
            r7-work/current-execution-out
            r7-work/.velmere/deployment-builds
            r7-work/R7_EXECUTION_SLICE_MANIFEST.json
            r7-work/R7_EXECUTION_SLICE_MANIFEST.tsv
            r7-work/R7_NPM_CI.log
            r7-risk-v5/R7_RISK_V5_PATCH_RECEIPT.json
            r7-risk-v5/part-00.txt
            r7-risk-runner-work/R7_RISK_V5_EFFECTIVE_WINDOWS_RUNNER_RECEIPT.json
            r7-target-rebuild/r7-runtime/R7_WINDOWS_EXECUTION_TRANSPORT_RECEIPT.json
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
