name: R10 Paid Authorization Remediation Verify

on:
  push:
    branches:
      - r10-paid-authz
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r10-paid-authz-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  VELMERE_OFFLINE_TS_FORCE_BUILTIN: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout worker branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install lockfile
        run: npm ci --ignore-scripts
      - name: Apply guarded paid authz patch
        run: node scripts/r10/patch-paid-authz.mjs
      - name: Assert source truth boundaries
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const analysis=fs.readFileSync('components/market-integrity/AnalysisCardsSection.tsx','utf8');
          const audit=fs.readFileSync('components/security/SecurityAuditsCleanPage.tsx','utf8');
          const detail=fs.readFileSync('components/market-integrity/AssetDetailModal.tsx','utf8');
          const forbidden=[
            ['analysis_localstorage_unlock', analysis.includes('velmere_unlocked_tiers')],
            ['audit_localstorage_unlock', audit.includes('velmere_unlocked_audit_tiers')],
            ['analysis_missing_session_accept', analysis.includes('!event.data.sessionId || event.data.sessionId === sessionId')],
            ['audit_missing_session_accept', audit.includes('!event.data.sessionId || event.data.sessionId === sessionId')],
            ['asset_direct_paid_bypass', detail.includes('Allow user to execute Pro and Advanced analysis directly')],
          ];
          const bad=forbidden.filter(([,present])=>present);
          if(bad.length) throw new Error('paid_authz_forbidden_patterns:'+JSON.stringify(bad));
          for(const [name,src] of [['analysis',analysis],['audit',audit]]){
            if(!src.includes('event.origin !== window.location.origin')) throw new Error(name+'_origin_check_missing');
            if(!src.includes('event.data?.sessionId !== sessionId')) throw new Error(name+'_session_binding_missing');
          }
          if(!audit.includes('Audit intake verification failed. No report was opened.')) throw new Error('audit_fail_closed_redirect_boundary_missing');
          NODE
      - name: Targeted ESLint
        run: npx eslint components/market-integrity/AnalysisCardsSection.tsx components/market-integrity/AssetDetailModal.tsx components/security/SecurityAuditsCleanPage.tsx
      - name: Direct TypeScript
        run: npm run typecheck:direct
      - name: Payment boundary regressions
        run: npm run test:a97:stripe
      - name: Paid surface and payment auth hardening regressions
        run: |
          node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/pass32/test-paid-surface-truth.ts
          node --import ./scripts/pass11/register-offline-ts-loader.mjs scripts/pass32/test-payment-auth-hardening.ts
      - name: Production build
        run: npm run build
      - name: Commit verified source-only changes
        run: |
          git diff --name-only > /tmp/changed.txt
          allowed='^(components/market-integrity/AnalysisCardsSection\.tsx|components/market-integrity/AssetDetailModal\.tsx|components/security/SecurityAuditsCleanPage\.tsx)$'
          bad="$(grep -Ev "$allowed" /tmp/changed.txt || true)"
          if [ -n "$bad" ]; then echo "Unexpected write scope:"; echo "$bad"; exit 1; fi
          if [ ! -s /tmp/changed.txt ]; then echo "No source diff to commit"; exit 0; fi
          git config user.name "velmere-r10-paid-authz"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -d '\n' git add -- < /tmp/changed.txt
          git commit -m "fix(r10): fail closed paid browser authorization [paid-authz]"
          git push origin HEAD:r10-paid-authz
      - name: Upload paid authz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r10-paid-authz-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/r10/paid-authz/**
