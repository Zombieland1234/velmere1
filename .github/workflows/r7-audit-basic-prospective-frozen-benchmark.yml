name: R7 Audit Basic Prospective Frozen Benchmark

on:
  push:
    branches:
      - velmere-r7-successor-delta-20260825
    paths:
      - '.github/workflows/r7-audit-basic-prospective-frozen-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-audit-basic-prospective-frozen-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prospective-frozen-benchmark:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      R7_RISK_FULL_SOURCE_AGGREGATE_SHA256: '50d59f5f028ef73b279fa3930889fcbf2ab5bc5e36ab4e8cec97be5ed49be67e'
      R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256: 'f83f28de6add73eee70d9086f2705241243661d64b5c9fd579b17b359050a221'
      R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256: 'b947314bb696fb8f9153c34d46ba825c5897e9f8cc8cf911a5f31113aa5fc01f'
      R7_RISK_BUNDLE_SHA256: '8e3c66471d534310e1142c3671d43bb556e35b6901c847c9596eea14e8815967'
      R7_PACKAGE_JSON_SHA256: '384932e8183ff4ced7850556ee21bb7b71f9a86add02112a4e434bc09f457a61'
      R7_PACKAGE_LOCK_SHA256: '5924aa0d679ebd78bcd6da01815fdd4b6ff503db45b17697c00168c06af7de61'
      EXACT_DEPLOYED_SOURCE_SHA256: '3f05fc95b3bfd3d41e96fa281e00a71302e35b8fff59f81f399a419cdb9f577e'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'

    steps:
      - name: Checkout exact controls and frozen policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup exact Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Reconstruct exact current source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'r7-risk-v5/run-r7-risk-v5-exact-windows.ps1' -Mode Prepare
          if ($LASTEXITCODE -ne 0) { throw "exact_current_source_prepare_failed:$LASTEXITCODE" }

      - name: Execute frozen corpus twice and verify deterministic thresholds
        shell: pwsh
        working-directory: r7-work
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/pass35/test-a19-audit-static-benchmark.mjs | Tee-Object -FilePath R7_AUDIT_BASIC_FROZEN_BENCHMARK_TEST.log
          if ($LASTEXITCODE -ne 0) { throw "frozen_benchmark_contract_test_failed:$LASTEXITCODE" }
          @'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import {
            runA19AuditStaticBenchmark,
            verifyA19AuditStaticBenchmark,
            verifyA19AuditStaticPolicy,
          } from "./lib/security/pass35-a19-audit-static-benchmark-runtime.mjs";

          const sha = (bytes) => crypto.createHash("sha256").update(bytes).digest("hex");
          const policyBytes = fs.readFileSync("config/pass35/a19-audit-static-benchmark-policy.json");
          const policy = JSON.parse(policyBytes.toString("utf8"));
          if (!verifyA19AuditStaticPolicy(policy)) throw new Error("frozen_policy_invalid");

          const run1 = runA19AuditStaticBenchmark(policy);
          const run2 = runA19AuditStaticBenchmark(policy);
          if (!verifyA19AuditStaticBenchmark(run1, policy) || !verifyA19AuditStaticBenchmark(run2, policy)) {
            throw new Error("frozen_runtime_verification_failed");
          }
          if (JSON.stringify(run1) !== JSON.stringify(run2)) throw new Error("frozen_benchmark_not_repeatable");
          if (!run1.localStaticBenchmarkPass || run1.failedGates.length !== 0) throw new Error(`frozen_gates_failed:${run1.failedGates.join(",")}`);
          if (run1.denominators.cases !== 240 || run1.denominators.mutations !== 2880 || run1.denominators.frozenTest !== 90) {
            throw new Error("frozen_denominator_mismatch");
          }
          if (run1.frozen.recall < 0.95 || run1.frozen.specificity < 0.95 || run1.frozen.precision < 0.95 || run1.frozen.f1 < 0.95) {
            throw new Error("frozen_metric_threshold_failed");
          }
          if (run1.frozen.severityAccuracy < 0.95 || run1.mutation.killRate < 0.99 || run1.frozen.fp !== 0) {
            throw new Error("frozen_quality_threshold_failed");
          }
          if (run1.paidGateEligible !== false || run1.independentExternalFamily !== false || run1.fullAuditClaimAllowed !== false) {
            throw new Error("frozen_hard_stop_regression");
          }

          const engineBytes = fs.readFileSync("lib/security/pass35-a19-audit-static-benchmark-runtime.mjs");
          const receipt = {
            schemaVersion: "velmere.r7.audit-basic-prospective-frozen-benchmark.v1",
            status: "PASS_PROSPECTIVE_FROZEN_BENCHMARK",
            github: {
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              headSha: process.env.GITHUB_SHA,
            },
            exactCurrentSource: {
              fullSourceAggregateSha256: process.env.R7_RISK_FULL_SOURCE_AGGREGATE_SHA256,
              executionSliceAggregateSha256: process.env.R7_RISK_EXECUTION_SLICE_AGGREGATE_SHA256,
              executionSliceManifestSha256: process.env.R7_RISK_EXECUTION_SLICE_MANIFEST_SHA256,
              bundleSha256: process.env.R7_RISK_BUNDLE_SHA256,
              packageJsonSha256: process.env.R7_PACKAGE_JSON_SHA256,
              packageLockSha256: process.env.R7_PACKAGE_LOCK_SHA256,
              exactDeployedSourceSha256: process.env.EXACT_DEPLOYED_SOURCE_SHA256,
            },
            frozenBeforeExecution: true,
            policy: {
              path: "config/pass35/a19-audit-static-benchmark-policy.json",
              sha256: `sha256:${sha(policyBytes)}`,
              passId: policy.passId,
              frozenSplitName: "frozen_test",
              thresholds: policy.thresholds,
            },
            engine: {
              path: "lib/security/pass35-a19-audit-static-benchmark-runtime.mjs",
              sha256: `sha256:${sha(engineBytes)}`,
            },
            results: {
              integritySha256: `sha256:${run1.integritySha256}`,
              families: run1.denominators.families,
              cases: run1.denominators.cases,
              vulnerable: run1.denominators.vulnerable,
              remediated: run1.denominators.remediated,
              frozenTest: run1.denominators.frozenTest,
              mutations: run1.denominators.mutations,
              frozen: run1.frozen,
              mutation: run1.mutation,
              failedGates: run1.failedGates,
              repeatability: "PASS_BYTE_IDENTICAL_JSON_X2",
            },
            hardStops: {
              paidGateEligible: false,
              independentExternalFamily: false,
              fullAuditClaimAllowed: false,
              replacesQualifiedHumanReview: false,
              exploitabilityClaimed: false,
            },
            customerFinalCredit: false,
            truthBoundary: "A pre-existing frozen synthetic corpus measures deterministic local structural prescreen behavior only. It cannot unlock paid value, replace external analyzer families, prove exploitability, replace qualified-human review, or by itself create Audit Basic FINAL.",
          };
          fs.mkdirSync("artifacts/r7/audit-basic", { recursive: true });
          fs.writeFileSync(
            "artifacts/r7/audit-basic/R7_AUDIT_BASIC_PROSPECTIVE_FROZEN_BENCHMARK.json",
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          fs.writeFileSync(
            "artifacts/r7/audit-basic/R7_AUDIT_BASIC_PROSPECTIVE_FROZEN_BENCHMARK_RUNTIME.json",
            `${JSON.stringify(run1, null, 2)}\n`,
          );
          console.log(JSON.stringify({
            status: receipt.status,
            cases: run1.denominators.cases,
            frozenCases: run1.denominators.frozenTest,
            mutations: run1.denominators.mutations,
            frozenRecall: run1.frozen.recall,
            frozenSpecificity: run1.frozen.specificity,
            frozenPrecision: run1.frozen.precision,
            frozenF1: run1.frozen.f1,
            mutationKillRate: run1.mutation.killRate,
            paidGateEligible: false,
            customerFinalCredit: false,
          }, null, 2));
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw "frozen_benchmark_receipt_failed:$LASTEXITCODE" }

      - name: Upload frozen benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-audit-basic-prospective-frozen-benchmark-${{ github.sha }}-${{ github.run_id }}
          path: |
            r7-work/artifacts/r7/audit-basic/R7_AUDIT_BASIC_PROSPECTIVE_FROZEN_BENCHMARK.json
            r7-work/artifacts/r7/audit-basic/R7_AUDIT_BASIC_PROSPECTIVE_FROZEN_BENCHMARK_RUNTIME.json
            r7-work/R7_AUDIT_BASIC_FROZEN_BENCHMARK_TEST.log
          if-no-files-found: error
          retention-days: 14
