name: P51 Export All-Refs Blob Corpus

on:
  workflow_dispatch:
  push:
    branches:
      - velmere-p47-p46-build-projection-windows-20260815
    paths:
      - '.github/workflows/p51-export-all-refs-blob-corpus.yml'

permissions:
  contents: read

jobs:
  export-all-refs-blob-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch all heads tags and pull-request refs
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git fetch --force --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head' \
            '+refs/pull/*/merge:refs/remotes/pull/*/merge'

      - name: Build deterministic reachable-blob corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p51-corpus
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          out = Path('p51-corpus')
          object_ids = sorted(set(
              line.split()[0]
              for line in subprocess.check_output(
                  ['git', 'rev-list', '--objects', '--all'], text=True
              ).splitlines()
              if line.strip()
          ))

          check = subprocess.Popen(
              ['git', 'cat-file', '--batch-check=%(objectname) %(objecttype) %(objectsize)'],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True
          )
          checked, _ = check.communicate('\n'.join(object_ids) + '\n')
          blobs = []
          for line in checked.splitlines():
              sha, kind, size = line.split()
              size = int(size)
              if kind == 'blob' and size <= 5_000_000:
                  blobs.append((sha, size))

          corpus_path = out / 'P51_ALL_REFS_BLOB_CORPUS.bin'
          manifest_path = out / 'P51_ALL_REFS_BLOB_CORPUS.tsv'
          aggregate = hashlib.sha256()
          offset = 0
          with corpus_path.open('wb') as corpus, manifest_path.open('w', encoding='utf-8', newline='\n') as manifest:
              manifest.write('sha1\toffset\tbyteLength\tsha256\n')
              for index, (sha1, expected_size) in enumerate(blobs, 1):
                  data = subprocess.check_output(['git', 'cat-file', 'blob', sha1])
                  if len(data) != expected_size:
                      raise SystemExit(f'blob size mismatch {sha1}: {len(data)} != {expected_size}')
                  sha256 = hashlib.sha256(data).hexdigest()
                  manifest.write(f'{sha1}\t{offset}\t{len(data)}\t{sha256}\n')
                  corpus.write(data)
                  corpus.write(b'\0' * 64)
                  aggregate.update(sha1.encode())
                  aggregate.update(b'\0')
                  aggregate.update(sha256.encode())
                  aggregate.update(b'\0')
                  aggregate.update(str(len(data)).encode())
                  aggregate.update(b'\n')
                  offset += len(data) + 64
                  if index % 250 == 0:
                      print(f'{index}/{len(blobs)} blobs; {offset} corpus bytes', flush=True)

          summary = {
              'schemaVersion': 'velmere.p51.all-refs-blob-corpus.v1',
              'status': 'PASS_CORPUS_EXPORTED',
              'objectCountScanned': len(object_ids),
              'blobCountIncluded': len(blobs),
              'maximumBlobBytes': 5_000_000,
              'corpusBytes': corpus_path.stat().st_size,
              'corpusSha256': hashlib.sha256(corpus_path.read_bytes()).hexdigest(),
              'manifestBytes': manifest_path.stat().st_size,
              'manifestSha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'identityAggregateSha256': aggregate.hexdigest(),
              'truthBoundary': 'Corpus contains only Git blobs reachable from fetched repository refs. It is transport input, not P46 exact-source or build credit.'
          }
          (out / 'P51_ALL_REFS_BLOB_CORPUS_SUMMARY.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          zstd -T0 -19 --long=31 --force \
            p51-corpus/P51_ALL_REFS_BLOB_CORPUS.bin \
            -o p51-corpus/P51_ALL_REFS_BLOB_CORPUS.bin.zst
          sha256sum p51-corpus/* > p51-corpus/P51_ALL_REFS_BLOB_CORPUS_FILES.sha256
          rm p51-corpus/P51_ALL_REFS_BLOB_CORPUS.bin

      - name: Upload corpus evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p51-all-refs-blob-corpus
          path: p51-corpus
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
